<script id="tmpl_customer_item" type="text/x-jquery-tmpl">
    <tr>
        <td style="text-align: center;">
        <input type="checkbox" name="customerS[]" value="${_id}">
        </td>
        <td>
            {{if name}}
            ${name}
            {{/if}}
        </td>
        <td>
            {{if owner}}
            ${handler.config.customerCommon.getUserName(owner)}
            {{/if}}
        </td>
        <td>
            {{if phone}}
            ${handler.customer.contactPhoe(phone)}
            {{/if}}
        </td>
        <td>
            {{if status}}
            ${getCache('custTmpls',dbType).status[status]}
            {{/if}}
        </td>
        <td>
            {{if custsource1}}
            ${handler.customer.getSourceName(dbType,custsource1)}
            {{/if}}
        </td>
        <td>
            {{if createTime}}
            ${createTime}
            {{/if}}
        </td>
        <!--<td>-->
        <!--<a href='#' class='ds_do_action' ds_action='config.customerCommon.showPopUpdate' ds_data='${_id}'>修改</a>-->
        <!--</td>-->
    </tr>
</script>
<script type="text/javascript">
    function selectAllCommonCustomer(sel){
        var pane = $("#customerCommon_info_pane").find('.customer_list');
        var all = pane.find("input[type=checkbox]");
        if(sel.checked==true){
            $.each(all,function(key, item){
                $(item).attr("checked",true);
            });
            $("#customerCommon_info_pane").find("input[name='selectAll']").val(1);
        }else{
            $.each(all,function(key, item){
                $(item).attr("checked",false);
            });
            $("#customerCommon_info_pane").find("input[name='selectAll']").val(0);
        }
    }
</script>
