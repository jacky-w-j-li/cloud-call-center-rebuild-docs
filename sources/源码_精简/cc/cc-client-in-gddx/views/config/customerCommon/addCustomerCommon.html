<div >
    <form id="frm_customerCommon_add" class="form-horizontal ">
        <div class="form_buttons" style="border-bottom: 0px solid #f0f0f0;line-height:30px;">
                <button type="button" class="btn btn-small btn-primary ds_form_action pull-right"  ds_action="config.customerCommon.saveCustomerCommon" style="margin-left: 10px;">保存</button>
                <button type="button" class="btn btn-small pull-right btn_pad btn_cancel_edit ds_do_action" ds_action="config.customerCommon.cancelModal" ds_data="frm_customerCommon_add" style="margin-left: 0px;">取消</button>
        </div>

        <div>
            <div class="control-group">
                <label class="control-label required">公海名称</label>
                <div class="controls">
                    <input style="width: 35%;" name="cName" type="text" maxlength="50" msgName='公海名称'>
                </div>
            </div>
            <div class="control-group">
                <label class="control-label required">管理员</label>
                <div class="controls">
                        <input name="ownercomManagers" type="hidden" class="select_input" id="managers_owner_select_input_com" />
                        <input name="managers" type="hidden" class="select_input" id="managers_owner_select_seasInput" />
                        <!--<input name="ownerdepManagers" type="hidden" class="select_input" id="managers_owner_select_input_dep" />-->
                        <!--<div id="_#menu#__owner_select_user" class="combobox_agent"></div>-->
                        <div id="managers_owner_select_seasUser" class="comtabbox_agent"></div>
                        <!--<div class="cust_managers_container">-->
                        <!--</div>-->
                </div>

            </div>
            <div class="control-group">
                <label class="control-label required">公海成员</label>
                <div class="controls">
                        <input name="ownercomMembers" type="hidden" class="select_input" id="members_owner_select_input_com" />
                        <input name="members" type="hidden" class="select_input" id="members_owner_select_seasInput" />
                        <!--<input name="ownerdepMembers" type="hidden" class="select_input" id="members_owner_select_input_dep" />-->
                        <!--<div id="_#menu#__owner_select_user" class="combobox_agent"></div>-->
                        <div id="members_owner_select_seasUser" class="comtabbox_agent"></div>
                        <!--<div class="cust_members_container">-->
                        <!--</div>-->
                </div>
            </div>
            <div class = "control-group">
                <label class="control-label required">公海类型</label>
                <div class="controls" style="padding-top:5px;">
                    <input class="categoryType" type="radio" name="category" value="3" onchange="changeCommonUnit('day')" checked>手动&nbsp;&nbsp;&nbsp;&nbsp;
                    <input class="categoryType" type="radio" name="category" value="4" onchange="changeCommonUnit('duration')">自动
                </div>

            </div>
            <div class="control-group claimCustomer">
                <label class="control-label">客户领取上限</label>
                <div class="controls">
                    <div id="field_rules_pane" style="position: relative;" class="">
                        <div class="row-select-box" style="position: relative;">
                            <span>待跟进：</span>
                            <input type="text" name="ruleNum" datatype="Number,Range" style="width:50px;height:13px" min="0" msgName='领取规则为大于0的整数'  value='50' onblur="if(this.value=='0'){this.value='50'}"  onkeyup="this.value=this.value.replace(/\D/g,'')">  <span>个</span><i></i>
                        </div>
                    </div>
                    <span class="help-block muted">默认值为50个。</span>
                </div>
            </div>
            <div class="control-group">
                <label class="control-label">客户回收规则</label>
                <div class="controls">
                    <div id="field_backRules_pane" style="position: relative;" class="">
                        待跟进：<input type="text" name="deNum" datatype="Number,Range" style="width:50px" onkeyup="this.value=this.value.replace(/\D/g,'')"><span
                            class="unit">天</span>无有效的通话,自动回收到公海。
                        <br/><br/>
                        跟进中：<input type="text" name="foNum" datatype="Number,Range" style="width:50px" onkeyup="this.value=this.value.replace(/\D/g,'')">天无完成的联系计划或有效的通话，自动回收到公海。
                    </div>
                    <span class="help-block muted"><br/>默认为不自动回收。</span>
                </div>
            </div>
        </div>
    </form>

    <div class="alert alert-block" style="line-height: 18px;">
        <b>说明：</b><br>
        1.手动公海需要座席去领取；自动公海里的客户是系统自动分配给座席的，请按需选择。<br>
        2.自动公海分配策略：<br>
        a.有奖券的优先其他成员获得商机，每分配一个商机消耗一个奖券。<br>
        b.有罚券的轮到获取商机的时候，跳过他，消耗一个罚券。<br>
        c.公海中成员都平级的时候（没有奖罚券或都有奖罚券），商机按每天一人一个轮流分配，轮流的顺序是：新一轮开始的时候按这周领取数最低的开始分配，剩下按随机顺序分配。<br>

    </div>
</div>
<script type="text/javascript">
    $(function(){
        //初始化座席
        _initAgentCheckbox();
    });
    function _initAgentCheckbox(){
        var inputIdMa="managers_owner_select_seasInput";
        var containerIdMa="managers_owner_select_seasUser";
        var inputIdMe = "members_owner_select_seasInput";
        var containerIdMe = "members_owner_select_seasUser";
        var editOwner="";
        if(isHasFunc("func_not_allow_user_edit_owner")){
            editOwner = "readonly"
        }
        utils.loadAgentTabBox(inputIdMa,containerIdMa,{width:"360",height:"17",maxHeight:292,hideTab:2,isRadio:false,commonTab:false},false,false);
        utils.loadAgentTabBox(inputIdMe,containerIdMe,{width:"360",height:"17",maxHeight:292,hideTab:2,isRadio:false,commonTab:false},false,false);
    };
    var pane = $("[datatype='Number,Range']");
    pane.each(function(){
        $(this).on('blur',function(){
            if(isNaN($(this).val())){
                if($(this).val() != ''){
                    if($(this).attr('name') == 'ruleNum'){
                        alert('客户领取上限数量只能输入数字');
                    }else if($(this).attr('name') == 'deNum'){
                        alert('客户回收规则待跟进只能输入数字');
                    }else if($(this).attr('name') == 'foNum'){
                        alert('客户回收规则跟进中只能输入数字');
                    }
                }
                $(this).val($(this).val().replace(/\D|^0/g,''));
            }
        })
    })

    function changeCommonUnit(type) {
        if (type == "duration") {
            $(".claimCustomer").hide();
            var unit = "分钟";
        } else {
            $(".claimCustomer").show();
            var unit = "天";
        }
        $(".unit").html(unit);
    }
</script>
