<div class="right_content_pane">
    <form id="quality_check_template_pane_form_two" class="form-horizontal">
        <input type="hidden" name="_id"/>
        <input type="hidden" name="enable">
        <div class="right_head clearfix" style="">
            <div class="pull-left">
                <h4>pass质检模板</h4>
            </div>
            <div class="pull-right">
                <a href="#" class="btn ds_do_action"
                   ds_action="config.qualityCheck.cancelQualityCheckTemplateTwo">返回</a>
                <a href="#" class="btn btn-primary ds_form_action"
                   ds_action="config.qualityCheck.saveQualityCheckTemplateTwo">保存</a>
            </div>
        </div>
        <div>
            <div class="control-group">
                <label class="label-style" for="field_name">质检模板名称</label>
                <div>
                    <input id="field_name" name="name" type="text" required msgName="质检模板名称" autocomplete="off" maxlength="20">
                </div>
            </div>
            <div class="control-group">
                <label class="label-style" for="uncurx_ratio">非关键错误比例</label>
                <div>
                    <input id="uncurx_ratio" name="uncurxratio" type="text" required msgName="非关键错误比例" autocomplete="off" maxlength="2">%
                </div>
            </div>
        </div>
        <div class="table-wrap">
            <div class="add-new-layer ds-config-quality-check-add-config-two ds_do_action" ds_action="qualityCheck.addQualityCheckTwo">
                <span class="span1">&nbsp&nbsp&nbsp添加一层&nbsp&nbsp&nbsp</span>
                <a href="#"><i class="icon-plus"></i></a>
            </div>
            <ul id="table0" class="clearfix">
            </ul>
        </div>
        <div class="alert alert-success">
            <strong>温馨提示:</strong> 1.第二级质检项若选中，则为非致命项。
        </div>
    </form>
    <div id="confirm_modal_del" class="modal hide fade in"  aria-hidden="false" tableindex=-1 style="width: 500px; display: none; left: 520px; margin: 0px auto;">
        <div class="modal-header">
            <button type="button" class="close" data-dismiss="modal" aria-hidden="true">×</button>
            <h4 class="modal-title"></h4>
        </div>
        <div class="modal-body"></div>
        <div class="modal-footer">
            <button type="button" class="btn btn-primary ds_do_action btn-small" ds_action="qualityCheck.removeQualityCheckTwo" ds_data="0">确认</button>
            <a href="#" class="btn  btn-small" data-dismiss="modal" aria-hidden="true">取消</a>
        </div>
    </div>
    <div id="confirm_modal_del_children" class="modal hide fade in"  aria-hidden="false" tableindex=-1 style="width: 500px; display: none; left: 520px; margin: 0px auto;">
        <div class="modal-header">
            <button type="button" class="close" data-dismiss="modal" aria-hidden="true">×</button>
            <h4 class="modal-title"></h4>
        </div>
        <div class="modal-body"></div>
        <div class="modal-footer">
            <button type="button" class="btn btn-primary ds_do_action btn-small" ds_action="qualityCheck.removeQualityCheckTwoChildren" ds_data="0">确认</button>
            <a href="#" class="btn  btn-small" data-dismiss="modal" aria-hidden="true">取消</a>
        </div>
    </div>

</div>
<script type="text/javascript">
    $(function(){
        var aHeight = $(window).height();
        $(".table-wrap").height(aHeight-280);
        $("#field_name").on("blur",function(){
            var value= $(this).val();
            $(this).attr("title",value);
        })
    })
</script>
