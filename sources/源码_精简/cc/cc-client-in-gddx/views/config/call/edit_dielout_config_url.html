<form>
    <div class="row-fluid">
        <div class="row-fluid" style="margin-top: 8px;">
            <div style="float: left;margin-top: 20px; margin-bottom: 10px;">
                <h4>编辑对接页面</h4>
            </div>
            <div style="float: right;margin-top:15px;margin-bottom: 5px;">
                <a href="#" class="btn btn-small ds_form_action" ds_action="config.interfaceUrl.cancelDialoutFields">取消</a>
                <a href="#" class="btn btn-small btn-primary ds_form_action" ds_action="config.interfaceUrl.editDialoutUrlFields">保存</a>
            </div>
        </div>
        <div class="row-fluid">
            <div style="border:1px solid;"></div>
        </div>
        <div class="row-fluid">
            <input id="field_id" name="_id" type="hidden" value="__id" />
            <div class="row_item">
                <label for="field_name">描述</label>
                <input id="field_name" name="name" type="text" max="20" dataType="LimitLen" msg="描述不能超过20个字符" value="__name" required>
            </div>
            <div class="row_item">
                <label for="field_url">弹屏地址</label>
                <input id="field_url" name="url" type="text" value="__url" msg="网址格式不正确"  required>
            </div>
            <div class="row_item">
                <label for="field_dialout_type">弹屏方式</label>
                <select id="field_dialout_type" name="type"
                        onchange="handler.config.interfaceUrl.changeUrlOutOpenType(this.value)"></select>
            </div>
            <div class="row_item urlOutOpenType" style="display: none">
                <label>弹屏页面打开方式</label>
                <select name="outOpenType" id="editUrlOutOpenType">
                    <option value="win">新窗口</option>
                    <option value="tab">TAB页</option>
                </select>
            </div>
        </div>
    </div>
</form>
