<div id="add_call_event_Modal" class="modal hide fade">
    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true">&times;</button>
        <h3 id="callEventTitle">添加通话事件</h3>
    </div>
    <form class="form-horizontal">
        <input type="hidden" id="callEventId" name="_id" value=""/>
        <div class="modal-body">

            <div class="control-group">
                <label class="control-label">
                    描述
                </label>
                <div class="controls">
                    <input type="text" id="callEventName" name="Name" required="true"/>
                </div>
            </div>

            <div class="control-group">
                <label class="control-label">
                    PBX
                </label>
                <div class="controls">
                    <select id="callEventPBX" name="PBX" required="true" msgName="PBX">
                        __SELECT_PBX_OPTIONS
                    </select>
                </div>
            </div>

            <div class="control-group">
                <label class="control-label">
                    事件类型
                </label>
                <div class="controls">
                    <select id="callEventConcreteType" name="ConcreteType" required="true">
                        <option value="RingURL">呼叫振铃</option>
                        <option value="RingingURL">被呼振铃</option>
                        <option value="LinkURL">接通</option>
                        <option value="HanupURL">通话结束</option>
                        <option value="PeerURL">座席状态</option>
                        <option value="InvestigateURL">满意度调查结束</option>
                    </select>
                </div>
            </div>

            <div class="control-group">
                <label class="control-label">
                    地址
                </label>
                <div class="controls">
                    <input class="input-large" type="text" id="callEventUrl" name="Url" required="true"/>
                </div>
            </div>

        </div>
        <div class="modal-footer">
            <a href="#" class="btn btn-info ds_form_action" ds_action="config.callEvent.saveCallEvent">保存</a>
            <a href="#" class="btn" onclick="$('#add_call_event_Modal').modal('hide');">关闭</a>
        </div>
    </form>
</div>
