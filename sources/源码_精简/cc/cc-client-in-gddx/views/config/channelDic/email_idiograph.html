<div class="row-fluid">
    <div class="span6">
        <div class="panel-heading">
            <span class="pull-left" style="margin-right:20px;font-weight: bold">邮件签名列表</span>
            <button id="config_mail_signature_add" type="button" class="pull-right btn-add ds_do_action" ds_action="config.channel.showMailSignatureAdd" style="margin: 0 1px 0 5px" ds_data=""> 添加</button>

<script id="tmpl_email_idiograph" type="text/html">
    <tr>
        <td>
            <span class="mail_idiograph_nameID" title="__name">__name</span>
        </td>
        <td>
            <form>
                <input name="_id" value="___id" type="hidden"/>
                <div class="accordion-heading" >
                    <a class="ds_form_action" ds_action="config.channel.showUpdateMailSignature" style="padding: 2px;" href="#">修改</a>
                    <a class="ds_form_action" ds_action="config.channel.delMailSignature" style="padding: 2px;" href="#">删除</a>

            </form>

    </tr>
