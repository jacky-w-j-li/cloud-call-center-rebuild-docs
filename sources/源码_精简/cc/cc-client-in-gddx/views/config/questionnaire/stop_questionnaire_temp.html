<div class="modal-header">
    <button type="button" class="close" data-dismiss="modal" aria-hidden="true">
        ×
    </button>
    <h3>{{=action}}问卷模板</h3>
</div>
<div class="">
    <form>

        <div class="modal-body">
            <div class="row_item">
                确认{{=action}}此问卷模板？
            </div>

        </div>
        <div class="modal-footer">
            <button href="#" class="btn btn-primary ds_do_action" ds_action="config.questionnaire.changeStatusQuestionnaireTemp" ds_data="{{=_id}}" action="{{=action}}">
                确认{{=action}}
            </button>
            <button class="btn" data-dismiss="modal" aria-hidden="true">
                取消
            </button>
        </div>
    </form>
</div>
