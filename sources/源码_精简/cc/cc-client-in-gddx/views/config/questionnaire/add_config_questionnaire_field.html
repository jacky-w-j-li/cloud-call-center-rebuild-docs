{{
    viewOption = viewOption || "add";


}}

<form>
    <div class="row-fluid">
        <div class="row-fluid" style="margin-top: 8px;">
            <div style="float: left;margin-top: 20px; margin-bottom: 10px;">
                <h4>{{=viewOption=='add'?'添加新字段':'更新字段'}}</h4>
            </div>
            <div style="float: right;margin-top:15px;margin-bottom: 5px;">
                <a href="#" class="btn btn-primary ds_form_action" ds_action="config.questionnaire.saveQuestionnaireFields">保存</a>
            </div>
        </div>
        <div class="row-fluid">
            <div style="border:1px solid;"></div>
        </div>
        <div class="row-fluid">
            <div class="row_item">
                <input type="hidden" name="_id" value="{{=_id}}" />
                <label for="flow_field_name">字段名称</label>
                <input id="flow_field_name" name="name" type="text" value="{{=name}}" required>
            </div>
            <div class="row_item">
                <label>描述</label>
                <textarea name="desc">{{=desc}}</textarea>
            </div>
        </div>
    </div>
