<div class="contact_summary">
    <div class="row-fluid">
        <div class="span12">
            <div style="border-bottom: 1px solid #f0f0f0;line-height:30px;" class="clearfix">
                <h4 style="float:left;line-height: inherit;">批量修改座席 &nbsp;&nbsp;</h4>
            </div>
        </div>
        <div class="span12">
            <div style="height: 25px;line-height: 25px;">您搜索到的座席共计<span class="cust_count">0</span>个</div>
        </div>
        <div class="span12">
            <div class="user_batch_section">
                <h5>批量修改上级：</h5>
                <form class="form-horizontal" id="frm_user_batch_parentId">
                    <input name="flag" type="hidden" value="parentId"/>
                    <div class="control-group ds_owner">
                        <label class="control-label">上级</label>
                        <div class="controls">
                            <input name="parentId" type="hidden" class="select_input" id="config_user_owner_select_input"  />
                            <div id="config_user_owner_select_user" class="combobox_agent"></div>
                        </div>
                    </div>
                    <div class="control-group">
                        <label class="control-label"></label>
                        <div class="controls" style="">
                            <button type="button" class="btn btn-small btn-primary ds_form_action pull-left btn_pad" ds_action="config.user.batchUpdateUser">保存</button>
                            <button type="button" class="btn btn-small pull-left  btn_cancel_edit">取消</button>
                        </div>
                    </div>
                </form>
            </div>
            <div class="user_batch_section">
                <h5>批量修改角色：</h5>
                <form class="form-horizontal" id="frm_user_batch_role">
                    <input name="flag" type="hidden" value="role"/>
                    <div class="control-group">
                        <label class="control-label">
                            角色
                        </label>
                        <div class="controls">
                            <table>
                                <tr>
                                    <td>
                                        <select name="roles" class="left_role" size="8"  multiple style="min-width: 100px;width: auto;">
                                        </select>
                                    </td>
                                    <td>
                                        <div style="margin:0 10px;">
                                            <p style="margin-bottom: 10px;">
                                                <button type="button"  class="btn btn-default btn-sm left_middle">&gt;</button>
                                            </p>
                                            <p>
                                                <button type="button"  class="btn btn-default btn-sm right_middle">&lt;</button>
                                            </p>
                                        </div>
                                    </td>
                                    <td>
                                        <select name="selectRoles" class="right_role" size="8" multiple style="min-width: 100px;width: auto;">
                                        </select>
                                    </td>
                                </tr>
                            </table>
                        </div>
                    </div>
                    <div class="control-group">
                        <label class="control-label"></label>
                        <div class="controls" style="">
                            <button type="button" class="btn btn-small btn-primary ds_form_action pull-left btn_pad" ds_action="config.user.batchUpdateUser">保存</button>
                            <button type="button" class="btn btn-small pull-left  btn_cancel_edit">取消</button>
                        </div>
                    </div>
                </form>
            </div>
            <div class="user_batch_section">
                <h5>批量修改接入会话数：</h5>
                <form class="form-horizontal" id="frm_user_batch_role">
                    <input name="flag" type="hidden" value="imDealCount"/>
                    <div class="control-group">
                        <div class="control-group">
                            <label class="control-label">座席最小能同时接待会话数</label>
                            <div class="controls">
                                <select name="minImDealCount" class="span2" id="minImDealCount"></select>
                            </div>
                        </div>
                        <div class="control-group">
                            <label class="control-label">座席最大能同时接待会话数</label>
                            <div class="controls">
                                <select name="maxImDealCount" class="span2" id="maxImDealCount"></select>
                            </div>
                        </div>

                        <div class="control-group">
                            <label class="control-label" for="maxEmailDealCount">座席最大能同时处理邮件数</label>
                            <div class="controls">
                                <input name="maxEmailDealCount" type="text" id="maxEmailDealCount" datatype="Number3" msg="请输入正整数"/>
                            </div>
                        </div>
                    </div>
                    <div class="control-group">
                        <label class="control-label"></label>
                        <div class="controls" style="">
                            <button type="button" class="btn btn-small btn-primary ds_form_action pull-left btn_pad" ds_action="config.user.batchUpdateUser">保存</button>
                            <button type="button" class="btn btn-small pull-left  btn_cancel_edit">取消</button>
                        </div>
                    </div>
                </form>
            </div>
            <div class="user_batch_section">
                <h5>批量修改国际电话服务：</h5>
                <form class="form-horizontal" id="frm_user_batch_callinternation">
                    <input name="flag" type="hidden" value="callinternation"/>
                    <div class="control-group ds_owner">
                        <label class="control-label">开启国际电话服务</label>
                        <div class="controls">
                            <input type="checkbox" name="iscallinternation"checked>
                        </div>
                    </div>
                    <div class="control-group">
                        <label class="control-label"></label>
                        <div class="controls" style="">
                            <button type="button" class="btn btn-small btn-primary ds_form_action pull-left btn_pad" ds_action="config.user.batchUpdateUser">保存</button>
                            <button type="button" class="btn btn-small pull-left  btn_cancel_edit">取消</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<style type="text/css">
    .user_batch_section{
        border: 1px dotted #ccc;
        padding: 15px;
        width: 80%;
        margin: 0 auto;
        margin-bottom: 15px;
    }
</style>
