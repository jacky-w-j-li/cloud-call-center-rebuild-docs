<div class="right_content_pane" style="hight:100%;overflow:hidden">
    <div class="panel-heading">
    添加技能组
    </div>
    <p class="asth">设置技能组</p>
    <form id="frm_email_add" class="form-horizontal set_details">
        <div class="row_item" id="agentAssignPanel">
            <div class="clearfix">
                <div class="pull-left">
                    <label for="email_queue_displayname">技能组名</label>
                        <input class="sizem" id="email_queue_displayname" type="text" name="DisplayName" required/>
                </div>
                <div class=" pull-right">
                    <button type="button" class="btn-blue mr20 ds_form_action" ds_action="config.channel.saveEmailQueue">保存</button>
                </div>
            </div>
            <div style="margin: 8px 0;">
                <label for="agentAssignResult_select">分配策略</label>
                <select id="agentAssignResult_select" name="assignRule" style="width:110px;">
                    <option value="queue">轮流</option>
                    <option value="random" selected>随机</option>
                    <option value="least">最少</option>
                    <option value="priority">优先</option>
                </select>
            </div>
            <div class="add-memory-ability" style="margin:6px 0;">
                <label>启用记忆分配</label><input id="queueIsMemory" type="checkbox" style="width:20px;height:20px;" name="IsMemory"/>
            </div>
            <div class="add-memory-ability" style="display:none">
                <label>记忆时间</label><input id="queueMemoryTime" type="hidden" style="width:40px;" value="120" name="MemoryTime"/><span class="memory-time">分钟</span>
            </div>
            <div class="show_result" id="agentAssignResult">
                    <ul></ul>
            </div>
             <div class="alert alert-success">
                    <strong>温馨提示:</strong> 输入框内为优先级别的设定，从零开始，数字越小，级别越高，优先级相同的采用轮询策略。默认为随机策略<br><br>
                    <strong>记忆分配：</strong>启用记忆分配后，优先分配给记忆的座席，如果该座席不满足条件，则按技能组策略进行分配
             </div>

        </div>
        <div class="row-fluid">
            <div class="row_item" style="display: none">
                <label class="control-label" for="email_queue_timeout">邮件/微信 提醒时长</label>
                <span class="input-append">
                    <input id="email_queue_timeout" style="width: 173px" maxlength="5" dataType="Number,Range" min="1"
                           type="text" name="Timeout" value="40" required/>
                    <span class="add-on" style="height: 15px;line-height: 15px">秒</span>
                </span>
            </div>
            <div class="row_item" style="display: none">
                <label class="control-label" for="email_queue_waitCount">邮件 最大分配次数</label>
                    <input id="email_queue_waitCount" type="text" name="WaitCount" value="3"
                           maxlength="2" dataType="Number,Range" min="1" max="99" required/>
            </div>
            <div class="row_item" style="display: none">
                <label class="control-label">技能组为空时，是否立即流转</label>
                    <input type="radio" name="Joinempty" value="yes" checked>是
                    <input type="radio" name="Joinempty" value="no">否
            </div>
            <div class="row_item" style="display: none">
                <label class="control-label" for="email_queue_strategy">分配策略</label>
                    <select id="email_queue_strategy" name="Strategy">
                        <option selected="selected" value="rrmemory">轮流</option>
                    </select>
            </div>
            <div class="row_item" style="display: none">
                <label class="control-label" for="email_sendServerPort">技能组为空流向</label>
                    <input id="email_sendServerPort" type="text" name="ToPeerWhenQueueEmpty" value="0">
            </div>
        </div>
    </form>
    <div class="queue_toggle_panel">
        <input type="text" class="sizem img_action_search" placeholder="输入座席姓名或工号" data-provide="typeahead" id="agentAssignAutoComplete" autocomplete="off">
        <a href="#" id="locationAgentHref" style="display: none">a</a>
        <!-- <span onchange="selectAllQueueAgent(this)">全选</span> -->
        <div class="set_result" id="agentAssignTable">
            <ul></ul>
        </div>
    </div>
</div>
<script type="text/javascript">
    $(function(){
        var fullHeight = $(".right_content_pane").height();
        var titleHeight = $(".asth").height() + $("#frm_email_add .alert-success").height()-81;
        console.log(titleHeight);
        var lessHeight = fullHeight - titleHeight-244;//边线及各种间距
        $(".show_result").css("max-height",lessHeight*3/10);
        $(".set_result").css("max-height",lessHeight*7/10);
    });
    function selectAllQueueAgent(sel){
        var leftList = $("#agentAssignTableLeft").find("input[type=checkbox]");
        var rightList = $("#agentAssignTableRight").find("input[type=checkbox]");
        if(sel.checked==true){
            $.each(leftList,function(key, item){
                $(item).attr("checked",true);
            })
            $.each(rightList,function(key, item){
                $(item).attr("checked",true);
            })
        }else{
            $.each(leftList,function(key, item){
                $(item).attr("checked",false);
            })
            $.each(rightList,function(key, item){
                $(item).attr("checked",false);
            })
        }
    }
</script>
