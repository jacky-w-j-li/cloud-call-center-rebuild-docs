<script>
    var sdkDemoEditor2 = ace.edit("webchat_sdk_code_demo_init");
    var JavaScriptMode = ace.require("ace/mode/javascript").Mode;
    sdkDemoEditor2.session.setMode(new JavaScriptMode());
    sdkDemoEditor2.getSession().setUseWrapMode(true);
        sdkDemoEditor2.setReadOnly(true);
    sdkDemoEditor2.setOptions({
        autoScrollEditorIntoView: true,
        maxLines: 50
    });
    sdkDemoEditor2.renderer.setScrollMargin(0, 10, 10, 10);
    setValue("init", "webchat_sdk_code_demo_init");

    var sdkDemoEditor2 = ace.edit("webchat_sdk_code_demo_script");
    var JavaScriptMode = ace.require("ace/mode/javascript").Mode;

    sdkDemoEditor2.getSession().setUseWrapMode(true);
        sdkDemoEditor2.setReadOnly(true);

        autoScrollEditorIntoView: true,
        maxLines: 30,

    });
    sdkDemoEditor2.renderer.setScrollMargin(0, 10, 10, 10);
    setValue("chat_demo_script", "webchat_sdk_code_demo_script");

    var sdkDemoEditor2 = ace.edit("webchat_sdk_send_msg");

    sdkDemoEditor2.session.setMode(new JavaScriptMode());
    sdkDemoEditor2.getSession().setUseWrapMode(true);

    setValue("send_msg", "webchat_sdk_send_msg");


    var sdkDemoEditor2 = ace.edit("webchat_sdk_convert_manual");

    });
    sdkDemoEditor2.renderer.setScrollMargin(0, 10, 10, 10);
    setValue("convert_manual", "webchat_sdk_convert_manual");


    var sdkDemoEditor2 = ace.edit("webchat_sdk_submit_investigate");
    var JavaScriptMode = ace.require("ace/mode/javascript").Mode;
    sdkDemoEditor2.session.setMode(new JavaScriptMode());
    sdkDemoEditor2.getSession().setUseWrapMode(true);
        sdkDemoEditor2.setReadOnly(true);
    sdkDemoEditor2.setOptions({

        maxLines: 50
    });
    sdkDemoEditor2.renderer.setScrollMargin(0, 10, 10, 10);
    setValue("submit_investigate", "webchat_sdk_submit_investigate");

    var sdkDemoEditor2 = ace.edit("webchat_sdk_submit_leavemsg");
    var JavaScriptMode = ace.require("ace/mode/javascript").Mode;
    sdkDemoEditor2.session.setMode(new JavaScriptMode());
    sdkDemoEditor2.getSession().setUseWrapMode(true);
        sdkDemoEditor2.setReadOnly(true);
    sdkDemoEditor2.setOptions({
        autoScrollEditorIntoView: true,
        maxLines: 50,
        setShowPrintMargin:true
    });
    sdkDemoEditor2.renderer.setScrollMargin(0, 10, 10, 10);
    setValue("send_leavemsg", "webchat_sdk_submit_leavemsg");

    sdkDemoEditor2.session.setMode(new JavaScriptMode());

    sdkDemoEditor2.setOptions({

    sdkDemoEditor2.renderer.setScrollMargin(0, 10, 10, 10);

    var sdkDemoEditor2 = ace.edit("webchat_sdk_show_breaktips");

    sdkDemoEditor2.session.setMode(new JavaScriptMode());

    });
    sdkDemoEditor2.renderer.setScrollMargin(0, 10, 10, 10);
    setValue("break_show_tips", "webchat_sdk_show_breaktips");

    function setValue(value, id) {
        DS.getView('config/channel/webchatsdk/'+value, function (view) {
            var el = document.getElementById(id);
            el.env.editor.setValue(view, 1);
        });
//        ace.require("ace/lib/net").get("./webchatsdk/"+value, function(t){
//            var el = document.getElementById(id);
//            el.env.editor.setValue(t, 1);
//        });
    }
    $(".text a").click(function(src){
        var a = $(src.target);
        if(a.html() == "[展开]"){
            a.html("[收缩]");
        }else{
            a.html("[展开]");
        }
        var forId =$(a).closest(".text").attr("for");
        $("#"+forId).toggleClass("show");
    });
</script>
