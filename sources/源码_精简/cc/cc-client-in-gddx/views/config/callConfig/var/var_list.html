<div class="row-fluid">
    <div class="span5">
        <div class="row-fluid">
            <div class="span7">
                <div class="input-append" style="float:left;">
                    <input id="var_query" name='query' class="ivr_search"
                           node-type="ivr.vars" map-key="Memo,DisplayName" pagination-name="varList"
                           type="text" placeholder="输入查询条件...">
                    <div class="btn-group">
                        <button class="btn dropdown-toggle" data-toggle="dropdown" tabindex="-1">
                            <span class="caret"></span>
                        </button>
                        <ul class="dropdown-menu">
                            <li>
                                <a href="#">高级查询</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
            <div class="span4 offset1 text-right pull-right">
                <a class="btn-add ds_action_flow">
                    <ds-get-view view="config/callConfig/var/var_add" panel="var_panel"/>
                    添加
                </a>
            </div>
        </div>
        <div>
            <div class="accordion-inner">
                <div class='ds-item-list' id="varList" item-view="config/callConfig/var/var_list_item"
                             data-source="ivr['vars']"></div>
            </div>
        </div>
        <div class="row-fluid">
            <div class="span4">
                <a href="#" class="ds_action_flow">
                    <ds-do-action action="config.ivr.vars.refreshVar" extra-data="config.callConfig.currentConfigData"
                                  update-client-data='{"method":"config.callConfig.updateClientDataList","arg":{"type":"vars"}}'/>
                    <ds-get-view view="config/callConfig/var/var_list" panel="ivrVarPanel"/>
                    <i class="icon-refresh"></i>刷新
                </a>
                <br/>
                <br/>
                <span>查询结果：<span class="varList_result_count">10</span></span>
            </div>
            <div class="span8 class_list pull-right">
                <div class="pagination" style="margin:3px;">
                    <ul id="varList_index">
                        <li><a href="#" for="varFrm" class="pagination" ds_pagination_action="config.callConfig.paginationChanged" value="0">&laquo;</a></li>
                        <li><a href="#" for="varFrm" class="pagination" ds_pagination_action="config.callConfig.paginationChanged" value="1">1</a></li>
                        <li><a href="#" for="varFrm" class="pagination" ds_pagination_action="config.callConfig.paginationChanged" value="2">2</a></li>
                        <li><a href="#" for="varFrm" class="pagination" ds_pagination_action="config.callConfig.paginationChanged" value="3">3</a></li>
                        <li><a href="#" for="varFrm" class="pagination" ds_pagination_action="config.callConfig.paginationChanged" value="4">4</a></li>
                        <li><a href="#" for="varFrm" class="pagination" ds_pagination_action="config.callConfig.paginationChanged" value="5">5</a></li>
                        <li><a href="#" for="varFrm" class="pagination" ds_pagination_action="config.callConfig.paginationChanged" value="6">&raquo;</a></li>
                    </ul>
                </div>
            </div>
            <form id="varFrm">
                <input type="hidden" name="dataSource" value="ivr.vars">
                <input type="hidden" name="itemListID" value="varList">
            </form>
        </div>
    </div>
    <div class="span7 sub-right" id="var_panel">
    </div>
</div>
