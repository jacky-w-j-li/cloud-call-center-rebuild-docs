<div class="row-fluid">
    <div class="span12">
        <form class="form-horizontal ds_item_edit" action="" client-data="session.ivrMap.ivr.ivr_service_no">
            <input type="hidden" name="_id"/>
            <input type="hidden" name="Type" value="normal"/>
            <div id="confirm_del_pane"></div>
            <div class="row-fluid">
                <div class="span7 offset1">
                    <i class="icon-edit"></i>修改服务号
                </div>
                <div class="span4 text-right pull-right">
                    <a class="btn btn-info btn-blue ds_action_flow">
                        <ds-form-action action="config.ivr.serviceNo.updateServiceNo" extra-data="config.callConfig.currentConfigData"
                            update-client-data='{"method":"config.callConfig.updateClientData","arg":{"type":"ivr_service_no"}}'/>
                        <ds-get-view view="config/callConfig/serviceNO/service_no_list" panel="ivrServiceNoPanel"/>
                        <ds-effect-ivr/>
                        保存
                    </a>
                    <a class="btn btn-danger btn-gray ds_action_flow">
                        <ds-form-action action="config.ivr.serviceNo.deleteServiceNo" extra-data="config.callConfig.currentConfigData"
                                update-client-data='{"method":"config.callConfig.updateClientData","arg":{"operation":"del","type":"ivr_service_no"}}'
                                on-complete="config.callConfig.serviceNo.afterDeleteServiceNo"/>
                        <ds-get-view view="config/callConfig/serviceNO/service_no_list" panel="ivrServiceNoPanel"/>
                        <ds-effect-ivr/>
                        删除
                    </a>
                </div>
            </div>
            <br/>
            <br/>
            <div class="control-group">
                <label class="control-label aa">服务号</label>
                <div class="controls">
                    <input type="text" name="Exten" value="__Exten" required disabled/>
                </div>
            </div>
            <div class="control-group">
                <label class="control-label">
                    别名
                </label>
                <div class="controls">
                    <input type="text" name="DisplayName" value="__DisplayName"/>
                </div>
            </div>
        </form>
    </div>
</div>
