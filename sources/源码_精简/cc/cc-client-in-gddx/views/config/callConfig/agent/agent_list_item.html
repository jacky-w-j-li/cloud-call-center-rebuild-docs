<div class="row-fluid list-item ds_action_flow" title="点击修改">
    <ds-get-view view="config/callConfig/agent/agent_edit" panel="agent_pane" view-data='{"_id":"___id"}'
            on-complete="config.callConfig.agent.onShownAgentEdit"/>
    <div class="span12">
        <div class="row-fluid">
            <div class="span4">
                <h4 class="text_hidden" style="color:#0088CC;">__displayName</h4>
            </div>
        </div>
        <div class="row-fluid">
            <div class="span2">
                <span class="label">__exten</span>
            </div>
            <div class="span3">
                __password
            </div>
            <div class="span7">
                最后修改时间：_@config.callConfig.agent.getAgentLastUpdateTime('__lastUpdate')@_
                &nbsp;&nbsp;
                <span class="label label-important">_@config.callConfig.agent.getAgentStatusName('__status')@_</span>
            </div>
        </div>
    </div>
</div>
<div style="height:1px;background-color:#EAEAEA;width:100%;margin-bottom:5px;">
</div>
