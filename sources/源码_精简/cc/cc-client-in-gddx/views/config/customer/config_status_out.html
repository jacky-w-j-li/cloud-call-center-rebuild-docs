<div class="modal-header">
    <button type="button" class="close" data-dismiss="modal" aria-hidden="true">
        ×
    </button>
    <h3>定制客户状态</h3>
</div>
<div class="">
    <form>
        <div class="modal-body">
            <div class="row_item">
                <label for="status0">未拨打</label>
                <input id="status0" maxlength="20" name="status0" type="text" value="__status0">
                <span class="square status0"></span> <span style="display: inline-block;padding-left: 10px;padding-top: 5px;">默认状态</span>
            </div>


            <div class="row_item">
                <label for="status1">兴趣</label>
                <input id="status1" maxlength="20" name="status1" type="text" value="__status1">
                <span class="square status1"></span>
            </div>
            <div class="row_item">
                <label for="status2">重点跟踪</label>
                <input id="status2" maxlength="20" name="status2" type="text" value="__status2">
                <span class="square status2"></span>
            </div>
            <div class="row_item">
                <label for="status3">成单</label>
                <input id="status3" maxlength="20" name="status3" type="text" value="__status3">
                <span class="square status3"></span>
            </div>
            <div class="row_item">
                <label for="status4">无兴趣</label>
                <input id="status4" maxlength="20" name="status4" type="text" placeholder="填写自定义状态名称..." value="__status4">
                <span class="square status4"></span>
            </div>
            <div class="row_item">
                <label for="status5">丢单</label>
                <input id="status5" maxlength="20" name="status5" type="text" placeholder="填写自定义状态名称..." value="__status5">
                <span class="square status5"></span>
            </div>
            <div class="row_item">
                <label for="status6">无效数据</label>
                <input id="status6" maxlength="20" name="status6" type="text" placeholder="填写自定义状态名称..." value="__status6">
                <span class="square status6"></span>
            </div>
            <div class="row_item">
                <label for="status7">可扩展状态</label>
                <input id="status7" maxlength="20" name="status7" type="text" placeholder="填写自定义状态名称..." value="__status7">
                <span class="square status7"></span>
            </div>
            <div class="row_item">
                <label for="status8">可扩展状态</label>
                <input id="status8" maxlength="20" name="status8" type="text" placeholder="填写自定义状态名称..." value="__status8">
                <span class="square status8"></span>
            </div>
            <div class="row_item">
                <label for="status9">可扩展状态</label>
                <input id="status9" maxlength="20" name="status9" type="text" placeholder="填写自定义状态名称..." value="__status9">
                <span class="square status9"></span>
            </div>
        </div>
        <div class="modal-footer">
            <button href="#" class="btn btn-small btn-primary ds_form_action" ds_action="config.customer.editStatus" template-id="__id">
                保存
            </button>
            <button class="btn btn-small " data-dismiss="modal" aria-hidden="true">
                取消
            </button>
        </div>
    </form>
</div>
