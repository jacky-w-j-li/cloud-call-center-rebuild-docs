<form id="__id">
    <input class="hidden" name="template_id" value="__template">
    <input class="hidden" name="field_id" value="__id">
    <div class="custom_field">
        <div class="item">
            <div class="nav">
                <span class="up ds_form_action" ds_action="config.customer.moveCustomFieldUp"></span>
                <span class="down ds_form_action" ds_action="config.customer.moveCustomFieldDown"></span>
            </div>

            <div class="name-type clearfix">
                <div class="ellipsis" style="display:inline-block;max-width: 180px;float: left;">__name</div>
                <div class="field-type" style="float: left;">__type</div>
            </div>
            <div class="edit-remove">
                <a class="item-delete ds_form_action" title="删除" ds_action="config.customer.deleteCustomField"></a>
                <a class="item-edit ds_form_action" ds_action="config.customer.showEditCustomField" title="编辑"></a>
            </div>
        </div>
    </div>
</form>
