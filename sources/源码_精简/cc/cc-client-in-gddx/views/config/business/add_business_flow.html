<div class="modal-header">
    <button type="button" class="close" data-dismiss="modal" aria-hidden="true">
        ×
    </button>
    <h3>添加业务流程</h3>
</div>
<div class="">
    <form>
        <div class="modal-body">
            <div class="row_item">
                <label for="name">业务流程名称</label>
                <input id="name" name="name" value="" maxlength="10" type="text" required>
            </div>
            <div class="row_item">
                <label >工单总时限设置</label>
                <input type="num" id="ctime" name="ctime" datatype="Number,Range" min="1" msg="输入的时间必须大于0" value=""   maxlength="5" onkeyup="this.value=this.value.replace(/\D/g,'')" >
                &nbsp;&nbsp;单位
                <select name="ctype">
                    <option value="min" selected="selected">分钟</option>
                    <option value="hours">小时</option>
                    <option value="day">天</option>
                </select>
            </div>
        </div>
        <div class="modal-footer">
            <button href="#" class="btn btn-primary ds_form_action" ds_action="config.business.addBusinessFlow">
                保存
            </button>
            <button class="btn" data-dismiss="modal" aria-hidden="true">
                取消
            </button>
        </div>
    </form>
</div>
