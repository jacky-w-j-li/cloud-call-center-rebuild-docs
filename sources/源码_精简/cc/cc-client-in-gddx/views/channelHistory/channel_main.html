<script type="text/javascript">
    $(function(){
        var evt=dsevent.evt.customerAdd+" "+dsevent.evt.channelRefresh+" "+
                dsevent.evt.customerUpdate+" "+dsevent.evt.callRefreshCustomer+" "+dsevent.evt.customerDelete
                ;
        dsevent.bind('#contact_list_channel', evt,function(event, params){
            var parent=$("#contact_list_channel");
            var data={};
            if(params){
                data=params;
            }
//            console.dir(data);
            var rightPane=$("#body_channel");
            var callId = handler.channelHistory.curShowPaneCallId;
            var flag=handler.channelHistory.currentFlag;
            if(flag=='relocationWeixin'){
                callId=callId+"_"+data.accountId;
            }
            data.callId = callId;
//            console.info("flag=="+flag+",callId======"+callId);
            var t=parent.find(".item"+callId);
            if(event.type==dsevent.evt.customerAdd){
                if(!callId)return;
                handler.customer.loadCustInfo(data._id, callId,flag,null,data.popupId);
                dsevent.publish(dsevent.evt.callRefreshCustomer,data);
            }else if(event.type==dsevent.evt.customerUpdate){
                dsevent.publish(dsevent.evt.callRefreshCustomer,data);
            }else if(event.type==dsevent.evt.customerDelete){
                rightPane.empty();
                dsevent.publish(dsevent.evt.callRefreshCustomer,data);
                t.click();
            }else if(event.type==dsevent.evt.callRefreshCustomer){
                handler.channelHistory.syncChannelCustomer(data,parent);
            }else if(event.type==dsevent.evt.channelRefresh){
                rightPane.empty();
                var model="call";
                if(flag=='relocationMail'){
                    model="mail";
                }else if(flag=='relocationWeixin'){
                    model="weixin";
                }
                handler.cancelDealToolbar(model);
                parent.find('.refresh').click();
            }
        });

    });
</script>
