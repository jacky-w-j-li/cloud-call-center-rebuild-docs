<div tabindex="-1" class="advanced_search_pane hidden" >
    <div class="advanced_body">
        <form id="frm_sms_advanced_search" class="ds_search_form">
            <input type="hidden" name="isAdvanceSearch" value="1">
            <fieldset>
                <div class="row-fluid">
                    <div class="span4 advanced_search_item ds_search_item">
                        <label>发送号码</label>
                        <input  name="num" type="text" class=""/>
                    </div>
                    <div class="span4 advanced_search_item ds_search_item">
                        <label>状态</label>
                        <select name="m7Status" class="">
                            <option value="" selected>--请选择--</option>
                        </select>
                    </div>
                    <div class="span4 advanced_search_item ds_search_item">
                        <label>短信签名</label>
                        <select name="sign" class="">
                            <option value="" selected>--请选择--</option>
                        </select>
                    </div>
                </div>
                <div class="row-fluid">
                    <div class="span4 advanced_search_item ds_search_item ds_owner">
                        <label>发送座席</label>
                        <input name="createUser" type="hidden" class="select_input" id="create_user_select_input"  />
                        <div id="create_user_select_user" class="combobox_agent"></div>
                    </div>
                    <div class="span8 advanced_search_item ds_search_item">
                        <label>发送时间</label>
                        <input name="submitTime_begin_date" class="ds_datetime" type="text" placeholder="">
                        <label style="width: 16px">至</label>
                        <input name="submitTime_end_date" class="ds_datetime" type="text" placeholder="">
                    </div>
                </div>
                <div style="padding: 10px;">
                    <button type="button" class="btn btn-small btn-primary ds_form_action  pull-right btn_advanced" ds_action="sms.searchSmsCard" >搜索</button>
                    <button type="button" class="btn btn-small  ds_do_action  pull-right" ds_action="sms.resetSms" ds_data="_#menu#_" style="margin-right: 10px;">重置</button>
                </div>
            </fieldset>
        </form>
    </div>
</div>

    </div>
    <div class="list-footer">

                </li>
                <li>
                    <a href="#"  value="3">3</a>
                </li>

                </li>

                </li>
                <li>
                    <a href="#"  value="6">»</a>
                </li>
            </ul>
        </div>
    </div>
</div>

<script id="tmpl_sms_item" type="text/html">
    <div class="list_item ">
        <div class="ds_do_action item_row item{{=_id}} item_check" ds_action="sms.showSmsDetail" ds_data="{{=_id}}" style="">
            <div class="card_row">
                <input type="hidden" name="pk" value="{{=_id}}" >
                <div class="card_right">
                    <div class="muted" title="{{=submitTime}}">{{=shortTime}}</div>
                    <div style="position: absolute;bottom: 8px;right:0;"><span class="label {{=statusClass}}">{{=statusDesc}}</span></div>
                </div>
                <div class="card_left">
                    <div style="">
                        <b class="ico_select_checkbox ico ico_wrap ico_item_customer " style="display: none;"></b>
                    </div>
                    <div style="position: absolute;bottom: 8px;left:0;"><span class="label" title="拆分条数">{{=splitCount}}</span></div>
                </div>
                <div class="card_middle">
                    <div class="card_row_title">{{=num}} <span title="签名">{{=signDisplay}}</span></div>
                    <div class="">
                        <span title="处理座席">{{=agentDesc}}</span>
                    </div>
                    <div class="ellipsis muted">{{=content}}</div>
                </div>
            </div>
        </div>
    </div>
</script>

<script type="text/javascript">
    var smsAgentsArr = getCache("agents");
    var _smsAgentsArr=[];
    for(var i=0;i<smsAgentsArr.length;i++){
        var u=smsAgentsArr[i];
        _smsAgentsArr.push(u);
    }

    _smsAgentsArr.unshift({_id:'interface',displayName:'接口调用',exten:'interface',pinyin:'interface'})
    utils.loadSearchInput({ id: "create_user_select_user",
        width: "110",
        height: "14",
        tip: "按姓名,拼音,工号搜索",
        data: _smsAgentsArr,
        searchField: ["displayName", "exten", "pinyin"],
        pinyinField: ["displayName"],
        listField: ["displayName", "exten"],
        userIdField: "_id",
        showField: "displayName",
        showAllList: true,
        callbackFuc: function (object) {
            $("#create_user_select_input").val(object._id);
        },
        onKeyChanged: function () {
            if ($("#create_user_select_user_input").val() != "") {
                $("#create_user_select_input").val("serachInputNoresult");
            } else {
                $("#create_user_select_input").val("");
            }
        }
    });
</script>
