<div class="">
    <form class="form-horizontal">
        <div>
            <div style="height: 25px;line-height: 25px;">您搜索到的邮件共计<span class="cust_count">0</span>个</div>
            <div style="height: 25px;line-height: 25px;margin-bottom: 0px;">分配规则：<a href="#" class="ds_do_action" ds_action="customer.autoAssgin">自动分配</a>&nbsp;&nbsp;&nbsp;&nbsp;
                <a href="#" class="ds_do_action" ds_action="customer.resetAssgin">重置</a>
                当前未分配邮件数<span class="cust_more_count" style="color:red">0</span>个 </div>
            <div style="margin-bottom: 20px;">过滤座席：
                <span style="display: inline-block;" id="mail_assign_select_agents"></span>
                <div id="mail_assign_search_div" class="combobox_agent"></div>
            </div>
        </div>
        <div class="row-fluid mail_assgin_container">
        </div>
        <div class="form_buttons" style="padding-top:10px;">
            <button type="button" class="btn btn-small btn-primary ds_form_action pull-left btn_pad" ds_action="callMail.saveMailAssign">保存</button>
            <button type="button" class="btn btn-small pull-left" data-dismiss="modal" aria-hidden="true">取消</button>
        </div>
    </form>
</div>

<script id="tmpl_mail_assgin" type="text/x-jquery-tmpl">
    <div class="span4">
        <input type="hidden" name="owner[]" value="${_id}"/>
        <div class="control-group" >
            <label class="control-label" style="width:85px;">${displayName}[${exten}]：</label>
            <input size="5" style="width:35px;float:left" type="text"  class="user_cust" name="assign[]" value="0"
                                         onkeyup="this.value=this.value.replace(/\D/g,'')" onafterpaste="this.value=this.value.replace(/\D/g,'')"  />
                                         <span style="padding-top:8px;float:left;">个客户</span>
        </div>
    </div>
</script>
<script type="application/javascript">
    $(function () {
        var pane=$("#batch_modal");
//        var users = getCache("agents");
        var users=filterUserByScope();
        var _users=[];
        for(var i=0;i<users.length;i++){
            var u=users[i];
            if(u.status=='enable'){
                _users.push(u);
            }
        }
        utils.loadSearchInput({ id: "mail_assign_search_div",
            width: "140",
            height: "14",
            tip: "按姓名、拼音、工号搜索",
            data: _users,
            listField: ["displayName", "exten"],
            userIdField: "_id",
            searchField: ["displayName", "exten", "pinyin"],
            pinyinField: ["displayName"],
            showAllList: true,
            callbackFuc: function (object) {
                if($.isArray(object)){
                    return;
                }
                var currentVals = pane.find("input[name='filterAgent']");
                var ishas = false;
                for (var i = 0; i < currentVals.length; i++) {
                    if (currentVals[i].value == object._id) {
                        ishas = true;
                        break;
                    }
                }
                if(!ishas) {
                    $('#mail_assign_select_agents').before("<span><input type='hidden' name='filterAgent' value=" + object._id + ">" +
                            "<span class='label label-info'>" + object.displayName +
                            "</span><a href='#' onclick=mail_removeAgent(this)><i class='icon-remove'></i></a>&nbsp;</span>");
                    filterCustAssign();
                }
            }
        });
    })
    function mail_removeAgent(src) {
        $(src).closest("span").remove();
        filterCustAssign();
    }
    function filterCustAssign(){
        var pane=$("#batch_modal");
        var _agents = pane.find("input[name='filterAgent']");
        var _filterUsers=[];
        _agents.each(function(){
            _filterUsers.push($(this).val());
        });
//        var users = getCache("agents");
        var users=filterUserByScope();
        var filterUsers = [];
        if(_filterUsers.length>0){
            for(var i=0;i<users.length;i++){
                var u=users[i];
                if($.inArray(u._id,_filterUsers)!=-1){
                    filterUsers.push(u);
                }
            }
        }else{
            for(var i=0;i<users.length;i++){
                var u=users[i];
                if(u.status=='enable'){
                    filterUsers.push(u);
                }
            }
        }

        filterUsers=handler.customer._bubbleSort(filterUsers);
        var html=[];
        for(var i=0;i<filterUsers.length;i++){
            var u=filterUsers[i];
            if(u.status=='enable'){
                var tmpl=pane.find("#tmpl_mail_assgin").tmpl(u).get(0).outerHTML;
                if((i+1)%3==1){
                    html.push('<div class="row-fluid">'+tmpl);
                }else if((i+1)%3==0){
                    html.push(tmpl+'</div>');
                }else{
                    html.push(tmpl);
                }
            }
        }
        if(filterUsers.length%3==1){
            html.push('<div class="span8"></div></div>');
        }else if(filterUsers.length%3==2){
            html.push('<div class="span4"></div></div>');
        }
        $(".mail_assgin_container",pane).html(html.join(""));
    }

</script>
