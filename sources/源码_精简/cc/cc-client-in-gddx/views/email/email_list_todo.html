<script type="text/javascript">
    $("#email_autoclaim_switch").bootstrapSwitch({size:'small',onColor:'success',offColor:'warning',onText:'开',offText:'关'});
    //        $("#login_panel").find(".bootstrap-switch-success").css({backgroundColor:'#5d87af!important',backgroundImage:"linear-gradient(to bottom,#5d87af,#5d87af)"});
//    $("#email_autoclaim_switch").bootstrapSwitch('toggleState');
//    $('#email_autoclaim_switch').bootstrapSwitch('setState', false);

    $('#email_autoclaim_switch').on('switchChange.bootstrapSwitch', function(event, state) {
        if(state){
            handler.email.autoClaim = true;
            handler.email.updateAutoClaimEmailSessionStatus("open");
            handler.email.claimNewEmailSession();
        }else{
            handler.email.autoClaim = false;
            handler.email.updateAutoClaimEmailSessionStatus("close");
        }
    });

    dsevent.bind("#view_email_todo", dsevent.evt.refreshEmailToDoList, function(event , params){
        $(this).find(".refresh").click();
    });
</script>
