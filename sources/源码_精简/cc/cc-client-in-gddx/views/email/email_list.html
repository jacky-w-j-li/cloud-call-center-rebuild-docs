<script type="text/html" id="tmpl_email_advanced_search">
    <div class="advanced_body">
        <form id="frm_email_advanced_search_{{=menu}}" class="ds_search_form">
            <fieldset>
                <div class="row-fluid">
                    <div class="span4 advanced_search_item ds_search_item ">
                        <label class="">客户邮箱地址</label>
                        <input name="from.addr" type="text"
                               placeholder="">
                    </div>
                    <div class="span4 advanced_search_item ds_search_item ">
                        <label class="">邮件主题</label>
                        <input name="subject" type="text"
                               placeholder=""></div>

                    <div class="span4 advanced_search_item ds_search_item ">
                        <label class="">客户名称</label>
                        <input name="custName" type="text"
                               placeholder="">
                    </div>
                </div>
                <div class="row-fluid">
                    <div class="advanced_search_item span8  ds_search_item ">
                        <label class="">创建时间</label>
                        <input name="createTime_begin_date" class="ds_datetime" type="text"
                               placeholder="">
                        <label style="width: 16px">至</label>
                        <input name="createTime_end_date" class="ds_datetime" type="text"
                               placeholder="">
                    </div>


                </div>
                <div class="row-fluid">
                    <div class="advanced_search_item span10  ds_search_item ">
                        <label class="">最近一次收取时间</label>
                        <input name="lastReceiveTime_begin_date" class="ds_datetime" type="text"
                               placeholder="">
                        <label style="width: 16px">至</label>
                        <input name="lastReceiveTime_end_date" class="ds_datetime" type="text"
                               placeholder="">
                    </div>
                </div>
                <div class="row-fluid">
                    <div class="span4 advanced_search_item ds_search_item ">
                        <label class="">企业客服邮箱</label>
                        <select class="" id="advanced_search_email" name="to.addr">
                            <option value="" selected>--请选择--</option>
                        </select>
                    </div>
                    <div class="span4 advanced_search_item ds_search_item ">
                        <label class="">分类选择</label>
                        <select class=" " name="category">
                            <option value=''>--请选择--</option>
                        </select>
                    </div>
                </div>
                <div class="row-fluid">
                    <div class="span4 advanced_search_item ds_search_item ">
                        <label class="">状态</label>
                        <select class=" " name="status">
                            <option value="" selected>--请选择--</option>
                            <option value="finish">已解决</option>
                            <option value="deal">处理中</option>
                            <option value="undeal">待处理</option>
                        </select>
                    </div>
                    <div class="span4 advanced_search_item ds_search_item ds_owner condition_hide">
                        <label>当前处理人</label>
                        <input name="ownercom" type="hidden" class="select_input" id="_#menu#__owner_select_input_com" />
                        <input name="agent" type="hidden" class="select_input" id="_#menu#__owner_select_input" />
                        <input name="ownerdep" type="hidden" class="select_input" id="_#menu#__owner_select_input_dep" />
                        <!--<div id="_#menu#__owner_select_user" class="combobox_agent"></div>-->
                        <div id="_#menu#__owner_select_user" class="comtabbox_agent"></div>
                    </div>
                </div>
                <div class="ques_fields_pane">
                </div>
                <div style="padding: 10px;">
                    <button type="button" class="btn btn-small btn-primary ds_form_action  pull-right btn_advanced"
                            ds_action="email.queryEmailList">搜索
                    </button>
                     <button type="button" class="btn btn-small  reset_adv_search ds_do_action pull-right" ds_action="email.resetForm" ds_data="{{=menu}}" style="margin-right: 10px;">重置</button>
                </div>
            </fieldset>
        </form>
    </div>
</script>
