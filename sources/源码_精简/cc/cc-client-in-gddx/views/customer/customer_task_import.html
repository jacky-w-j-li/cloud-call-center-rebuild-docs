<div class="">

            <col width="20%"/>

        </colgroup> -->

        <tr>
            <th>

            </th>
            <th>
                电话
            </th>
            <th>
                状态
            </th>
            <th>
                来源
            </th>

        </tr>
        </thead>
        <tbody id="task_import_list_pane">
        </tbody>
    </table>
    <div class="pagination pagination-small" style="" for="import_query_frm" ds_pagination_action="customer.loadTaskImpList">

                <a href="#"  value="6">»</a>
            </li>
        </ul>
    </div>
</div>

<script id="tmpl_taskimport_item" type="text/x-jquery-tmpl">
    <tr>
        <td>
            {{if name}}
            ${name}
            {{/if}}
        </td>
        <td>
            {{if phone}}
            ${handler.customer.contactPhoe(phone)}
            {{/if}}
        </td>
        <td>
            {{if status}}
            ${getCache('custTmpls',dbType).status[status]}
            {{/if}}
        </td>
        <td>
            {{if custsource1}}
            ${handler.customer.getSourceName(dbType,custsource1)}
            {{/if}}
        </td>
    </tr>
</script>
