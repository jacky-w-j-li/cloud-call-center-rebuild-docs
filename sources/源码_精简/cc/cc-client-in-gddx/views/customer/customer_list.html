<div class="left_column" id="contact_list__#menu#_"  ds_menu="_#menu#_">
    <div class="contacts_caption">
        <div class="caption-top clearfix">
            <div class="search_condition" style="display: none;visibility: hidden;"></div>
            <div class="btn-mycustomer" style="float: right">
                <button type="button" class="btn btn-small ds_do_action" ds_action="customer.showCustAdd" ds_data="_#menu#_">添加客户</button>
            </div>
            <div class="btn-customermanage btn-group" style="float:right;overflow: visible;margin-right: 10px;display: none;">
            </div>

            <form id="frm_customer_advanced_search__#menu#_" class="ds_search_form">
                <span class="refresh ds_form_action" style="" ds_action="customer.searchCustomerPage">
                    <a href="javascript:void(0);" title="刷新" class="ajaxed"></a>
                </span>
                <div class="input-append ds_search_item" style="margin-left: 5px;">
                    <input name="dbType" type="hidden"  value="" />
                    <input name="menu" type="hidden"  value="_#menu#_" />
                    <input class="" name="combox" style="width: 110px;" type="text" placeholder="输入名称或号码查询">
                    <input name="remindSearch" class="cust_remindSearch_hidden" type="hidden" value=""/>
                    <button type="button" class="btn ds_form_action customer_normal_search" ds_action="customer.searchCustomerPage"  title="查询">
                        <i class="icon-search"></i>
                    </button>
                    <button type="button" class="btn customer_advanced_search" style="height: 24px;" title="高级查询">
                        <span class="caret"></span>
                    </button>
                </div>
                <div id="customer_advanced_search_pane" style="display:none;min-width: 710px;">
                </div>
            </form>
        </div>
    </div>
    <div class="list_container compact-view">
        <div class="contact_list" >
            <div class="ds_search_filter">
            </div>
            <div class="list-inside">
            </div>
            <div class="pagination pagination-small" style="width:100%;margin:0 3px;" for="frm_customer_advanced_search__#menu#_" ds_pagination_action="customer.searchCustomerPage">
                <span style="float:left;margin-top:8px;font-size:12px;">查询结果: <span class="result_count">10</span></span>
                <ul class="pull-right" style="padding-right: 2px;">
                    <li>
                        <a href="#"  value="0">«</a>
                    </li>
                    <li>
                        <a href="#"  value="1">1</a>
                    </li>
                    <li>
                        <a href="#"  value="2">2</a>
                    </li>
                    <li>
                        <a href="#"  value="3">3</a>
                    </li>
                    <li>
                        <a href="#"  value="4">4</a>
                    </li>
                    <li>
                        <a href="#"  value="5">5</a>
                    </li>
                    <li>
                        <a href="#"  value="6">»</a>
                    </li>
                </ul>
            </div>
        </div>
    </div>
    <script id="tmpl_customer_page_item" type="text/x-jquery-tmpl">
        <div class="list_item">
            <div class="ds_do_action item_row item${_id}" ds_action='customer.showCustInfo' ds_data="_#menu#_">
                <div class="contact_item">
                    <div class="right-items status status_lead">
                        <span class="status-name ${status}" title="${getCache('custTmpls', dbType).status[status]}">${getCache('custTmpls',dbType).status[status]}</span>
                        <br>

                    </div>
                    <!--div class="recentTime">
                        <p>更新于${recentTime}</p>
                    </div-->
                    <div class="left-items">
                    <span class="bulk">
                      <input class="summary_id hiddenCheckbox" type="checkbox" name="customerId" value="${_id}" >
                    </span>
                    </div>
                    <div class="middle-items">
                        <div class="contact">
                          <span class="name">
                             <span class="major" title="${name}" style="max-width: 315px;">${name}</span>
                             <span class="minor" title="${name}">${title}</span>
                          </span>
                        </div>
                        <div class="next_action">
                            {{if notifyTime}}
                            <span style="top:8px;" class="action_date_id action_date ${getNotifyDate(notifyTime).type}" title="${notifyTime}">${getNotifyDate(notifyTime).name}</span>
                            {{else}}
                            <span style="top:8px;" class="action_date_id"></span>
                            {{/if}}
                            <span class="action_content" title="${action}">${action}
                                {{if notifyTime}}
                                    (${getNotifyDate(notifyTime).displayName})
                                {{/if}}
                                &nbsp;
                            </span>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </script>
</div>
<div class="right_column" >
    <div class="contact_detail">
        <div  class="content">
            <div class="custlist" id="_#menu#__customer">

            </div>
        </div>
    </div>
</div>
<style type="text/css">
    #customer_advanced_search_pane{
        border: 1px rgb(189, 188, 188) solid;
        position: absolute;
        top: 75px;
        left: 185px;
        background-color: #ffffff;
        padding: 0;
        z-index: 1;
        margin-top: -1px;
    }
    .advanced_search_item label {
        display: inline-block;
        width: 70px;
        float: left;
        line-height: 23px;
        text-align: right;
        padding-right: 5px;
    }

    .advanced_search_item input {
        width: 120px;
        padding: 3px;
        height: 17px;
        float: left;
        margin-bottom: 0;
    }
    .advanced_search_item select {
        width: 128px;
        padding: 3px;
        /*height: 17px;*/
        float: left;
        margin-bottom: 0;
    }
</style>
<script type="text/javascript">
    $(function(){
        var menu = '_#menu#_';
        var evt=dsevent.evt.customerAdd+" "+dsevent.evt.customerAddCancel+" "+dsevent.evt.customerNew+" "+
                dsevent.evt.customerUpdate+" "+dsevent.evt.action+" "+dsevent.evt.customerUpdateStatus+" "+dsevent.evt.customerUpdateOwner+" "
                +dsevent.evt.customerBatchDel+" "+dsevent.evt.customerDelete+" "+dsevent.evt.customerRefresh;
        dsevent.bind('#contact_list__#menu#_', evt,function(event, params){
            var parent=$("#contact_list_"+menu);
            var data={};
            if(params){
                data=params;
            }
            var t=parent.find(".item"+data._id);
            var rightPane=$("#"+menu+"_customer");
            if(event.type==dsevent.evt.customerAdd){
               parent.find(".list-inside").prepend(parent.find("#tmpl_customer_page_item").tmpl(data));
               parent.find(".list-inside .item_row:first").click();
            }else if(event.type==dsevent.evt.customerAddCancel){
                var t1=parent.find(".item_row.expanded");
                if(t1.length>0){
                    t1.click();
                }
            }else if(event.type==dsevent.evt.customerUpdate){
                handler.customer.syncCustItem(data,t,0);
            }else if(event.type==dsevent.evt.action){
                handler.customer.syncCustItem(data,t,1);
            }else if(event.type==dsevent.evt.customerUpdateStatus){
                handler.customer.syncCustItem(data,t,2);
            }else if(event.type==dsevent.evt.customerUpdateOwner){

            }else if(event.type==dsevent.evt.customerBatchDel){
                rightPane.empty();
                parent.find('.refresh').click();
            }else if(event.type==dsevent.evt.customerDelete){
                rightPane.empty();
                t.parent().remove();
            }else if(event.type==dsevent.evt.customerRefresh){
                rightPane.empty();
                parent.find('.refresh').click();
            }
        });

    });
</script>
