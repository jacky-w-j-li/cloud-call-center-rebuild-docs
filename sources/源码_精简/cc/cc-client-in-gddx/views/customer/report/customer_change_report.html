<script type="text/javascript">
    $(function () {
        var pane=$("#view_customer_change_report");
        var users = getCache("agents");
        var _users=[];
        for(var i=0;i<users.length;i++){
            var u=users[i];
            if(u.status=='enable'){
                _users.push(u);
            }
        }
        utils.loadSearchInput({ id: "report_customer_change_search_div",
            width: "120",
            height: "14",
            tip: "按姓名,拼音,工号搜索",
            data: _users,
            listField: ["displayName", "exten"],
            userIdField: "_id",
            searchField: ["displayName", "exten", "pinyin"],
            pinyinField: ["displayName"],
            showAllList: true,
            callbackFuc: function (object) {
                if($.isArray(object)){
                    return;
                }
                var currentVals = pane.find("input[name='filterAgent[]']");
                var ishas = false;
                for (var i = 0; i < currentVals.length; i++) {
                    if (currentVals[i].value == object._id) {
                        ishas = true;
                        break;
                    }
                }
                if(!ishas) {
                    pane.find('#report_customer_change_select_agents').before("<span><input type='hidden' name='filterAgent[]' value=" + object._id + ">" +
                            "<span class='label label-info'>" + object.displayName +
                            "</span><a href='#' onclick=report_customer_removeAgent(this)><i class='icon-remove'></i></a>&nbsp;</span>");
//                    report_filterCustAssign();
                }
            }
        });
    });
    function report_customer_removeAgent(src) {
        $(src).closest("span").remove();
        report_filterCustAssign();
    }
    function report_filterCustAssign(){

    }

</script>
