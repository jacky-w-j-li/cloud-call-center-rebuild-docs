<div id="contact_list__#menu#_"  ds_menu="_#menu#_" class="list_check_pane">

                            </ul>
                        </li>
                    </ul>

            </div>

                        </ul>
                    </div>
                </div>

            </div>-->

            <div class="ds_search_filter" style="display: none;">

        </div>

    </div>

<script id="tmpl_customer_page_item" type="text/x-jquery-tmpl">
    <div class="list_item list_item_check">
        <div class="ds_do_action item_row item${_id} item_check customer_item" ds_action="customer.showCustInfo" ds_data="_#menu#_" style="">
            <div class="card_row_new">
                <input type="hidden" name="customerId" value="${_id}" >
                <div class="card_right">
                    <div class="muted">
                        <span class="cust-owner " title="所属人" >{{html ownerDesc}}</span>
                        {{if ownerMenu}}
                            {{if ownerMenu=="customer_seas"}}
                                <button type="button" class="btn-blue btn-small btn_cust_claim">领取</button>
                            {{/if}}
                        {{/if}}
                    </div>
                    <div style="position: absolute;bottom: 0;right:0;">
                        <span class="status-name ${status} ellipsis" title="${getCache('custTmpls', dbType).status[status]}" style="max-width: 70px;">
                            ${getCache('custTmpls',dbType).status[status]}
                        </span>
                    </div>
                </div>
                <div class="card_left">
                    <b class="ico_select_checkbox ico ico_wrap ico_item_checkbox customer_item"></b>
                    <div style="position: absolute;bottom: 6px;left:3px;" class="customer_isRead">
                    {{if readImg}}
                        <img src="${readImg}" style="width: 10px"/>
                     {{/if}}
                    </div>
                </div>
                <div class="card_middle" style="margin-right:80px;">
                    <div class="customer cust-name ellipsis">${name}</div>
                    <div class="ellipsis  muted margin_patch" >
                           <!--  <span class="genjinicon ${contactDesc}" title=""></span> -->
                            <span class='cust-title'>${title}</span>&nbsp;
                    </div>
                </div>
            </div>
        </div>
    </div>
</script>

<script id="tmpl_customer_plan_item" type="text/x-jquery-tmpl">
    <div class="list_item list_item_check">
        <div class="ds_do_action item_row item${_id} item_check customer_item" ds_action="customer.showCustInfo" ds_data="_#menu#_" style="">
            <div class="card_row_new">
                <input type="hidden" name="customerId" value="${_id}" >
                <div class="card_right">
                    {{if notifyTime}}
                        <span style="" class="action_date_id action_date ${getNotifyDate(notifyTime).type}" title="${notifyTime}">${getNotifyDate(notifyTime).name}</span>
                    {{else}}
                        <span style="" class="action_date_id"></span>
                    {{/if}}
                        <!--<div class="muted">-->
                            <!--<span class="cust-owner " title="所属人" >${ownerDesc}</span>-->
                        <!--</div>-->
                    <div style="position: absolute;bottom: 5px;right:0;">
                        <span class="status-name ${status} ellipsis" title="${getCache('custTmpls', dbType).status[status]}" style="max-width: 70px;">
                            ${getCache('custTmpls',dbType).status[status]}
                        </span>
                    </div>
                </div>
                <div class="card_left">
                    <b class="ico_select_checkbox ico ico_wrap ico_item_checkbox customer_item"></b>
                    <div style="position: absolute;bottom: 6px;left:3px;" class="">
                    </div>
                </div>
                <div class="card_middle" style="margin-right:80px;">
                    <div class="customer cust-name ellipsis">${name}</div>
                    <div class="ellipsis cust-title muted margin_patch action_content" >
                        ${action}
                        {{if notifyTime}}
                            (${getNotifyDate(notifyTime).displayName})
                        {{/if}}
                        &nbsp;
                    </div>
                </div>
            </div>
        </div>
    </div>
</script>
<script type="text/javascript">
    $(function(){
        var menu = '_#menu#_';
        console.info("list-page menu===="+menu);
        if(menu=='customer_plan'){
            var evt=dsevent.evt.customerAdd+" "+dsevent.evt.customerAddCancel+" "+dsevent.evt.customerNew+" "+
                    dsevent.evt.customerUpdate+" "+dsevent.evt.action+" "+dsevent.evt.customerUpdateStatus+" "+dsevent.evt.customerUpdateOwner+" "
                    +dsevent.evt.customerBatchDel+" "+dsevent.evt.customerDelete+" "+dsevent.evt.customerRefresh;
            dsevent.bind('#contact_list__#menu#_', evt,function(event, params){
                var parent=$("#contact_list_"+menu);
                var data={};
                if(params){
                    data=params;
                }
                console.info("event.type====="+event.type)
                var t=parent.find(".item"+data._id);
                var rightPane=$("#"+menu+"_customer");
                if(event.type==dsevent.evt.customerAdd){
                    parent.find(".list-inside").prepend($("#tmpl_customer_page_item").tmpl(data));
                    parent.find(".list-inside .item_row:first").click();
                }else if(event.type==dsevent.evt.customerAddCancel){
                    var t1=parent.find(".item_row.expanded");
                    if(t1.length>0){
                        t1.click();
                    }
                }else if(event.type==dsevent.evt.customerUpdate){
                    handler.customer.syncCustPageItem(data,t,0);
                }else if(event.type==dsevent.evt.action){
                    handler.customer.syncCustItem(data,t,1);
                }else if(event.type==dsevent.evt.customerUpdateStatus){
                    handler.customer.syncCustPageItem(data,t,2);
                }else if(event.type==dsevent.evt.customerUpdateOwner){

                }else if(event.type==dsevent.evt.customerBatchDel){
                    rightPane.html(template("tmpl_customer_content_container_inner",{}));
                    handler.cancelDealToolbar("customer",menu);
                    parent.find('.customer_normal_search').click();
                }else if(event.type==dsevent.evt.customerDelete){
                    rightPane.html(template("tmpl_customer_content_container_inner",{}));
                    t.parent().remove();
                }else if(event.type==dsevent.evt.customerRefresh){
                    rightPane.html(template("tmpl_customer_content_container_inner",{}));
                    handler.cancelDealToolbar("customer",menu);
                    parent.find('.refresh').click();
                }
            });
        }else{
            var evt=dsevent.evt.customerAdd+" "+dsevent.evt.customerAddCancel+" "+dsevent.evt.customerNew+" "+
                    dsevent.evt.customerUpdate+" "+dsevent.evt.customerUpdateStatus+" "+dsevent.evt.customerUpdateOwner+" "
                    +dsevent.evt.customerBatchDel+" "+dsevent.evt.customerDelete+" "+dsevent.evt.customerRefresh+" "+dsevent.evt.customerRefreshIsRead;
            dsevent.bind('#contact_list_'+menu, evt,function(event, params){
                var parent=$("#contact_list_"+menu);
                var data={};
                if(params){
                    data=params;
                }
                var t=parent.find(".item"+data._id);
                var rightPane=$("#"+menu+"_customer");
                if(event.type==dsevent.evt.customerAdd){
//                    console.dir(rightPane)
//                    console.dir(parent.find(".list-inside .item_row:first"))
                    var items=parent.find(".list-inside").find(".list_item");
                    if(items.length==0){
                        parent.find(".list-inside").empty();
                    }
                    data.contactDesc=handler.customer.showContactDesc(data.sysStatus);
                    parent.find(".list-inside").prepend($("#tmpl_customer_page_item").tmpl(data));
                    parent.find(".list-inside .item_row:first").click();
                }else if(event.type==dsevent.evt.customerAddCancel){
                    var t1=parent.find(".item_row.expanded");
                    if(t1.length>0){
                        t1.click();
                    }
                }else if(event.type==dsevent.evt.customerUpdate){
                    handler.customer.syncCustPageItem(data,t,0);
//            }else if(event.type==dsevent.evt.action){
//                handler.customer.syncCustItem(data,t,1);
                }else if(event.type==dsevent.evt.customerUpdateStatus){
                    handler.customer.syncCustPageItem(data,t,2);
                }else if(event.type==dsevent.evt.customerUpdateOwner){
                    handler.customer.syncCustItem(data,t,3);
                }else if(event.type==dsevent.evt.customerBatchDel){
                    rightPane.html(template("tmpl_customer_content_container_inner",{}));
                    handler.cancelDealToolbar("customer",menu);
                    parent.find('.customer_normal_search').click();
                }else if(event.type==dsevent.evt.customerDelete){
                    rightPane.html(template("tmpl_customer_content_container_inner",{}));
                    t.parent().remove();
                }else if(event.type==dsevent.evt.customerRefresh){
//                    rightPane.empty();
                    rightPane.html(template("tmpl_customer_content_container_inner",{}));
                    handler.cancelDealToolbar("customer",menu);
                    parent.find('.refresh').click();
                }else if(event.type==dsevent.evt.customerRefreshIsRead){
                    handler.customer.syncCustPageItem(data,t,3);
                }
            });
        }

    });
</script>
