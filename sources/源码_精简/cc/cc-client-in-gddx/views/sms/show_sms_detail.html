<style>
    .cdrDetailLabel {width: 90px;}
    .cdrDetailText {width: 150px; text-align: left}
    #sms_detail_wrapper tr{line-height: 20px}
</style>
<div id="show_sms_detail_Modal" class="modal hide fade">
    <div class="modal-header">
        <h3>短信详细信息</h3>
    </div>
    <div class="modal-body" style="max-height: 500px;">
        <div id="sms_detail_wrapper">
            <table>
                <tr>
                    <td class="cdrDetailLabel">号码：</td>
                    <td class="cdrDetailText">_@sms.renderSmsHidden('_#num#_',true)@_</td>
                    <td class="cdrDetailLabel">发送时间：</td>
                    <td class="cdrDetailText">_#submitTime#_</td>
                    <td class="cdrDetailLabel">拆分条数：</td>
                    <td class="cdrDetailText">_#splitCount#_</td>
                </tr>
                <tr>
                    <td class="cdrDetailLabel">处理状态：</td>
                    <td class="cdrDetailText">_@sms.getSmsStatusName('_#m7Status#_')@_</td>
                    <td class="cdrDetailLabel">发送座席：</td>
                    <td class="cdrDetailText">_@cdr.getAgentName('_#createUser#_')@_</td>
                    <td class="cdrDetailLabel">签名：</td>
                    <td class="cdrDetailText">_#signDisplay#_</td>
                </tr>
                <tr>
                    <td class="cdrDetailLabel">通道状态：</td>
                    <!--<td class="cdrDetailText">_@sms.getChannelStatus('_#_id#_')@_</td>-->
                    <td class="cdrDetailText">_#by_errordescription#_</td>
                </tr>
                <tr>
                    <td class="cdrDetailLabel">短信内容：</td>
                    <td class="cdrDetailText" colspan="5">
                        <textarea id="sms_comments" name="content" rows="3" style="width: 500px" disabled>_#content#_</textarea>
                    </td>
                </tr>
            </table>
        </div>
    </div>
    <div class="modal-footer">
        <a href="#" class="btn ds_do_action" ds_action="sms.closeSmsDetail" id="smsDetailCloseBtn">关闭</a>
    </div>
</div>
<script>
    $(function(){
        $('#show_sms_detail_Modal').css({
            'width': function () {
                return ($(document).width() *.50) + 'px';
            },
            'margin-left': function () {
                return -($(this).width() / 2);
            }
        });
    });
</script>
