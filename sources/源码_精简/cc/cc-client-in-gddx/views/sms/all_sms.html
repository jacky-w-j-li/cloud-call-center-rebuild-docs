<div class="right_container" id="all_sms_main_panel">
    <div style="height:98%;margin:3px 3px;" id="all_sms_query">
        <div class="row-fluid">
            <br/>
            <h5><i class="icon-search"></i>所有短信查询</h5>
            <br/>

            <form id="all_sms_form" class="form-inline all_sms_query_form">
                <input type="hidden" name="DISPOSAL_AGENT" id="all_sms_agent"/>
                <div>
                    <label style="display: inline;padding-left: 3px">起止时间</label>
                    <div class="input-append date form_datetime">
                        <input size="16" name="BEGIN_TIME" id="all_sms_datetime_picker_start" type="text" value="" readonly style="z-index: 9">
                        <span class="add-on datetimepicker-remove" style="height: 14px;line-height: 15px"><i class="icon-remove"></i></span>
                        <span class="add-on datetimepicker-open" style="height: 14px;line-height: 15px"><i class="icon-th"></i></span>
                    </div>
                    至
                    <div class="input-append date form_datetime">
                        <input size="16" name="END_TIME" id="all_sms_datetime_picker_end" type="text" value="" readonly style="z-index: 9">
                        <span class="add-on datetimepicker-remove" style="height: 14px;line-height: 15px"><i class="icon-remove"></i></span>
                        <span class="add-on datetimepicker-open" style="height: 14px;line-height: 15px"><i class="icon-th"></i></span>
                    </div>
                </div>
                <div class="clear10"></div>
                <div>
                    <label>
                        发送号码
                    </label>
                    <input type="text" name="num" class="input-lager" style="margin-right: 5px;"/>
                    <label>
                        状态
                    </label>
                    <span id="status_span">
                        <select name="m7Status" class="sms_status_selector">

                        </select>
                    </span>
                    <label>
                        短信签名
                    </label>
                    <span id="sign_span">
                        <select name="sign" class="sms_sign_selector">
                        </select>
                    </span>
                </div>
                <div class="clear10"></div>
                <div>
                    <label for="create_user_select_input">
                        发送座席
                    </label>
                    <span style="margin-right: 5px;">
                        <input name="createUser" type="hidden" class="ds_search_item select_input" id="create_user_select_input" style="float:none;"/>
                        <span id="create_user_select_user" class="combobox_agent"></span>
                    </span>
                </div>

                <div class="clear10"></div>
                <div>
                    <a href="#" class="button ds_form_action" ds_action="sms.searchAllSms"
                       style="margin:2px 5px;" id="all_sms_query_link">查询</a>
                    <a href="#" class="button ds_do_action" ds_action="sms.resetSms" style="margin:2px 5px;" >重置</a>
                </div>

                <div class="clear5">&nbsp;</div>
                <br>

                <div class='row-fluid account_line'></div>
                <br/>

                <div>
                    <table class="table table-striped table-bordered table-hover">
                        <thead>
                        <tr>
                            <th>发送号码</th>
                            <th>发送座席</th>
                            <th>发送时间</th>
                            <th>状态</th>
                            <th>拆分条数</th>
                            <th>签名</th>
                            <th>模板ID</th>
                            <th>内容</th>
                            <th>操作</th>
                        </tr>
                        </thead>
                        <tbody class="all_sms_table_data">
                        </tbody>
                    </table>
                    <div class="row-fluid class_list">
                        <div for="all_sms_form" ds_pagination_action="sms.searchAllSms"
                             class="pagination pagination-small" style="display:table; margin:0;width:100%;">
                            <span style="float:left;margin-top:15px;font-size:12px;">查询结果：<span class="result_count">0</span></span>
                            <ul style="float:right;margin-top:5px;">
                                <li><a href="#"  value="0">&laquo;</a></li>
                                <li><a href="#"  value="1">1</a></li>
                                <li><a href="#"  value="2">2</a></li>
                                <li><a href="#"  value="3">3</a></li>
                                <li><a href="#"  value="4">4</a></li>
                                <li><a href="#"  value="5">5</a></li>
                                <li><a href="#"  value="6">&raquo;</a></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </form>
            <br>
            <div class="alert alert-success">
                <strong>温馨提示:</strong> 短信提交成功后5分钟之内送达。超过66字(含签名)后每66字记一条。
            </div>
        </div>
    </div>
</div>
<script>
    $(function(){
        $('#all_sms_datetime_picker_start').datetimepicker({
            controlType: utils.jqueryUITimepickerControl,
            timeFormat: "HH:mm:ss",
            dateFormat: "yy-mm-dd",
            showSecond: true
        });
        $('#all_sms_datetime_picker_end').datetimepicker({
            controlType: utils.jqueryUITimepickerControl,
            timeFormat: "HH:mm:ss",
            dateFormat: "yy-mm-dd",
            showSecond: true
        });
    });
    var smsAgentsArr = getCache("agents");
    var _smsAgentsArr=[];
    for(var i=0;i<smsAgentsArr.length;i++){
        var u=smsAgentsArr[i];
        _smsAgentsArr.push(u);
    }
    _smsAgentsArr.unshift({_id:'interface',displayName:'接口调用',exten:'interface',pinyin:'interface'});
    _smsAgentsArr.unshift({_id:'hangupSMS',displayName:'挂机短信',exten:'hangupSMS',pinyin:'hangupSMS'});
    utils.loadSearchInput({ id: "create_user_select_user",
        width: "182",
        height: "14",
        tip: "按姓名,拼音,工号搜索",
        data: _smsAgentsArr,
        searchField: ["displayName", "exten", "pinyin"],
        pinyinField: ["displayName"],
        listField: ["displayName", "exten"],
        userIdField: "_id",
        showField: "displayName",
        showAllList: true,
        callbackFuc: function (object) {
            $("#create_user_select_input").val(object._id);
        },
        onKeyChanged: function () {
            if ($("#create_user_select_user_input").val() != "") {
                $("#create_user_select_input").val("serachInputNoresult");
            } else {
                $("#create_user_select_input").val("");
            }
        }
    });
</script>
<style>
    #all_sms_main_panel label {
        font-size:11px;
    }
</style>
