<div id="phone_bar"  class="" style="float: left">
    <div class="input-append" style="margin-bottom:0px;margin-top:8px;">
        <input id="dialout_input" class="span2" type="text" style="font-size: 15px;" onkeydown="if(event.keyCode==13){softphonebar_dialout($('#dialout_input').val());}">
        <!--<div></div>-->
        <button id="dialoutEnable" class="btn btn-small btn-success btn_last_child" style="display: none" type="button" onclick="softphonebar_dialout($('#dialout_input').val());">呼叫</button>
        <button id="dialoutDisable" class="btn btn-small btn_last_child" type="button" disabled>呼叫</button>
        <button id="hangupEnable" class="btn btn-small btn-danger btn_last_child" style="display: none" type="button" onclick="phone_hangup();">挂机</button>
        <!--<button id="hangupEnable" class="btn btn-small btn-danger btn_child" style="display: none" type="button" onclick="phone_hangup();">挂机</button>-->
        <!--<button id="SmsEnable" class="btn btn-small btn-info btn_last_child ds_do_action smsPopoverHtml"-->
               <!--ds_action="sms.openSendSms" type="button"-->
               <!--style="display: none">-->
            <!--短信-->
       <!--</button>-->
    </div>
    <div class="btn-group" style="margin-bottom:0px;margin-top:8px;">
        <button id="holdEnable" class="btn btn-small btn-info btn_first_child" style="/*width:58px;*/display: none;" type="button" onclick="phone_hold();">保持</button>
        <button id="holdDisable" class="btn btn-small btn_first_child" style="" type="button" disabled>保持</button>
        <button id="recoverEnable" class="btn btn-small btn-info btn_first_child" style="display: none" type="button" onclick="phone_unhold();">恢复</button>
        <button id="transferEnable" class="btn btn-small btn-info " style="display: none" type="button" data-toggle="modal" data-target="#softphone_transfer">转接</button>
        <button id="transferDisable" class="btn btn-small " style="" type="button" disabled>转接</button>
        <button id="consultEnable" class="btn btn-small btn-info " style="display: none" type="button" data-toggle="modal" data-target="#softphone_consult">咨询</button>
        <button id="consultDisable" class="btn btn-small " style="display:none;" type="button" disabled>咨询</button>
        <button id="stopConsultEnable" class="btn btn-danger " style="display: none;" onclick="phone_stopConsult();">结束咨询</button>
        <button id="ivrMenuEnable" class="btn btn-small btn-info" style="display:none" data-toggle="modal" data-target="#softphone_ivrMenu">转菜单</button>
        <button id="InvestigateEnable" class="btn btn-info" style="display:none" onclick="phone_investigate();">转调查</button>
        <button id="consultThreeWayCallEnable" class="btn btn-success" style="display: none" onclick="phone_threewaycall('912345');">三方</button>
        <button id="consultTransferEnable" class="btn btn-success " style="display:none" onclick="phone_transfer('912345', 'number');">转接</button>
        <button id="threewayEnable" class="btn btn-small btn-info btn_last_child" style="display: none "   type="button" data-toggle="modal" data-target="#softphone_threewaycall">三方</button>
        <button id="threewayDisable" class="btn btn-small btn_last_child" style="" type="button" disabled>三方</button>
    </div>
</div>
<div id="peer_state" style="float: left;margin-left: 10px;margin-right: 10px;" >
    <div class="state_group" style="width: auto;">
        <div id="softphone_timer" class="fr state_time">00:00:00</div>
        <!--<img class="fr state_line" src="./img/client/line.png" />-->
        <!--<div id="softphone_dropdown" class="fr state_dropdown"><b id="softphone_dropdown_caret" class="caret" style="vertical-align: middle;"></b></div>-->
        <div id="softphone_phonestate" class="fr state" onclick="javascript:$('#softphone_dropdown_caret').click()">失效</div>

        <div class="fr dh_state_sx" style="display: none;cursor:pointer;"><img style="width: 20px;height: 20px" src="../img/phoneBar/dh_hb.png"></div>
        <div class="fr dh_state_busy" style="display: none;cursor:pointer;" onclick="phone_setBusy(true, 0)" ><img style="width: 20px;height: 20px" src="../img/phoneBar/dh_busy.png"></div>
        <div class="fr dh_state_idle" style="cursor:pointer;" onclick="phone_setBusy(true, 1)"><img style="width: 20px;height: 20px" src="../img/phoneBar/dh.png"></div>

        <img class="fr" style="margin-top: 3px;margin-right: 4px;" src="./img/client/line.png" />

        <div class="fr yj_state_enable ds_do_action" style="cursor:pointer;margin-left: 5px;margin-right: 5px" ds_action="setPhoneBarMailChannel" ds_data="false" style="margin-left: 5px;display: none" >
            <img style="width: 20px;height: 20px" src="../img/phoneBar/yj.png">
        </div>
        <div class="fr yj_state_disable ds_do_action" style="cursor:pointer;margin-left: 5px;margin-right: 5px"   ds_action="setPhoneBarMailChannel" ds_data="true" style="margin-left: 5px" >
            <img style="width: 20px;height: 20px" src="../img/phoneBar/yj_hb.png">
        </div>
        <div class="fr wx_state_enable ds_do_action" style="cursor:pointer;" ds_action="setPhoneBarWXChannel" ds_data="false" style="margin-left: 5px; display: none">
            <img style="width: 20px;height: 20px" src="../img/phoneBar/wx.jpg">
        </div>
        <div class="fr wx_state_disable ds_do_action" style="cursor:pointer;" ds_action="setPhoneBarWXChannel" ds_data="true" style="margin-left: 5px">
            <img style="width: 20px;height: 20px" src="../img/phoneBar/wx_hb.jpg">
        </div>
    </div>
    <ul id="softphone_otherstate" class="customer_db">
    </ul>
</div>


<div id="softphone_consult" class="modal hide fade" tabindex="-1" role="dialog" aria-hidden="true" style="color: #000;height: 400px; overflow-y: auto">
    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true">×</button>
        <h3>咨询通话</h3>
    </div>
    <div class="modal-body" style="height:300px;" >
        <div id="softphone_consult_div" style="float: left;position: relative;" class="combobox_agent"></div>
        <button class="btn btn-small btn-blue" type="button" style="float: left;margin-left:5px;" onclick="softphonebar_consult($('#softphone_consult_div_input').val())">咨询</button>
    </div>
</div>

<div id="softphone_transfer" class="modal hide fade" tabindex="-1" role="dialog" aria-hidden="true" style="color: #000;height: 400px; overflow-y: auto">
    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true">×</button>
        <h3>转接通话</h3>
    </div>
    <div class="modal-body" style="height:300px;" >
        <div id="softphone_transfer_div" style="float: left;position: relative;" class="combobox_agent"></div>
        <button class="btn btn-small btn-blue" type="button" style="float: left;margin-left:5px;" onclick="softphonebar_transfer($('#softphone_transfer_div_input').val())">转接</button>
        <div class="clear10">&nbsp;</div>
        <div style="font-size: 14px;font-weight: bold;">转接到技能组</div>
        <div class="clear5">&nbsp;</div>
        <div id="softphone_transfer_skillgroup" style="width:510px;">
        </div>
    </div>
</div>

<div id="softphone_ivrMenu" class="modal hide fade" tabindex="-1" role="dialog" aria-hidden="true" style="color: #000;height: 400px; overflow-y: auto">
    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true">×</button>
        <h3>转IVR菜单</h3>
    </div>
    <div class="modal-body" style=" overflow-y: visible ">
        <table class="table table-hover table-bordered">
            <thead>
            <tr class="hearTd" style="background-color: #f5f5f5">
                <th>IVR菜单名称</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody id="softphone_ivrMenu_table_body">

            </tbody>
        </table>
    </div>
</div>

<div id="softphone_threewaycall" class="modal hide fade" tabindex="-1" role="dialog" aria-hidden="true" style="color: #000;height: 400px; overflow-y: auto">
    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true">×</button>
        <h3>三方通话</h3>
    </div>
    <div class="modal-body" style="height:300px;" >
        <div id="softphone_threewaycall_div" style="float: left;position: relative;" class="combobox_agent"></div>
        <button class="btn btn-small btn-primary"  type="button" style="float: left;margin-left:5px;" onclick="softphonebar_threewaycall($('#softphone_threewaycall_div_input').val())">三 方</button>
    </div>
</div>

<script type="text/javascript" >

    $(function(){
        DS.getView("sms/sendSms", function (view) {
            var options = {
                trigger	:'click',
                placement:"bottom",
                html:"true",
                title:'发短信  <i class="icon-question-sign" id="sms_tip"></i>',
                content:view
            }
            $(".smsPopoverHtml").popover(options);
        });
        utils.loadSearchInput({ id:"softphone_consult_div",
            width:"320",
            height:"18",
            tip:"请输入工号或者手机号(可以输入座席姓名进行下拉选择)",
            data: phone_peers,
            searchField: ["DisplayName", "exten"],
            pinyinField: ["DisplayName"],
            listField: ["DisplayName", "exten"],
            userIdField: "userId",
            showField: "exten",
            showState: true,
            notShowMySelf: true,
            callbackFuc: function(object) {
                //console.dir(object);
            }
        });
        utils.loadSearchInput({ id:"softphone_transfer_div",
            width:"320",
            height:"18",
            tip:"请输入关键字进行查询",
            data: phone_peers,
            searchField: ["DisplayName", "exten"],
            pinyinField: ["DisplayName"],
            listField: ["DisplayName", "exten"],
            userIdField: "userId",
            showField: "exten",
            showState: true,
            notShowMySelf: true,
            callbackFuc: function(object) {
                //console.dir(object);
            }
        });

        $('#softphone_ivrMenu').on('shown', function(){
            var ivrMenuHtml = '';
            var menuList = getCache('ivrMenu');
            for(var i=0; i<menuList.length; i++){
                ivrMenuHtml += "<tr style=\"height: 3px;\"><td>"+ menuList[i].DisplayName +"</td><td><a href=\'javascript:phone_toMenu(\""+menuList[i].Exten+"\",\""+menuList[i].DisplayName+"\")\'>转菜单</a></td></tr>";
                $('#softphone_ivrMenu_table_body').html(ivrMenuHtml);
            }
        });

        utils.loadSearchInput({ id:"softphone_threewaycall_div",
            width:"320",
            height:"18",
            tip:"请输入关键字进行查询",
            data: phone_peers,
            searchField: ["DisplayName", "exten"],
            pinyinField: ["DisplayName"],
            listField: ["DisplayName", "exten"],
            userIdField: "userId",
            showField: "exten",
            showState: true,
            notShowMySelf: true,
            callbackFuc: function(object) {
                //console.dir(object);
            }
        });

        $('#softphone_transfer').on('shown', function () {
            $("#softphone_transfer_skillgroup").html("");
            var skillgroupHtml = "";
            //TODO show idle peer count
            for(var i in phone_queues) {
                skillgroupHtml += "<div style=\"float: left\">"+phone_queues[i].queueName+"<span style=\"color: #009900\">［空闲座席数:"+phone_queues[i].idleAgentCount+"］</span></div>"+
                        "<div style=\"float: right\"><a href=javascript:phone_transfer(\""+phone_queues[i].queueId+"\",\"skillgroup\"); ><i class=\"icon-transfer\"></i>转接</a></div>" +
                        "<div style=\"height: 3px;clear: both;border-bottom: 1px solid #ccc;width: 100%\">&nbsp;</div>" +
                        "<div class=\"clear5\">&nbsp;</div>";
            }
            $("#softphone_transfer_skillgroup").html(skillgroupHtml);
        })

        $("#peer_state .state_dropdown").click(function(){
            $("#softphone_otherstate").slideToggle('fast');
        });

        $('body').click(function(e) {
            if($("#softphone_otherstate").css("display") == "block"
                    && e.target.id != "softphone_dropdown"
                    && e.target.id != "softphone_dropdown_caret"
                    && e.target.id != "softphone_phonestate") {
                $("#softphone_otherstate").slideUp('fast');
            }
        });

    });
</script>
