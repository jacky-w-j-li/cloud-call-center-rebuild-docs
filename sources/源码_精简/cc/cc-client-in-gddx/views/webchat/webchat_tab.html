<div class="webchat_container">
    <div class="row-fluid ">
        <div class="span9"style="position: relative">
            <input type="hidden" name="copy_sessionId" value="_#_id#_">
            <input type="hidden" name="copy_accessId" value="_#accessId#_">
            <div class="chat_top clearfix" style="margin-bottom: 6px;height: 34px;">
                <div class="chat_top_head pull-left clearfix">
                    <img src="./img/client/customer/_#platformPic#_" style="width: 35px;float: left;margin-right: 10px;"/>
                    <div class="chat_top_head_left" style="">
                        <div style="font-weight:bold;" class="chat_top_head_clea pull-left customer_name_#sid#_" cust_id="_#custId#_">
                            _#sName#_
                            <span class="chat_top_head_type webchat_user_id" ds_data="_#sid#_">(_#fromSource#_)</span>
                        </div>
                        <div class="fmuted"  style="width: 100%;margin-top: 5px;display: inline-block">_#createTime#_</div>
                    </div>
                </div>
                <div class="pull-right chat_transfer">
                    <input id="combobox_webchat_owner" type="text"  style="display:none;width:125px;vertical-align:bottom;margin-right:5px;padding:3px 6px;float: left" placeholder="按姓名,拼音,工号搜索">
                    <span class="img_action_turn" id="combobox_webchat_owner_desc" uid="_#user#_">转接</span>
                    <input id="combobox_webchat_change_group" type="text"  style="display:none;width:125px;vertical-align:bottom;margin-right:5px;padding:3px 6px;float: left" placeholder="按技能组搜索">
                    <span class="img_action_turn" id="combobox_webchat_change_group_desc" uid="_#user#_">技能组转接</span>
                    <input id="combobox_webchat_invite_owner"  type="text"  style="display:none;width:125px;vertical-align:bottom;margin-right:5px;padding:3px 6px;float: left" placeholder="按姓名,拼音,工号搜索">
                    <span class="img_action_invite img_action_turn" id="combobox_webchat_invite_owner_desc"  uid="_#user#_">邀请座席</span>
                    <span class="img_action_turn ds_do_action kick_invite"  ds_action="webchat.kickInvite" ds_data="_#_id#_">踢出协作座席</span>
                    <span class="img_action_stop stop_session ds_do_action" data-toggle="dropdown" ds_action="webchat.endSession">结束会话</span>
                </div>
                <div class = "chat_grab">
                    <form>
                        <input type="hidden" name="_id" value="_#_id#_">
                        <input type="hidden" name="sid" value="_#sid#_">
                        <input type="hidden" name="currUser" value="_#user#_">
                        <span type = "button" class="ds_form_action img_action_grab" data-toggle="dropdown" ds_action="webchat.webchatGrab">抢接会话</span>
                    </form>
                </div>

            </div>

            <div class="chat_msg chat_msg_bottom setImFonts clearbt" ds_attr="2" ds_time="" noChatPopover="false">
                <div class="msg_inner"></div>
                <div class="cancel_webchat" style = "display:none" id = "cancel_webchat_#_id#_">
                    <p>正在邀请<span class= "invited_name"></span>加入该会话</p>
                    <span class="chat_action_cancel ds_do_action" ds_action="webchat.cancelInvite" ds_data="_#_id#_">取消</span>
                </div>
            </div>
            <div class="chart_time_stopwatch_box">
                <div class="chart_time_stopwatch chattime_item_#_id#_ hidden">
                    访客已等待 <span class="ts_minute">00</span>:<span class="ts_second">00</span>
                </div>
            </div>
            <div class="chat_toolbar">
                <ul name="imFontCon" class="imFontCon">
                    <li class="ds_do_action" ds_action="webchat.changeImFontSize" font="12">12</li>
                    <li class="ds_do_action" ds_action="webchat.changeImFontSize" font="14">14</li>
                    <li class="ds_do_action" ds_action="webchat.changeImFontSize" font="16">16</li>
                    <li class="ds_do_action" ds_action="webchat.changeImFontSize" font="18">18</li>
                    <li class="ds_do_action" ds_action="webchat.changeImFontSize" font="20">20</li>
                </ul>
                <div class="face_con" id="face_con">
                    <ul style="list-style: none;"></ul>
                </div>
                <div class="face_arrow"></div>
                <span class="ds_do_action webchat_msg_emojiface set_im_font" ds_action="webchat.showFontSize">
                   <img src="../../img/client/customer/font-icon.png?160222" width="20px" height="20px"/>
                </span>
                <span class="ds_do_action webchat_msg_emojiface" ds_action="webchat.showEmojiFaces" ds_data="">
                    <img src="../../img/client/customer/face-icon.png?160222" width="20px" height="20px"/>
                </span>
                <span class="webchat_msg_emojiface" style="width:20px; height:20px;z-index:0;">
                    <img id="webchat_msg_image_btn__#sid#_" src="../../img/client/customer/image-icon.png?160222" />
                </span>
                <span class="webchat_msg_emojiface"  id = "file_upload" style="width:20px; height:20px;z-index:0;">
                    <img id="webchat_msg_file_btn__#_id#_" src="../../img/client/customer/files-icon.png?160720" />
                </span>
                <span class="initiate_appraise webchat_msg_emojiface ds_do_action" data-toggle="popover" data-placement="top" data-trigger="hover focus" data-content="请求评价" ds_action="webchat.pushImCSRInfo">
                    <img id="" src="../../img/client/customer/flower_icon.png?160222" width="20px" height="20px"/>
                </span>
                <span class="webchat_msg_emojiface ds_do_action" data-toggle="popover" data-placement="top" data-trigger="hover focus" data-content="知识库搜索" ds_action="webchat.showKmPopover" ds_data="_#_id#_" id = "webchat_km_search" style="width:23px; height:20px;z-index:0;" >
                    <img id="webchat_msg_km_btn__#_id#_" src="../../img/client/customer/kmsearch-icon.png" />
                </span>
                <script>$(function () { $("[data-toggle='popover']").popover(); });</script>

                <!--<img src="./img/client/customer/webchat_ico.png " style="width: 25px;"/>-->
            </div>


            <div class="chat_deal clearfix">
                <form action="">
                    <!--<input type="hidden" name="accessId" value="_#accessId#_">-->
                    <input type="hidden" name="sid" value="_#sid#_">
                    <input type="hidden" name="sessionId" value="_#_id#_">
                    <input type="hidden" name="contentType" value="text">
                    <input type="hidden" name="platform" value="_#platform#_">
                    <input type="hidden" name="accessId" value="_#accessId#_">
                    <input type="hidden" name="agentFirstReplyTime" value="_#agentFirstReplyTime#_">
                    <input type="hidden" name="manualTime" value="_#manualTime#_">
                    <input type="hidden" name="status" value="_#status#_">
                    <input type="hidden" name="lastRedirectTime" value="_#lastRedirectTime#_">
                    <input type="hidden" name="lastRedirectUserTime" value="_#lastRedirectUserTime#_">
                    <input type="hidden" name="lastClaimTime" value="_#lastClaimTime#_">
                    <div class="row-fluid" style="position:relative">
                        <textarea rows="2"  class="span12  ds_selectItem_action textarea_autocomplete setImFonts" keyup_selectitem_action="webchat.selectItem" name="content"></textarea>
                        <div class="suggest search-suggest" ds_index="-1" style="display:none">
                             <ul>
                            </ul>
                         </div>
                        <button type="button" class="btn bg-img-none btn-blue btn-small ds_form_action pull-right reply_webchat" ds_action="webchat.replyChat" ds_data="">发送</button>
                    </div>

                </form>
            </div>
        </div>
        <div class="span3" style="overflow-y: auto">
            <ul class="information_and_quickreplay clearFloat">
                <li class="li-quickreply ds_do_action active" ds_action="webchat.showChatDetails">信息</li>
                <li class="li-quickreply ds_do_action" ds_action="webchat.showQuickReplyContent">快捷回复</li>
            </ul>
            <div class="webchat_remark_box" style="color: #7D7D7D;">
                <div class="webchat_remark_li_title"><b>基本信息</b></div>
                <div class="webchat_dialog_info clearFloat"></div>
                <div style="color: #7D7D7D;padding: 0 0 5px;font-weight: bold;position: relative;height: 46px">
                    <span style="position: absolute">备注:</span>
                    <textarea rows="3" name="remark" class="dialog_remark ds_focus_action" focus_action="webchat.editWebChatRemark" blur_action="webchat.saveSessionRemark" style="resize: none" placeholder="点击输入文字......">_#remark#_</textarea>
                </div>
                <div class="webchat_access_infomation"></div>
                <div class="webchat_consult_tab" style="color: #7D7D7D;">
                </div>
            </div>

            <div class="webchat_quickreply_tab clearfix hidden">
                <ul class="system_and_user clearFloat">
                    <li class="li-quickreply_webchat ds_do_action active" ds_action="webchat.showReplyCustom" style="border-radius: 5px 0 0 5px;">自定义</li>
                    <li class="li-quickreply_webchat ds_do_action" ds_action="webchat.showReplySystm" style="border-radius: 0 5px 5px 0;">系统公用</li>
                </ul>
                <div class="webchat_quickreply_tab_system"></div>
                <div class="system_quickreply_lists"></div>
            </div>
        </div>
        <script>

        </script>
    </div>

    for(var i=0;i<historyList.length;i++){
        }}

                <div class="webchat_access_li_content">
                    <span>咨询页面：</span>
                    {{
                    var name = '';
                    if(historyList[i].platform == 'pc'){
                        name = '网页咨询';
                    }else if(historyList[i].platform == 'wap'){
                        name = 'wap咨询';
                    }else if(historyList[i].platform == 'sdk'){
                        name = 'app咨询';
                    }else if(historyList[i].platform == 'weixin'){
                        name = '微信咨询';
                    }else {
                        name = '未知';
                    }

                    if(historyList[i].fromUrl){
                        if(historyList[i].urlTitle){
                        }}
                        <span>
                            <a href="{{=historyList[i].fromUrl}}" target="_blank">{{=historyList[i].urlTitle}}</a>
                        </span>
                        {{
                        }else{
                        }}
                        <span>
                            <a href="{{=historyList[i].fromUrl}}" target="_blank">{{=name}}</a>
                        </span>
                        {{
                        }
                    }else{
                    }}
                    <span>
                        <span>{{=name}}</span>
                    </span>
                    {{
                    }
                    }}
                </div>
            </div>
        {{
    }
    }}
