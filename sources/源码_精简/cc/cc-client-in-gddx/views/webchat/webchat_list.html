        <div class="caption-top clearfix">

                <form id="frm_webchat_normal_search">
                    <span class="refresh ds_form_action" style="display: none;" ds_action="webchat.searchWebchatCard"></span>
                    <div class="header_search_wrap pull-left quick_search" style="width:268px;min-width:250px;">
                        <div class="header_search_button ds_form_action normal_search" ds_action="webchat.searchWebchatCard">
                            <i class="icon-search"></i>
                        </div>
                        <div class="header_search_input">
                            <div class="header_search_input_textbox">
                                <div class="textbox_wrap" style="margin-left: 0;">
                                    <div class="textbox_inner">
                                        <input type="text" name="sName" class="textbox_input" maxlength="254" placeholder="输入用户名查询">

                    </div>
                    <div class="pull-right" style="margin-top:7px;">
                        <span style="margin-left:8px;cursor: pointer;" class="ds_do_action" ds_data="frm_webchat_advanced_search" ds_action="clickOtherBtn" title="刷新">

                        </span>
                    </div>

    <div tabindex="-1" class="advanced_search_pane hidden">
        <div class="advanced_body">
            <form id="frm_webchat_advanced_search" class="ds_search_form">
                <input type="hidden" name="isAdvanceSearch" value="1">
                <fieldset>
                    <div class="row-fluid">
                        <div class="span4 advanced_search_item ds_search_item">
                            <label>用户名称</label>
                            <input type="text" name="sName">
                        </div>
                        <div class="span4 advanced_search_item ds_search_item ds_owner condition_hide" style="display: none;">
                            <label>当前处理人</label>
                            <input name="ownercom" type="hidden" class="select_input" id="_#menu#__owner_select_input_com" />
                            <input name="user" type="hidden" class="select_input" id="_#menu#__owner_select_input" />
                            <input name="ownerdep" type="hidden" class="select_input" id="_#menu#__owner_select_input_dep" />
                            <!--<div id="_#menu#__owner_select_user" class="combobox_agent"></div>-->
                            <div id="_#menu#__owner_select_user" class="comtabbox_agent"></div>
                        </div>
                        <div class="span4 advanced_search_item ds_search_item condition_hide" style="display: none;">
                            <label>状态</label>
                            <select name="status">
                                <option value="" selected>--请选择--</option>
                            </select>
                        </div>
                        
                    </div>
                    <div class="row-fluid">
                        <div class="span8 advanced_search_item ds_search_item">
                            <label >人工时间</label>
                            <input name="manualTimeBegin" class="ds_datetime" type="text" >
                            <label style="width: 16px">至</label>
                            <input name="manualTimeEnd" class="ds_datetime" type="text" >
                        </div>
                        <div class="span4 advanced_search_item ds_search_item condition_hide" style="display: none;">
                            <label>处理结果</label>
                            <select name="finishKey">
                                <option value="" selected>--请选择--</option>
                            </select>
                        </div>
                    </div>
                    <div class="row-fluid">
                        <div class="span8 advanced_search_item ds_search_item">
                            <label >创建时间</label>
                            <input name="createTimeBegin" class="ds_datetime" type="text" >
                            <label style="width: 16px">至</label>
                            <input name="createTimeEnd" class="ds_datetime" type="text" >
                        </div>
                        <div class="span4 advanced_search_item ds_search_item condition_hide" style="display: none;">
                            <label>技能组</label>
                            <select name="toPeer">
                                <option value="" selected>--请选择--</option>
                            </select>
                        </div>
                    </div>
                    <div class="row-fluid">
                        <div class="span8 advanced_search_item ds_search_item">
                            <label >领取时间</label>
                            <input name="beginTimeBegin" class="ds_datetime" type="text" >
                            <label style="width: 16px">至</label>
                            <input name="beginTimeEnd" class="ds_datetime" type="text" >
                        </div>
                        <div class="span4 advanced_search_item ds_search_item condition_hide" style="display: none;">
                            <label>满意度评价</label>
                            <select name="appraiseKey">
                                <option value="" selected>--请选择--</option>
                            </select>
                        </div>
                    </div>
                    <div class="row-fluid">
                        <div class="span8 advanced_search_item ds_search_item">
                            <label >结束时间</label>
                            <input name="endTimeBegin" class="ds_datetime" type="text" >
                            <label style="width: 16px">至</label>
                            <input name="endTimeEnd" class="ds_datetime" type="text" >
                        </div>
                        <div class="span4 advanced_search_item ds_search_item condition_hide" style="display: none;">
                            <label>平台来源</label>
                            <select name="platform">
                                <option value="">--请选择--</option>
                                <option value="pc" >网站咨询</option>
                                <option value="wap" >wap咨询</option>
                                <option value="sdk" >app咨询</option>
                                <option value="weixin">微信咨询</option>
                            </select>
                        </div>
                    </div>
                    <div class="row-fluid">
                        <div class="span4 advanced_search_item ds_search_item condition_hide" style="display: none;">
                            <label>地域</label>
                            <input type="text" name="area" placeholder="国家 省份 城市">
                        </div>
                        <div class="span4 advanced_search_item ds_search_item condition_hide" style="display: none;">
                            <label>搜索来源</label>
                            <select name="seoSource">
                                <option value="" selected>--请选择--</option>
                            </select>
                        </div>
                        <div class="span4 advanced_search_item ds_search_item">
                            <label>关键字</label>
                            <input type="text" name="seoKeywords">
                        </div>
                    </div>
                    <div class="row-fluid">
                        <div class="span8 advanced_search_item ds_search_item">
                        <label>消息条数</label>
                        <span>
                        <label><input type="radio" name="msgCountType" value="gt"/><span>大于</span></label>
                        <label><input type="radio" name="msgCountType" value="lt"/><span>小于</span></label>
                        <label><input type="radio" name="msgCountType" value="eq"/><span>等于</span></label>
                        <label><input name="msgCount" type="text"/></label>
                        </span>

                        </div>
                        <div class="span4 advanced_search_item ds_search_item">
                            <label>会话内容</label>
                            <input type="text" name="mKeyword">
                        </div>
                    </div>
                    <div style="padding: 10px;">
                        <button type="button" class="btn btn-small btn-primary ds_form_action  pull-right" ds_action="webchat.searchWebchatCard">搜索</button>
                         <button type="button" class="btn btn-small  reset_adv_search ds_do_action pull-right" ds_action="resetForm" ds_data="webchatList" style="margin-right: 10px;">重置</button>
                    </div>
                </fieldset>
            </form>
