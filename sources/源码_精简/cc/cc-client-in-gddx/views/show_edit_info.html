<div class="modal hide fade" id="editInfoModal" tabindex="-1" style="overflow: hidden" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true" >
    <div class="modal-header" style="border:0px;padding:10px;">
        <button type="button" class="close" style="margin-top: -5px;" data-dismiss="modal" aria-hidden="true">×</button>
        <!--<h4 class="modal-title" >个人设置</h4>-->
    </div>
    <div class="modal-body">
        <div class="tabbable">
            <ul class="nav nav-tabs">
                <li class="active"><a href="#panel_edit_info" data-toggle="tab">个人信息</a></li>
                <li><a href="#panel_edit_password" data-toggle="tab">密码</a></li>
                <li><a href="#panel_edit_warn" data-toggle="tab">提醒设置</a></li>
                <!--<li><a href="#panel_edit_channel" data-toggle="tab" style="display: none;" class="channel_my_set">渠道设置</a></li>-->
            </ul>
            <div class="tab-content">
                <div class="tab-pane active" id="panel_edit_info">
                    <form>
                        <div class="row_item">
                            <label class="control-label" for="userEdit_icon-container-qiniu" style="line-height: 55px">头像</label>
                            <div class="userEdit_icon_preview_img" id="userEdit_icon-container-qiniu">
                                <img class="S_line5 fl" src="./img/user.png" style="width: 50px;height:auto;border-radius:50%;">

                                <div id="userEdit_icon-container-qiniu" class="pull-left" style="margin-left: 15px;margin-top: 30px;">
                                    <a class="btn btn-info btn-small img-none btn-blue" id="userEdit_icon-pickfiles" href="#" >
                                        <i class="icon-plus icon-white"></i>
                                        <sapn>选择图片</sapn>
                                    </a>
                                </div>
                            </div>
                            <table class="table table-striped table-hover text-left userEdit_icon_container display_none" style="margin-top:15px;display: none">
                                <thead>
                                <tr>
                                    <th class="span4">图片</th>
                                    <th class="span2">大小</th>
                                    <th class="span6">&nbsp;</th>
                                </tr>
                                </thead>
                                <tbody id="userEdit_icon-fsUploadProgress">
                                </tbody>
                            </table>
                        </div>
                        <div class="row_item">
                            <label for="name">姓名</label>
                            <input id="name" value="__displayName" name="displayName" type="text" tabindex="20" tabindex="20" required/>
                        </div>
                        <div class="row_item">
                            <label for="mobile">手机</label>
                            <input id="mobile" value="__mobile" name="mobile" type="text" tabindex="20"/>
                        </div>
                        <div class="row_item">
                            <label for="email">邮箱</label>
                            <input id="email" value="__email" name="email" type="text" tabindex="20" dataType="Email" msg="邮箱格式输入错误" msgName="邮箱"/>
                        </div>
                        <div class="row_item" id="AutoBusyTime_editUserInfo">
                            <label for="AutoBusyTime">后处理时长</label>
                            <span class="input-append">
                                <input id="AutoBusyTime" style="width: 173px" value="__AutoBusyTime" name="AutoBusyTime" type="text" tabindex="20" dataType="Number" msg="后处理时长只能为大于等于0的数字" msgName=""/>
                                <span class="add-on" style="height: 15px;line-height: 15px">秒</span>
                            </span>
                            <!--<input id="AutoBusyTime" value="__AutoBusyTime" name="AutoBusyTime" type="text" tabindex="20" dataType="Number" msg="后处理时长只能为大于等于0的数字" msgName=""/>-->
                        </div>
                        <div class="row_item">
                            <div class="" style="padding-left: 118px;margin: 20px 0;">
                                <button type="button" class="btn btn-primary btn-small ds_form_action" ds_action="editUser" >保存</button>
                                <button type="button" class="btn btn-small"  data-dismiss="modal" aria-hidden="true">取消</button>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="tab-pane" id="panel_edit_password">
                    <form>
                        <div class="row_item">
                            <label for="oldPassword">旧密码</label>
                            <input id="oldPassword" name="oldPassword" tabindex="20" type="password" required/>
                        </div>
                        <div class="row_item">
                            <label for="password">新密码</label>
                            <input id="password" name="password" type="password" tabindex="20" dataType="LimitLen,Character" min="6" max="15" msg="新密码必须填写6-15位数字+字母，可以包含下划线" msgName="新密码" required/>
                        </div>
                        <div class="row_item">
                            <label for="newPassword">确认密码</label>
                            <input id="newPassword" name="newPassword" type="password" tabindex="20" dataType="LimitLen,Character" min="6" max="15" msg="确认密码必须填写6-15位数字+字母，可以包含下划线" msgName="确认密码" required/>
                        </div>
                        <div class="row_item">
                            <div style="padding-left: 118px;margin: 20px 0;">
                                <a href="#" class="btn btn-primary btn-small ds_form_action" ds_action="appUserPasswordUpdate">保存</a>
                                <button type="button" class="btn btn-small"  data-dismiss="modal" aria-hidden="true">取消</button>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="tab-pane" id="panel_edit_warn">
                    <form style="margin-left: 30px;">
                        <h5 style="color:#999">开关设置</h5>
                        <!-- <div class="row_item">
                            <label style="width: 170px;margin-left: 23px;text-align:left;float:none">联系计划提醒开关</label>
                            <input id="communication_plan_switch" name="" type="checkbox" checked="checked">
                        </div> -->
                        <div class="row_item">
                            <label  style="width: 170px;margin-left: 23px;text-align:left;float:none">客户分配，回收提醒开关</label>
                            <input id="customer_distributeAndRecover_switch" name="customer_distributeAndRecover_switch" type="checkbox" checked="checked">
                        </div>
                        <!-- <div class="row_item">
                            <div style="padding-left: 45px;margin: 20px 0;">
                                <a href="#" class="btn btn-primary btn-small ds_form_action" ds_action="appUserPasswordUpdate">保存</a>
                                <button type="button" class="btn btn-small" data-dismiss="modal" aria-hidden="true">取消</button>
                            </div>
                        </div> -->
                    </form>
                </div>

                <div class="tab-pane" id="panel_edit_channel" >
                    <form>
                        <div class="alert alert-info">
                            打开该开关您将会接收到邮件和微信。
                        </div>
                        <div class="row_item">
                            <label class="checkbox">
                                <input type="checkbox" name="channelMail" value="" checked="checked">
                                接收邮件
                            </label>
                        </div>
                        <div class="row_item">
                            <label class="checkbox">
                                <input type="checkbox" name="channelWx" value="" checked="checked">
                                接收微信
                            </label>
                        </div>
                        <div class="row_item">
                            <div style="padding-left: 118px;margin: 20px 0;">
                                <a href="#" class="btn btn-primary btn-small ds_form_action" ds_action="setUserChannel">保存</a>
                                <button type="button" class="btn btn-small"  data-dismiss="modal" aria-hidden="true">取消</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    $(function(){
        if(session.user.custRemind==0){//关
            $("#customer_distributeAndRecover_switch").bootstrapSwitch({size:'small',onColor:'success',offColor:'warning',onText:'开',offText:'关',state:false});
        }else{//开
            $("#customer_distributeAndRecover_switch").bootstrapSwitch({size:'small',onColor:'success',offColor:'warning',onText:'开',offText:'关',state:true});
        }
        $('#customer_distributeAndRecover_switch').on('switchChange.bootstrapSwitch', function(event, state) {
            if(state){//开
                handler.customer.settingCustRemind("1");
            }else{//关
                handler.customer.settingCustRemind("0");
            }
        });

        $('#editInfoModal').css({
            'width': function () {
                return '435px';
//                return ($(document).width() * .3) + 'px';
            },
            'margin-left': function () {
                return -($(this).width() / 2);
            },
            'height': function () {
                return '350px';
//                return ($(document).height() * .38) + 'px';
            }
        });
    });
</script>
