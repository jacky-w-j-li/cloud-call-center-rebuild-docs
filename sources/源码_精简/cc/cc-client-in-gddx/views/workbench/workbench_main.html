<script>
$(function(){
  var rHeight = $("#contact_workbench").height() > ($(window).height() - 71) ? $("#contact_workbench").height() : ($(window).height() - 71);
  var cHeight = rHeight - 377;
  var cards = $(".bound-card-bottom");
  for (var i = 0; i < cards.length; i++) {
    var sWidth = 0;
    $(cards[i]).find("b,span").each(function (m) {
      sWidth += $(this).width();
        });
    if ((sWidth+44)>$(cards[i]).parent().width()) {
      $(cards[i]).find("b").hide();
    };
  };
      $(".today-communication").css("max-height",cHeight);
  $("[data-original-title]").tooltip({placement: 'right',html:true});
});
</script>

    <script type="text/javascript">
        $(function(){
            //商机券开关显示
            if(session.user.getCustFlag==0){//关
                $("#chanceTicket_switch").bootstrapSwitch({size:'small',onColor:'success',offColor:'warning',onText:'开',offText:'关',state:false});
            }else{//开
                $("#chanceTicket_switch").bootstrapSwitch({size:'small',onColor:'success',offColor:'warning',onText:'开',offText:'关',state:true});
            }

            $('#chanceTicket_switch').on('switchChange.bootstrapSwitch', function(event, state) {
                if(state){//开
                    handler.customer.titket.settingCustTitketFlag("1");
                }else{//关
                    handler.customer.titket.settingCustTitketFlag("0");
                }
            });
            $('.btn-hide').on('click',function(){
                $(".chanceTicket-toggle").hide();
                $('#cust_titket_to_user_select_user_input').val("");
                $('#donationNum').val("");
            })
            $('#donationCustTitket').on('click', function(event, state) {
                var target = $(this);
                if (target.hasClass("disabled")) return false;
                target.addClass("disabled");
                var toUser = $("#cust_titket_to_user_select_input").val();
                var donationNum = $("#donationNum").val();
                if(toUser == ''){
                    alert("赠送座席不能为空");
                    target.removeClass('disabled');
                    return;
                }else if(donationNum == ''){
                    alert("赠送数量不能为空");
                    target.removeClass('disabled');
                    return;
                }else if(donationNum == '0'){
                    alert("赠送数量不能为0");
                    target.removeClass('disabled');
                    return;
                }
                if(toUser && donationNum ){
                    var sum = parseInt($(".chanceTicket-sum").text())
                    if($("#donationNum").val() <= sum){
                        handler.customer.titket.donationCustTitket(toUser,donationNum,function(flag){
                            target.removeClass('disabled');
                            if(flag){
                                $(".chanceTicket-sum").text(sum - donationNum);
                                if(sum - donationNum == 0){
                                    $(".chanceTicket-set").hide();
                                    $(".chanceTicket-not").show();
                                }
                            }
                        });
                    }else{
                        target.removeClass('disabled');
                        alert("数量超出已用上限");
                    }
                    $("#cust_titket_to_user_select_user_input").val("");
                    $("#cust_titket_to_user_select_input").val("");
                    $("#donationNum").val("");
                }
            });

            //初始化赠送奖券人员列表
            var agents=getCache("agents");
            var _agents=[];
            for(var i=0;i<agents.length;i++){
                var u=agents[i];
                if(u.status=='enable'){
                    _agents.push(u);
                }
            }
            utils.loadSearchInput({ id: "cust_titket_to_user_select_user",
                width: "110",
                height: "17",
                tip: "按姓名、拼音搜索",
                data: _agents,
                searchField: ["displayName","exten"],
                pinyinField: ["displayName"],
                listField: ["displayName"],
                userIdField: "_id",
                showField: "displayName",
                showAllList: true,
                callbackFuc: function (object) {
                    $("#cust_titket_to_user_select_input").val(object._id);
                },
                onKeyChanged: function () {
                    if ($("#cust_titket_to_user_select_user_input").val() != "") {
                        $("#cust_titket_to_user_select_input").val("serachInputNoresult");
                    } else {
                        $("#cust_titket_to_user_select_input").val("");
                    }
                }
            });

            dsevent.bind("#view_webchat_todo", dsevent.evt.refreshWebchatToDoList, function(event , params){
                $(this).find(".refresh").click();
//            $("#view_webchat_todo_content").html("");
            });
//            handler.webchat.getIvr();

            $('#imDealCount').bind('change', function () {
                handler.webchat.updateIvrCount();
            })
        });

        $('#workbench_report_sale_agent_datetime_picker_start').datetimepicker({
            dateFormat: "yy-mm-dd",
            showTimepicker: false
        });
        $('#workbench_report_sale_agent_datetime_picker_end').datetimepicker({
            dateFormat: "yy-mm-dd",
            showTimepicker: false
        });
    </script>
