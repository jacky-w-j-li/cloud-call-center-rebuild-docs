<div class="modal-header">
    <button type="button" class="close" data-dismiss="modal" aria-hidden="true">
        ×
    </button>
    <h3>查看明细</h3>
</div>
<div class="">
    <form>
        <div class="modal-body">
        </div>
    </form>
</div>

<script id="tmpl_callRecord_detail" type="text/x-jquery-tmpl">
<div class="contact-info">
    <div class="custom_fields expandable item" style="">
        <p>
            <span class="label4">客户名称</span>
            <span>${custName}</span>
        </p>
        <p>
            <span class="label4">分类</span>
            <span>${handler.callRecord.showTypeDesc(dbType,type)}</span>
        </p>
        <p>
            <span class="label4">创建人</span>
            <span>${handler.call.getAgentName(creator)}</span>
        </p>
        <p>
            <span class="label4">创建时间</span>
            <span>${createTime}</span>
        </p>
        <p>
            <span class="label4">号码</span>
            <span>${callNo}</span>
        </p>
        <p>
            <span class="label4">振铃时间</span>
            <span>${callTime}</span>
        </p>
        {{if recordAddr}}
            <p>
                <span class="label4">录音</span>
                <span><audio id="cdr_listen_audio" src="${recordAddr}" preload="auto"  controls="controls">您的浏览器不支持此播放器</audio></span>
            </p>
        {{/if}}
        {{each fields}}
        <p>
            <span class="label4">${n}</span>
            {{if t=='dropdown' || t=='radio' || t=='checkbox'}}
            ${handler.callRecord.getCustomFieldDicName(dbType,k,v,t)}
            {{else}}
            <span>{{html replaceUrl(v)}}</span>
            {{/if}}
        </p>
        {{/each}}
    </div>
</div>
</script>
