<script type="text/javascript">
    $(function () {
        $(".questionnaire_list_search_dorpdown").bind("click", function () {
            $("#questionnaire_list_search_query_#menu#_").toggleClass("task_query_close");
        });


        var temp = "<option value='_id'>_name</option>";
        var quesTemps = getCache("questionnaireTemp");
        var html = "";
        for (var i = 0; i < quesTemps.length; i++) {
            var tempItem = quesTemps[i];
            html += temp.replace(/_id/g, tempItem._id).replace(/_name/g, tempItem.name);
        }


        var typeSelect = $("#questionnaire_list_search_query_#menu#_").find("table").find(".quesTemp_type");
        var resultSelect = $("#questionnaire_list_search_query_#menu#_").find(".ques_result");
        var masterSelect = $("#questionnaire_list_search_query_#menu#_").find(".ques_master");
        var batchNoInput = $("#questionnaire_list_search_query_#menu#_").find(".ques_batchNo");
        var queryTimeInput = $("#questionnaire_list_search_query_#menu#_").find(".query_time");
        typeSelect.append(html);


        var agents = getCache("agents") || [];
        masterSelect.append(temp.replace(/_id/g, "##").replace(/_name/g, "未分配"));
        for (var i = 0; i < agents.length; i++) {
            var agentsItem = agents[i];
            masterSelect.append(temp.replace(/_id/g, agentsItem._id).replace(/_name/g, agentsItem.displayName));
        }

        var menu = session.currentPage.pageId;
        if (menu == "my_questionnaire_uncomplete" || menu == 'questionnaire_uncomplete' || menu == "my_questionnaire_uncomfirm") {
            resultSelect.closest("div").hide();
            queryTimeInput.closest("div").hide();
        }
        if (menu == 'my_questionnaire_complete' || menu == "my_questionnaire_uncomplete" || menu == "my_questionnaire_uncomfirm") {
            masterSelect.closest("div").hide();
        }
        if (menu == 'questionnaire_complete') {
            var tdPanel = batchNoInput.closest("td");
            var tablePanel = batchNoInput.closest("table");
            var html = tdPanel.html();
            tablePanel.append("<tr><td></td></tr>");
            tablePanel.find("td").last().append(html);
            tdPanel.remove();
        }


        $("select[name='temp_id']").change(function(){
            var statusHtml = "";
            $("select[name='temp_id'] option").each(function(){
                if($(this).attr("selected")){
                    var tempData = getCache("questionnaireTemp", $(this).attr("value"));
                    if(tempData.qstatus){
                        statusHtml += '<option value="">--请选择--</option>';
                        for(var key in tempData.qstatus){
                            statusHtml += '<option value="'+key+'">'+tempData.qstatus[key]+'</option>';
                        }
                    }else{
                        statusHtml += '<option value="">--请选择--</option>';
                        statusHtml += '<option value="success">成功</option>';
                        statusHtml += '<option value="invalid">无效电话</option>';
                        statusHtml += '<option value="noAnswer">无人接听</option>';
                        statusHtml += '<option value="imparity">客户不配合</option>';
                        statusHtml += '<option value="other">其他</option>';
                    }
                    return false;
                }
            });
            if(statusHtml == ""){
                statusHtml += '<option value="">--请选择--</option>';
                statusHtml += '<option value="success">成功</option>';
                statusHtml += '<option value="invalid">无效电话</option>';
                statusHtml += '<option value="noAnswer">无人接听</option>';
                statusHtml += '<option value="imparity">客户不配合</option>';
                statusHtml += '<option value="other">其他</option>';
            }
            resultSelect.html(statusHtml);
        });
//        $("select[name='temp_id']").change();

    });
</script>
