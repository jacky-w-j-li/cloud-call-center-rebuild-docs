<div class="im_report_head">
    <form class="form-horizontal">
        <input type="hidden" name="reportType" value="im_report_session_seoSource">
    <div id="time_type"style="display: inline-block;float: left">
        <!--<label style="float:left;margin-right:3px;">-->
        <!--时间类型-->
        <!--</label>-->
        <select name="timeType" id="im_report_engine_time_type"
                onchange="handler.report.callReport.resetDate('im_report_engine_dateTd',this.value)">
            <option value="day" id="optionDay">日报</option>
            <option value="month" id="optionMonth">月报</option>
            <option value="year" id="optionYear">年报</option>
            <option value="other" id="optionOther">自定义</option>
        </select>
        <div id="im_report_engine_dateTd" style="display: inline">
        </div>
        <div id="im_report_engine_dateTd_other" style="display: none">
            <div class="input-append date form_datetime">
                <input id="im_report_engine_datetime_picker_start" size="6" class="input-medium report_start_time" name="StartTime" type="text" value="" readonly>
                <span class="add-on datetimepicker-remove" style="height: 14px;line-height: 15px"><i class="icon-remove"></i></span>
                <span class="add-on datetimepicker-open" style="height: 14px;line-height: 15px"><i class="icon-th"></i></span>
            </div>
            <div style="padding-top: 5px;display: inline">
                至
            </div>
            <div class="input-append date form_datetime">
                <input id="im_report_engine_datetime_picker_end" size="6" class="input-medium report_end_time" name="EndTime" type="text" value="" readonly>
                <span class="add-on datetimepicker-remove" style="height: 14px;line-height: 15px"><i class="icon-remove"></i></span>
                <span class="add-on datetimepicker-open" style="height: 14px;line-height: 15px"><i class="icon-th"></i></span>
            </div>
        </div>
    </div>
    <div id="btn-select"style="display: inline-block;float: right">
        <a class="button ds_form_action" id="im_report_engine_btn" ds_action="report.im.im_report_engine">查询</a>
        <a class="button ds_form_action" ds_action="report.callReport.confirmExportReportPdf" style="margin-right: 10px">导出PDF</a>
        <a class="button ds_form_action" ds_action="report.im.exportImSourceAnalyseExcel">导出Excel</a>
    </div>
        </form>
</div>
<div id="engine_chart">
    <div id="im_report_engine_highcharts_container" style="width:840px;height:400px;margin: 0 auto">
    </div>
</div>
<div class="row-fluid">
    <div class="span12" id="im_report_engine_table">
        <table id="im_report_engine_table_id"  class="table table-striped table-bordered table-hover" style="table-layout:fixed;">
            <thead id="imReportEngineTableHeader">
            </thead>
            <tbody id="imReportEngineTableTbody">
            </tbody>
        </table>
    </div>
</div>
<script type="text/javascript">
    $('#im_report_engine_datetime_picker_start').datetimepicker({
        dateFormat: "yy-mm-dd",
        showTimepicker: false
    });
    $('#im_report_engine_datetime_picker_end').datetimepicker({
        dateFormat: "yy-mm-dd",
        showTimepicker: false
    });
</script>
