<div class="im_report_head">
    <form class="form-horizontal">
        <input type="hidden" name="reportType" value="im_report_session_fromUrl">
    <div id="time_type"style="display: inline-block;float: left">
        <!--<label style="float:left;margin-right:3px;">-->
        <!--时间类型-->
        <!--</label>-->
        <select name="timeType" id="im_report_website_time_type"
                onchange="handler.report.callReport.resetDate('im_report_website_dateTd',this.value)">
            <option value="day" id="optionDay">日报</option>
            <option value="month" id="optionMonth">月报</option>
            <option value="year" id="optionYear">年报</option>
            <option value="other" id="optionOther">自定义</option>
        </select>
        <div id="im_report_website_dateTd" style="display: inline">
        </div>
        <div id="im_report_website_dateTd_other" style="display: none">
            <div class="input-append date form_datetime">
                <input id="im_report_website_datetime_picker_start" size="6" class="input-medium report_start_time" name="StartTime" type="text" value="" readonly>
                <span class="add-on datetimepicker-remove" style="height: 14px;line-height: 15px"><i class="icon-remove"></i></span>
                <span class="add-on datetimepicker-open" style="height: 14px;line-height: 15px"><i class="icon-th"></i></span>
            </div>
            <div style="padding-top: 5px;display: inline">
                至
            </div>
            <div class="input-append date form_datetime">
                <input id="im_report_website_datetime_picker_end" size="6" class="input-medium report_end_time" name="EndTime" type="text" value="" readonly>
                <span class="add-on datetimepicker-remove" style="height: 14px;line-height: 15px"><i class="icon-remove"></i></span>
                <span class="add-on datetimepicker-open" style="height: 14px;line-height: 15px"><i class="icon-th"></i></span>
            </div>
        </div>
    </div>
    <div id="btn-select"style="display: inline-block;float: right">
        <a class="button ds_form_action" id="im_report_website_btn" ds_action="report.im.im_report_website">查询</a>
        <a class="button ds_form_action" ds_action="report.callReport.confirmExportReportPdf" style="margin-right: 10px">导出PDF</a>
        <a class="button ds_form_action" ds_action="report.im.exportImSourceAnalyseExcel">导出Excel</a>
    </div>
        </form>
</div>
<div class="row-fluid">
    <div class="span12" id="im_report_fromurl_highmaps_container">
        <table class="session_rank_table table" >
            <thead style="border-bottom: 1px solid #ddd">
                <tr style="border-top: 1px solid #dadada;">
                    <td style="width: 230px;height: 28px;line-height: 28px" name="rank">排名</td>
                    <td style="width: 450px;height: 28px;line-height: 28px">来源网址</td>
                    <td style="height: 28px;line-height: 28px;padding-left: 40px">总对话数</td>
                </tr>
            </thead>
            <tbody class="rank_tbody">

            </tbody>
        </table>
    </div>
</div>
<div class="row-fluid" style="margin-bottom: 30px">
    <div class="span12" id="im_report_fromurl_table">
        <table id="im_report_website_table_id"   class="table table-striped table-bordered table-hover" style="table-layout:fixed;">
            <thead id="imReportWebsiteTableHeader">

            </thead>
            <tbody id="imReportWebsiteTableTbody">

            </tbody>
        </table>
        <div class="pagination pagination-small" ds_pagination_action="report.im.im_report_website_updown">
            <ul class="user_list_page pull-right" style="padding-right: 2px;">
                <li class="active"><a href="#" value="1" app="disabled">上一页</a></li>
                <li><a href="#" value="2" app="enable">下一页</a></li>
            </ul>
        </div>
    </div>
</div>
<script type="text/javascript">
    $('#im_report_website_datetime_picker_start').datetimepicker({
        dateFormat: "yy-mm-dd",
        showTimepicker: false
    });
    $('#im_report_website_datetime_picker_end').datetimepicker({
        dateFormat: "yy-mm-dd",
        showTimepicker: false
    });
</script>
