<script>
    $(function(){
        utils.loadSearchInput({ id: "im_report_keyword_commissioner_user",
            width: "179",
            height: "14",
            tip: "按搜索引擎搜索",
            data: getCache("seoSource"),
            searchField: ["name", "name", "name"],
            pinyinField: ["name"],
            listField: ["name"],
            userIdField: "_id",
            showField: "name",
            showAllList: true,
            callbackFuc: function (object) {
                $("#im_report_keyword_input").val(object._id);
                //alert(object._id);
            },
            onKeyChanged: function () {
                if ($("#im_report_keyword_commissioner_user_input").val() != "") {
                    $("#im_report_keyword_input").val("serachInputNoresult");
                } else {
                    $("#im_report_keyword_input").val("");
                }
            }
        });
    })


</script>
