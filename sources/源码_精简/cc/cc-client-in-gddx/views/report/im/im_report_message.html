<script>
    $(function () {
        var allAccessIds = getCache("accessIds");
        utils.loadSearchInput({ id: "im_report_message_search_div",
            width: "149",
            height: "14",
            tip: "按名称搜索",
            data: allAccessIds,
            listField: ["name","platform"],
            userIdField: "_id",
            searchField: ["name"],
            pinyinField: [],
            showAllList: true,
            callbackFuc: function (object) {
                console.log(object);
                if($.isArray(object) || !object._id){
                    return;
                }
                var currentVals = $("input[name='selectedAccessId']");

                var ishas = false;
                for (var i = 0; i < currentVals.length; i++) {
                    if (currentVals[i].value === object._id) {
                        ishas = true;
                    }
                }
                if (!ishas) {
                    $('#im_report_message_select_accessId').before("<span id=" + object._id + "><input type='hidden' name='selectedAccessId' value=" + object._id + ">" +
                            "<span class='label label-info'>" + object.name +
                            "</span><a href='#' onclick=removeAccessId('" + object._id + "')><i class='icon-remove'></i></a>&nbsp;</span>");
                }
                countSelectAccessId();
            }
        });
    })
    function removeAccessId(id) {
        $('#' + id).remove();
        countSelectAccessId();
    }
    function countSelectAccessId() {
        var currentVals = $("input[name='selectedAccessId']");
        var ExtenStr = '';
        for (var i = 0; i < currentVals.length; i++) {
            ExtenStr += currentVals[i].value;
            if (i != currentVals.length - 1) {
                ExtenStr += ',';
            }
        }
        if(ExtenStr){
           $(".report_compare_btn").hide();
        }else{
            $(".report_compare_btn").show();
        }
        $('#selectedAccessIdList').val(ExtenStr);
    }
</script>
