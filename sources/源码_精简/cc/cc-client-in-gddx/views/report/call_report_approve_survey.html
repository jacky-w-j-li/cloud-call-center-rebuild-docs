<script>
    $(function(){
        var allAgents = getCache("agents");
        utils.loadSearchInput({ id:"approve_survey_report_search_div",
            width:"149",
            height:"14",
            tip:"按姓名,工号搜索",
            data: allAgents,
            showDep:true,
            listField: ["displayName", "exten"],
            userIdField: "_id",
            searchField: ["displayName", "exten", "pinyin"],
            pinyinField: ["displayName"],
            showAllList: true,
            multiSelect: true,
            callbackFuc: function(object) {
                //if object is array,no match recored
                if(Object.prototype.toString.call(object) === '[object Array]'){
                    return;
                }
                var currentVals = $("input[name='callReportApproveSurvey']");
                var ishas = false;
                for(var i=0;i<currentVals.length;i++){
                    if(currentVals[i].value === object._id){
                        ishas = true;
                    }
                }
                if(!ishas){
                    $('#approve_survey_report_select_agents').before("<span id="+object._id+"><input type='hidden' name='callReportApproveSurvey' value="+object._id+">" +
                            "<span class='label label-info'>" + object.displayName +
                            "</span><a href='#' onclick=removeAgentApprove('" + object._id + "')><i class='icon-remove'></i></a>&nbsp;</span>");
                }
                //$('#approve_survey_report_search_div_input').val('');
                utils.setSearchInput("approve_survey_report_search_div", "");
                countSelectAgentApprove();
            }
        });
    })
    function removeAgentApprove(id){
        $('#'+id).remove();
        countSelectAgentApprove();
    }
    function countSelectAgentApprove(){
        var currentVals = $("input[name='callReportApproveSurvey']");
        var ExtenStr = '';
        for(var i=0;i<currentVals.length;i++){
            ExtenStr += currentVals[i].value;
            if(i != currentVals.length-1){
                ExtenStr += ',';
            }
        }
        $('#approveSurveySelectedAgentList').val(ExtenStr);
    }
</script>
