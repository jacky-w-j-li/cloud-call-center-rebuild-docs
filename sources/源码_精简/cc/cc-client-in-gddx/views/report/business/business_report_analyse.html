<div class="">
    <div style="/*height:98%;margin:3px 3px;*/">
        <div class="row-fluid">
            <h5><i class="icon-user"></i>工单分析报表</h5>
            <br/>

            <form class="form-horizontal">
                <input type="hidden" name="reportType" value="business_report_analyse">

                <div id="time_type">
                    <!--<label style="float:left;margin-right:3px;">时间类型</label>-->
                    <select name="timeType" class="span2" id="business_report_analyse_time_type"
                            onchange="handler.report.callReport.resetDate('business_report_analyse_dateTd',this.value)">
                        <option value="day" id="optionDay">日报</option>
                        <option value="month" id="optionMonth">月报</option>
                        <option value="year" id="optionYear">年报</option>
                        <option value="other" id="optionOther">自定义</option>
                    </select>

                    <div id="business_report_analyse_dateTd" style="display: inline">
                    </div>
                    <div id="business_report_analyse_dateTd_other" style="display: none">
                        <div class="input-append date form_datetime">
                            <input id="business_report_analyse_datetime_picker_start" size="6" class="input-medium report_start_time" name="StartTime" type="text" value="" readonly>
                            <span class="add-on datetimepicker-remove" style="height: 14px;line-height: 15px"><i class="icon-remove"></i></span>
                            <span class="add-on datetimepicker-open" style="height: 14px;line-height: 15px"><i class="icon-th"></i></span>
                        </div>
                        <div style="padding-top: 5px;display: inline">
                            至
                        </div>
                        <div class="input-append date form_datetime">
                            <input id="business_report_analyse_datetime_picker_end" size="6" class="input-medium report_end_time" name="EndTime" type="text" value="" readonly>
                            <span class="add-on datetimepicker-remove" style="height: 14px;line-height: 15px"><i class="icon-remove"></i></span>
                            <span class="add-on datetimepicker-open" style="height: 14px;line-height: 15px"><i class="icon-th"></i></span>
                        </div>
                    </div>
                </div>
                <div class="clear10"></div>
                <div id="btn-select">
                    <a class="button ds_form_action" id="business_report_analyse_btn"
                       ds_action="report.business.business_report_analyse">查询</a>
                    <a class="button ds_form_action" ds_action="report.callReport.confirmExportReportPdf">导出PDF</a>
                    <a class="button ds_form_action" ds_action="report.business.exportBusinessAnalyseExcel">导出Excel</a>
                </div>
                <div class='row-fluid account_line'></div>
                <br/>
                <div id="business_report_analyse_highcharts_container" style="min-width: 310px; height: 300px; margin: 0 auto"></div>
                <div id="business_report_analyse_highcharts_container_Y" style="width: 95%; height: 300px; margin: 0 0; display: none;"></div>

                <div class="business_report_analyse_data_part" span12>
                    <div class="alert alert-block" style="padding: 5px 10px;line-height:1.5">
                        <h12>
                            <a class="alert_a" data-toggle="collapse" data-parent="#accordion" href="#collapseTwo1">点击展开或折叠“说明”</a>
                        </h12>
                        <div id="collapseTwo1" class="panel-collapse collapse ">
                            <div class="panel-body">
                                说明：<br>
                                创建工单数：座席新创建的工单数量总计<br>
                                完成工单数：座席完成的工单数量总计<br>
                                完成率：完成工单数/完成工单数<br>
                                平均完成时长：工单由创建到完成所使用的总时长的平均值<br>
                                平均处理时长：工单执行过程中的每一个步骤所用时长的平均值<br>
                                平均等待时长：工单在工单池子里等待被领取的时长平均值<br>
                            </div>
                        </div>
                    </div>
                    <div class="data_content_part" id="business_report_analyse_table">
                        <table id="business_report_analyse_table_id" class="table table-striped table-bordered table-hover">
                            <thead id="businessReportAnalyseTableHeader">

                            </thead>
                            </thead>
                            <tbody id="businessReportAnalyseTableTbody">

                            </tbody>
                        </table>
                    </div>
                </div>
            </form>

            <div class="contentpart" style="padding: 5px;margin: 10px;">

            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    $('#business_report_analyse_datetime_picker_start').datetimepicker({
        dateFormat: "yy-mm-dd",
        showTimepicker: false
    });
    $('#business_report_analyse_datetime_picker_end').datetimepicker({
        dateFormat: "yy-mm-dd",
        showTimepicker: false
    });
</script>
