<script>
    function changeCheckAllProvinceRelayCity(sel){
        var proArr = $(".Relay_City_Province_check");
        if(sel.checked==true){
            $.each(proArr,function(i,item){
                item.checked=true;
            })
        }else{
            $.each(proArr,function(i,item){
                item.checked=false;
            })
        }
    }
    $(document).on("click",'#relay_area_city input[type = checkbox]',function(){
        var chknum = $("#relay_area_city input[type = checkbox]").length;//选项总个数
        var chk = 0;
        $("#relay_area_city input[type = checkbox]").each(function () {
            if($(this).prop("checked")== true){
                chk++;
            }
        });
        if(chknum==chk){//全选
            $('#check_AllProvince').prop('checked',true);
        }else{//不全选
            $('#check_AllProvince').prop('checked',false);
        }
    });
    $(document).on("click","#all_city_checked",function(){
        if($('#all_city_checked').attr('checked')){
            $('#all_city_checked').prop('checked',true);
            $('#report_relay_area_city_service_no_div input[type = checkbox]').prop('checked',true);}
        else{
            $('#all_city_checked').prop('checked',false);
            $('#report_relay_area_city_service_no_div input[type = checkbox]').prop('checked',false);}
    });
    $(document).on("click",'#report_relay_area_city_service_no_div input[type = checkbox]',function(){
        var chknum = $("#report_relay_area_city_service_no_div input[type = checkbox]").length;//选项总个数
        var chk = 0;
        $("#report_relay_area_city_service_no_div input[type = checkbox]").each(function () {
            if($(this).prop("checked")== true){
                chk++;
            }
        });
        if(chknum==chk){//全选
            $('#all_city_checked').prop('checked',true);
        }else{//不全选
            $('#all_city_checked').prop('checked',false);
        }
    });
</script>
