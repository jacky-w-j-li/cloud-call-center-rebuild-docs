<div class="">
    <div style="/*height:98%;margin:3px 3px;*/">
        <div class="row-fluid">
            <h5><i class="icon-user"></i>商机分析报表</h5>
            <br/>
            <form class="form-horizontal">
                <input type="hidden" name="reportType" value="customer_report_sale">
                <div id="time_type">
                    <!--<label style="float:left;margin-right:3px;">时间类型</label>-->
                    <select name="timeType" id="customer_report_sale_time_type"
                            onchange="handler.report.callReport.resetDate('customer_report_sale_dateTd',this.value)">
                        <option value="all" id="all">所有</option>
                        <option value="year" id="optionYear">年报</option>
                        <option value="month" id="optionMonth">月报</option>
                    </select>

                    <div id="customer_report_sale_dateTd" style="display: inline">
                    </div>
                    <div id="customer_report_sale_dateTd_other" style="display: none">
                        <div class="input-append date form_datetime">
                            <input id="report_sale_datetime_picker_start" size="6" class="input-medium report_start_time" name="StartTime" type="text" value="" readonly>
                            <span class="add-on datetimepicker-remove" style="height: 14px;line-height: 15px"><i class="icon-remove"></i></span>
                            <span class="add-on datetimepicker-open" style="height: 14px;line-height: 15px"><i class="icon-th"></i></span>
                        </div>
                        <div style="padding-top: 5px;display: inline">
                            至
                        </div>
                        <div class="input-append date form_datetime">
                            <input id="report_sale_datetime_picker_end" size="6" class="input-medium report_end_time" name="EndTime" type="text" value="" readonly>
                            <span class="add-on datetimepicker-remove" style="height: 14px;line-height: 15px"><i class="icon-remove"></i></span>
                            <span class="add-on datetimepicker-open" style="height: 14px;line-height: 15px"><i class="icon-th"></i></span>
                        </div>
                    </div>
                </div>
                <div class="clear10"></div>
                <div id="btn-select">
                    <a class="button ds_form_action" id="customer_report_sale_btn"
                       ds_action="report.customer.customer_report_sale">查询</a>
                    <a class="button ds_form_action" ds_action="report.callReport.confirmExportReportPdf">导出PDF</a>
                    <a class="button ds_form_action" ds_action="report.customer.exportCustomerSaleExcel">导出Excel</a>
                </div>
                <div class='row-fluid account_line'></div>
                <br/>
                <div id="customer_report_sale_highcharts_container" style="min-width: 310px; height: 300px; margin: 0 auto"></div>
                <div id="customer_report_sale_highcharts_container_Y" style="width: 95%; height: 300px; margin: 0 0; display: none;"></div>

                <div class="agent_report_data_part" span12>
                    <div class="alert alert-block" style="padding: 5px 10px;line-height:1.5">
                        <h12>
                            <a class="alert_a" data-toggle="collapse" data-parent="#accordion" href="#collapseTwo10">点击展开或折叠“说明”</a>
                        </h12>
                        <div id="collapseTwo10" class="panel-collapse collapse">
                            <div class="panel-body">
                                说明：<br>
                                1.成单率 = 成单数 / 商机数<br>
                                2.无效率 = 无效数 / 商机数<br>
                                3.丢单率 = 丢单数 / 商机数<br>
                                4.单均产值 = 总产值 / 成单数<br>
                                5.如果成单数大于商机数, 成单率 = 100%;
                                  如果无效数大于商机数，无效率 = 100%;
                                  如果丢单数大于商机数，丢单率 = 100%.<br>
                            </div>
                        </div>
                    </div>
                    <div class="data_content_part" id="customer_report_sale_table">
                        <table id="customer_report_sale_table_id" class="table table-striped table-bordered table-hover">
                            <thead id="customerReportSaleTableHeader">
                                <th onclick="utils.sortTable('customer_report_sale_table_id', 0, 'string', this);" style="cursor: pointer;" state="init">时间<span class="sort monitor_sort">&nbsp;</span></th>
                                <th onclick="utils.sortTable('customer_report_sale_table_id', 1, 'string', this);" style="cursor: pointer;" state="init">商机数<span class="sort monitor_sort">&nbsp;</span></th>
                                <th onclick="utils.sortTable('customer_report_sale_table_id', 2, 'string', this);" style="cursor: pointer;" state="init">成单数<span class="sort monitor_sort">&nbsp;</span></th>
                                <th onclick="utils.sortTable('customer_report_sale_table_id', 3, 'string', this);" style="cursor: pointer;" state="init">无效数<span class="sort monitor_sort">&nbsp;</span></th>
                                <th onclick="utils.sortTable('customer_report_sale_table_id', 4, 'string', this);" style="cursor: pointer;" state="init">丢单数<span class="sort monitor_sort">&nbsp;</span></th>
                                <th onclick="utils.sortTable('customer_report_sale_table_id', 5, 'string', this);" style="cursor: pointer;" state="init">成单率<span class="sort monitor_sort">&nbsp;</span></th>
                                <th onclick="utils.sortTable('customer_report_sale_table_id', 6, 'string', this);" style="cursor: pointer;" state="init">无效率<span class="sort monitor_sort">&nbsp;</span></th>
                                <th onclick="utils.sortTable('customer_report_sale_table_id', 7, 'string', this);" style="cursor: pointer;" state="init">丢单率<span class="sort monitor_sort">&nbsp;</span></th>
                                <th onclick="utils.sortTable('customer_report_sale_table_id', 8, 'string', this);" style="cursor: pointer;" state="init">单均产值<span class="sort monitor_sort">&nbsp;</span></th>
                                <th onclick="utils.sortTable('customer_report_sale_table_id', 9, 'string', this);" style="cursor: pointer;" state="init">总产值<span class="sort monitor_sort">&nbsp;</span></th>
                            </thead>
                            </thead>
                            <tbody id="customerReportSaleTableTbody">

                            </tbody>
                        </table>
                    </div>
                </div>
            </form>

            <div class="contentpart" style="padding: 5px;margin: 10px;">

            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    $('#report_sale_datetime_picker_start').datetimepicker({
        dateFormat: "yy-mm-dd",
        timeFormat: "HH:mm",
        showTimepicker: true,
        stepMinute: 30
    });
    $('#report_sale_datetime_picker_end').datetimepicker({
        dateFormat: "yy-mm-dd",
        timeFormat: "HH:mm",
        showTimepicker: true,
        stepMinute: 30
    });
</script>
