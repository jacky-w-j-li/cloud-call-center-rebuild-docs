<div id="qualityCheckListQueryPanel">
    <div style="height:98%;margin:3px 3px;">
        <div class="row-fluid">

                                <div id="quality_check_skill_group" class="combobox_agent"></div>

                        </tr>
                    </table>
                </div>
                <div class="pull-left">
                    <label style="float:left;">接听座席&nbsp;</label>
                    <table style="margin-right: 5px">
                        <tr>
                            <td>
                                <input name="DISPOSAL_AGENT" type="hidden" class="ds_search_item select_input" id="quality_check_list_disposal_agent_select_input" style="float:none;"/>
                                <div id="quality_check_list_disposal_agent_select_user" class="combobox_agent"></div>

                    </table>
                </div>
                <div class="pull-left">

                <div>

                        <tr>
                            <td>

                                <div id="quality_check_connect_type" class="combobox_agent"></div>
                            </td>
                        </tr>
                    </table>
                </div>
                <div class="clear10"></div>
                <div class="pull-left">
                    <label style="width: 48px">满&nbsp;意&nbsp;度&nbsp;</label>
                    <select name="INVESTIGATE" class="investigate_selector input-medium" style="margin-right: 5px"></select>
                </div>
                <div class="pull-left">
                    <label>通话时长</label>
                    <div class="input-append"><input type="text" style="width: 55px" name="CALL_TIME_LENGTH_BEGIN" class="input-small" dataType="Number" msg="时长条件只能为正整数"><span class="add-on" style="height: 14px;line-height: 15px">秒</span></div> 至
                    <div class="input-append"><input type="text" style="width: 55px" name="CALL_TIME_LENGTH_END" class="input-small" dataType="Number" msg="时长条件只能为正整数"><span class="add-on" style="height: 14px;line-height: 15px;margin-right: 6px">秒</span></div>
                </div>
                <div class="pull-left">
                    <span class="pass_no">
                        <label>质检评级</label>
                        <select name="LEVEL">
                            <option value="">--全部--</option>
                            <option value="A">优秀</option>
                            <option value="B">合格</option>
                            <option value="C">提醒</option>
                            <option value="D">不合格</option>
                        </select>
                    </span>
                </div>
                <div class="clear10"></div>

                        <div class="input-append"><input type="text" name="GRADE_MAX" class="input-small" placeholder="0-100分" dataType="Number" msg="单项评分条件只能为正整数"><span class="add-on" style="height: 14px;line-height: 15px;margin-right: 6px">分</span></div>
                    </span>
                </div>
                <div class="pull-left">
                    <label style="float:left;margin-right: 3px;" >质检人员&nbsp;</label>
                    <table style="margin-right: 5px">
                        <tr>
                            <td>
                                <input name="GRADE_USER" type="hidden" class="ds_search_item select_input" id="quality_check_list_disposal_grade_select_input" style="float:none;"/>
                                <div id="quality_check_list_disposal_grade_select_user" class="combobox_agent"></div>
                            </td>
                        </tr>
                    </table>
                </div>
                <div>
                    <!-- <select name="GRADE_USER" class="queue_qc_agents input-medium"></select> -->
                    <span class="normal_no">
                        <label>查看方式</label>
                        <select name="amount" style="margin-right: 5px">

                            <option value="yes">已通过</option>
                            <option value="no">未通过</option>
                            <option value="dont">不涉及</option>
                        </select>
                    </span>
                    <span class="normal_no">
                        <label>显示层数</label>
                        <select name="floors" id="qc_query_in_floor">

                        </select>
                    </span>
                </div>
                <div class="clear10"></div>
                <div>
                    <a href="#" class="button ds_form_action" ds_action="qualityCheck.queryQualityCheckList" id="callSheetQualityCheckListQueryBtn">查询</a>
                    <a href="#" class="button ds_do_action callSheetQualityCheckListQueryResetBtn" ds_action="resetForm" ds_data="resetSpan">重置</a>
                    <a href="#" class="button ds_do_action callSheetQualityCheckListQueryResetHideBtn" style="display:none;" ds_action="resetForm" ds_data="resetSpan">重置</a>
                    <a href="#" class="button ds_form_action" ds_action="qualityCheck.exportQualityCheckListExcel">导出EXCEL</a>
                    <a href="#" class="button ds_do_action" ds_action="qualityCheck.queryranking"style="border-radius: 50%;width: 13px;height: 32px;float: right;text-align: center;line-height: 17px;">排名</a>
                </div>

                <div class="clear5">&nbsp;</div>
                <div class='row-fluid account_line'></div>
                <br/>

                <div style="width:100%;overflow-x:auto;padding-bottom:10px;">
                    <table class="table table-striped table-bordered table-hover">
                        <thead>
                            <tr id="quality_check_list_table_header">
                            </tr>
                        </thead>
                        <tbody id="quality_check_list_query_table_data">
                        </tbody>
                    </table>
                    <div class="row-fluid class_list">
                        <div class="pagination pagination-small" for="qualityCheckListQueryFrm" style="display:table; margin:0;width:100%;"
                             ds_pagination_action="qualityCheck.queryQualityCheckList">
                            <span class="result_info">查询结果：<span class="result_count">10</span></span>
                            <ul style="float:right;">
                                <li><a href="#" value="0">&laquo;</a></li>
                                <li><a href="#" value="1">1</a></li>
                                <li><a href="#" value="2">2</a></li>

                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<div id="show_quality_comments_pane"></div>
<script type="text/javascript">
    $(function(){
        $('#quality_check_list_datetime_picker_start').datetimepicker({
//            controlType: utils.jqueryUITimepickerControl,
            timeFormat: "HH:mm:ss",
            dateFormat: "yy-mm-dd",
            showSecond: true
        });
        $('#quality_check_list_datetime_picker_end').datetimepicker({
//            controlType: utils.jqueryUITimepickerControl,
            timeFormat: "HH:mm:ss",
            dateFormat: "yy-mm-dd",
            showSecond: true
        });
        $('#check_datetime_picker_start').datetimepicker({
//            controlType: utils.jqueryUITimepickerControl,
            timeFormat: "HH:mm:ss",
            dateFormat: "yy-mm-dd",
            showSecond: true
        });
        $('#check_datetime_picker_end').datetimepicker({
//            controlType: utils.jqueryUITimepickerControl,
            timeFormat: "HH:mm:ss",
            dateFormat: "yy-mm-dd",
            showSecond: true
        });
        $('#qualityCheckListQueryFrm select[name="GRADE_CONFIG"]').on('change', function (event) {
            var src = $(event.currentTarget);
            var data = src.find('option:selected').attr('ds_data');
            $('#qualityCheckListQueryFrm input[name= "GRADE_MIN"]').val('');
            $('#qualityCheckListQueryFrm input[name= "GRADE_MAX"]').val('');
            $('#qualityCheckListQueryFrm input[name= "GRADE_MIN"]').attr('placeholder','0-'+data+'分');
            $('#qualityCheckListQueryFrm input[name= "GRADE_MAX"]').attr('placeholder','0-'+data+'分');
            if($(this).find('option:selected').val() == ""){
                $('#qualityCheckListQueryFrm input[name= "GRADE_MIN"]').attr('placeholder','0-100分');
                $('#qualityCheckListQueryFrm input[name= "GRADE_MAX"]').attr('placeholder','0-100分');
                return false;
            }

        })

        $("a[data-toggle]").popover();
    });
    var users = [];
    if(session.user.scope.qc == "all" || session.user.type == "admin"){
        users = getCache("agents");
    }else{
        var lowUsers = session.user.moduleUsers.qc||[];
        var agents = getCache("agents");
        for(var i=0 ;i<agents.length;i++){
            for(var j=0;j<lowUsers.length;j++){
                if(lowUsers[j] == agents[i]._id){
                    users.push(agents[i]);
                }
            }
        }
    }
    utils.loadSearchInput({ id: "quality_check_list_disposal_agent_select_user",
        width: "100",
        height: "14",
        tip: "按姓名,拼音,工号搜索",
        data:users,
        searchField: ["displayName", "exten", "pinyin"],
        pinyinField: ["displayName"],
        listField: ["displayName", "exten"],
        userIdField: "_id",
        showAllList: true,
        callbackFuc: function(object) {
            if(Object.prototype.toString.call(object) === '[object Array]'){
                return;
            }
            var currentVals = $("#qualityCheckListQueryFrm input[name='DISPOSAL_AGENT']");
            var ishas = currentVals.val().indexOf(','+object._id)>-1;
            if(!ishas){
                $('#quality_check_list_disposal_agent_select_user').before("<span id='"+object._id + "' class='cc_value'><span class='label label-info'>"+object.displayName+
                        "</span><a href='#' onclick=removePanleSpan('"+object._id+"','agent')><i class='icon-remove'></i></a>&nbsp;</span>");

                $('#quality_check_list_disposal_agent_select_user_input').attr("<span id='"+object._id+"' class='cc_value'><span class='label label-info'>"+object.displayName+
                        "</span><a href='#' onclick=removePanleSpan('"+object._id+"','agent')><i class='icon-remove'></i></a>&nbsp;</span>");
                currentVals.val(currentVals.val() + ',' + object._id);
            }
        }
    });
    function removePanleSpan(id,type){
        var currentVals;
        if(type=='agent'){
            $('#qualityCheckListQueryFrm #'+id).remove();
            currentVals = $("#qualityCheckListQueryFrm input[name='DISPOSAL_AGENT']");
        }else if(type=='grade'){
            $('#qualityCheckListQueryFrm #'+id+"_g").remove();
            currentVals = $("#qualityCheckListQueryFrm input[name='GRADE_USER']");
        }else if(type=='group'){
            $('#qualityCheckListQueryFrm #'+id).remove();
            currentVals = $("#qualityCheckListQueryFrm input[name='ERROR_MEMO']");
        }else if(type=='calltype'){
            $('#qualityCheckListQueryFrm #'+id).remove();
            currentVals = $("#qualityCheckListQueryFrm input[name='CONNECT_TYPE']");
        }
        var oldagents = ','+id;
        currentVals.val(currentVals.val().replace(oldagents, ''));
    }
    utils.loadSearchInput({ id: "quality_check_list_disposal_grade_select_user",
        width: "184",
        height: "14",
        tip: "按姓名,拼音,工号搜索",
        data:users,
        searchField: ["displayName", "exten", "pinyin"],
        pinyinField: ["displayName"],
        listField: ["displayName", "exten"],
        userIdField: "_id",
        showAllList: true,
        callbackFuc: function(object) {
            if(Object.prototype.toString.call(object) === '[object Array]'){
                return;
            }
            var currentVals = $("#qualityCheckListQueryFrm input[name='GRADE_USER']");
            var ishas = currentVals.val().indexOf(','+object._id)>-1;
            if(!ishas){
                $('#quality_check_list_disposal_grade_select_user').before("<span id='"+object._id +"_g'"+ "' class='cc_value'><span class='label label-info'>"+object.displayName+
                        "</span><a href='#' onclick=removePanleSpan('"+object._id+"','grade')><i class='icon-remove'></i></a>&nbsp;</span>");

                $('#quality_check_list_disposal_grade_select_user_input').attr("<span id='"+object._id+"_g"+"'class='cc_value'><span class='label label-info'>"+object.displayName+
                        "</span><a href='#' onclick=removePanleSpan('"+object._id+"','grade')><i class='icon-remove'></i></a>&nbsp;</span>");
                currentVals.val(currentVals.val() + ',' + object._id);
            }
        }
    });
    utils.loadSearchInput({ id: "quality_check_skill_group",
        width: "184",
        height: "14",
        tip: "按技能组搜索",
        data:getCache('queues'),
        listField: ["DisplayName"],
        userIdField: "_id",
        searchField: ["DisplayName"],
        pinyinField: ["DisplayName"],
        showAllList: true,
        callbackFuc: function(object) {
            if(Object.prototype.toString.call(object) === '[object Array]'){
                return;
            }
            var currentVals = $("#qualityCheckListQueryFrm input[name='ERROR_MEMO']");
            var ishas = currentVals.val().indexOf(','+object.Exten)>-1;
            if(!ishas){
                $('#quality_check_skill_group').before("<span id='"+object.Exten + "' class='cc_value'><span class='label label-info'>"+object.DisplayName+
                        "</span><a href='#' onclick=removePanleSpan('"+object.Exten+"','group')><i class='icon-remove'></i></a>&nbsp;</span>");

                $('#quality_check_skill_group_input').attr("<span id='"+object.Exten+"' class='cc_value'><span class='label label-info'>"+object.DisplayName+
                        "</span><a href='#' onclick=removePanleSpan('"+object.Exten+"','group')><i class='icon-remove'></i></a>&nbsp;</span>");
                currentVals.val(currentVals.val() + ',' + object.Exten);
            }
        }
    });
    utils.loadSearchInput({ id: "quality_check_connect_type",
        width: "184",
        height: "14",
        tip: "按呼叫类型搜索",
        data:getCache('callType'),
        listField: ["code_name"],
        userIdField: "_id",
        searchField: ["code_name"],
        pinyinField: ["code_name"],
        showAllList: true,
        callbackFuc: function(object) {
            if(Object.prototype.toString.call(object) === '[object Array]'){
                return;
            }
            var currentVals = $("#qualityCheckListQueryFrm input[name='CONNECT_TYPE']");
            var ishas = currentVals.val().indexOf(','+object.code_value)>-1;
            if(!ishas){
                $('#quality_check_connect_type').before("<span id='"+object.code_value + "' class='cc_value' ><span class='label label-info'>"+object.code_name+
                        "</span><a href='#' onclick=removePanleSpan('"+object.code_value+"','calltype')><i class='icon-remove'></i></a>&nbsp;</span>");

                $('#quality_check_connect_type_input').attr("<span id='"+object.code_value+"' class='cc_value' ><span class='label label-info'>"+object.code_name+
                        "</span><a href='#' onclick=removePanleSpan('"+object.code_value+"','calltype')><i class='icon-remove'></i></a>&nbsp;</span>");
                currentVals.val(currentVals.val() + ',' + object.code_value);
            }
        }
    });
    utils.loadSearchInput_new({ id: "quality_check_list_task_name_select",
        width: "180",
        height: "14",
        tip: "按任务名称搜索",
        data:getqualityTasks(getCache('qualityTasks')),
        searchField: ["TASK_NAME"],
        pinyinField: ["TASK_NAME"],
        listField: ["TASK_NAME"],
        userIdField: "_id",
        showField: "TASK_NAME",
        showAllList: true,
        callbackFuc: function (object) {
            $("#quality_check_list_task_name_input").val(object._id);
            var templeid=getCache('qualityTasks',$("#quality_check_list_task_name_input").val());
            $('#qualityCheckListTemplates input[name=TEMPLATE]').each(function(){
                if($(this).val()==templeid.query.TASK_TEMPLATE){
                    $(this).prop("checked",true);
                    handler.qualityCheck.changeQualityCheckTemplate('qualityCheckListTemplates');
                }
            });
            $('#qualityCheckListTemplates input[name=TEMPLATE][checked!=true]').prop("disabled",true);
        },
        onKeyChanged: function () {
            $('#qualityCheckListTemplates input[name=TEMPLATE]').prop("disabled",false);
            if ($("#quality_check_list_task_name_select_input").val() != "") {
                $("#quality_check_list_task_name_input").val("serachInputNoresult");
            } else {
                $("#quality_check_list_task_name_input").val("");
            }
        }
    });
    $("#quality_check_list_task_name_select_input").blur(function(){
         var str= $(this).prev().val();
        if(str=="serachInputNoresul"){
            $().alertmessage('showError', '输入有误，请检查后重新输入！');
        }
    })
    $(".callSheetQualityCheckListQueryResetBtn").click(function(){
        $("#qualityCheckListQueryFrm input[name=GRADE_MIN]").prop("placeholder","0-100分");
        $("#qualityCheckListQueryFrm input[name=GRADE_MAX]").prop("placeholder","0-100分");
        $("#quality_check_list_task_name_select_input").val('');
        $("#quality_check_list_task_name_input").val('');
        $('#qualityCheckListTemplates input[name=TEMPLATE]').prop("disabled",false);
    })
    function getqualityTasks(task){
        var newarray = new Array();
        for(var task_one=0,len = task.length;task_one<len;task_one++){
            if(task[task_one].hide == true){
                newarray.push(task[task_one]);
            }
        }
        return newarray;
    }

</script>
