<script>
    $(function(){
        var users = [];
        if(session.user.scope.qc == "all" || session.user.type == "admin"){
            users = getCache("agents");
        }else{
            var lowUsers = session.user.moduleUsers.qc||[];
            var agents = getCache("agents");
            for(var i=0 ;i<agents.length;i++){
                for(var j=0;j<lowUsers.length;j++){
                    if(lowUsers[j] == agents[i]._id){
                        users.push(agents[i]);
                    }
                }
            }
        }
        utils.loadSearchInput({ id:"quality_check_agent_report_search_div",
            width:"193",
            height:"14",
            tip:"按姓名,拼音,工号搜索",
            data: users,
            listField: ["displayName", "exten"],
            userIdField: "_id",
            searchField: ["displayName","exten","pinyin"],
            pinyinField: ["displayName"],
            showAllList: true,
            callbackFuc: function(object) {
                //if object is array,no match recored
                if(Object.prototype.toString.call(object) === '[object Array]'){
                    return;
                }
                var currentVals = $("#qualityCheckAgentQueryFrm input[name='selectedAgent']");
                var ishas = currentVals.val().indexOf(','+object._id)>-1;
                if(!ishas){
                    $('#quality_check_agent_report_search_div').before("<span class='cc_value' id="+object._id + "><span class='label label-info'>"+object.displayName+
                            "</span><a href='#' onclick=removeQueryAgent('"+object._id+"')><i class='icon-remove'></i></a>&nbsp;</span>");

                    $('#quality_check_agent_report_search_div_input').attr("<span cc_value id="+object._id+"><span class='label label-info'>"+object.displayName+
                            "</span><a href='#' onclick=removeQueryAgent('"+object._id+"')><i class='icon-remove'></i></a>&nbsp;</span>");
                    currentVals.val(currentVals.val() + ',' + object._id);
                }
            }
        });
    });
    function removeQueryAgent(id){
        $('#qualityCheckQueryPanel #'+id).remove();
        var currentVals = $("#qualityCheckAgentQueryFrm input[name='selectedAgent']");
        currentVals.val(currentVals.val().replace(',' + id, ''));
    }
</script>
