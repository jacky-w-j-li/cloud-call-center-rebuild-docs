    <div tabindex="-1" id="quality_check_random_template_add_pane"class="modal hide fade" aria-hidden="false" style="min-width: 640px;min-height: 200px"></div>
    <div tabindex="-1" id="quality_task_add_pane"class="modal hide fade" style="width:1000px;min-width: 640px;min-height: 200px;"></div>

<script type="text/javascript">
    var qualityCheckRandomTemplate = null;
    $(function(){
        $('#quality_record_random_checkbox').change(function(event){
            var value = $(this).is(':checked');
            if (value) {
                $("#quality_check_datetime_picker_start").val("");
                $("#quality_check_datetime_picker_end").val("");
                $(".input-append>input[name='CALL_TIME_LENGTH_BEGIN']").val("");
                $(".input-append>input[name='CALL_TIME_LENGTH_END']").val("");
                $('.random_hide').show();
                $('#condition_for_task').hide();//任务查询
                $('#callSheetQualityCheckQueryBtn_reset').hide();//重置按钮
                $('#condition_for_quality').show();
                $('#condition_for_quality_Check').hide();
                var taskTemplateId = $("#qualityCheckRandomTemplates").find('input[type="radio"]:checked').val();
                if (taskTemplateId) {
                    handler.qualityCheck.getQualityTemplate(taskTemplateId);
                    $('.random_btn').show();//重新抽取按钮
                } else {
//                    $('#condition_for_quality_Check').show();//普通查询
                    $('.random_btn').hide();//重新抽取按钮
                }
            } else {
                $('.random_hide').hide();
                $('#condition_for_task').hide();
                $('#condition_for_quality').hide();
                $('#condition_for_quality_Check').show();
                $('.random_btn').hide();//重新抽取按钮
                $('#callSheetQualityCheckQueryBtn_reset').show();//重置按钮
//                $('#callSheetQualityCheckQueryBtn_reset').click();//重置按钮触发
                $(".input-append>input[name='CALL_TIME_LENGTH_BEGIN']").val("");
                $(".input-append>input[name='CALL_TIME_LENGTH_END']").val("");
            }
           if (value && $('#quality_task_random_checkbox').is(':checked')) {
                $('#quality_task_random_checkbox').click();
               $('#callSheetQualityCheckQueryBtn_reset').hide();
            }
            if (!value && !$('#quality_task_random_checkbox').is(':checked')) {
                $('#condition_for_task').hide();
                $('#condition_for_quality_Check').show();
            }


//            if(!value && !$('#quality_check_random_template_add_pane').is(":hidden")){
//                $('#qualityCheckMainPanel .quality_check_random_template_add_pane_show').click();
//            }
            $('#qualityCheckMainPanel .quality_check_random_template_add_pane_show').click(function () {
                $('#quality_check_random_template_add_pane').modal();
            });
            if (value) {
                if ($('#qualityCheckRandomTemplates').html()) {
                    $('#callSheetQualityCheckQueryBtn').click();
                } else {
                    render.qualityCheck.renderQualityCallSheetTable("","quality_check_query");
                    DS.updatePagination('qualityCheckQueryFrm', 0, 10, 1);
                }
            } else {
                $('#callSheetQualityCheckQueryBtn').click();
            }
        });
        $('#quality_task_random_checkbox').change(function () {
            var value = $(this).is(':checked');
            if (value && $('#quality_record_random_checkbox').is(':checked')) {
                $('#quality_record_random_checkbox').click();
            }
            if (!value && !$('#quality_record_random_checkbox').is(':checked')) {
                $('#condition_for_task').hide();
                $('#condition_for_quality_Check').show();
            }
            if (value) {
                $("#quality_check_datetime_picker_start").val("");
                $("#quality_check_datetime_picker_end").val("");
                $(".input-append>input[name='CALL_TIME_LENGTH_BEGIN']").val("");
                $(".input-append>input[name='CALL_TIME_LENGTH_END']").val("");
                $("#qualityCheckMainPanel .task_hide").show();
                $('#condition_for_quality').hide();
                $('#qualityCheckTemplates').find('input[type="radio"]').attr("disabled","disabled");
                var taskTemplateId = $("#qualityCheckTaskTemplates").find('input[type="radio"]:checked').val();
                if (taskTemplateId) {
                    handler.qualityCheck.getTaskTemplate(taskTemplateId);
                    $('#callSheetQualityCheckQueryBtn_reset').hide();
                } else {
                    $('#callSheetQualityCheckQueryBtn_reset').show();
                }
                if ($('#qualityCheckTaskTemplates').html()) {
                    $('#callSheetQualityCheckQueryBtn').click();
                } else {
                    render.qualityCheck.renderQualityCallSheetTable("","quality_check_query");
                    DS.updatePagination('qualityCheckQueryFrm', 0, 10, 1);
                }
            } else {
                $('#callSheetQualityCheckQueryBtn').click();
                $('#qualityCheckTemplates').find('input[type="radio"]').removeAttr("disabled");
                $("#qualityCheckMainPanel .task_hide").hide();
                $('#callSheetQualityCheckQueryBtn_reset').show();
            }

        });
        $('#quality_check_datetime_picker_start').datetimepicker({
//            controlType: utils.jqueryUITimepickerControl,
            timeFormat: "HH:mm:ss",
            dateFormat: "yy-mm-dd",
            showSecond: true
        });
        $('#quality_check_datetime_picker_end').datetimepicker({
//            controlType: utils.jqueryUITimepickerControl,
            timeFormat: "HH:mm:ss",
            dateFormat: "yy-mm-dd",
            showSecond: true
        });
        var users = [];
        if(session.user.scope.qc == "all" || session.user.type == "admin"){
            users = getCache("agents");
        }else{
            var lowUsers = session.user.moduleUsers.qc||[];
            var agents = getCache("agents");
            for(var i=0 ;i<agents.length;i++){
                for(var j=0;j<lowUsers.length;j++){
                    if(lowUsers[j] == agents[i]._id){
                        users.push(agents[i]);
                    }
                }
            }
        }
        utils.loadSearchInput({ id: "quality_record_disposal_agent_user",
            width: "179",
            height: "14",
            tip: "按姓名,拼音,工号搜索",
            data:users,
            searchField: ["displayName", "exten", "pinyin"],
            pinyinField: ["displayName"],
            listField: ["displayName", "exten"],
            userIdField: "_id",
            showField: "displayName",
            showAllList: true,
            callbackFuc: function (object) {
                $("#quality_record_disposal_agent_input").val(object._id);
            },
            onKeyChanged: function () {
                if ($("#quality_record_disposal_agent_user_input").val() != "") {
                    $("#quality_record_disposal_agent_input").val("serachInputNoresult");
                } else {
                    $("#quality_record_disposal_agent_input").val("");
                }
            }
        });
       $('#qualityCheckTaskTemplates').change(function () {
           var taskTemplateId = $("#qualityCheckTaskTemplates").find('input[type="radio"]:checked').val();
           if (taskTemplateId) {
               handler.qualityCheck.getTaskTemplate(taskTemplateId);
           }
           $('#callSheetQualityCheckQueryBtn').click();
       });
        $('#qualityCheckRandomTemplates').change(function () {
            var taskTemplateId = $("#qualityCheckRandomTemplates").find('input[type="radio"]:checked').val();
            if (taskTemplateId) {
                handler.qualityCheck.getQualityTemplate(taskTemplateId);
            }
        });
    });
</script>
