<div id="qualityCheckCyclePanel">
    <label>周期名称&nbsp;&nbsp;<input type="text" id="cycleName" maxlength="10"></label><br/>
    <div>
        <label>
            起始日期
        </label>
        <div class="input-append date form_datetime">
            <input type="text" id="cycleStartDate" readonly>
            <span class="add-on datetimepicker-remove" style="height: 14px;line-height: 15px"><i class="icon-remove"></i></span>
            <span class="add-on datetimepicker-open" style="height: 14px;line-height: 15px"><i class="icon-th"></i></span>
        </div>
        <!--<div class="input-append date random_hide" style="display: none">-->
            <!--<input id="quality_check_datetime_picker_start_show" size="16" type="text" value="" readonly="">-->
        <!--</div>-->
        <label class="endDate">
            结束日期
        </label>
        <div class="input-append date form_datetime">
            <input type="text" id="cycleEndDate" readonly>
            <span class="add-on datetimepicker-remove" style="height: 14px;line-height: 15px"><i class="icon-remove"></i></span>
            <span class="add-on datetimepicker-open" style="height: 14px;line-height: 15px"><i class="icon-th"></i></span>
        </div>
        <!--<div class="input-append date random_hide" style="display: none">-->
            <!--<input id="quality_check_datetime_picker_end_show" size="16" type="text" value="" readonly="">-->
        <!--</div>-->
    </div>
    <label>周期间隔</label>
    <label><input type="radio" name="intervalType" value="day" class="qualityCheckRadio">一天</label>
    <label><input type="radio" name="intervalType" value="week"  class="qualityCheckRadio">一周</label>
    <label><input type="radio" name="intervalType" value="month" class="qualityCheckRadio">一个月</label>
    <label><input type="radio" name="intervalType" value="manual" class="qualityCheckRadio">自定义<input type="text" id="manualCycle" style="width: 50px;">&nbsp;&nbsp;天</label><br/>
    <!--<button id="qualityCheckCycleSubmitBtn" type="button" style="margin:0 0 20px 130px" class="pull-left btn-add ds_do_action" ds_action="qualityCheck.save_quality_check_cycle" ds_data="newCycle"> 添加</button>-->
    <a href="#" id="qualityCheckCycleSubmitBtn" class="button ds_do_action" ds_action="qualityCheck.save_quality_check_cycle" ds_data="newCycle" style="display:block;margin:0 0 20px 0">添加</a>
    <!--<div class="parting"></div>-->
    <hr style="clear:both;">
    <table class="table table-striped table-bordered table-hover">
        <thead>
        <tr id="quality_check_cycle_list_table_header">
            <td>周期名称</td>
            <td>起始日期</td>
            <td>结束日期</td>
            <td>周期间隔</td>
            <td style="table-layout: fixed;min-width: 4em">操作</td>
        </tr>
        </thead>
        <tbody id="quality_check_cycle_list_query_table_data"></tbody>
    </table>
    <div class="row-fluid class_list">
        <div class="pagination pagination-small" for="qualityCheckCycleListQueryFrm" style="display:table; margin:0;width:100%;" ds_pagination_action="qualityCheck.quality_check_cycle">
            <span class="result_info">查询结果：<span class="result_count">0</span></span>
            <ul style="float:right;">
                <li class="disabled"><a href="#" value="0" app="disabled">«</a></li>
                <li class="disabled"><a href="#" value="1" app="disabled">1</a></li>
                <li class="disabled"><a href="#" value="2" app="disabled">2</a></li>
                <li class="disabled"><a href="#" value="3" app="disabled">3</a></li>
                <li class="disabled"><a href="#" value="4" app="disabled">4</a></li>
                <li class="disabled"><a href="#" value="5" app="disabled">5</a></li>
                <li class="disabled"><a href="#" value="6" app="disabled">»</a></li>
            </ul>
        </div>
    </div>
    <div id="show_cycle_detail_Modal" class="modal hide fade in" aria-hidden="false" style="left: 364px; margin: 0px auto;">
        <div class="modal-header">
            <button type="button" class="close" data-dismiss="modal" aria-hidden="true">×</button>
            <h3>质检周期详情</h3>
        </div>
        <div class="modal-body">
            <div class="active-history-content timeline-area">
                <table class="table table-striped table-bordered table-hover">
                    <thead>
                        <tr>
                            <td>区间名称</td>
                            <td>区间起始时间</td>
                            <td>区间结束时间</td>
                        </tr>
                    </thead>
                    <!--只显示当前日期所在周期的前后五条区间信息包括当前周期最多显示limit*2条-->
                    <tbody id="cycleDetailTable">
                    </tbody>
                </table>
            </div>
        </div>
        <div class="modal-footer">
            <a href="#" class="btn" onclick="$('#show_cycle_detail_Modal').modal('hide');">关闭</a>
        </div>
    </div>
</div>
<!--日期控件-->
<script type="text/javascript">
    $('#cycleStartDate').datetimepicker({
        dateFormat: "yy-mm-dd",
        showTimepicker: false
    });
    $('#cycleEndDate').datetimepicker({
        dateFormat: "yy-mm-dd",
        showTimepicker: false
    });
</script>
