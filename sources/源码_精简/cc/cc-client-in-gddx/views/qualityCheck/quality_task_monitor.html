<script>
    $(function(){
        var allAgents = getCache("agents");
        utils.loadSearchInput({ id:"quality_check_agent_report_search_qa",
            width:"193",
            height:"14",
            tip:"按姓名,拼音,工号搜索",
            data: allAgents,
            searchField: ["displayName", "exten", "pinyin"],
            pinyinField: ["displayName"],
            listField: ["displayName", "exten"],
            userIdField: "_id",
            showField: "displayName",
            showAllList: true,
            callbackFuc: function(object) {
                $("#qa_selected_agent").val(object._id);
            },
            onKeyChanged: function () {
                if ($("#quality_check_agent_report_search_qa_input").val() != "") {
                    $("#qa_selected_agent").val("serachInputNoresult");
                } else {
                    $("#qa_selected_agent").val("");
                }
            }
        });
    });
</script>
