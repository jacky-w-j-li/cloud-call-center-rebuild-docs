<div class="action_form">
    <div class="action_bar">
        <h2>处理工单【_@business.getBusinessStepActionName('__stepId','__actionId')@_】</h2>
    </div>
    <div class="process_action">
        <form>
            <input type='hidden' name='_id' value='__id'>
            <input type='hidden' name='actionId' value='__actionId'>

            <div class="row-fluid" id="_menu_task_list_process_fields_pane" style="margin-top: 10px;">

            </div>

            <div class="row-fluid">
                <div style="float: right">
                    <button class="btn btn-primary btn-small ds_form_action execute_button" ds_action="business.excuteBusinessStepAction">
                        执行
                    </button>
                </div>
                <div style="float: right;margin-right: 20px;" id="_menu_business_next_step_user">
                    <div class='field-label'>
                        <label class='control-label'
                               style='margin-top: 3px;text-align: right;'>处理人</label>
                    </div>
                    <div class='field-option'>
                        <div class='field-option-inner ds_search_item'>
                            <select class="input-small" name="master" id="_menu_task_list_process_next_user"
                                    style="display: none;">
                            </select>

                            <div id="_menu_task_list_process_next_user_type" class="combobox_agent"></div>
                        </div>
                    </div>
                    <!--<span>处理人：</span>-->


                </div>
            </div>
        </form>
    </div>
</div>

<script type="text/javascript">

    $(function () {
        var pane = $("#_menu_task_list_process_fields_pane");
        var business = session.business.currentBusiness['_menu'];
        handler.business.createFlowStepActionCustomFields(pane, '__actionId', business);
        handler.business.addBusienssSelectCascade();

        var actionId = "__actionId";
        var stepId = "__stepId";
        var action = handler.business.getFlowAction(stepId, actionId);

        var nextStepId = action.jumpTo;



        var nextStep = getCache("businessFlowStep", nextStepId);
        if (nextStep.type == "sys") {
            $("#_menu_business_next_step_user").hide();
            $("#_menu_task_list_process_next_user").val("sys");
        } else {
            var roles = handler.business.getStepRoles(nextStepId);
            var agents = handler.business.getRoleAgents(roles);
            //所有角色
            pane = $("#_menu_task_list_process_next_user");
            var tmp = "<option value='_id'>_name</option>";
            if(roles[0]=='busCreateUser'){
                var createUser = business.createUser;
                var age = getCache('agents',createUser);
                agents= [];
                agents.push(age);
            }else{
                if(agents.length !== 1){
                    pane.append(tmp.replace(/_id/g, "").replace(/_name/g, "自动分配"));
                }
            }
            for (var i = 0; i < agents.length; i++) {
                var usersItem = agents[i];
                pane.append(tmp.replace(/_id/g, usersItem._id).replace(/_name/g, usersItem.displayName));
            }
            if(roles[0]!='busCreateUser'){
                if(agents.length !== 1){
                    agents.push({_id:"_id",displayName:"自动分配",pinyin:"zidongfenpei"});
                }
            }
            for (var i = 0; i < agents.length; i++) { //临时解决方案,底下的循环中移除,会造成选择处理人之后无效
                if(agents[i].status && agents[i].status == "disable"){
                    agents.splice(i, 1);
                }
            }
            session.dicMap["business_agents"] = agents;
            utils.loadSearchInput({ id: "_menu_task_list_process_next_user_type",
                width: "120",
                height: "15",
                tip: "按姓名,拼音搜索",
                data: agents,
                showState: true,
                cacheData: "business_agents",
                searchField: ["displayName"],
                pinyinField: ["displayName"],
                listField: ["displayName"],
                userIdField: "_id",
                showField: "displayName",
                showAllList: true,
                callbackFuc: function (object) {
                    pane.val(object._id);
                },
                onKeyChanged: function () {
                    pane.val("");
                }
            });
            if(agents.length == 1){
                utils.setSearchInput("_menu_task_list_process_next_user_type", agents[0].displayName);
            } else {
                utils.setSearchInput("_menu_task_list_process_next_user_type", "自动分配");
            }
        }

        //event  ==========
        dsevent.bind("#_menu_task_list_process_fields_pane", "taskExcuteAction", function (event, data) {
            if (data._id == '__id') {
                $("#_menu_task_list_process_fields_pane").closest(".business_process").empty();
            }
        });



    });

</script>
