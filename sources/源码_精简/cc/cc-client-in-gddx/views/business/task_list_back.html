<div class="action_form" id="_menu__id">
    <div class="action_bar">
        <h2>退回业务</h2>
    </div>
    <div class="process_action">
        <form>
            <input type='hidden' name='_id' value='__id'>

            <div class="row-fluid"  style="margin-top: 10px;">
                <div class='row_item'>
                    <label>退回原因</label>
                    <textarea name="backInfo" style="width: 78%;" required></textarea>
                </div>
            </div>

            <div class="row-fluid">
                <div style="float: right">
                    <button class="btn btn-primary btn-small ds_form_action" ds_action="business.excuteBusinessBackAction">确认退回</button>
                </div>
            </div>
        </form>
    </div>
</div>

<script type="text/javascript">
   $(function(){
       //event  ==========
       dsevent.bind("#_menu__id","taskExcuteAction",function(event,data){
           if(data._id == '__id'){
               $("#_menu__id").closest(".business_process").empty();
           }
       });
   });
</script>
