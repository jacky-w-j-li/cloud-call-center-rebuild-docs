<div class="row-fluid">
    <form>
        <input class="reSaveId" type='hidden' name='_id' value='__id'>
        <input class="reSaveCustomer" type='hidden' name='customer' value='__customer'>
    <div class="action_form">
        <div class="action_bar">
            <!--<div class="row_item">-->
                <!--<label style="margin-top: 5px;width: 80px;">业务类型</label>-->
                <!--<select id="_menu_add_task_taskType" name="flow" style="margin-top: 5px;">-->
                <!--</select>-->
            <!--</div>-->

            <div style="float: right;margin: 0 0 0 -200px;width: 100%;">
                <div style="margin: 0 0 0  200px;">
                    <!--<span id="_menu_add_task_info" class="task_info"></span>-->
                    <!--接听座席:【<span title="_@business.getUserNameById('__callAgent')@_">_@business.getUserNameById('__callAgent',5)@_</span>】-->

                        <div class="allTask" style="float:right;display:none">
                                <span class="time_img"><img width="20px" height="20px" src="../img/taskTimeAllF.png" title="工单总时长"></span>
                                <span class="time" style="color:#ea8010" countdowntime="noTime"></span>
                        </div>

                    <div id="_menu_task_call_info">
                        <span style="display: block; overflow: hidden;text-overflow: ellipsis;white-space: nowrap;">来电时间:【__callTime】  来电号码:【__callNum】  <a class="ds_do_action" ds_action="business.listenRecord" ds_data="__recordUrl">听取录音</a></span>
                    </div>
                </div>
            </div>
            <div style="float: left;width: 200px;">
                <label  class="pane_title_label">工单类型</label>
                <select id="_menu_add_task_taskType" name="flow" style="margin-top: 5px;width: 120px;"></select>

            </div>

        </div>
        <div class="last_action">
            <div class='row-fluid' id="_menu_add_task_business_fields">

            </div>
            <div class='row-fluid' id="_menu_excute_business_operate">
                <div class='span6'>
                    <div class='row-fluid'>
                        <div class='field-label'>
                            <label class="control-label" style='margin-top: 3px;text-align: right;'>下一步处理</label>
                        </div>
                        <div class='field-option'>
                            <div class='field-option-inner ds_search_item'>
                                <select id="_menu_add_task_next_step_action" name='nextAction' style="width: 100%;"></select>
                            </div>
                        </div>
                    </div>
                </div>
                <div class='span6'>
                    <div class='row-fluid'>
                        <div class='field-label'>
                            <label class="control-label" style='margin-top: 3px;text-align: right;'>处理人</label>
                        </div>
                        <div class='field-option'>
                            <div class='field-option-inner ds_search_item'>
                                <select id="_menu_add_task_next_step_user" name="nextUser" style="width: 100%;display:none;"></select>
                                <div id="_menu_add_task_next_step_user_type" class="combobox_agent"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class='row-fluid'>
                <div class="span8">
                    <div style="margin-top: 10px;">
                        <span>_@business.getUserNameById('__lastUpdateUser')@_ 处理于 __lastUpdateTime</span>
                    </div>
                </div>
                <div class="span4">
                    <div style="float: right;margin-right: 10px;">
                        <a class="btn btn-primary btn-small ds_form_action" ds_action="business.reSaveBusiness" menu='_menu' id="_menu_excute_business_button" href="#">
                            提交
                        </a>

                    </div>
                    <div style="float: right;margin-right: 10px; display: none;">
                        <a class="btn btn-info btn-small ds_form_action" ds_action="business.doSaveTempBusiness" menu='_menu' id="_menu_temp_save_business_button" href="#">
                            暂存
                        </a>

                    </div>
                </div>
            </div>
        </div>
    </div>
    </form>
</div>

<script type="text/javascript">
    $(function(){
        $("#_menu_task_call_info").hide();
        if("__linkCall" == "true"){
            $("#_menu_task_call_info").show();
        }

        var flows = getCache("businessFlow");
        var temp = '<option value="_id">_name</option>';
        var html = "";
        var business = session.business.currentBusiness['_menu'];
        for (var i = 0; i < flows.length; i++) {
            var flowsItem = flows[i];
            if(handler.business.hasAccessForFlow(flowsItem)){
                html += temp.replace(/_id/g, flows[i]._id).replace(/_name/g, flows[i].name);
            }
        }
        var pane = $('#_menu_add_task_taskType');
        pane.append(html);
        var business = session.business.currentBusiness['_menu'];
        pane.val(business.flow);

        var currentBusinessFlow = business.flow;
        var currentBusinessId = $(".reSaveId").val();
        var currentBusinessCustomer = $(".reSaveCustomer").val();

        var saveFlag = "__saveFlag";
        if(saveFlag == 'temp'){
            $("#_menu_temp_save_business_button").closest("div").show();
        }


        $('#_menu_add_task_taskType').bind('change', function () {
            var id = $(this).val();
            var pane = $('#_menu_add_task_business_fields');
            pane.empty();
            if (id) {
                var flow = getCache("businessFlow", id);
                var tipInfo = "<i class='icon-info-sign task_info_tip' data-toggle='popover' data-trigger='hover' data-title='工单提示' data-content=_tips></i>";
                if(!flow.tips){
                    flow.tips = "";
                }
                $("#_menu_add_task_info").html(tipInfo.replace(/_tips/g,flow.tips)+flow.tips);
                $("#_menu_add_task_info").find("i").popover({});


                handler.business.createStartFlowCustomFields(pane, id,business);
                handler.business.addBusienssSelectCascade();

                var currentFlow = getCache("businessFlow", id);
                var currentFlowStep = handler.business.getStartStep(currentFlow);
                var actions = currentFlowStep.actions;
                var html = "";
                var actionTmp = "<option value=_id>_name</option>";
                for (var i = 0; i < actions.length; i++) {
                    var actionsItem = actions[i];
                    html += actionTmp.replace(/_id/g, actionsItem._id).replace(/_name/g, actionsItem.name);
                }
                $("#_menu_add_task_next_step_action").empty();
                $("#_menu_add_task_next_step_action").append(html);
                $("#_menu_add_task_next_step_action").change();

                if(id != currentBusinessFlow){ //当前退回工单类型发生变化
                    //do
                    var reSaveCustomer = " <input class='reSaveCustomer' type='hidden' name='customer' value='"+currentBusinessCustomer+"'>";
                    $(".reSaveCustomer").remove();
                    $(".reSaveId").val("").after(reSaveCustomer);
                }else{
                    $(".reSaveCustomer").remove();
                    $(".reSaveId").val(currentBusinessId);
                }
                if(currentFlow.ctype&&currentFlow.ctime){
                    pane.closest('form').find(".allTask").find(".time_img").removeAttr("ds_hide");
                }else{
                    pane.closest('form').find(".allTask").find(".time_img").attr("ds_hide","add_task_back");
                    pane.closest('form').find(".allTask").hide();
                    pane.closest('form').find(".allTask").find(".time").text("");
                }
            }
        });

        $('#_menu_add_task_next_step_action').bind('change', function () {
            var actionId = $(this).val();
            var flowId = $("#_menu_add_task_taskType").val();
            var pane = $("#_menu_add_task_next_step_user");

            pane.empty();

            var flow = getCache("businessFlow", flowId);
            var step = handler.business.getStartStep(flow);

            var action = handler.business.getFlowAction(step._id,actionId);

            var nextStepId = action.jumpTo;
            var roles = handler.business.getStepRoles(nextStepId);
            var agents = handler.business.getRoleAgents(roles);

            if(roles[0]=='busCreateUser'){
                var createUser = business.createUser;
                var age = getCache('agents',createUser);
                agents= [];
                agents.push(age);
            }else{
                if(agents.length !== 1) {
                    pane.append("<option value=''>自动分配</option>");
                }
            }
            var tmp = "<option value= '_id'>_name</option>";
            for (var i = 0; i < agents.length; i++) {
                var usersItem = agents[i];
                pane.append(tmp.replace(/_id/g,usersItem._id).replace(/_name/g,usersItem.displayName));
            }
            if(roles[0]!='busCreateUser'){
                if(agents.length !== 1){
                    agents.push({_id:"_id",displayName:"自动分配",pinyin:"zidongfenpei"});
                }
            }

            for (var i = 0; i < agents.length; i++) {//临时解决方案,底下的循环中移除,会造成选择处理人之后无效
                if(agents[i].status && agents[i].status == "disable"){
                    agents.splice(i, 1);
                }
            }
            session.dicMap["business_backAgents"] = agents;
            utils.loadSearchInput({ id: "_menu_add_task_next_step_user_type",
                width: "120",
                height: "15",
                tip: "按姓名,拼音搜索",
                data: agents,
                showState: true,
                cacheData: "business_backAgents",
                searchField: ["displayName"],
                pinyinField: ["displayName"],
                listField: ["displayName"],
                userIdField: "_id",
                showField: "displayName",
                showAllList: true,
                callbackFuc: function (object) {
                    pane.val(object._id);
                },
                onKeyChanged: function () {
                    pane.val("");
                }
            });
            if(agents.length == 1){
                utils.setSearchInput("_menu_add_task_next_step_user_type", agents[0].displayName);
            } else {
                utils.setSearchInput("_menu_add_task_next_step_user_type", "自动分配");
            }

        });

        $('#_menu_add_task_taskType').change();

        //console.log(handler.business.hasAccessForFlow(flowsItem));
        if(business.master != session.user._id){
            $('#_menu_add_task_taskType').closest("form").find(":input").attr("disabled","");
            $('#_menu_excute_business_button').hide();
            $('#_menu_temp_save_business_button').hide();
            $('#_menu_excute_business_operate').hide();
        }



        //event  ==========
        dsevent.bind("#_menu_add_task_business_fields", "taskExcuteAction", function (event, data) {
            if (data._id == '__id') {
                var pane = $("#_menu_add_task_business_fields").closest(".business_transform").closest("div.business-info");
                handler.business.loadTaskInfo(pane, '_menu', data.customer, data._id);
            }else{
                //兼容退回切换工单类型
                var pane = $("#_menu_add_task_business_fields").closest(".business_transform").closest("div.business-info");
                handler.business.loadTaskInfo(pane, '_menu', data.customer, currentBusinessId);
            }
        });

        dsevent.bind("#_menu_add_task_business_fields", "taskExcuteTempAction", function (event, data) {
            if (data._id == '__id' ) {
                // $("#_menu_add_task_business_fields").closest(".business_transform").closest("div.business-info").empty();
                var pane = $("#_menu_add_task_business_fields").closest(".business_transform").closest("div.business-info");
                handler.business.loadTaskInfo(pane, '_menu', data.customer, data._id);
            }
        });
    });

</script>

<style type="text/css">
    .inline-checkbox {
        float: left;
        margin-left: 5px;
    }
</style>
