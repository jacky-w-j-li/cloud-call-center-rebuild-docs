<!--cdr_peer_list.html-->
<form id="cdrPeerForm" class="form-horizontal" style="min-height: 300px;" >
    <div class="row-fluid">
        <br>
        <h5><i class="icon-user"></i>座席状态日志查询</h5>
        <br>

        <div>
            <div>
                <div>
                    <label for="cdr_peer_agent_name_input" style="padding-left: 3px;padding-right: 4px;display: inline;float: left;margin-top: 4px;">&nbsp;座&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;席&nbsp;</label>
                    <input type="hidden" name="AGENT" id="cdr_peer_agent_name_input"/>

                    <div id="cdr_peer_agent_name_div" style="display: inline" class="combobox_agent"></div>


                    <!--<table>
                        <tr>
                     <td id="agent_report_select_agents"></td>
                     <td id="agent_report_search_div" class="combobox_agent"></td>
                     <td id="agent_report_checkbox_td"  style="padding-left: 12px">-->
                    <input type="hidden" id="queryArry"/>
                         <input type="checkbox" id="agent_report_checkbox" name="includeSubordinate" style="margin-top: 6px;margin-bottom: 5px;margin-left:3px">
                         显示已选座席下级
                     <!--</td>
                        </tr>

                    </table>-->


                </div>
                <div class="clear10"></div>
                <div>
                    <label style="display: inline;padding-left: 3px">起止时间</label>
                    <div class="input-append date form_datetime">
                        <input size="16" name="BEGIN_TIME" id="cdrPeerBeginTime" type="text" value="" readonly style="z-index:9;">
                        <span class="add-on datetimepicker-remove" style="height: 14px;line-height: 15px"><i class="icon-remove"></i></span>
                        <span class="add-on datetimepicker-open" style="height: 14px;line-height: 15px"><i class="icon-th"></i></span>
                    </div>
                    至
                    <div class="input-append date form_datetime">
                        <input size="16" name="END_TIME" id="cdrPeerEndTime" type="text" value="" readonly style="z-index: 9">
                        <span class="add-on datetimepicker-remove" style="height: 14px;line-height: 15px"><i class="icon-remove"></i></span>
                        <span class="add-on datetimepicker-open" style="height: 14px;line-height: 15px"><i class="icon-th"></i></span>
                    </div>
                </div>
                <div class="clear10"></div>
                <div>

                    <input type="hidden" name="reportType" value="call_report_agent">
                    <input type="hidden" name="selectedAgent" id="selectedAgentList">

                    <a href="#" id="queryCdrPeerAhref" ds_action="cdr.queryCdrPeer" class="button ds_form_action">查询</a>

                    <a href="#" ds_action="cdr.resetCdrPeerQueryCondition" class="button ds_form_action">重置</a>
                    <a href="#" ds_action="cdr.exportCdrPeer" class="button ds_form_action">导出EXCEL</a>
                    <a href="#" ds_action="cdr.exportCdrPeerDetail" class="button ds_form_action exportCdrMonitorPopover" id="exportCdrMonitorPopoverHtml">
                        <div style="text-align: center;float: right;" class="exportCdrMonitorPopoverHtml" data-toggle="popover" data-placement="bottom" data-html="true" data-content="导出详情EXCEL中将包含座席登录期间的状态变化。一次导出最多能导出某一天的详细状态日志，请确保选择的起止时间在同一天内！" data-original-title="温馨提示">
                            导出详细EXCEL
                        </div>

                    </a>
                    <div style="height:45px;line-height:45px;overflow:hidden; ">
                        <input type="checkbox" id="time_report_checkbox" name="StartingAndEndingTime">
                        仅显示最初登录时间和最后退出时间
                    </div>

                    <!--<a ds_action="report.callReport.exportRelayTimeExcels" class="button ds_form_action">导出EXCEL</a>-->

                   <!-- <a class="button ds_form_action" ds_action="report.callReport.exportRelayTimeExcel">导出Excel</a>-->

                </div>

            </div>
        </div>
    </div>
    <div class="clear5">&nbsp;</div>
    <div class='row-fluid account_line'></div>
    <br/>
    <div>
        <div>
            <div>
                <div id="cdrPeerListTable">

                </div>
                <div class="row-fluid class_list">
                    <div class="pagination pagination-small" for="cdrPeerForm" ds_pagination_action="cdr.paginationCdrPeer"
                        style="display:table; margin:0;width:100%;">
                        <span style="margin-top:10px;font-size:12px;">查询结果：<span class="cdr_peer_result_count">0</span></span>
                        <ul id="cdr_peer_index" style="float:right;">
                            <li><a href="#"  value="0">&laquo;</a></li>
                            <li><a href="#"  value="1">1</a></li>
                            <li><a href="#"  value="2">2</a></li>
                            <li><a href="#"  value="3">3</a></li>
                            <li><a href="#"  value="4">4</a></li>
                            <li><a href="#"  value="5">5</a></li>
                            <li><a href="#"  value="6">&raquo;</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

</form>
<script type="text/javascript">
        $(function(){
            $('#cdrPeerBeginTime').datetimepicker({
                controlType: utils.jqueryUITimepickerControl,
                timeFormat: "HH:mm:ss",
                dateFormat: "yy-mm-dd",
                showSecond: true
            });
            $('#cdrPeerEndTime').datetimepicker({
                controlType: utils.jqueryUITimepickerControl,
                timeFormat: "HH:mm:ss",
                dateFormat: "yy-mm-dd",
                showSecond: true
            });

        });
        utils.loadSearchInput({ id: "cdr_peer_agent_name_div",
            width: "220",
            height: "14",
            tip: "按姓名,拼音,工号搜索",
            data: getCache("agents"),
            searchField: ["displayName", "exten", "pinyin"],
            pinyinField: ["displayName"],
            listField: ["displayName", "exten"],
            userIdField: "_id",
            showField: "displayName",
            showAllList: true,
            callbackFuc: function (object) {
                $("#cdr_peer_agent_name_input").val(object._id);
                $("#selectedAgentList").val(object._id);
                //countSelectAgent();
            },
            onKeyChanged: function () {
                var str=$("#cdr_peer_agent_name_div_input").val()
                if ($("#cdr_peer_agent_name_div_input").val() != "") {
                    $("#cdr_peer_agent_name_input").val("serachInputNoresult");
                } else {
                    $("#cdr_peer_agent_name_input").val("");
                }
                $("#selectedAgentList").val(str);

            }

        });

        function countSelectAgent() {
            var currentVals = $("input[name='selectedAgent']");
            var ExtenStr = '';
            for (var i = 0; i < currentVals.length; i++) {
                ExtenStr += currentVals[i].value;
                if (i != currentVals.length - 1) {
                    ExtenStr += ',';
                }
            }
            $('#selectedAgentList').val(ExtenStr);
        }
    $('#time_report_checkbox').click(function(){
        $('#queryCdrPeerAhref').click();

        })


</script>
