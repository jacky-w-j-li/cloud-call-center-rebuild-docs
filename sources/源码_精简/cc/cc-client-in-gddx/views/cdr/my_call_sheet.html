<div class="right_container" id="my_call_sheet_query_main_panel">
    <div style="height:98%;margin:3px 3px;" id="my_call_sheet_query">
        <div class="row-fluid">
            <br/>
            <h5><i class="icon-search"></i>我的通话记录查询</h5>
            <br/>

            <form id="my_call_sheet_query_form" class="form-inline my_call_sheet_query_form">
                <input type="hidden" name="DISPOSAL_AGENT" id="my_call_sheet_agent"/>
                <div>
                    <label for="my_call_sheet_datetime_picker_start">
                        呼叫时间
                    </label>
                    <input type="text" name="BEGIN_DATE" class="input-small ds_date"
                           data-date-format="yyyy-mm-dd" id="my_call_sheet_datetime_picker_start"
                           placeholder="开始日期"/>
                    <input type="text" name="BEGIN_TIME" class="input-small ds_time" placeholder="开始时间"/>
                    至
                    <input type="text" name="END_DATE" class="input-small ds_date" placeholder="结束日期"
                           data-date-format="yyyy-mm-dd" id="my_call_sheet_datetime_picker_end"/>
                    <input type="text" name="END_TIME" class="input-small ds_time" placeholder="结束时间"/>
                </div>
                <div class="clear10"></div>
                <div>
                    <label>
                        主叫
                    </label>
                    <input type="text" name="CALL_NO" class="input-small" style="margin-right: 5px;"/>
                    <label >
                        被叫
                    </label>
                    <input type="text" name="CALLED_NO" class="input-small" style="margin-right: 5px;"/>
                    <label>
                        呼叫类型
                    </label>
                    <select name="CONNECT_TYPE" style="margin-right: 5px;" class="call_type_selector">
                    </select>
                    <label>
                        处理状态
                    </label>
                    <span id="status_span">
                        <select name="STATUS" class="call_status_selector">

                        </select>
                    </span>
                </div>
                <div class="clear10"></div>
                <div>
                    <label style="margin-left: 12px">
                        技能组
                    </label>
                    <select name="ERROR_MEMO" class="queue_selector">
                    </select>
                    <label style="margin-left:11px;">
                        满意度
                    </label>
                    <select name="INVESTIGATE" style="margin-right: 5px;" class="investigate_selector">
                    </select>
                    <label style="margin-left:20px;">
                        标记
                    </label>
                    <select name="KEY_TAG" style="margin-right: 5px;" class="key_tag_selector">
                        <option value>--全部--</option>
                        <option value="true">是</option>
                        <option value="false">否</option>
                    </select>
                </div>
                <div class="clear10"></div>
                <div>
                    <label for="CALL_TIME_LENGTH">通话时长</label>
                    <div class="input-append"><input type="text" style="width: 55px" name="CALL_TIME_LENGTH_BEGIN" dataType="Number" msg="时长条件只能为正整数" class="input-small"><span class="add-on" style="height: 14px;line-height: 15px">秒</span></div> 至
                    <div class="input-append"><input type="text" style="width: 55px" name="CALL_TIME_LENGTH_END"  dataType="Number" msg="时长条件只能为正整数" class="input-small"><span class="add-on" style="height: 14px;line-height: 15px">秒</span></div>
                    <label style="margin-left: 2px">定位客户</label>
                    <select name="CUSTOMER_NAME" style="margin-right: 5px;" class="cdr_customer_name_selector">
                        <option value>--全部--</option>
                        <option value="true">已定位</option>
                        <option value="未知客户">未知客户</option>
                        <option value="多个匹配客户">多个匹配客户</option>
                    </select>
                </div>
                <div class="clear10"></div>
                <div>
                    <a href="#" class="button ds_form_action" ds_action="cdr.searchMyCallSheet"
                       style="margin:2px 5px;" id="my_call_sheet_query_link">查询</a>
                    <a href="#" class="button ds_do_action" ds_action="resetForm" ds_data="resetSpan" style="margin:2px 5px;" >重置</a>
                </div>

                <div class="clear5">&nbsp;</div>
                <br>

                <div class='row-fluid account_line'></div>
                <br/>

                <div>
                    <table class="table table-striped table-bordered table-hover">
                        <thead>
                        <tr>
                            <th>定位客户</th>
                            <th>主叫号码</th>
                            <th>被叫号码</th>
                            <th>呼叫类型</th>
                            <th>处理状态</th>
                            <th>处理座席</th>
                            <th>呼入技能组</th>
                            <th>满意度</th>
                            <th>省份</th>
                            <th>城市</th>
                            <th>标记</th>
                            <th>呼叫时间</th>
                            <th>通话时长</th>
                            <th>操作</th>
                        </tr>
                        </thead>
                        <tbody class="call_sheet_table_data">
                        </tbody>
                    </table>
                    <div class="row-fluid class_list">
                        <div for="my_call_sheet_query_form" ds_pagination_action="cdr.searchMyCallSheet"
                             class="pagination pagination-small" style="display:table; margin:0;width:100%;">
                            <span class="result_info">查询结果：<span class="result_count">0</span></span>
                            <ul style="float:right;margin-top:5px;">
                                <li><a href="#"  value="0">&laquo;</a></li>
                                <li><a href="#"  value="1">1</a></li>
                                <li><a href="#"  value="2">2</a></li>
                                <li><a href="#"  value="3">3</a></li>
                                <li><a href="#"  value="4">4</a></li>
                                <li><a href="#"  value="5">5</a></li>
                                <li><a href="#"  value="6">&raquo;</a></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
<style>
    #my_call_sheet_query_main_panel label {
        font-size:11px;
    }
</style>
<script type="text/javascript">
</script>
