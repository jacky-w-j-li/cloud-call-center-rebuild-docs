<div class="right_container" id="call_sheet_export_monitor_task_query_panel">
    <div style="height:98%;margin:3px 3px;" id="my_call_sheet_query">
        <div class="row-fluid">
            <br/>
            <h5><i class="icon-search"></i>批量下载通话录音任务查询</h5>
            <br/>

            <form id="call_sheet_query_export_monitor_task_form" class="form-inline call_sheet_query_export_monitor_task_form">
                <input type="hidden" name="DISPOSAL_AGENT" id="my_call_sheet_agent"/>
                <div>
                    <label style="display: inline;padding-left: 3px">起止时间</label>
                    <div class="input-append date form_datetime">
                        <input size="16" name="BEGIN_TIME" id="export_monitorBeginTime" type="text" value="" readonly style="z-index:9;">
                        <span class="add-on datetimepicker-remove" style="height: 14px;line-height: 15px"><i class="icon-remove"></i></span>
                        <span class="add-on datetimepicker-open" style="height: 14px;line-height: 15px"><i class="icon-th"></i></span>
                    </div>
                    至
                    <div class="input-append date form_datetime">
                        <input size="16" name="END_TIME" id="export_monitorEndTime" type="text" value="" readonly style="z-index:9;">
                        <span class="add-on datetimepicker-remove" style="height: 14px;line-height: 15px"><i class="icon-remove"></i></span>
                        <span class="add-on datetimepicker-open" style="height: 14px;line-height: 15px"><i class="icon-th"></i></span>
                    </div>
                </div>

                <div class="clear10"></div>
                <div>
                    <a href="#" class="button ds_form_action" ds_action="cdr.searchExportMonitorTask"
                       style="margin:2px 5px;" id="call_sheet_export_monitor_query_link">查询</a>
                    <a href="#" class="button ds_do_action" ds_action="resetForm" ds_data="resetSpan" style="margin:2px 5px;" >重置</a>
                </div>

                <div class="clear5">&nbsp;</div>
                <br>

                <div class='row-fluid account_line'></div>
                <br/>

                <div>
                    <table class="table table-striped table-bordered table-hover">
                        <thead>
                        <tr>
                            <th width="15%">创建时间</th>
                            <th width="10%">状态</th>
                            <th width="15%">预计可获得录音数量</th>
                            <th width="50%">下载地址</th>
                            <th width="10%">操作</th>
                        </tr>
                        </thead>
                        <tbody class="call_sheet_export_monitor_task_table_data">
                        </tbody>
                    </table>
                    <div class="row-fluid class_list">
                        <div for="call_sheet_query_export_monitor_task_form" ds_pagination_action="cdr.searchExportMonitorTask"
                             class="pagination pagination-small" style="display:table; margin:0;width:100%;">
                            <span class="result_info">查询结果：<span class="result_count">0</span></span>
                            <ul style="float:right;margin-top:5px;">
                                <li><a href="#"  value="0">&laquo;</a></li>
                                <li><a href="#"  value="1">1</a></li>
                                <li><a href="#"  value="2">2</a></li>
                                <li><a href="#"  value="3">3</a></li>
                                <li><a href="#"  value="4">4</a></li>
                                <li><a href="#"  value="5">5</a></li>
                                <li><a href="#"  value="6">&raquo;</a></li>
                            </ul>
                        </div>
                    </div>
                </div>
                <br>
                <div class="alert alert-success">
                    <strong>温馨提示:</strong> 当日提交的批量下载任务，会在次日凌晨3时生成压缩包。生成的下载地址30天内有效。
                </div>
            </form>
        </div>
    </div>
</div>
<style>
    #my_call_sheet_query_main_panel label {
        font-size:11px;
    }
</style>
<script type="text/javascript">
    $(function(){
        $('#export_monitorBeginTime').datetimepicker({
            controlType: utils.jqueryUITimepickerControl,
            timeFormat: "HH:mm:ss",
            dateFormat: "yy-mm-dd",
            showSecond: true
        });
        $('#export_monitorEndTime').datetimepicker({
            controlType: utils.jqueryUITimepickerControl,
            timeFormat: "HH:mm:ss",
            dateFormat: "yy-mm-dd",
            showSecond: true
        });
    });
</script>
