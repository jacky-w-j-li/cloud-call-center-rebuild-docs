        if(session.user.scope.call != 'all'){

            $("#showAssignAllCallBackAgent_btn").hide();
            //$("#callback_agent_td").hide();
            //$("#callback_checkbox_td").hide();
        }
    })

    function selectAllNotDealCdr(sel){
        var userArr = document.getElementsByName("notDealCheckbox");
        if(sel.checked==true){
            for(var i=0,len=userArr.length;i<len;i++){
                userArr[i].checked = true;
            }
        }else{
            for(var i=0,len=userArr.length;i<len;i++){
                userArr[i].checked = false;
            }
        }
    }
    function selectOneNotDealCdr(){
        var  userArr= document.getElementsByName("notDealCheckbox");
         var i=0,count=0;
             for (; i < userArr.length; i++) {
                   if(userArr[i].checked==true){
                        count++;
                   }
             }
             if(count==userArr.length){
                $("#checkedAllNotDealCdr").attr("checked",true);
             }else{
                $("#checkedAllNotDealCdr").removeAttr("checked");
             }
        }
</script>
