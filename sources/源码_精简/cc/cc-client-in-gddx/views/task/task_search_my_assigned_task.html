<div class="row-fluid">
    <div class="span6 search_item ds_master">
        <label>处理人</label>
        <input name="master" type="text" class="ds_search_item select_input" style="display: none;" id="_#menu#__master_select_input" />
        <div id="_#menu#__master_select_user" style="float:left;" class="combobox_agent"></div>
    </div>
</div>
<div class="row-fluid">
    <div class="span6 search_item ds_tag">
        <label for="search_tag__#menu#_">类型</label>
        <select id="search_tag__#menu#_" name="tags" class="ds_search_item">
        </select>
    </div>
    <div class="span6 search_item ds_status">
        <label for="search_status__#menu#_">状态</label>
        <select id="search_status__#menu#_" name="isComplete" class="ds_search_item">
            <option value="">--全部--</option>
            <option value="true">完成</option>
            <option value="false">处理中</option>
        </select>
    </div>
</div>
<div class="row-fluid">
    <div class="span12 search_item">
        <label >时间</label>
        <input name="lastUpdateTime_begin_date" class="ds_search_item ds_date _#menu#_" type="text" placeholder="yyyy-mm-dd">
        <input name="lastUpdateTime_begin_time" class="ds_search_item ds_time" type="text" placeholder="00:00" pattern="([01]?[0-9]|2[0-3]):[0-5][0-9]">
        <label style="width: 16px">至</label>
        <input name="lastUpdateTime_end_date" class="ds_search_item ds_date _#menu#_" type="text" placeholder="yyyy-mm-dd">
        <input name="lastUpdateTime_end_time" class="ds_search_item ds_time" type="text" placeholder="00:00" pattern="([01]?[0-9]|2[0-3]):[0-5][0-9]">
    </div>
</div>
<script type="text/javascript">
    utils.loadSearchInput({ id: "_#menu#__master_select_user",
        width: "110",
        height: "18",
        tip: "按姓名,拼音搜索",
        data: getCache("agents"),
        searchField: ["displayName"],
        pinyinField: ["displayName"],
        listField: ["displayName"],
        userIdField: "_id",
        showField: "displayName",
        showAllList: true,
        callbackFuc: function (object) {
            $("#_#menu#__master_select_input").val(object._id);
        },
        onKeyChanged: function () {
            if ($("#_#menu#__master_select_user_input").val() != "") {
                $("#_#menu#__master_select_input").val("serachInputNoresult");
            } else {
                $("#_#menu#__master_select_input").val("");
            }
        }
    });
    var tags = getCache('tags');
    var tagMenu = '<option value="">--全部--</option>';
    for(var i in tags){
        tagMenu += '<option value="'+i+'">'+tags[i]+'</option>';
    }
    $('#search_tag__#menu#_').html(tagMenu);
    $('.ds_date._#menu#_').datepicker({
        changeMonth: true,
        changeYear: true,
        showButtonPanel: true
    });
</script>
