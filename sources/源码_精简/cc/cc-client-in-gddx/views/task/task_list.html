<div class="left_column ds_search_pane" id="contact_list__#menu#_" ds_menu="_#menu#_" ds_index="1">
    <div class="contacts_caption">
        <div class="caption-top clearfix">
            <span class="refresh ds_do_action" ds_action="task.searchTask" ds_data="_#menu#_"><a
                    href="javascript:void(0);" class="ajaxed">刷新</a></span>
            <div class="input-append" style="margin-left: 20px;">
                <input class="span2 ds_search_item" name="title" style="width: 100%" type="text" placeholder="输入标题查询">
                <button class="btn ds_do_action" type="button" ds_action="task.searchTask" ds_data="_#menu#_" title="查询">
                    <i class="icon-search"></i>
                </button>
                <button type="button" class="btn" data-toggle="collapse"
                        data-target="#search__#menu#_" style="height: 24px;" title="高级查询">
                    <span class="caret"></span>
                </button>
            </div>
        </div>
    </div>
    <div class="list_container compact-view">
        <div class="contact_list ">
            <div class="search collapse" id="search__#menu#_" style="height: 0px;">

            </div>
            <div class="ds_search_filter">

            </div>
            <div class="list-inside">

            </div>
            <div>
                <div style="margin-right: 8px;">
                    <a class="btn ds_do_action ds_more" ds_action="task.moreTask" ds_data="_#menu#_" href="#">更多...</a>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="right_column" >
    <div class="contact_detail">
        <div  class="content">
            <div class="contact_operating_area custlist " id="_#menu#__business">

            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $(function () {
        dsevent.bind('#contact_list__#menu#_', 'customerAdd customerNew customerUpdate '
                + dsevent.evt.taskComplete + " " + dsevent.evt.taskCompleteCancel, function (event, params) {
            var menu = '_#menu#_';
        });
        var url = '';
        var searchPane = $('#contact_list__#menu#_');
        if('_#menu#_' == 'my_uncomplete_task') {
            url = 'task/task_search_my_uncomplete_task';
            searchPane.attr('query_type', 'assignedToMe');
        } else if ('_#menu#_' == 'my_assigned_task') {
            url = 'task/task_search_my_assigned_task';
            searchPane.attr('query_type', 'createdByMe');
        } else if ('_#menu#_' == 'all_task') {
            url = 'task/task_search_all_task';
            searchPane.attr('query_type', 'all');
        }
        DS.getView(url, function(view){
            if(view){
                view = view.replace(new RegExp('_#'+'menu'+'#_', 'g'), '_#menu#_');
                $('#search__#menu#_').html(view);
            }
        });
    });
</script>
