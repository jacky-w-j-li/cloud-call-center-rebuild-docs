<!DOCTYPE html>
<html>
<head>
    <title>来自网站的试用申请邮件</title>
    <style type="text/css">
        body {
            word-wrap: break-word;
            -webkit-nbsp-mode: space;
            -webkit-line-break: after-white-space;
        }

    </style>
</head>
<body>
<div style="margin: 0;padding: 0;font-family: '宋体,Microsoft YaHei', Helvetica, Arial, sans-serif;font-size: 12px;line-height: 1;">
    <div style="background:#ededed;margin: 0; padding:20px 0 20px 0;overflow:hidden; text-align:center;">
        <div style="width:600px;margin:0 auto;padding:0 30px;background:#fff;overflow:hidden;">
            <table width="525" align="center" cellspacing="0" cellpadding="0" border="0"
                   style="background:none; margin: 0 auto">
                <tbody>
                <tr>

                    <td height="78px" align="center" valign="top">
                        <div style="width:525px;height:78px;position: relative;overflow:hidden;">
                            <table width="525" align="center" cellspacing="0" cellpadding="0" border="0"
                                   style="background:none; margin: 0 auto">
                                <tbody>
                                <tr>
                                    <td style="width:200px;">
                                        <a
                                                style="width:100%;height:auto;display:block;padding:0;margin:0;margin-top: 20px;"
                                                href="http://www.7moor.com/"><img alt="" src="http://user.7moor.com/img/logo2.png" style="border:none;width: 200px;"></a>

                                    </td>
                                    <td>
                                        <p style="width:100%;text-align:right;height:16px;line-height:16px;float:right;color:#cd3434;padding:0;margin:40px 0 0 0;font-weight:bold;font-size:12px;">
                                            来自网站的试用申请</p></td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </td>
                </tr>
                <tr>
                    <td align="center" valign="top">
                        <div style="width:525px;overflow:hidden;">
                            <div style="width:523px;margin:25px 0 0 0;padding:10px 0 20px 0;border:1px solid #e8e8e8;background:#f8f8f8;overflow:hidden;color:#cd3434;line-height:28px;text-align:left;float:left;">
                                <div style="width: 490px; font-size: 14px; margin: 0px 0px 0px 24px; padding: 0px;">
                                    尊敬的管理员：
                                </div>
                                <div style="width: 490px; font-size: 12px; margin: 0px 0px 0px 24px; padding: 0px;">
                                    收到用户的试用申请：<br>
                                    称呼：_#try_out_name#_<br>
                                    电话/手机：_#try_out_tel#_<br>
                                    公司名称：_#try_out_company#_<br>
                                    感兴趣的产品：_#try_out_products#_<br>
                                    需求描述：_#try_out_memo#_<br>
                                    申请提交时间：_#try_out_time#_<br>

                                    请您尽快联系申请者。
                                </div>
                            </div>
                        </div>
                    </td>
                </tr>
                <tr>
                    <td>
                        <div >
                            <span style="float: right;color: #808080;margin-top: 20px;">容联七陌科技有限公司</span>
                        </div>
                    </td>
                </tr>
                <tr>
                    <td>
                        <div>
                            <span style="float: right;color: #808080;margin-top: 20px;">联系邮箱：service@7moor.com</span>
                        </div>
                    </td>
                </tr>
                <tr>
                    <td>
                        <div>
                            <span style="float: right;color: #808080;margin-top: 20px;margin-bottom: 20px;">联系电话：4008-113-114</span>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>

        </div>
    </div>
</div>
</body>
</html>
