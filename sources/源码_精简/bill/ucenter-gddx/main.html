        $(function () {
            var param=[];
            try{
                var _url=window.location.href;

<div>
    <div class="loading_indicator" style="visibility: hidden;">

    <span class="loading_indicator_span" style="visibility: hidden;">正在获取数据...</span>
    <div class="login_panel" id="login-panel">
    </div>

    <div id="main-panel" class="container" style="display: none">
        <div class="user-header clearfix">
            <div class="pull-left navbar_path" id="pane_tmpl_main_head">
            </div>
            <div class="pull-left user-title" >

                    欢迎您：<strong class="uc_company"></strong>
                    <!--<span class="uc_accountname"></span>-->
                    <!--<span class="uc_email"></span>-->
                    &nbsp;&nbsp;
                    余额:<span class="uc_balance" style="color:#f0ad4e;"></span>元
                    &nbsp;
                    <span id="uc_finance_balance_id" style="display: none;">财务账户余额:<span class="uc_finance_balance" style="color:#f0ad4e;"></span></span>
                    &nbsp;
                    透支额度:<span class="uc_overdraw" style="color:#f0ad4e;"></span>元
                    &nbsp;
                    <button type="button" class="btn btn-success btn-xs ds_do_action btn_bank_pay" ds_action="account.showOnlinePay">立即充值</button>
                    <a href="#" id="popover_account_pay" style="padding: 0;" class="btn" data-toggle="popover" data-placement="auto" data-trigger="hover focus"
                    data-content="选择对应产品，可购买号码、续费、充值话费、购买坐席licence。" data-original-title="账户余额有什么用途?">
                    <span style="font-size: 18px;" class="glyphicon glyphicon-question-sign"></span>
                    </a>
                </p>
            </div>
            <ul class="nav navbar-nav navbar-right" style="margin-top: 9px;">
                <li class="">
                    <a href="#" class="ds_do_action" ds_action="loadMainView" ds_data="index/idx_main">主页</a>
                </li>
                <li class="dropdown menu_dropList">
                    <a href="#" class="dropdown-toggle" data-toggle="dropdown">个人设置 <b class="caret"></b></a>

                        <li class="divider"></li>
                        <li><a href="#" class="ds_do_action domain_aboutUs" ds_action="account.aboutUs">关于我们</a></li>
                        <li><a href="#" class="ds_do_action text-danger" ds_action="account.logout">退出</a></li>
                    </ul>
                </li>
            </ul>

        </div>
        <div class="row" id="ucenter_main">

        </div>
        <footer class="bs-footer" style="" id="pane_tmpl_main_foot">
        </footer>

    </div>
    <div class="modal fade " id="service_modal" tabindex="-1" role="dialog" >
        <div class="modal-dialog" style="width: 800px;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close " data-dismiss="modal" aria-hidden="true">&times;</button>
                    <h4 class="modal-title" >选购服务号</h4>
                </div>
                <div class="modal-body" style="padding: 10px 20px 20px;">
                </div>
                <!--<div class="modal-footer">-->
                    <!--<button type="button" class="btn btn-primary ds_form_action" ds_action="account.addServiceNo"  ds_form="#frm_serviceno_data">保存</button>-->
                    <!--<button type="button" class="btn btn-default" data-dismiss="modal">关闭</button>-->
                <!--</div>-->
            </div><!-- /.modal-content -->
        </div><!-- /.modal-dialog -->
    </div><!-- /.modal -->

    <div class="modal fade " id="fax_modal">
        <div class="modal-dialog" style="width: 800px;">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close " data-dismiss="modal" aria-hidden="true">&times;</button>
                    <h4 class="modal-title" >导入号码</h4>
                </div>
                <div class="modal-body" style="padding: 10px 20px 20px;">
                </div>
                <div class="modal-footer">
                <button type="button" class="btn btn-primary ds_do_action" ds_action="fax.importNum"  ds_data="frm_fax_num_import">提交</button>
                <button type="button" class="btn btn-default" data-dismiss="modal">关闭</button>
                </div>
            </div><!-- /.modal-content -->
        </div><!-- /.modal-dialog -->
    </div><!-- /.modal -->

    <div class="modal fade" id="common_modal">
        <div class="modal-dialog">
            <div class="modal-content">

                </div>
                <div class="modal-body">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-default" data-dismiss="modal">关闭</button>
                    <button type="button" class="btn btn-primary ds_form_action" ds_action=""  ds_form="">保存</button>
                </div>
            </div><!-- /.modal-content -->
        </div><!-- /.modal-dialog -->
