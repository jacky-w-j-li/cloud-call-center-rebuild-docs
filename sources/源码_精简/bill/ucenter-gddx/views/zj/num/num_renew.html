<div class="well" style="padding: 0 19px;">
    <h2>_#_id#_
        <small>月租:<span class="text-primary monthRent">_@formatTrueFee(_#monthRent#_)@_</span>元</small>
    </h2>
    <!--<p class="text-muted"></p>-->
</div>

<form class="form-horizontal" id="frm_serviceno_detail">
    <input type="hidden" name="serviceno" value="_#_id#_">
    <input type="hidden" name="monthRent" value="_#monthRent#_">
    <input type="hidden" name="money" value="_#totalFee#_">
    <input type="hidden" name="flag" value="snRenew">
    <input type="hidden" name="serviceFlag" value="">
    <input type="hidden" name="concurrent" value="1">
    <input type="hidden" name="balance" value="_#balance#_">

    <div class="form-group">
        <label class="control-label col-md-2">
            本月还剩天数
        </label>
        <div class="col-md-10" style="line-height: 35px;">
            <span class="leaveDay">_#leaveDay#_</span>天
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-md-2">
            应付金额
        </label>
        <div class="col-md-10" style="line-height: 35px;">
           <span class="fee total_fee" >_#totalFee#_</span>元
           <span class="text-muted">&nbsp;[月租/本月总天数*本月剩余天数=应付金额]</span>
        </div>
    </div>
    <div class="clearfix">
        <p>您当前可支付余额为<strong>_#balance#_</strong>元,其中实际余额为<strong>_#actualBalance#_</strong>元,透支额度为<strong>_#overdraw#_</strong>元</p>
        <p class="balance_not_enough" style="display: none;color: red;">
            您的账户余额不足，请立即充值
        </p>
        <!--<div class="alert alert-warning balance_not_enough" style="display: none;">-->
        <!--您的账户余额不足，请立即&nbsp;<a href="#" class="ds_do_action" ds_action="zjNum.redirectOnlinePay" ds_data="_#totalFee#_">充值</a>-->
        <!--</div>-->
    </div>
    <div class="alert alert-info">
        <ul>
            <li>启用号码需要先缴纳本月剩余的费用</li>
        </ul>
    </div>
    <div class="form-group">
        <div class="col-md-offset-2 col-md-10">
            <button type="button" class="btn btn-primary ds_form_action ds_pay" ds_action="zjNum.confirmPayNew">立刻购买</button>
            <button type="button" class="btn btn-default" data-dismiss="modal">关闭</button>
        </div>
    </div>
</form>

</style>
<script type="text/javascript">
    $('#popover_concurrent').popover({
    });
</script>
