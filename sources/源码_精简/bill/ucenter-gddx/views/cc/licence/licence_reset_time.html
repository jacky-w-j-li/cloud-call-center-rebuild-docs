<div class="well" style="padding: 0 19px;">
    <h2>重置试用到期日期_@licence.showFieldDesc("licenceType","_#licenceType#_")@_<small>
        licence单价:<span class="text-primary monthRent">_#licencePrice#_</span>元
    </small></h2>
    <p class="text-muted">当前licence数<span class="text-primary">_#num#_</span>,到期日期为<strong class="text-danger">_#endDate#_</strong></p>
</div>
<form class="form-horizontal" id="frm_licence_reset_time">
    <input type="hidden" name="_id" value="_#_id#_">
    <div class="form-group">
        <label class="control-label col-md-2">
            重置到期日期
        </label>
        <div class="col-md-5">
            <input type="text" name="resetTime" class="form-control input-sm ds_date " style="display: inline-block;width: auto"/>
            <label for="resetTime" class="error" style="display: none;"></label>
        </div>
    </div>
    <div class="form-group">
        <div class="col-md-offset-2 col-md-10">
            <button type="button" class="btn btn-primary ds_form_action" ds_action="licence.resetTime" >确认</button>
            <button type="button" class="btn btn-default" data-dismiss="modal">关闭</button>
        </div>
    </div>
</form>
