<form class="form-horizontal" id="sms_template_to_check_update"  method="post">
    <input type="hidden" name="_id" value="_#_id#_">
    <div class="form-group">
        <label class="control-label col-md-4">
            模板标题
        </label>
        <div class="col-md-5">
            <input type="text" name="name" value="_#name#_"/>
        </div>
    </div>
    <div class="invoice_info_base">
        <div class="form-group">
            <label class="control-label col-md-4">
                模板内容
            </label>
            <div class="col-md-5">
                <textarea name="content">_#content#_</textarea>
            </div>
        </div>
        <div class="form-group">
            <label class="control-label col-md-4">
                模板签名
            </label>
            <div class="col-md-5">
                <input  type="text" name="signToCheck" value="_#signToCheck#_"/>
            </div>
        </div>
        <div class="form-group">
            <label class="control-label col-md-4">
                模板类型
            </label>
            <div class="col-md-5">
                _smsTemplateTypeToReplace_
            </div>
        </div>

    </div>
    <div class="form-group">
        <div class="col-md-offset-3 col-md-8">
            <button type="button" class="btn btn-default" data-dismiss="modal">关闭</button>
            <button type="button" class="btn btn-primary ds_form_action" ds_action="sms.updateSmsTemplateToCheck">保存</button>
        </div>
    </div>
</form>
