<div class="pay_start" style="margin:10px;">
    <div class="custFee_pay">
        <div class="well" style="padding: 0 19px;">
            <h2>续费 _#name#_
                <small>
                    单价:<span class="text-primary monthRent">_@formatTrueFee(_#price#_)@_</span>元/_@custFee.getPricePeriodDesc('_#pricePeriod#_')@_
                </small>
            </h2>

        </div>
        <form class="form-horizontal" id="form_custFee_update">
            <input type="hidden" name="custFeeId" value="_#id#_"/>
            <input type="hidden" name="balance" value="_#balance#_">
            <input type="hidden" name="overdraw" value="_#overdraw#_">


            <div class="form-group" id="custFee_renew_div">
                <label class="control-label col-md-3">
                    时长
                </label>
                <div class="col-md-5"  style="line-height: 35px;">
                    <input type="text" onkeyup="value=value.replace(/[^\d]/g,'')" name="duration" value='1' class="form-control input-sm ds_spinner_custFee" min="1" required/>_@custFee.getPricePeriodDesc('_#pricePeriod#_')@_
                    <label for="month" class="error" style="display: none;"></label>
                </div>
            </div>
            <div class="form-group" id="custFee_renew_totalFee_div">
                <label class="control-label col-md-3">
                    费用
                </label>
                <div class="col-md-5" style="line-height: 35px;">
                    <span class="fee">_#totalFee#_</span>元
                </div>
            </div>

            <div class="clearfix">
                <p>您当前可支付余额为:<span>_#balance#_</span>元,其中实际余额为:_#actualBalance#_,透支额度为_#overdraw#_</p>

                <p class="balance_not_enough" style="display: none;color: red;">
                    您的账户余额不足，请立即充值。
                </p>
            </div>
            <div class="form-group">
                <div class="col-md-offset-3 col-md-8">
                    <button type="button" class="btn btn-primary ds_form_action custFee_renew" ds_action="custFee.confirmPay">立刻购买</button>
                    <button type="button" class="btn btn-default" data-dismiss="modal">关闭</button>
                </div>
            </div>
        </form>
    </div>

</div>
<div class="pay_end" style="display: none;">
    <p class="text-center">请您在新打开的网上银行页面进行支付，支付完成前请不要关闭该窗口</p>
    <p class="text-center"><button type="button" class="btn btn-primary ds_do_action" ds_action="custFee.finishPay" >支付完成</button></p>
</div>
