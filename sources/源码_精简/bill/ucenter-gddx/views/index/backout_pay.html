<form class="form-horizontal" id="frm_backout_pay">
    <input type="hidden" name="_id" value="_#_id#_">
    <div class="form-group">
        <label class="control-label col-md-4">
            撤销金额：
        </label>
        <div class="col-md-5">
            <span style="display: inline-block;padding-top: 6px;">_#money#_元</span>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-md-4">
            备注：
        </label>
        <div class="col-md-5">
            <span style="display: inline-block;padding-top: 6px;">_@fee.showFieldDesc('flag','_#flag#_')@_</span>
        </div>
    </div>
</form>
