<form class="form-horizontal" id="frm_invoice_addr_update" method="post" >
    <input type="hidden" name="_id" value="_#_id#_">
    <div class="form-group">
        <label class="control-label col-md-4">
            收件人姓名
        </label>
        <div class="col-md-5">
            <input type="text" class="form-control input-sm" name="userName" value='_#userName#_' required>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-md-4">
            邮政编码
        </label>
        <div class="col-md-5">
            <input type="text" class="form-control input-sm" name="post" value='_#post#_' required>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-md-4">
            手机号
        </label>
        <div class="col-md-5">
            <input type="text" class="form-control input-sm phone" name="phone" value='_#phone#_' required>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-md-4">
            详细地址
        </label>
        <div class="col-md-5">
            <textarea class="form-control input-sm" name="addr" required>_#addr#_</textarea>
        </div>
    </div>
    <div class="form-group">
        <label class="col-md-offset-4 col-md-5">
            <input type="checkbox" name="isDefault" >设为默认
        </label>
    </div>
</form>
