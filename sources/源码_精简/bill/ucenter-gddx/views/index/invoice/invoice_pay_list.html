<div class="panel panel-default">
    <div class="panel-body">
        <form id="frm_invoice_get_search" class="form-horizontal">
            <table class="table_row_search">
                <tbody>
                <tr>
                    <td>快捷查询</td>
                    <td class="quick_condition">
                        <input type="hidden" name="flag" value="deal">
                        <button type="button" class="btn btn-link ds_do_action" ds_action="invoice.quick_search" ds_data="nodeal">可开票充值单</button>
                        <button type="button" class="btn btn-info ds_do_action" ds_action="invoice.quick_search" ds_data="deal">不可开票充值单</button>
                    </td>
                    <td colspan="5">
                    </td>
                </tr>
                <tr>
                    <td>充值日期</td>
                    <td>
                        <input type="text" name="startPayTime" class="form-control input-sm ds_date" style="display: inline-block;width: auto"/> 至
                        <input type="text" name="endPayTime" class="form-control input-sm ds_date" style="display: inline-block;width: auto"/>
                    </td>
                    <td>状态</td>
                    <td>
                        <select name="invoiceStatus" class="form-control input-sm">
                            <option value="">--请选择--</option>
                            <option value="dealing">处理中</option>
                            <option value="deal">已开发票</option>
                            <option value="overdue">过期</option>
                        </select>
                    </td>
                    <td>
                        <button type="button" class="btn btn-primary btn-sm ds_form_action ds_invoice_get_search" ds_action="invoice.queryGetList">查询</button>
                        <button type="button" class="btn btn-default btn-sm ds_do_action" ds_action="invoice.reset">重置</button>
                    </td>

                </tr>
                </tbody>
            </table>
        </form>
    </div>
</div>
<div class="panel panel-info">
    <div class="panel-heading invoice_get_head">
        <span class="text-danger" >自助发票功能从2015-12-04上线，此日期之前的充值单据都处理为过期；若之前还有未开的充值单据，请您联系客服开具！</span>
    </div>

    <table class="table">
        <thead>
        <tr>
            <th>流水号</th>
            <th>支付方式</th>
            <th>充值时间</th>
            <th>金额(元)</th>
            <th>类型</th>
            <th>备注</th>
            <th>状态</th>
            <th>关联发票</th>
        </tr>
        <tr class="warning select_num_tr" style="display: none;">
            <td colspan="10">已选择 <span class="select_num" style="color:red; ">0</span> 条</td>
        </tr>
        </thead>
        <tbody class="content_list">
        </tbody>
    </table>
</div>
<div class="row">
    <div class="col-md-5">查询结果：<span class="result_count" style="margin-top:3px;display: inline-block;">0</span></div>
    <div class=" col-md-7">
        <ul class="pagination pagination-sm pull-right" style="margin: 0;"
            for="frm_invoice_get_search" ds_pagination_action="invoice.queryGetList">
            <li><a href="#"  value="0">&laquo;</a></li>
            <li><a href="#"  value="1">1</a></li>
            <li><a href="#"  value="2">2</a></li>
            <li><a href="#"  value="3">3</a></li>
            <li><a href="#"  value="4">4</a></li>
            <li><a href="#"  value="5">5</a></li>
            <li><a href="#"  value="6">&raquo;</a></li>
        </ul>
    </div>
</div>
