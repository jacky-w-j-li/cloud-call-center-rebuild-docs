<div class="container">
    <div style="width:950px;margin: 0 auto;" id="pane_tmpl_login_head">

    </div>
</div>

<div class="login_main" style="/*background-color:#eeeeee;*/">
    <div style="width:350px;margin:0 auto;" >
    <h1>用户中心</h1>
    <form id="login-form">
        <div class="form-group">
            <label for="login_loginName">账户登录名</label>
            <input type="text" class="form-control" id="login_loginName" name="loginName" placeholder="账户登录名" autofocus>
        </div>
        <div class="form-group">
            <label for="login_password">密码</label>
            <input type="password" class="form-control" id="login_password" name="password" placeholder="" >

            <div class="form-group">
                <label class="checkbox-inline">
                    <input type="checkbox" id="login_remember" name="remember" value="remember-me">记住密码
                </label>
                <label class="checkbox-inline pull-right domain_aboutUs" style="display: none;">
                </label>
            </div>
            <button type="button" class="btn btn-lg btn-success btn-block"  id="login">登 录</button>
        </div>
    </form>
    <hr>
    <p id="pane_login_download">
       <!--没有账号?<a class="btn btn-link" href="http://uc.7moor.com/" target="_blank">立即注册</a>-->
       <!--<a class="btn pull-right text-info" href="http://115.29.160.119/download/win" target="_top"><span class="glyphicon glyphicon-circle-arrow-down"></span> 下载客户端</a>-->
    </p>
</div>
</div>
<footer class="login-footer" style="">
    <div class="container" style="width:950px;" id="pane_tmpl_login_foot">
    </div>
</footer>

<style type="text/css">
    .login_main{
        border-top: 1px solid #ccc;
        padding: 40px 0 60px;
        background: url('../img/content_bg.png') repeat;
    }
    .login-footer{
        border-top: 1px solid #e5e5e5;
        padding-top: 20px;
        padding-bottom: 10px;
        color: #777;
        text-align: center;

    }

</style>
<script id="tmpl_login_head" type="text/html">
    {{if domain=='7moor'}}
        <div class="pull-left" style="height: 80px;line-height: 80px;">
             <a href="http://www.7moor.com/" target="_blank"><img src="./img/logo2.png" alt="容联.七陌" style="width: 180px;"></a>
        </div>
        <div class="pull-right text-muted" style="vertical-align: middle;margin-top: 20px;">
            <ul style="list-style: none;">
                <li>技术支持热线：4008-113-114</li>
                <li>技术支持邮箱：<a class="" href="javascript:mailTo()">service@7moor.com</a></li>
            </ul>
        </div>
    {{else}}
        <div class="pull-left" style="height: 80px;line-height: 80px;">
            <a href="./"><img alt="" src="./thirdImg/{{fileName}}" style="max-width:200px;max-height: 60px"></a>
        </div>
        <div class="pull-right text-muted" style="vertical-align: middle;margin-top: 20px;">
            {{ if phone}}
            <ul style="list-style: none;">
                <li>技术支持热线：{{phone}}</li>
            </ul>
            {{/if}}
        </div>
    {{/if}}
</script>
