    <form class="form-horizontal" id="frm_pwd_update">
        <div class="form-group">
            <label class="control-label col-md-4">
                当前密码
            </label>
            <div class="col-md-5">
                <input type="password" name="oldPwd" value='' class="form-control input-sm" required/>
            </div>
        </div>
        <div class="form-group">
            <label class="control-label col-md-4">
                新的密码
            </label>
            <div class="col-md-5">
                <input type="password" name="newPwd" value='' id="newPwd" class="form-control input-sm tb_password" required/>
            </div>
        </div>
        <div class="form-group">
            <label class="control-label col-md-4">
                确认密码
            </label>
            <div class="col-md-5">
                <input type="password" name="repeatPwd" value='' class="form-control input-sm tb_password" equalTo="#newPwd" data-msg-equalTo="密码不一致" required/>
            </div>
        </div>
    </form>
