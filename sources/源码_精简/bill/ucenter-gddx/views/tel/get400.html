<div>
    <div class="alert alert-info">您的申请将以邮件的方式发送给我们的服务专员，我们会尽快联系您</div>
    <form class="form-horizontal" id="">
        <div class="form-group">
            <label class="control-label col-md-3">
                我的邮箱
            </label>
            <div class="col-md-7">
                <input type="text" style="display: inline-block;"  name="linkManEmail" value='_#linkManEmail#_' class="form-control email" required />
            </div>

        </div>
        <div class="form-group">
            <label class="control-label col-md-3">
                我的姓名
            </label>
            <div class="col-md-7">
                <input type="text" style="display: inline-block;"  name="linkManName" value='_#linkManName#_' class="form-control" required />
            </div>
        </div>
        <div class="form-group">
            <label class="control-label col-md-3">
                我的电话
            </label>
            <div class="col-md-7">
                <input type="text" style="display: inline-block;"  name="linkManPhone" value='_#linkManPhone#_' class="form-control" required />
            </div>
        </div>
        <div class="form-group">
            <div class="col-md-offset-3 col-md-7">
                <button type="button" class="btn btn-primary ds_form_action" ds_action="tel.send400">立刻发送</button>
                <button type="button" class="btn btn-default" data-dismiss="modal">关闭</button>
            </div>
        </div>
    </form>
</div>
