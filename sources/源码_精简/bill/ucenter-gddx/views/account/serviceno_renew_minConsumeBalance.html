<div class="well" style="padding: 0 19px;">
    <h2>_#productDesc#_低消充值
        <small>
            当前余额:<span class="text-primary minConsumeBalance">_#minConsumeBalance#_</span>元
        </small>
    </h2>
</div>

<form class="form-horizontal" id="frm_serviceno_detail">
    <input type="hidden" name="flag" value="buyMinConsumeBalance">
    <input type="hidden" name="minConsumeBalance" value="_#minConsumeBalance#_">
    <input type="hidden" name="serviceFlag" value="">
    <div class="form-group">
        <label class="control-label col-md-2">
            充值金额
        </label>
        <div class="col-md-5">
            <input type="text"  name="money" class="form-control input-sm number" style="display: inline-block;width: 100px;" required>元
            <label for="money" class="error" style="display: none;"></label>
        </div>
    </div>
    <div class="form-group">
        <div class="col-md-offset-2 col-md-10">
            <button type="button" class="btn btn-primary ds_form_action" ds_action="account.showPay2DialMins">立刻购买</button>
            <button type="button" class="btn btn-default" data-dismiss="modal">关闭</button>
        </div>
    </div>
</form>
