<script language="javascript">
    $("#frm_serviceno_search").find(".sp_item").click(function () {
        $("#frm_serviceno_search").find(".sp_item").removeClass("showField");

    });
    $("#frm_serviceno_search").find(".city_item").click(function () {
        $("#frm_serviceno_search").find(".city_item").removeClass("showField");
        $(this).addClass("showField");
    });
