<div>
    <p class="">
        <form class="form-inline clearfix" role="form" id="frm_batch_search">
            <input type="hidden" name="flag" value="2"/>
            <input type="hidden" name="called" value="true"/>
            <div class="pull-left">
                <table class="table_row_search">
                    <tbody>
                    <tr>
                        <td >号码 </td>
                        <td >
                            <input type="text" name="num" class="form-control input-sm"/>
                        </td>
                        <td >批次号 </td>
                        <td >
                            <input type="text" name="batchNo" class="form-control input-sm"/>
                        </td>
                        <td >状态</td>
                        <td >
                            <select name="reason" class="form-control input-sm">
                                <option value="">全部</option>
                                <option value="4">呼叫成功</option>
                                <option value="0">呼叫失败</option>
                            </select>
                        </td>
                        <td >是否按键</td>
                        <td >
                            <select name="keypress" class="form-control input-sm">
                                <option value="">全部</option>
                                <option value=true>是</option>
                                <option value=false>否</option>
                            </select>
                        </td>
                        <td>
                            <button type="button" class="btn btn-primary btn-sm ds_form_action" ds_action="batch.getBatchList">查询</button>
                            <button type="button" class="btn btn-default btn-sm ds_do_action" ds_action="batch.reset" >重置</button>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div class="pull-right" style="line-height: 40px;">
                <button type="button" class="btn btn-primary btn-sm ds_form_action" ds_action="batch.exportNum" >导出</button>
            </div>

            <!--<div class="form-group">-->
                <!--<label class="sr-only" for="batch_num">号码</label>-->
                <!--<input type="text" name="num" class="form-control" id="batch_num" placeholder="号码">-->
            <!--</div>-->
        </form>
    </p>
    <div class="panel panel-info">
        <table class="table table-bordered table-hover">
            <thead>
            <tr>
                <th>号码</th>
                <th>导入批次</th>
                <th>开始时间</th>
                <th>通话时长</th>
                <th>是否按键</th>
                <th>状态</th>
            </tr>
            </thead>
            <tbody class="batch_list">
            </tbody>
        </table>
    </div>

    <div class="row">
        <div class="col-md-5">查询结果：<span class="result_count" style="margin-top:3px;display: inline-block;">0</span></div>
        <div class=" col-md-7">
            <ul class="pagination pagination-sm pull-right" style="margin: 0;"
                for="frm_batch_search" ds_pagination_action="batch.getBatchList">
                <li><a href="#"  value="0">&laquo;</a></li>
                <li><a href="#"  value="1">1</a></li>
                <li><a href="#"  value="2">2</a></li>
                <li><a href="#"  value="3">3</a></li>
                <li><a href="#"  value="4">4</a></li>
                <li><a href="#"  value="5">5</a></li>
                <li><a href="#"  value="6">&raquo;</a></li>
            </ul>
        </div>
    </div>
</div>
