<script id="tmpl_contact_action" type="text/x-jquery-tmpl">
        <a class="show_on_hover edit-action" href="#" style="">编辑</a>
        <form action="#" method="post">
            <input type="hidden" name="lastActionId" value="">
            <input type="hidden" name="actionId" value="${actionId}">
            <input type="hidden" name="default_action" value="${action}">
            <input type="hidden" name="default_action_type" value="date">
            <input type="hidden" name="default_action_date" value="${notifyTime}">
            <h3 class="actionlabel" style="line-height:25px;">联系计划:</h3>
            <div class="current_name" style="display: table;">
                <div class="cell">
                    <a href="#" class="done_marker tooltip-icon ds_form_action" ds_action='customer.dealNote'>
                    <span class="tip-container" style="display: none;">
                      <span class="arrow"></span>
                        <span class="tip-content">点击完成计划</span>
                    </span>
                    </a>
                </div>
                <div class="current_name_data" style="max-width: 463px;">
                    <span title="${action}">${action}</span>
                </div>
            </div>
            <div class="change_name" style="display: none;">
                <input type="text" name="remark" class="note_body" value="${action}">
                <!--<textarea class="note_description note_body" name="remark"></textarea>-->
                <!--<span class="counter"></span>-->
            </div>

            <div class="current_date" style="display: block;">
                <span class="${getNotifyDate(notifyTime).type}" title="${notifyTime}">${getNotifyDate(notifyTime).name}</span>
                <!--<a class="show_on_hover" href="#" style="">Change</a>-->
            </div>

            <div class="change_date" style="display: none;margin-top:10px;">
                <div id="sales_action_time" style="display:inline-block;">
                    <select name="change_date_type" style="width:100px;">
                        <option value="date">联系时间</option>
                        <optgroup label="快速选择">
                            <option value="half">半小时后</option>
                            <option value="hour">一小时后</option>
                            <option value="tomorrow">明天</option>
                            <option value="aftertomorrow">后天</option>
                            <option value="week">三天后</option>
                            <option value="2week">2周后</option>
                            <option value="month">30天后</option>
                        </optgroup>
                    </select>
                    <input name="notifyTime_date" class="ds_date" minDate="true" type="text" placeholder="yyyy-mm-dd" style="margin-left:0;">
                    <input name="notifyTime_time" class="ds_time" type="text" placeholder="00:00" style="width:35px;">
                    <!--<input name="notifyTime_time" class="ds_search_item ds_time" type="text" placeholder="00:00" pattern="([01]?[0-9]|2[0-3]):[0-5][0-9]" style="width:35px;">-->
                    <!--<input type="text" name="notifyTime" class="date_picker" style="margin-right:5px;width:115px;" value="${notifyTime}"-->
                           <!--readonly="true" onkeydown="readOnlyKeyDown()">-->
                </div>
            </div>

            <div class="actions_history"></div>

            <div class="buttons" style="display: none;">
                <a href="#" class="ds_form_action button" ds_action="customer.saveCustAction" id="cust_mark_action_1">保存</a>
                <a href="#" class="ds_form_action cancel_button" ds_action="customer.actionCancel" id="cust_mark_action_2">取消</a>
            </div>
        </form>
        <div style="clear:both;"></div>
    </script>
