<div class="ds_search_pane" id="contact_list__#menu#_" ds_menu="_#menu#_" ds_index="1">
    <div class='contacts_caption'>
        <div class="header_wrap clearfix" style="padding-bottom: 5px">
            <form id="questionnaire_list_query_form__#menu#_">
                <input type="hidden" name="questionnaireType" value="_#menu#_">
            <span class="refresh ds_form_action" ds_action="questionnaire.queryQuestionnaireList" ds_data="_#menu#_"
                  id="reflush_questionnaire_button" style="display:none;"></span>
                <div class="header_search_wrap pull-left quick_search" style="width:267px; min-width:250px;margin-left: 5px">
                    <div class="header_search_button ds_form_action ques_normal_search normal_search" ds_action="questionnaire.queryQuestionnaireList">
                        <i class="icon-search"></i>
                    </div>
                    <div class="header_search_input">
                        <div class="header_search_input_textbox">
                            <div class="dropdown">
                                <div class="dropdown-toggle quick_card quick_card_sty" data-toggle="dropdown">
                                    <span class="quick_desc ellipsis" style="">全部</span>
                                    <span class="caret"></span>
                                </div>
                                <ul class="dropdown-menu quick_menu" style="min-width: 90px;">

                                </ul>
                                <div class="textbox_wrap textbox_wrap_sty">
                                    <div class="textbox_inner">
                                        <input type="text" name="query" class="textbox_input inpt_sty" maxlength="254" placeholder="输入名称或电话查询" style="border-color: rgb(204, 204, 204);">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="text_link header_search_advanced ques_advanced_search">
                       高级搜索
                    </div>
                </div>

                <div class="btn-group" style="display: none;margin-left:5px;margin-top:2px;">
                    <button href="#" class="btn btn-small ds_do_action " id="questionnaire_assign_button__#menu#_" ds_action="questionnaire.showQuestionAssign" ds_data="_#menu#_">分配</button>
                    <button href="#" class="btn btn-small  ds_do_action " id="questionnaire_export_button__#menu#_" ds_action="questionnaire.exportExcel" ds_data="_#menu#_">导出</button>
                    <button href="#" class="btn btn-small  ds_do_action " style="color:red" id="questionnaire_delete_button__#menu#_" ds_action="questionnaire.deleteQues" ds_data="_#menu#_">删除</button>

                    <button id="questionnaire_dropdown_button__#menu#_" class="btn dropdown-toggle" data-toggle="dropdown">
                        <span class="caret"></span>
                    </button>
                    <ul class="dropdown-menu pull-right">
                        <li>
                            <a href="#" class="ds_do_action" ds_action="questionnaire.deleteQues" style="color: red;">删除查询结果</a>
                        </li>
                    </ul>
                </div>

                <div class="refresh-questionnaire pull-right" style="margin-top:7px;display:none">
                    <span style="margin-right:8px;cursor: pointer;" class="ds_form_action" ds_action="questionnaire.queryQuestionnaireList" title="刷新">
                    <i class="icon-refresh"></i>
                </span>
                </div>
            </form>
        </div>
        <div class="ds_search_filter" style="display: none;">
        </div>
    </div>
    <div tabindex="-1" id="ques_advanced_search_pane" class="advanced_search_pane hidden">

    </div>
    <div class="list_container">
            <div class="list-inside">
            </div>
            <div class="list-footer">
                <div class="pagination pagination-small" for="questionnaire_list_query_form_#menu#_" ds_pagination_action="questionnaire.queryQuestionnaireListByPage">
                    <span style="float:left;">查询结果：<span class="result_count">0</span></span>
                    <ul class="" style="float:right;padding-right: 6px;">
                        <li>
                            <a href="#"  value="0">«</a>
                        </li>
                        <li>
                            <a href="#"  value="1">1</a>
                        </li>
                        <li>
                            <a href="#"  value="2">2</a>
                        </li>
                        <li>
                            <a href="#"  value="3">3</a>
                        </li>
                        <li>
                            <a href="#"  value="4">4</a>
                        </li>
                        <li>
                            <a href="#"  value="5">5</a>
                        </li>
                        <li>
                            <a href="#"  value="6">»</a>
                        </li>
                    </ul>
                </div>
            </div>
    </div>
</div>
<script type="text/html" id="tmpl_questionnaire_advanced_search">
    <div class="advanced_body">
        <form id="frm_ques_advanced_search_{{=menu}}" class="ds_search_form">
            <fieldset>
                <div class="row-fluid">
                        <span class="advanced_search_item name formQue ds_search_item">
                        <label class="search_label">创建时间</label>
                        <input name="createTime_begin_date" class="ds_datetime" type="text"
                               placeholder="">
                        <label style="width: 16px">至</label>
                        <input name="createTime_end_date" class="ds_datetime" type="text"
                               placeholder="">
                        </span>
                </div>

                <div class="row-fluid">
                        <span class="advanced_search_item name formQue ds_search_item">
                        <label class="query_time search_label">回访时间</label>
                        <input name="lastUpdateTime_begin_date" class="ds_datetime" type="text"
                               placeholder="">
                        <label style="width: 16px">至</label>
                        <input name="lastUpdateTime_end_date" class="ds_datetime" type="text"
                               placeholder="">
                        </span>
                </div>
                <div class="row-fluid">
                            <span class="name formQue ds_search_item">
                            <label class="search_label">问卷模板</label>
                            <select class="quesTemp_type" name="temp_id">
                                <option value="" selected>--请选择--</option>
                                {{ for(var i=0; i<tempList.length; i++){
                                }}
                                <option value="{{=tempList[i]._id}}">{{=tempList[i].name}}</option>
                                {{
                                }
                                }}
                            </select>
                            </span>
                            <span class="name formQue ds_search_item">
                            <label class="search_label">状态</label>
                            <select class="ques_result " name="result">
                                <option value="" selected>--请选择--</option>
                                <option value="success">成功</option>
                                <option value="invalid">无效电话</option>
                                <option value="noAnswer">无人接听</option>
                                <option value="imparity">客户不配合</option>
                                <option value="other">其他</option>
                            </select>
                            </span>
                            <span class="name formQue ds_search_item">
                                <label class="search_label">当前处理人</label>
                                <select class="ques_master query_field" name="owner">
                                    <option value="" selected>--请选择--</option>
                                    {{ for(var i=0; i<agents.length; i++){
                                    }}
                                    <option value="{{=agents[i]._id}}">{{=agents[i].displayName}}</option>
                                    {{
                                    }
                                    }}
                                </select>
                            </span>
                </div>
                <div class="row-fluid">
                        <div class="span8 name formQue ds_search_item">
                            <label class="search_label">导入批次号</label>
                            <input type="text" class="text ques_batchNo" name="batchNo"/>
                        </div>
                </div>

                <div class="ques_fields_pane">
                </div>
                <div style="padding: 10px;">
                    <button type="button" class="btn btn-small btn-primary ds_form_action  pull-right btn_advanced" ds_action="questionnaire.queryHighQues" >搜索</button>
                    <button type="button" class="btn btn-small  ds_do_action  pull-right" ds_action="questionnaire.resetQueryHighQues" ds_data="{{=menu}}" style="margin-right: 10px;">重置</button>
                </div>
            </fieldset>
        </form>
    </div>

</script>
