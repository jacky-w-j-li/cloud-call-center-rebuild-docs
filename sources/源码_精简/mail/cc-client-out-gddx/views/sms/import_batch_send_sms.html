<div class="right_container">
    <div class="left_column ds_search_pane" id="import_list__#menu#_"  ds_menu="_#menu#_" ds_index="1">
        <div class="contacts_caption">
            <div class="caption-top clearfix">
                <div style="float:right;">
                    <button class="btn ds_do_action" ds_action="sms.addImpTemplateTask" ds_data="_#menu#_">添加模板任务</button>
                    <!--<div class="btn-group">-->
                        <!--<button class="btn ds_do_action" ds_action="sms.addImpTemplateTask" ds_data="_#menu#_">添加模板任务</button>-->
                        <!--<button class="btn dropdown-toggle" data-toggle="dropdown">-->
                            <!--<span class="caret"></span>-->
                        <!--</button>-->
                        <!--<ul class="dropdown-menu pull-right">-->
                            <!--<li><a class="ds_do_action" ds_action="sms.addImpTask" ds_data="_#menu#_">添加人工审核任务</a></li>-->
                        <!--</ul>-->
                    <!--</div>-->
                </div>
                <span class="refresh ds_do_action" ds_action="sms.searchSmsImport" ds_data="_#menu#_">
                    <a href="javascript:void(0);" title="刷新" class="ajaxed" style="margin-top:2px">刷新</a>
                </span>
                <div class="input-append">
                    <input class="span2 ds_search_item" name="batchNo" style="width: 95px" type="text" placeholder="输入批次号查询">
                    <button class="btn ds_do_action" type="button" ds_action="sms.searchSmsImport" ds_data="_#menu#_" title="查询">
                        <i class="icon-search"></i>
                    </button>
                    <button type="button" class="btn" data-toggle="collapse"
                            data-target="#search__#menu#_" style="height: 24px;" title="高级查询">
                        <span class="caret"></span>
                    </button>
                </div>
            </div>
        </div>
        <div class="list_container compact-view">
            <div class="contact_list">
                <div class="search collapse" id="search__#menu#_" style="height: 0px;">
                </div>
                <div class="ds_search_filter">
                </div>
                <div class="list-inside">
                </div>
                <div style="margin-right: 8px;">
                    <a class="btn ds_do_action ds_more" ds_action="sms.moreSmsImport" ds_data="_#menu#_" href="#" style="display: none;">更多...</a>
                </div>
            </div>
            <script id="tmpl_sms_task_item" type="text/x-jquery-tmpl">
                <div class="list_item">
                    <div class="ds_do_action item_row item${batchNo}" ds_action='sms.showImportTask' ds_data='${batchNo}'>
                        <input type="hidden" name="batchNo" value="${batchNo}" >
                        <div class="contact_item">
                            <div class="right-items status status_lead">
                                {{if type=='sms'}}
                                人工审核
                                {{else}}
                                模板
                                {{/if}}
                                {{if flag=='finish'}}
                                <span class="status-name" style="color:green;" title="${getDicCacheName('impTaskStatus',flag)}">${getDicCacheName('impTaskStatus',flag)}</span>
                                {{else}}
                                <span class="status-name" style="color:red;" title="${getDicCacheName('impTaskStatus',flag)}">${getDicCacheName('impTaskStatus',flag)}</span>
                                {{/if}}
                                <br>
                            </div>
                            <div class="recentTime">
                                <p>创建于${createTime.substring(0,createTime.length-3)}</p>
                            </div>

                            <div class="middle-items" style="margin-left:10px;">
                                <div class="contact">
                                  <span class="name">
                                    <span class="major" title="${batchNo}" style="max-width: 315px;">${batchNo}</span>
                                    <span class="minor" title=""></span>
                                  </span>
                                </div>
                                <div class="next_action">
                                    <span style="top:8px;" class="action_date_id"></span>
                                    <span class="action_content" title=""></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </script>
        </div>
    </div>
    <div class="right_column" >
        <div class="contact_detail">
            <div class="content" >
                <div id="sms_import_pane">

                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    $(function(){
        var url = 'customer/customer_import_search';
        DS.getView(url, function(view){
            if(view){
                view = view.replace(new RegExp('_#'+'menu'+'#_', 'g'), '_#menu#_');
                $('#search__#menu#_').html(view);
            }
        });
    });
</script>
