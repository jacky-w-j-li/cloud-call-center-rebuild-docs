<div class="inbox clearfix">
    <div class="head">
        <div class="clearfix">
            <div class="pull-left">_#mailId#_</div>
            <div class="pull-right">_#createTime#_</div>
        </div>
        <div class="clearfix">
            <div class="pull-left">收件人：_#toDesc#_</div>
            <div class="pull-left" style="margin-left: 10px;">抄送：_#ccDesc#_</div>
        </div>
        <div>_#subject#_</div>
        <div class="attach">
            _#attachDesc#_
        </div>
    </div>
    <div class="inbox_content">
        <iframe scrolling='auto' width='100%' height='200px' frameborder='0' src='' name='reply__#_id#_' id='reply__#_id#_'></iframe>
    </div>
</div>
