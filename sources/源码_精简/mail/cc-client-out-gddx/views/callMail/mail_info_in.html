<div class="inbox clearfix">
    <div class="head">
        <div class="clearfix">
            <div class="pull-left">_#fromDesc#_</div>
            <div class="pull-right">_#createTime#_</div>
        </div>
        <div class="clearfix">
            <div class="table_ds_word">收件人：_#toDesc#_</div>
            <div class="table_ds_word" style="">抄送：_#ccDesc#_</div>
        </div>
        <div>_#subject#_</div>
        <div class="attach">
            _#attachDesc#_
        </div>
    </div>

    <div class="inbox_content">
        <iframe scrolling='auto' width='100%' frameborder='0' src='' name='inboxInfo__#_id#_' id='inboxInfo__#_id#_'></iframe>
    </div>
    <div class="pull-right">
        <button type="button" class="btn btn-primary btn-small ds_do_action my_dealInbox" ds_action="callMail.dealInbox" ds_data="_#_id#_" style="margin-left: 10px;display: none;">标记为已读</button>
    </div>
</div>
