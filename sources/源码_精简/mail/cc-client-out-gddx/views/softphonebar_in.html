<script type="text/javascript" >
    $(function(){
        var phoneBarTipOption = {placement:'bottom',trigger:'hover',html:true};
        phoneBarTipOption.title='外呼';
        $('#dialoutEnable_tip').tooltip(phoneBarTipOption);
        phoneBarTipOption.title='挂机';
        $('#hangupEnable_tip').tooltip(phoneBarTipOption);
        phoneBarTipOption.title='保持';
        $('#holdEnable_tip').tooltip(phoneBarTipOption);
        phoneBarTipOption.title='恢复';
        $('#recoverEnable_tip').tooltip(phoneBarTipOption);
        phoneBarTipOption.title='转接';
        $('#transferEnable_tip').tooltip(phoneBarTipOption);
        phoneBarTipOption.title='咨询';
        $('#consultEnable_tip').tooltip(phoneBarTipOption);
        phoneBarTipOption.title='结束咨询';
        $('#stopConsultEnable_tip').tooltip(phoneBarTipOption);
        phoneBarTipOption.title='转IVR菜单';
        $('#ivrMenuEnable_tip').tooltip(phoneBarTipOption);
        phoneBarTipOption.title='转满意度调查';
        $('#InvestigateEnable_tip').tooltip(phoneBarTipOption);
        phoneBarTipOption.title='转三方通话';
        $('#consultThreeWayCallEnable_tip').tooltip(phoneBarTipOption);
        phoneBarTipOption.title='咨询转接';
        $('#consultTransferEnable_tip').tooltip(phoneBarTipOption);
        phoneBarTipOption.title='三方通话';
        $('#threewayEnable_tip').tooltip(phoneBarTipOption);
        phoneBarTipOption.title='短信';
        $('#SmsEnable_tip').tooltip(phoneBarTipOption);
        phoneBarTipOption.title='通话标签';
        $("#setCallLabel_tip").tooltip(phoneBarTipOption);
        phoneBarTipOption.title='所在技能组排队总数';
        $('.my_queue_stat').tooltip(phoneBarTipOption);
        phoneBarTipOption.title='今日已接电话数';
        $('.my_call_stat').tooltip(phoneBarTipOption);
        phoneBarTipOption.title='多渠道im会话排队总数';
        $('.my_queue_webchat').tooltip(phoneBarTipOption);
        var options = {
            trigger	:'click',
            placement:"bottom",
            html:"true",
            content:'<div class="dialout_wrap"><input type="text" id="dialout_input_pop" placeholder="输入号码点击回车键发起呼叫" class="dialout_input ds_key_action" keyup_action="cdr.showMycallHistoryDetail" onkeydown="if(event.keyCode==13){softphonebar_dialout_popup($(\'#dialout_input_pop\').val());}"><div class="dialout_button_wrap"><div class="dialout_button" onclick="softphonebar_dialout_popup($(\'#dialout_input_pop\').val());"></div></div></div><div class="cdr_history-wrap"><ul id="cdr_history-item"></ul></div>'

        }
        $(".dialoutPopoverHtml").popover(options);
        $(".dialoutPopoverHtml").on('click', function(e){
            $(".smsPopoverHtml").popover('hide');
            var phoneCookie = DS.getCookie("phoneNum");
            _cti_ui_Autocomplete_new(phoneCookie);
            handler.cdr.autoSearchCustomerHistory()
            _cti_keyCodeDialoutConnect();
            $('#dialout_input_pop').focus();
        })
        var _cti_keyCodeDialoutConnect=function(){
            var num=-1;
            document.onkeydown=function(event){
                var pane=$("#phone-num-autoComplate li[state='on']")
                var len=pane.length;
                var e = event || window.event;
                if($("#cdr_history-item").css("display")!="none"){
                    num=-1
                }
                if($("#phone-num-autoComplate").css("display")!="none"){
                    if(e && e.keyCode==38){//上
                        $("#dialout_input_pop").attr("flag","on")
                        num--;
                        if(num<0){num=len-1}
                        pane.eq(num).addClass("active");
                        pane.eq(num).siblings().removeClass("active");
                        var html=pane.eq(num).html()
                        $('#dialout_input_pop').val(html);
                    }else if( e && e.keyCode==40){//下
                        $("#dialout_input_pop").attr("flag","on")
                        num++
                        if(num>=len){num=0}
                        pane.eq(num).addClass("active");
                        pane.eq(num).siblings().removeClass("active");
                        var html=pane.eq(num).html()
                        $('#dialout_input_pop').val(html);
                    }
                }
            }
        }

        DS.getView("sms/sendSms", function (view) {
            var options = {
                trigger	:'click',
                placement:"bottom",
                html:"true",
                title:'发短信  <i class="icon-question-sign" id="sms_tip"></i>',
                content:view
            }
            $(".smsPopoverHtml").popover(options);
        });
        $(".smsPopoverHtml").on('click', function(e){
            $(".dialoutPopoverHtml").popover('hide');
        })
        utils.loadSearchInput({ id:"softphone_consult_div",
            width:"320",
            height:"18",
            tip:"请输入工号或者手机号(可以输入座席姓名进行下拉选择)",
            data: phone_peers,
            searchField: ["DisplayName", "exten"],
            pinyinField: ["DisplayName"],
            listField: ["DisplayName", "exten"],
            userIdField: "userId",
            showField: "exten",
            showState: true,
            notShowMySelf: true,
            callbackFuc: function(object) {
                //console.dir(object);
            }
        });
        utils.loadSearchInput({ id:"softphone_transfer_div",
            width:"320",
            height:"18",
            tip:"请输入工号或者手机号(可以输入座席姓名进行下拉选择)",
            data: phone_peers,
            searchField: ["DisplayName", "exten"],
            pinyinField: ["DisplayName"],
            listField: ["DisplayName", "exten"],
            userIdField: "userId",
            showField: "exten",
            showState: true,
            notShowMySelf: true,
            callbackFuc: function(object) {
                //console.dir(object);
            }
        });

        $('#softphone_ivrMenu').on('shown', function(){
            var ivrMenuHtml = '';
            var menuList = getCache('ivrMenu');
            for(var i=0; i<menuList.length; i++){
                ivrMenuHtml += "<tr style=\"height: 3px;\"><td>"+ menuList[i].DisplayName +"</td><td><a href=\'javascript:phone_toMenu(\""+menuList[i].Exten+"\",\""+menuList[i].DisplayName+"\")\'>转菜单</a></td></tr>";
                $('#softphone_ivrMenu_table_body').html(ivrMenuHtml);
            }
        });
        $('#softphone_phonestate_dropdown').on('click', function(e){
            if($("#softphone_phonestate_dropdown .caret").is(":hidden")){
                e.stopPropagation();
            }
        });
        utils.loadSearchInput({ id:"softphone_threewaycall_div",
            width:"320",
            height:"18",
            tip:"请输入工号或者手机号(可以输入座席姓名进行下拉选择)",
            data: phone_peers,
            searchField: ["DisplayName", "exten"],
            pinyinField: ["DisplayName"],
            listField: ["DisplayName", "exten"],
            userIdField: "userId",
            showField: "exten",
            showState: true,
            notShowMySelf: true,
            callbackFuc: function(object) {
                //console.dir(object);
            }
        });

        $('#softphone_transfer').on('shown', function () {
            $("#softphone_transfer_skillgroup").html("");
            var skillgroupHtml = "";
            //TODO show idle peer count
            for(var i in phone_queues) {
                skillgroupHtml += "<div style=\"float: left\">"+phone_queues[i].queueName+"<span style=\"color: #009900\">［空闲座席数:"+phone_queues[i].idleAgentCount+"］</span></div>"+
                        "<div style=\"float: right\"><a href=javascript:phone_transfer(\""+phone_queues[i].queueId+"\",\"skillgroup\"); ><i class=\"icon-arrow-right\"></i>转接</a></div>" +
                        "<div style=\"height: 3px;clear: both;border-bottom: 1px dashed #ccc;width: 100%\">&nbsp;</div>" +
                        "<div class=\"clear5\">&nbsp;</div>";
            }
            $("#softphone_transfer_skillgroup").html(skillgroupHtml);
        })

        $(".top_user_info").click(function(){
            var sipTypes = ['gateway', 'sip', 'Local'];
            var docs = new Array();
            for(var i=0 ; i<sipTypes.length;i++){
                if(sipTypes[i] != phone_data.extenType){
                    docs.push(sipTypes[i]);
                }
            }
            var allHtml = '';
            for(var i=0 ; i<docs.length ; i++){
                if(docs[i] == 'gateway')
                    allHtml += '<li><a style="color:#083F5D;font-weight:100;text-decoration:none;" onclick="phone_switch_exten_type(\'gateway\')">接听方式切换为：SIP话机</a></li>';
                else if(docs[i] == 'sip')
                    allHtml += '<li><a style="color:#083F5D;font-weight:100;text-decoration:none;" onclick="phone_switch_exten_type(\'sip\')">接听方式切换为：软电话</a></li>';
                else if(docs[i] == 'Local')
                    allHtml += '<li><a style="color:#083F5D;font-weight:100;text-decoration:none;" onclick="phone_switch_exten_type(\'Local\')">接听方式切换为：手机</a></li>';
            }
            $("#softphone_exten_type").html(allHtml);
            $("#softphone_exten_type").slideToggle('fast');
        });

        $('body').click(function(e) {
            if($("#softphone_exten_type").css("display") == "block"
                    && e.target.id != "user_exten_type"
                    && e.target.id != "exten_type_dropdown_caret"
                    && !$(e.target).hasClass('top_user_info')
                    && e.target.id != "user_status"
                    && e.target.id != "top_user_bg") {
                $("#softphone_exten_type").slideUp('fast');
            }
        });

    });
</script>
