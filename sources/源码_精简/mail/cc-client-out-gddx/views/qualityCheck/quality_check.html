<!--qulity_check-->
<div id="qualityCheckMainPanel">
    <div style="height:98%;margin:3px 3px;">
        <div class="row-fluid">
            <br/>
            <h5><i class="icon-search"></i>待质检记录查询</h5>
            <br/>
            <form id="qualityCheckQueryFrm" class="form-horizontal form-inline">
                <div>
                    <label>质检模板&nbsp;</label>
                    <span id="qualityCheckTemplates" onchange="handler.qualityCheck.changeQualityCheckTemplate('qualityCheckTemplates')"></span>
                </div>
                <div class="clear10"></div>
                <div>
                    <input type="checkbox" id="quality_record_random_checkbox" style=""/>
                    <label>使用条件模板随机抽查</label>
                </div>
                <div class="clear10"></div>
                <div class="random_hide not_select" style="display: none">
                    <label>抽查条件模板&nbsp;</label>
                    <span id="qualityCheckRandomTemplates" onchange="handler.qualityCheck.changeQualityCheckRandomTemplate('qualityCheckRandomTemplates','change')"></span>
                    <span class="quality_check_random_template_add_pane_show" style="height: 14px;line-height: 15px;margin-right: 5px;"><i class="icon-plus"></i></span>
                    <span style="height: 14px;line-height: 15px"><a class="ds_form_action" ds_action="qualityCheck.remove_random_template"><i class="icon-minus"></i></a></span>
                </div>
                <div class="clear10 random_hide" style="display: none"></div>
                <div>
                    <label>
                        呼叫时间
                    </label>
                    <div class="input-append date form_datetime">
                        <input id="quality_check_datetime_picker_start" size="16" class="input-medium" name="BEGIN_TIME" type="text" value="" readonly>
                        <span class="add-on datetimepicker-remove" style="height: 14px;line-height: 15px"><i class="icon-remove"></i></span>
                        <span class="add-on datetimepicker-open" style="height: 14px;line-height: 15px"><i class="icon-th"></i></span>
                    </div>
                    <div class="input-append date random_hide" style="display: none">
                        <input id="quality_check_datetime_picker_start_show" size="16" type="text" value="" readonly>
                    </div>
                    <div style="padding-top: 5px;display: inline">
                        至
                    </div>
                    <div class="input-append date form_datetime">
                        <input id="quality_check_datetime_picker_end" size="16" class="input-medium" name="END_TIME" type="text" value="" readonly>
                        <span class="add-on datetimepicker-remove" style="height: 14px;line-height: 15px"><i class="icon-remove"></i></span>
                        <span class="add-on datetimepicker-open" style="height: 14px;line-height: 15px"><i class="icon-th"></i></span>
                    </div>
                    <div class="input-append date random_hide" style="display: none">
                        <input id="quality_check_datetime_picker_end_show" size="16" type="text" value="" readonly>
                    </div>
                </div>
                <div class="clear10"></div>

                <div>
                    <label>呼叫类型</label>
                    <select name="CONNECT_TYPE" class="call_type_selector"></select>
                    <label>通话座席</label>
                    <span class="quality_agent_input_show" style="margin-right: 5px;">
                        <input name="DISPOSAL_AGENT" type="hidden" class="ds_search_item select_input" id="quality_record_disposal_agent_input" style="float:none;"/>
                        <span id="quality_record_disposal_agent_user" class="combobox_agent"></span>
                    </span>
                    <span class="quality_agent_input_hide" style="margin-right: 5px;" hidden>
                        <input type="text" id="quality_record_disposal_agent_input_show" style="float:none;" readonly/>
                    </span>
                    <label>技能组</label>
                    <select name="ERROR_MEMO" class="queue_selector"></select>
                </div>
                <div class="clear10"></div>
                <div>
                    <label for="CALL_TIME_LENGTH">通话时长</label>
                    <div class="input-append"><input type="text" style="width: 55px" name="CALL_TIME_LENGTH_BEGIN" dataType="Number" msg="时长条件只能为正整数" class="input-small"><span class="add-on" style="height: 14px;line-height: 15px">秒</span></div> 至
                    <div class="input-append"><input type="text" style="width: 55px" name="CALL_TIME_LENGTH_END"  dataType="Number" msg="时长条件只能为正整数" class="input-small"><span class="add-on" style="height: 14px;line-height: 15px">秒</span></div>
                    <label>&nbsp;&nbsp;&nbsp;满意度</label>
                    <select name="INVESTIGATE" class="investigate_selector"></select>
                </div>
                <div class="clear10"></div>
                <div>
                    <span class="quality_check_random_progress_show" hidden>
                        <label>抽查条数</label>
                        <input type="text" id="quality_check_template_random_num" style="float:none;width: 55px" readonly/>
                        <span class="quality_agent_input_hide" style="margin-left: 15px;">
                            <label>质检进度</label>
                            <span class="quality_check_random_progress">0/0</span>
                        </span>
                    </span>
                </div>
                <div class="clear10"></div>
                <div>
                    <a href="#" class="button ds_form_action" id="callSheetQualityCheckQueryBtn" ds_action="qualityCheck.quality_check"  style="margin:2px 5px;">查询</a>
                    <span class="random_btn" hidden><a href="#" class="button ds_form_action" id="callSheetQualityCheckQueryBtn_random" ds_action="qualityCheck.quality_check_random"  style="margin:2px 5px;">重新抽取</a></span>
                    <a href="#" class="button ds_do_action" id="callSheetQualityCheckQueryBtn_reset" ds_action="cdr.resetForm" ds_data = "qualityCheck" style="margin:2px 5px;" >重置</a>
                </div>

                <div class="clear5">&nbsp;</div>
                <div class='row-fluid account_line'></div>
                <br/>

                <div>
                    <table class="table table-striped table-bordered table-hover">
                        <thead>
                        <tr>
                            <td>定位客户</td>
                            <td>主叫号码</td>
                            <td>被叫号码</td>
                            <td>呼叫类型</td>
                            <td>接听状态</td>
                            <td>接听座席</td>
                            <td>呼入技能组</td>
                            <td>满意度</td>
                            <td>呼叫时间</td>
                            <td>通话时长</td>
                            <td>操作</td>
                        </tr>
                        </thead>
                        <tbody id="quality_check_query_table_data">
                        </tbody>
                    </table>
                    <div class="row-fluid class_list">
                        <div class="pagination pagination-small" for="qualityCheckQueryFrm" style="display:table; margin:0;width:100%;"
                             ds_pagination_action="qualityCheck.quality_check">
                            <span class="result_info">查询结果：<span class="result_count">10</span></span>
                            <ul style="float:right;">
                                <li><a href="#"  value="0">&laquo;</a></li>
                                <li><a href="#"  value="1">1</a></li>
                                <li><a href="#"  value="2">2</a></li>
                                <li><a href="#"  value="3">3</a></li>
                                <li><a href="#"  value="4">4</a></li>
                                <li><a href="#"  value="5">5</a></li>
                                <li><a href="#"  value="6">&raquo;</a></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div tabindex="-1" id="quality_check_random_template_add_pane" class="advanced_search_pane hidden" style="min-width: 640px;min-height: 200px">
    </div>
</div>
<script type="text/javascript">
    var qualityCheckRandomTemplate = null;
    $(function(){
        $('#quality_record_random_checkbox').change(function(event){
            var value = $(this).is(':checked');
            qualityCheckRandomTemplate = value;
            var time_show = $("#qualityCheckMainPanel form[id='qualityCheckQueryFrm'] .form_datetime");
            var random_hide = $(".random_hide");
            var agent_show = $(".quality_agent_input_show");
            var agent_hide = $(".quality_agent_input_hide");
            var call_type = $("#qualityCheckMainPanel form[id='qualityCheckQueryFrm'] select[name='CONNECT_TYPE']");//呼叫类型
            var queue = $("#qualityCheckMainPanel form[id='qualityCheckQueryFrm'] select[name='ERROR_MEMO']");//技能组
            var investigate = $("#qualityCheckMainPanel form[id='qualityCheckQueryFrm'] select[name='INVESTIGATE']");//满意度
            var begin_time = $("#qualityCheckMainPanel form[id='qualityCheckQueryFrm'] input[name='CALL_TIME_LENGTH_BEGIN']");//通话时长-开始
            var end_time = $("#qualityCheckMainPanel form[id='qualityCheckQueryFrm'] input[name='CALL_TIME_LENGTH_END']");//通话时长-结束
            var random_btn = $(".random_btn");//重新抽取按键
            var reset_btn = $("#callSheetQualityCheckQueryBtn_reset");//重置按钮
            var progress = $(".quality_check_random_progress_show");//质检进度

            if(value){
                reset_btn.hide();
                random_hide.show();
                time_show.hide();
            }else{
                reset_btn.show();
                time_show.show();
                random_hide.hide();
            }
            random_btn.attr("hidden",!value);
            progress.attr("hidden",!value);
            agent_show.attr("hidden",value);
            agent_hide.attr("hidden",!value);
            call_type.attr("disabled",value);
            queue.attr("disabled",value);
            investigate.attr("disabled",value);
            begin_time.attr("disabled",value);
            end_time.attr("disabled",value);


            if(!value && !$('#quality_check_random_template_add_pane').is(":hidden")){
                $('#qualityCheckMainPanel .quality_check_random_template_add_pane_show').click();
            }
        });
        $('#quality_check_datetime_picker_start').datetimepicker({
//            controlType: utils.jqueryUITimepickerControl,
            timeFormat: "HH:mm:ss",
            dateFormat: "yy-mm-dd",
            showSecond: true
        });
        $('#quality_check_datetime_picker_end').datetimepicker({
//            controlType: utils.jqueryUITimepickerControl,
            timeFormat: "HH:mm:ss",
            dateFormat: "yy-mm-dd",
            showSecond: true
        });
        utils.loadSearchInput({ id: "quality_record_disposal_agent_user",
            width: "179",
            height: "14",
            tip: "按姓名,拼音,工号搜索",
            data: getCache("agents"),
            searchField: ["displayName", "exten", "pinyin"],
            pinyinField: ["displayName"],
            listField: ["displayName", "exten"],
            userIdField: "_id",
            showField: "displayName",
            showAllList: true,
            callbackFuc: function (object) {
                $("#quality_record_disposal_agent_input").val(object._id);
            },
            onKeyChanged: function () {
                if ($("#quality_record_disposal_agent_user_input").val() != "") {
                    $("#quality_record_disposal_agent_input").val("serachInputNoresult");
                } else {
                    $("#quality_record_disposal_agent_input").val("");
                }
            }
        });
    });
</script>
