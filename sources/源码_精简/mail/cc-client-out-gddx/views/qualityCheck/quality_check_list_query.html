<div id="qualityCheckListQueryPanel">
    <div style="height:98%;margin:3px 3px;">
        <div class="row-fluid">
            <br/>
            <h5><i class="icon-search"></i>质检结果查询</h5>
            <br/>
            <form id="qualityCheckListQueryFrm" class="form-horizontal form-inline">
                <div>
                    <label>质检模板&nbsp;</label>
                    <span id="qualityCheckListTemplates" onchange="handler.qualityCheck.changeQualityCheckTemplate('qualityCheckListTemplates')"></span>
                </div>
                <div class="clear10"></div>
                <div>
                    <label>呼叫时间</label>
                    <div class="input-append date form_datetime">
                        <input id="quality_check_list_datetime_picker_start" size="16" class="input-medium" name="BEGIN_TIME" type="text" value="" readonly>
                        <span class="add-on datetimepicker-remove" style="height: 14px;line-height: 15px"><i class="icon-remove"></i></span>
                        <span class="add-on datetimepicker-open" style="height: 14px;line-height: 15px"><i class="icon-th"></i></span>
                    </div>
                    <div style="padding-top: 5px;display: inline">
                        至
                    </div>
                    <div class="input-append date form_datetime">
                        <input id="quality_check_list_datetime_picker_end" size="16" class="input-medium" name="END_TIME" type="text" value="" readonly>
                        <span class="add-on datetimepicker-remove" style="height: 14px;line-height: 15px"><i class="icon-remove"></i></span>
                        <span class="add-on datetimepicker-open" style="height: 14px;line-height: 15px"><i class="icon-th"></i></span>
                    </div>
                </div>
                <div class="clear10"></div>
                <div>
                    <label style="width: 48px">技&nbsp;能&nbsp;组&nbsp;</label>
                    <select name="ERROR_MEMO" class="queue_selector input-medium"></select>
                    <label>接听座席</label>
                    <input name="DISPOSAL_AGENT" type="hidden" class="ds_search_item select_input" id="quality_check_list_disposal_agent_select_input" style="float:none;"/>
                    <span id="quality_check_list_disposal_agent_select_user" class="combobox_agent"></span>
                    <label>呼叫类型</label>
                    <select name="CONNECT_TYPE" class="call_type_selector input-medium"></select>
                </div>
                <div class="clear10"></div>
                <div>
                    <label style="width: 48px">满&nbsp;意&nbsp;度&nbsp;</label>
                    <select name="INVESTIGATE" class="investigate_selector input-medium"></select>
                    <label>通话时长</label>
                    <div class="input-append"><input type="text" style="width: 55px" name="CALL_TIME_LENGTH_BEGIN" class="input-small" dataType="Number" msg="时长条件只能为正整数"><span class="add-on" style="height: 14px;line-height: 15px">秒</span></div> 至
                    <div class="input-append"><input type="text" style="width: 55px" name="CALL_TIME_LENGTH_END" class="input-small" dataType="Number" msg="时长条件只能为正整数"><span class="add-on" style="height: 14px;line-height: 15px">秒</span></div>
                    <label>质检评级</label>
                    <select name="LEVEL">
                        <option value="">--全部--</option>
                        <option value="A">优秀</option>
                        <option value="B">合格</option>
                        <option value="C">提醒</option>
                        <option value="D">不合格</option>
                    </select>
                </div>
                <div class="clear10"></div>
                <div>
                    <label>单项评分</label>
                    <select name="GRADE_CONFIG" class="cdr_grade_config input-medium"></select>
                    <div class="input-append"><input type="text" name="GRADE_MIN" class="input-small" placeholder="0-100分" dataType="Number" msg="单项评分条件只能为正整数"><span class="add-on" style="height: 14px;line-height: 15px">分</span></div> 至
                    <div class="input-append"><input type="text" name="GRADE_MAX" class="input-small" placeholder="0-100分" dataType="Number" msg="单项评分条件只能为正整数"><span class="add-on" style="height: 14px;line-height: 15px">分</span></div>
                </div>
                <div class="clear10"></div>
                <div>
                    <a href="#" class="button ds_form_action" ds_action="qualityCheck.queryQualityCheckList" id="callSheetQualityCheckListQueryBtn">查询</a>
                    <a href="#" class="button ds_do_action" ds_action="cdr.resetForm" ds_data = "queryQualityCheckList">重置</a>
                    <a href="#" class="button ds_form_action" ds_action="qualityCheck.exportQualityCheckListExcel">导出EXCEL</a>
                </div>

                <div class="clear5">&nbsp;</div>
                <div class='row-fluid account_line'></div>
                <br/>

                <div style="width:100%;overflow-x:auto;padding-bottom:10px;">
                    <table class="table table-striped table-bordered table-hover">
                        <thead>
                            <tr id="quality_check_list_table_header">
                                <!--<td>主叫号码</td>-->
                                <!--<td>被叫号码</td>-->
                                <!--<td>接听座席</td>-->
                                <!--<td>呼入技能组</td>-->
                                <!--<td>呼叫时间</td>-->
                                <!--<td>通话时长</td>-->
                                <!--<td>质检人员</td>-->
                                <!--<td>质检得分</td>-->
                            </tr>
                        </thead>
                        <tbody id="quality_check_list_query_table_data">
                        </tbody>
                    </table>
                    <div class="row-fluid class_list">
                        <div class="pagination pagination-small" for="qualityCheckListQueryFrm" style="display:table; margin:0;width:100%;"
                             ds_pagination_action="qualityCheck.queryQualityCheckList">
                            <span class="result_info">查询结果：<span class="result_count">10</span></span>
                            <ul style="float:right;">
                                <li><a href="#" value="0">&laquo;</a></li>
                                <li><a href="#" value="1">1</a></li>
                                <li><a href="#" value="2">2</a></li>
                                <li><a href="#" value="3">3</a></li>
                                <li><a href="#" value="4">4</a></li>
                                <li><a href="#" value="5">5</a></li>
                                <li><a href="#" value="6">&raquo;</a></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<div id="show_quality_comments_pane"></div>
<script type="text/javascript">
    $(function(){
        $('#quality_check_list_datetime_picker_start').datetimepicker({
//            controlType: utils.jqueryUITimepickerControl,
            timeFormat: "HH:mm:ss",
            dateFormat: "yy-mm-dd",
            showSecond: true
        });
        $('#quality_check_list_datetime_picker_end').datetimepicker({
//            controlType: utils.jqueryUITimepickerControl,
            timeFormat: "HH:mm:ss",
            dateFormat: "yy-mm-dd",
            showSecond: true
        });
    });

    utils.loadSearchInput({ id: "quality_check_list_disposal_agent_select_user",
        width: "183",
        height: "14",
        tip: "按姓名,拼音,工号搜索",
        data: getCache("agents"),
        searchField: ["displayName", "exten", "pinyin"],
        pinyinField: ["displayName"],
        listField: ["displayName", "exten"],
        userIdField: "_id",
        showField: "displayName",
        showAllList: true,
        callbackFuc: function (object) {
            $("#quality_check_list_disposal_agent_select_input").val(object._id);
        },
        onKeyChanged: function () {
            if ($("#quality_check_list_disposal_agent_select_user_input").val() != "") {
                $("#quality_check_list_disposal_agent_select_input").val("serachInputNoresult");
            } else {
                $("#quality_check_list_disposal_agent_select_input").val("");
            }
        }
    });
</script>
