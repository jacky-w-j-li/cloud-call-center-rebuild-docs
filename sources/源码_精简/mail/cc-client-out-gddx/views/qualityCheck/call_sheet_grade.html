<h5>请您评分</h5>
<form>
<input type="hidden" name="callSheetID" value="__CALL_SHEET_ID"/>
<input type="hidden" name="offeringTime" value="__OFFERING_TIME"/>
<input type="hidden" name="disposalAgent" value="__DISPOSAL_AGENT"/>
<table class="table table-striped table-bordered table-hover" id='callSheetGradeTable'>
    <tr class="info" >
        <td style="width:120px;">评分项</td>
        <td>权重 | 打分</td>
    </tr>
    __CALL_SHEET_GRADE_CONFIG
    <tr>
        <td>
            总分
        </td>
        <td>
            <h4 id="gradeAmount" style="color:green;">0</h4>
        </td>
    </tr>
    <tr>
        <td>
            备注
        </td>
        <td>
            <textarea name="COMMENTS" style="width:400px;"></textarea>
        </td>
    </tr>
</table>
<a href="#" class="btn btn-primary ds_form_action" ds_action="qualityCheck.saveCallSheetGrade">保存并评分下一个</a>
</form>
