<style type="text/css" id="cti_ConfigTableHeader_style"></style>
<div id="cti_ConfigTableHeader" class="modal hide fade in">
    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true">×</button>
        <h3>平台监控-表头显示配置</h3>
    </div>
    <div class="modal-body">
        <div class="row-fluid">
        <form id="cti_ConfigTableHeader_form">
        <input type="hidden" name="reportType" value="im_monitor_agent" style="border-color: rgb(204, 204, 204);">
        <input type="hidden" name="reportName" value="座席监控列表" style="border-color: rgb(204, 204, 204);">
            <table class="table table-striped table-bordered table-hover">
                <thead>
                    <tr>
                        <td>是否显示</td>
                        <td>表头名称</td>
                    </tr>
                </thead>
                <tbody>
                    <tr disabled="disabled">
                        <td colspan="2"><input type="checkbox" name="agentName@座席" disabled="disabled" checked="checked"> 座席(必选)、<input type="checkbox" name="agentNo@工号" disabled="disabled" checked="checked"> 工号(必选)、<input type="checkbox" name="answerStyle@接听方式" disabled="disabled" checked="checked"> 接听方式(必选)、<input type="checkbox" name="state@状态" disabled="disabled" checked="checked"> 状态(必选)</td></td>
                    </tr>
                    <tr>
                        <td><input type="checkbox" name="stateTime@状态时长" checked="checked"></td>
                        <td>状态时长</td>
                    </tr>
                    <tr>
                        <td><input type="checkbox" name="dealingTime@外呼时长" checked="checked"></td>
                        <td>外呼时长</td>
                    </tr>
                    <tr>
                        <td><input type="checkbox" name="queueName@技能组" checked="checked"></td>
                        <td>技能组</td>
                    </tr>
                    <tr>
                        <td><input type="checkbox" name="customerNo@客户号码" checked="checked"></td>
                        <td>客户号码</td>
                    </tr>
                    <tr>
                        <td><input type="checkbox" name="answerCount@已接听数" checked="checked"></td>
                        <td>已接听数</td>
                    </tr>
                    <tr>
                        <td><input type="checkbox" name="dealingCount@外呼总数" checked="checked"></td>
                        <td>外呼总数</td>
                    </tr>
                    <tr>
                        <td><input type="checkbox" name="dealingSuccessCount@外呼成功数" checked="checked"></td>
                        <td>外呼成功数</td>
                    </tr>
                    <tr>
                        <td><input type="checkbox" name="operation@操作" disabled="disabled" checked="checked"></td>
                        <td>操作(必选)</td>
                    </tr>
                </tbody>
            </table>
        </form>
        </div>
    </div>
    <div class="modal-footer">
        <a href="#" class="btn btn-primary btn-small" onclick="_cti_saveTableHeader();"> 保存</a>
        <a href="#" class="btn" onclick="$('#cti_ConfigTableHeader').modal('hide');"> 取消</a>
    </div>
</div>
