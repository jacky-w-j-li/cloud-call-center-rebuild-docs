<div class="">
    <div id="_monitoring" class="monitoring">
        <div class="form_head" style="border-top:none;">
            <div class="form_title" >
                <span class='form_caption'>今日呼叫情况总览</span>
            </div>
        </div>
        <div id="_todayCallChartTip" class="todayCallChartTip">
            <div class="clear5"></div>
            <div class="chartTipBlock"><span class="colorA">&nbsp;&nbsp;</span>呼入接通</div>
            <div class="chartTipBlock"><span class="colorB">&nbsp;&nbsp;</span>呼入未接</div>
            <div class="chartTipBlock"><span class="colorC">&nbsp;&nbsp;</span>呼出接通</div>
            <div class="chartTipBlock"><span class="colorD">&nbsp;&nbsp;</span>呼出未接</div>
            <div class="clear"></div>
        </div>

        <div id="_TodayPandect" class="TodayPandect">
            <div id="_TodayPandectChart" >
                <div class="todayChart">
                    <div id="_today_call_sum" class="todayChartCallSum">呼叫总量：0</div>
                    <div class="clear5"></div>
                    <div id="_todayChartInCallBox" class="todayChartInCall" >
                        <div id="_today_call_in_success" class="todayCallInSuccess" ></div>
                        <div id="_today_call_in_failure" class="todayCallInFailure" ></div>
                    </div>
                    <div id="_todayChartOutCallBox" class="todayChartOutCall">
                        <div id="_today_call_out_success" class="todayCallOutSuccess"></div>
                        <div id="_today_call_out_failure" class="todayCallOutFailure"></div>
                    </div>
                    <div class="todayInCallBox">
                        <div class="clear5"></div>
                        <div id="_today_call_in_sum" class="todayInCallSum">呼入总量：0</div>
                    </div>
                    <div class="todayOutCallBox">
                        <div class="clear5"></div>
                        <div id="_today_call_out_sum" class="todayOutCallSum" >呼出总量：0</div>
                    </div>
                    <div class="clear5"></div>
                </div>
            </div>
        </div>

        <div class="form_head">
            <div class='form_title'>
                <span class='form_caption'>服务号接通比例分析图</span>
            </div>
        </div>

        <div id="_todayServiceNumberChartTip" class="todayServiceNumberChartTip">
            <div class="clear5"></div>
            <div class="chartTipBlock"><span class="colorA">&nbsp;&nbsp;</span>呼入接通</div>
            <div class="chartTipBlock"><span class="colorB">&nbsp;&nbsp;</span>呼入未接</div>
            <div class="clear"></div>
        </div>
        <div id="_ServiceNumber" class="ServiceNumber">
            <div id="_ServiceNumberChart"> </div>
        </div>

        <div class="form_head">
            <div class='form_title'>
                <span class='form_caption'>二十四小时分时段呼入图表</span>
            </div>
        </div>

        <div id="_todayInCallChartTip" class="todayInCallChartTip">
            <div class="clear5"></div>
            <div class="chartTipBlock"><span class="colorE">&nbsp;&nbsp;</span>呼入总数</div>
            <div class="chartTipBlock"><span class="colorA">&nbsp;&nbsp;</span>呼入已接数</div>
            <div class="clear"></div>
        </div>
        <div id="_TwentyFourHourInChart" class="TwentyFourHourInChart">
            <div id="_TwentyFourHourInCallMouseTip" class="TwentyFourHourInCallMouseTip">今日呼入统计</div>
            <div id="_TwentyFourHourInCallChartArea" class="TwentyFourHourInCallChartArea"> </div>
        </div>

        <div class="form_head">
            <div class='form_title'>
                <span class='form_caption'>二十四小时分时段呼出图表</span>
            </div>
        </div>

        <div id="_todayOutCallChartTip" class="todayOutCallChartTip">
            <div class="clear5"></div>
            <div class="chartTipBlock"><span class="colorE">&nbsp;&nbsp;</span>呼出总数</div>
            <div class="chartTipBlock"><span class="colorC">&nbsp;&nbsp;</span>呼出接通数</div>
            <div class="clear"></div>
        </div>
        <div id="_TwentyFourHourOutChart" class="TwentyFourHourOutChart">
            <div id="_TwentyFourHourOutCallMouseTip" class="TwentyFourHourOutCallMouseTip">今日呼出统计</div>
            <div id="_TwentyFourHourOutCallChartArea" class="TwentyFourHourOutCallChartArea"> </div>
        </div>
        <div class="clear10" style="height: 50px;">&nbsp;</div>
    </div>
</div>
