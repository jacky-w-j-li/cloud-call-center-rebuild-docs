<div class="row-fluid">
    <div class="span12 search_item">
        <label>导入状态</label>
        <select name="flag" id="search_flag__#menu#_" class="ds_search_item">
        </select>
    </div>
</div>
<div class="row-fluid">
    <div class="span12 search_item">
        <label >创建时间</label>
        <input name="createTime_begin_date" class="ds_search_item ds_date _#menu#_" type="text" placeholder="yyyy-mm-dd">
        <input name="createTime_begin_time" class="ds_search_item ds_time" type="text" placeholder="00:00" pattern="([01]?[0-9]|2[0-3]):[0-5][0-9]">
        <label style="width: 16px">至</label>
        <input name="createTime_end_date" class="ds_search_item ds_date _#menu#_" type="text" placeholder="yyyy-mm-dd">
        <input name="createTime_end_time" class="ds_search_item ds_time" type="text" placeholder="00:00" pattern="([01]?[0-9]|2[0-3]):[0-5][0-9]">
    </div>
</div>
<script type="text/javascript">
    var dic=getCache("impTaskStatus");
    var options = ['<option value="" selected>--请选择--</option>'];
    for(var i=0;i<dic.length;i++){
        options.push('<option value="'+dic[i].code_value+'">'+dic[i].code_name+'</option>');
    }
    $('#search_flag__#menu#_').html(options.join(""));
</script>
