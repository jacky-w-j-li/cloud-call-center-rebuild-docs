<script id="tmpl_cust_assgin" type="text/x-jquery-tmpl">
    <div class="span4" ds_data="${deptOrSeasOrPersonId}">

    function customer_removeAgent(src) {
        $(src).closest("span").remove();
        filterCustAssign();
    }
    function filterCustAssign(){
//        var pane=$("#_#menu#__customer");
        var pane=$('#batch_modal');
        var _agents = pane.find("input[name='filterAgent']");
        var _filterUsers=[];
        _agents.each(function(){
            _filterUsers.push($(this).val());
        });
//        var users = getCache("agents");
        var users=filterUserByScope('customer');
        var filterUsers = [];
        if(_filterUsers.length>0){
            for(var i=0;i<users.length;i++){
                var u=users[i];
                if($.inArray(u._id,_filterUsers)!=-1){
                    filterUsers.push(u);
                }
            }
        }else{
            for(var i=0;i<users.length;i++){
                var u=users[i];
                if(u.status=='enable'){
                    filterUsers.push(u);
                }
            }
        }

        filterUsers=handler.customer._bubbleSort(filterUsers);
        var html=[];
        for(var i=0;i<filterUsers.length;i++){
            var u=filterUsers[i];
            if(u.status=='enable'){
                var tmpl=pane.find("#tmpl_cust_assgin").tmpl(u).get(0).outerHTML;
                if((i+1)%3==1){
                    html.push('<div class="row-fluid">'+tmpl);
                }else if((i+1)%3==0){
                    html.push(tmpl+'</div>');
                }else{
                    html.push(tmpl);
                }
            }
        }
        if(filterUsers.length%3==1){
            html.push('<div class="span8"></div></div>');
        }else if(filterUsers.length%3==2){
            html.push('<div class="span4"></div></div>');
        }
        $(".cust_assgin_container",pane).html(html.join(""));
    }
