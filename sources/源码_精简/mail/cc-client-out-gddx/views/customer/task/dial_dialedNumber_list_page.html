<div id="import_list_dial_task_dialedNumber"  ds_menu="_#menu#_" class="list_check_pane">
    <div class="contacts_caption" style="">
        <div class="cancel_edit" style="">
            <div class="list_check_all" style="cursor: pointer;" >
                <b class="ico_select_checkbox ico ico_wrap" style="top:10px;left:5px;"></b>
            </div>
            <div style="display: inline-block;margin-left: 30px;font-weight: bold;">
                已选
                <span class="bottom_toolbar_selsize_num">
                    0
                </span>
                项
            </div>
            <span class="pull-right">
                <a href="#" class="ds_do_action" ds_action="cancelDealToolbar" ds_data="customer" ds_attr="_#menu#_">取消</a>
            </span>
        </div>
        <div class="caption-top clearfix">
            <div class="search_condition" style="display:none;"></div>
            <div class="header_wrap clearfix">
                <form id="frm_customer_advanced_search">
                    <input name="dbType" type="hidden"  value="" />
                    <input name="menu" type="hidden"  value="_#menu#_" />
                    <input name="status" type="hidden"  value="" />
                    <span class="refresh ds_form_action" style="display: none;" ds_action="customer.task.queryDialedNumberTaskList"></span>
                    <div class="header_search_wrap pull-left quick_search" style="">
                        <div class="header_search_button ds_form_action dial_dialedNumber_task_normal_search normal_search" ds_action="customer.task.queryDialedNumberTaskList">
                            <i class="icon-search"></i>
                        </div>
                        <div class="header_search_input">
                            <div class="header_search_input_textbox">
                                <div class="dropdown">

                                    <ul class="dropdown-menu quick_menu" style="min-width: 90px;">
                                    </ul>
                                    <div class="textbox_wrap textbox_wrap_sty">
                                        <div class="textbox_inner">
                                            <input type="text" name="phone" class="textbox_input inpt_sty" maxlength="254" placeholder="输入号码查询">
                                        </div>
                                    </div>
                                </div>

                            </div>
                        </div>
                        <div class="text_link header_search_advanced customer_advanced_called_search">
                            高级搜索
                        </div>
                    </div>
                </form>

                <!--<div class="header_func_plus pull-right"><i class="icon-plus"></i></div>-->
            </div>
            <div class="ds_search_filter" style="display: none;">
            </div>
        </div>

    </div>
    <div tabindex="-1" id="customer_advanced_called_search_pane" class="advanced_search_pane hidden">
    </div>
    <div class="list_container">
        <div class="list-inside">
        </div>
        <div class="list-footer">
            <div class="pagination pagination-small" for="frm_customer_advanced_search_dial_task_dialedNumber" ds_pagination_action="customer.task.queryDialedNumberTaskList">
                <span style="float:left;">查询结果：<span class="result_count">0</span></span>
                <ul class="" style="float:right;padding-right: 6px;">
                    <li>
                        <a href="#"  value="0">«</a>
                    </li>
                    <li>
                        <a href="#"  value="1">1</a>
                    </li>
                    <li>
                        <a href="#"  value="2">2</a>
                    </li>
                    <li>
                        <a href="#"  value="3">3</a>
                    </li>
                    <li>
                        <a href="#"  value="4">4</a>
                    </li>
                    <li>
                        <a href="#"  value="5">5</a>
                    </li>
                    <li>
                        <a href="#"  value="6">»</a>
                    </li>
                </ul>
            </div>
        </div>

    </div>
</div>
<script id="customer_dialedNumber_task_page_item" type="text/x-jquery-tmpl">
    <div class="list_item">
        <div class="ds_do_action item_row item${_id} " ds_action="customer.task.showAgentCalledTaskInfo" ds_data="_#menu#_">
            <input type="hidden" name="_id" value="${taskId}" />
            <input type="hidden" name="phone" value="${checkEncryptTel(phone)}" />
            <input type="hidden" name="taskName" value="${taskName}" />
            <input type="hidden" name="createTime" value="${createTime}" />
            <input type="hidden" name="createUser" value="${createUser}" />
            <input type="hidden" name="source" value="${source}" />
            <input type="hidden" name="owner" value="${ownerId}" />
            <div class="card_row_new">
                <div class="card_right">
                    <span class="shortTime">${lastTime}</span>
                </div>
                <div class="card_middle">
                    <span  class="card_row_title" >${checkHideTel(phone)}</span>
                    {{if dialTag=="dealing"}}
                    <span class="no_status status_dealing">已接听</span>
                    {{/if}}
                    {{if dialTag=="noAnswer"}}
                    <span class="no_status status_no_answer">拒接</span>
                    {{/if}}
                    {{if dialTag=="nobody"}}
                    <span class="no_status status_nobody">无人接听</span>
                    {{/if}}
                    {{if dialTag=="stop"}}
                    <span class="no_status status_stop_service">停机</span>
                    {{/if}}
                    {{if dialTag=="emptyNumber"}}
                    <span class="no_status">空号</span>
                    {{/if}}
                    {{if dialTag=="other"}}
                    <span class="no_status status_other">其他</span>
                    {{/if}}
                    {{if dialTag=="NA"}}
                    <span class="no_status status_out_service">未标记</span>
                    {{/if}}
                </div>
                <div class="card_right">
                    <span>${taskName}</span>
                </div>
                <div class="card_middle">
                    <span >通话时长:${timeLen}</span>
                </div>
                <div class="card_right">
                    {{if taskStatus=="已关闭" || taskStatus=="已归档"}}
                    <span class="label-important">${taskStatus}</span>
                    {{else}}
                    <span class="label-success">进行中</span>
                    {{/if}}
                </div>
                <div class="card_middle">
                    <span>执行座席：${owner}</span>
                </div>
            </div>
        </div>
    </div>
</script>
