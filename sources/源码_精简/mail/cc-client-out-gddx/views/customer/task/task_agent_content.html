<script id="agent_task_detail" type="text/x-jquery-tmpl">
<div class="contact_summary">
<div class="baseinfo cust_base">
    <input type="hidden" id="callTaskId" value="${task._id}">
    <div id="task_cing">
        <div style="margin:30px 200px 0 0;line-height:20px;font-size:14px;color:#7b7b7b" class="clearfix">
        您正在进行<span class="hlig">${task.taskName}</span>外呼任务，每日任务量<span class="hlig">${taskUser.dailyTask}</span>${task.uword}，已完成<span class="hlig">${taskUserDaily.called}</span>${task.uword},请点击右侧开始按钮
        </div>
    </div>
    <div class="daily_chart" id="daily_chart">
    <button class="ds_do_action call_start" ds_action="customer.task.showAgentTaskInfo" ds_data="${task._id}">开始</button>
    <button class="ds_do_action call_next" ds_action="customer.task.showAgentTaskInfo" ds_data="${task._id}">下一条</button>
    <button class="ds_do_action call_mark" ds_action="customer.task.showMarkList" ds_data="${task._id}">结束</button>
        <div>
            <canvas width="100" height="100"></canvas>
            <span>${taskUser.total}</span>
        </div>
    </div>
</div>
</script>
<script id="agent_sample_detail" type="text/x-jquery-tmpl">
<div class="contact_summary">
<div class="baseinfo cust_base">
    <input type="hidden" id="saveTaskId" value="${taskId}" />

    <div id="task_cing">
    <div style="margin-right:200px;" class="clearfix">
        <h3 class="brdb pull-left">
        <span class="major">
            ${checkHideTel(sample.phone)} </span>
        <span id="tips_m" class="mark-un">未标记</span></h3>
    </div>
 <div class="text-mute" style="height:3em;margin-right:200px;overflow:hidden">
   客户名称： ${sample.name} 描述： ${sample.title}
</div>
    <div class="daily_chart" id="daily_chart">
    <button style="display:none" class="ds_do_action call_start" ds_action="customer.task.showAgentTaskInfo" ds_data="${task._id}">开始</button>
    <button class="ds_do_action call_next" ds_action="customer.task.showAgentTaskInfo" ds_data="${task._id}">下一条</button>
    <button style="display:block" class="ds_do_action call_mark" ds_action="customer.task.showMarkList" ds_data="${task._id}">结束</button>
        <div>
            <canvas width="100" height="100"></canvas>
            <span></span>
        </div>
    </div>
    </div>
</div>
</div>
</script>

            <div class="base_summary">
                <div style="font-size: 14px;line-height: 30px;">
                    <span style="color:#009900;font-weight:bold;">${phone}</span>未定位到客户。

</script>
