<div class="advanced_body">
    <form id="frm_agent_called_advanced_search" class="ds_search_form">
        <input type="hidden" name="isAdvanceSearch" value="1">
        <fieldset>
            <div class="row-fluid">
                <div class="span4 advanced_search_item ds_search_item">
                    <label>电话号码</label>
                    <input  name="phone" type="text" />
                </div>
                <div class="span4 advanced_search_item ds_search_item">
                    <label>任务名称</label>
                    <input  name="taskName" type="text" class=""/>
                </div>
                <div class="span4 advanced_search_item ds_search_item">
                    <label>拨打状态</label>
                    <select name="dialStatus" class="">
                        <option value="" selected>--请选择--</option>
                        <option value="linked" >已接听</option>
                        <option value="unlinked" >未接听</option>
                        <option value="" >未呼通</option>
                    </select>
                </div>
            </div>
            <div class="row-fluid">
                <div class="span4 advanced_search_item ds_search_item">
                    <label>客户转化状态</label>
                    <select name="custStatus" class="">
                        <option value="" >--请选择--</option>
                        <option value="1" >已转化</option>
                        <option value="2" >未转化</option>
                    </select>
                </div>
            </div>

            <div class="custom_fields_pane">
            </div>
            <div style="padding: 10px;">
                <button type="button" class="btn btn-small btn-primary ds_form_action  pull-right btn_advanced" ds_action="customer.task.searchCalledAdvanced" >搜索</button>
                <button type="button" class="btn btn-small  ds_do_action  pull-right" ds_action="resetForm" ds_data="_#menu#_" style="margin-right: 10px;">重置</button>
            </div>
        </fieldset>
    </form>
</div>
