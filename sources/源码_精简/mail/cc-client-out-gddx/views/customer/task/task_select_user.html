<script type="application/javascript">
    function _initAgents(_users,agents){
        if(agents==""){
            var html=['<lable width="80px">已选择座席：无</lable>'];
            $('#task_selected_agent').html(html.join(""));
            return;
        }
        var arr = agents.split(",");
        var html=['<lable width="80px">已选择座席：</lable>'];
        var h1 = '<span custid="_#displayId#_">_#displayName#_</span>&nbsp;&nbsp;';
        var h2 =  '<br><span custid="_#displayId#_" style="margin-left: 72px;">_#displayName#_</span>&nbsp;&nbsp;';
        var _agents = [];
        for(var i=0;i<arr.length;i++){
            for(var o in _users){
                if(arr[i] == _users[o]._id){
                    _agents.push(_users[o]);
                }
            }
        }
        _agents = handler.customer._bubbleSort(_agents);
        for(var i=0;i<_agents.length;i++){
            if(i!=0 && i%12==0){
                html.push(h2.replace(/_#displayName#_/g, _agents[i].displayName).replace(/_#displayId#_/g, _agents[i]._id));
            }else{
                html.push(h1.replace(/_#displayName#_/g, _agents[i].displayName).replace(/_#displayId#_/g, _agents[i]._id));
            }

        }
        $('#task_selected_agent').html(html.join(""));
    }
    function customer_removeAgent(src) {
        $(src).closest("span").remove();
        var users=filterUserByScope('custTask');
        var _users=[];
        for(var i=0;i<users.length;i++){
            var u=users[i];
            if(u.status=='enable'){
                _users.push(u);
            }
        }
        filterCustAssignAgent(_users);
    }

    function filterCustAssignAgent2(_users,arr) {
        var pane = $("#frm_task_select_user");
        var filterUsers = [];
        for (var i = 0; i < _users.length; i++) {
            var u = _users[i];
            if (($.inArray(u._id, arr) == -1)) {
                filterUsers.push(u);
            }
        }
        filterUsers=handler.customer._bubbleSort(filterUsers);
        var html=[];
        if(filterUsers.length == 0){
            pane.find(".ch_agents").hide();
            pane.find(".form_buttons .btn-blue").hide();
        }else{
            for(var i=0;i<filterUsers.length;i++){
                var u=filterUsers[i];
                var tmpl=$("#tmpl_cust_assgin").tmpl(u).get(0).outerHTML;
                // if((i+1)%3==1){
                //     html.push('<div class="row-fluid">'+tmpl);
                // }else if((i+1)%3==0){
                //     html.push(tmpl+'</div>');
                // }else{
                html.push(tmpl);
                // }
            }
        }
        $(".task_select_agent_container",pane).html(html.join(""));
    }
    function filterCustAssignAgent(_users) {
        var pane = $("#frm_task_select_user");
        var _agents = pane.find("input[name='filterAgent']");
        var _filterUsers = [];//过滤座席
        _agents.each(function () {
            _filterUsers.push($(this).val());
        });
        var filterUsers = [];
        for (var i = 0; i < _users.length; i++) {
            var u = _users[i];
            if ($.inArray(u._id, _filterUsers) != -1){
                filterUsers.push(u);
            }
        }
        filterUsers=handler.customer._bubbleSort(filterUsers);
        var html=[];
        for(var i=0;i<filterUsers.length;i++){
            var u=filterUsers[i];
            var tmpl=$("#tmpl_cust_assgin").tmpl(u).get(0).outerHTML;
            if((i+1)%3==1){
                html.push('<div class="row-fluid">'+tmpl);
            }else if((i+1)%3==0){
                html.push(tmpl+'</div>');
            }else{
                html.push(tmpl);
            }
        }
        $(".task_select_agent_container",pane).html(html.join(""));
    }

    function selectTaskAllAgent(sel){
        var pane = $("#frm_task_select_user").find('.task_select_agent_container');
        var all = pane.find("input[type=checkbox]");
        var task_num = $("input[name=dailyTaskAllAgent]").val();
        var unit = $(".unit").html();
        if(sel.checked==true){
            $.each(all,function(key, item){
                $(item).attr("checked",true).siblings("input").attr("disabled",false).val(task_num);
            });
            var total = task_num * all.length;
            if (total>0) {
                $("#dttotal").html("（共计" + total + "<span class='unit'>" + unit + "</span>/天）");
            }else{
                $("#dttotal").empty();
            }
        }else{
            $.each(all,function(key, item){
                $(item).attr("checked",false).siblings("input").attr("disabled",true).val("");
            });
            $("#dttotal").empty();
        }
    }
    function selectAgent(sel){
        var task_num = $("input[name=dailyTaskAllAgent]").val();
        var pane = $("#frm_task_select_user").find('.task_select_agent_container');
        var all = pane.find("input[type=checkbox]:checked");
        var total = 0;
        var unit = $(".unit").html();
        if(sel.checked==true){
            $(sel).siblings("input").attr("disabled",false).val(task_num);
            $.each(all,function(key, item){
                total += parseInt($(item).siblings("input").val());
            });
            if (total>0) {
                $("#dttotal").html("（共计" + total + "<span class='unit'>" + unit + "</span>/天）");
            }else{
                $("#dttotal").empty();
            }
        }else{
            $(sel).siblings("input").attr("disabled",true).val("");
            $.each(all,function(key, item){
                total += parseInt($(item).siblings("input").val());
            });
            if (total>0) {
                $("#dttotal").html("（共计" + total + "<span class='unit'>" + unit + "</span>/天）");
            }else{
                $("#dttotal").empty();
            }
        }
    }
    $(document).on("keyup", "input[name='dailyTask[]']", function(event){
        var src = $(event.currentTarget);
        var pane = $("#frm_task_select_user").find('.task_select_agent_container');
        var all = pane.find("input[type=checkbox]:checked");
        var total = 0;
        var unit = $(".unit").html();
        var value= src.val().replace(/[^\d]/g,'');
        src.val(value);
        $.each(all,function(key, item){
            total += parseInt($(item).siblings("input").val());
        });
        if (total>0) {
            $("#dttotal").html("（共计" + total + "<span class='unit'>" + unit + "</span>/天）");
        }else{
            $("#dttotal").empty();
        }
    });
</script>
