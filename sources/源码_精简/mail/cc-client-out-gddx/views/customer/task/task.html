
<div class="left_column ds_search_pane" id="import_list__#menu#_"  ds_menu="_#menu#_">
    <div class="contacts_caption">
        <div class="caption-top clearfix">
            <div style="float:right;">
                <button class="btn btn-small ds_do_action" ds_action="customer.task.showTaskAdd" ds_data="_#menu#_">添加外呼任务</button>
            </div>
            <span class="refresh ds_do_action" ds_action="customer.task.queryTaskList" ds_data="_#menu#_">
                <a href="javascript:void(0);" title="刷新" class="ajaxed"></a>
            </span>
            <div class="input-append" style="margin-left: 10px;">
                <form id="customer_task_query_frm">
                    <input type="hidden" name="menu" value='_#menu#_'/>
                    <input class="span2 ds_search_item" name="taskName" style="width: auto" type="text" placeholder="输入任务名称查询">
                    <button class="btn  ds_form_action" type="button" ds_action="customer.task.queryTaskList" title="查询">
                        <i class="icon-search"></i>
                    </button>
                </form>
                <!--<button type="button" class="btn" data-toggle="collapse"-->
                        <!--data-target="#search__#menu#_" style="height: 24px;" title="高级查询">-->
                    <!--<span class="caret"></span>-->
                <!--</button>-->
            </div>
        </div>
    </div>
    <div class="list_container compact-view">
        <div class="contact_list">
            <div class="ds_search_filter">
            </div>
            <div class="list-inside" >
            </div>
            <div class="pagination pagination-small" style="width:100%;margin:0 3px;" for="frm_customer_advanced_search__#menu#_" ds_pagination_action="customer.task.queryTaskList">
                <span style="float:left;margin-top:8px;font-size:12px;">查询结果：<span class="result_count">10</span></span>
                <ul class="" style="float:right;padding-right: 6px;">
                    <li>
                        <a href="#"  value="0">«</a>
                    </li>
                    <li>
                        <a href="#"  value="1">1</a>
                    </li>
                    <li>
                        <a href="#"  value="2">2</a>
                    </li>
                    <li>
                        <a href="#"  value="3">3</a>
                    </li>
                    <li>
                        <a href="#"  value="4">4</a>
                    </li>
                    <li>
                        <a href="#"  value="5">5</a>
                    </li>
                    <li>
                        <a href="#"  value="6">»</a>
                    </li>
                </ul>
            </div>
        </div>

    </div>
</div>
<div class="right_column" >
    <div class="contact_detail">
        <div class="content" >
            <div id="customer_import_task_pane">

            </div>
        </div>
    </div>
</div>
<script id="customer_task_page_item" type="text/x-jquery-tmpl">
    <div class="list_item">
        <div class="ds_do_action item_row item${_id} expanded" ds_action="customer.task.showTaskInfo" ds_data="_#menu#_">
            <input type="hidden" name="_id" value="${_id}">
            <div class="contact_item">
                <div class="right-items status status_lead">
                    <span class="status-name" style="color:green;" title="运行">
                        运行
                    </span>
                    <br>
                </div>
                <div class="recentTime">
                    <p>创建时间${createTime}</p>
                </div>
                <div class="middle-items" style="margin-left:10px;">
                    <div class="contact">
                        <span class="name">
                        <span class="major" title="${_id}" style="max-width: 315px;">
                            ${taskName}
                        </span>
                        <span class="minor" title="">
                        </span>
                    </span>
                </div>
                <div class="next_action">
                    <span style="top:8px;" class="action_date_id">
                    </span>
                    <span class="action_content" title="">
                    </span>
                </div>
            </div>
        </div>
    </div>
</script>
