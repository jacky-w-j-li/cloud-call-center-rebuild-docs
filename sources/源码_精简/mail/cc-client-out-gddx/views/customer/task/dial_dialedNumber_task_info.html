<script type="text/javascript">
    function task_dialStatus_stat(data){
        $('#task_pie_chart_dial').empty();
        $('#task_pie_chart_dial').highcharts({
            chart: {
                type: 'pie'
            },
            title: {
                text: '拨打统计图表'
            },
            plotOptions: {
                pie: {
                    allowPointSelect: true,
                    cursor: 'pointer',
                    dataLabels: {
                        enabled: false,
                        color: '#000000',
                        connectorColor: '#000000',
                        format: '<b>{point.name}</b>: {point.percentage:.1f} %'
                    },
                    showInLegend: true
                }
            },
            series: [
                {
                    type: 'pie',
                    name: '拨打统计',
                    data: data
                }
            ]
        });
    }
    function task_status_stat(data) {
        var pane=$("#chart_pane");
        $('#task_pie_chart_status').empty();
        $('#task_pie_chart_status').highcharts({
            chart: {
                type: 'pie'
            },
            title: {
                text: '成交统计图表'
            },
            plotOptions: {
                pie: {
                    allowPointSelect: true,
                    cursor: 'pointer',
                    dataLabels: {
                        enabled: false,
                        color: '#000000',
                        connectorColor: '#000000',
                        format: '<b>{point.name}</b>: {point.percentage:.1f} %'
                    },
                    showInLegend: true
                }
            },
            series: [
                {
                    type: 'pie',
                    name: '成交统计',
                    data : data
                }
            ]
        });
    }
    function _initListHandler(list){
        var pane= $("#view_dial_task_list_content");
        var dialListPane=pane.find(".task_user_dial_list");
        var statusListPane=pane.find(".task_user_status_list");
        if(list.length > 0){
            var html = [];
            var html2=[];
            var viewTemp = ["<tr><td>_#displayName#_</td>"];
            var agents=getCache("agents");
            var tmls=getCache('custTmpls');
            var status = tmls[0].status;
            for(var i in status){
                viewTemp.push("<td>_#"+i+"#_</td>");
            }
            viewTemp.push("</tr>");
            DS.getView('customer/task/dial_task_list_item', function (view) {
//                html.push(DS.renderMethodViewNew(view,{menu:"_#menu#_"}));
                for (var i = 0; i < list.length; i++) {
                    var _obj=list[i];
                    _obj.menu = "_#menu#_";
                    for(var j=0;j<agents.length;j++){
                        var agent = agents[j];
                        if(agent._id == _obj.agent){
                            _obj.displayName = agent.displayName;
                        }
                    }
                    handler.customer.task._initDialTaskUserNullFields(_obj);
                    html.push(DS.renderMethodViewNew(view,_obj));
                    html2.push(DS.renderMethodViewNew(viewTemp.toString(),_obj));
                }
                dialListPane.html(html.join(""));
                statusListPane.html(html2.join(""));
            });
        } else {
            var html='<tr><td class="text-center" colspan="10">没有记录!</td></tr>';
            dialListPane.html(html);
            statusListPane.html(html);
        }
    }
    $(function(){
        var status = getCache("custTmpls")[0].status;
        var action={
            action:"app.customer.task.statDialUserData",
            data:{
                taskId:"_#taskId#_"
//                status:status
            }
        };
        DS.send(action, function (response) {
            if (response.success) {
                var docs = response.data;
                //初始化列表
                _initListHandler(docs);
                //统计数据
                var totalStat = 0;
                var calledStat = 0;
                var linkedStat =0;
                var statusCount = {};
                for(var i in status){
                    statusCount[i] = 0;
                }
                for(var i=0;i<docs.length;i++){
                    var obj = docs[i];
                    var total = parseInt(obj.total || 0);
                    var called = parseInt(obj.called || 0);
                    var linked = parseInt(obj.linked || 0);
                    totalStat+=total;
                    calledStat+=called;
                    linkedStat+=linked;

                    for(var j in status){
                        var val =parseInt(obj[j] || 0);
                        statusCount[j]+=val;
                    }
                }
                //拨打图表
                var totalStat = totalStat;
                var calledStat = calledStat;
                var linkedStat = linkedStat;
                var chartData=[
                    {name:"未接听",y:calledStat - linkedStat},
                    {name:"已接听",y:linkedStat},
                    {name:"未拨打",y:totalStat - calledStat}
                ];
                var count = 0;
                for(var i=0;i<chartData.length;i++){
                    var obj = chartData[i];
                    if(obj.y==0){count++};
                }
                if(count == chartData.length){
                    task_dialStatus_stat(chartData);
                }else{
                    $('#task_pie_chart_dial').empty();
                    $('#task_pie_chart_dial').css("height","30px");
                }
                //成交统计图表
                var chartData2=[];
                var count2 = 0;
                for(var i in status){
                    var val = statusCount[i] || 0;
                    chartData2.push({
                        name:status[i],
                        y:val
                    });
                    if(val==0 || val==null){count2++};
                }
                if(count2==chartData2.length){
                    $('#task_pie_chart_status').empty();
                    $('#task_pie_chart_status').css("height","30px");
                }else{
                    task_status_stat(chartData2);
                }
            }else{
                $().alertmessage('showError', response.message||errMsg);
            }
        });

    });
</script>
