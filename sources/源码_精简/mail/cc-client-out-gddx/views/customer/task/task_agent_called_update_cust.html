<div class="contact_summary" style="padding: 18px;">
    <div class="" style="height:100%;min-height: 500px;background-color: white">
        <div class="edit_customer">
            <form>
                <input type="hidden" name='_id' />
                <!--<div style="border-bottom: 1px solid #f0f0f0;line-height:30px;">-->
                    <!--<h4 style="float:left;line-height: inherit;">-->
                        <!--更新客户 &nbsp;&nbsp;-->
                        <!--&lt;!&ndash;<button type="button" class="btn btn-small btn-link ds_do_action pull-right" ds_action="call.showSelectCust" ds_data="_#menu#_">客户已存在，点此选择</button>&ndash;&gt;-->
                    <!--</h4>-->
                <!--</div>-->

                <div class="" style="width:500px;">
                    <div id="icc_agent_called_update_customer_customerAddDiv"></div>
                    <div class="form_buttons" style="padding:5px 0 0 117px;margin-top: 30px;">
                        <button type="button" class="btn-blue ds_form_action " flag="_#dealSrc#_" ds_action="customer.task.updateCustomer">保存</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
<script id="tmpl_custmanage_agent_callled_update" type="text/x-jquery-tmpl">
        <fieldset>
    <input type="hidden" name="dbType" value="${_id}">
    {{each(key,field) stable_fields}}
    {{if field.name=='name'}}
        <div class="row_item">
            <label >${field.value}</label>
            <input  name="${field.name}" type="text" ${field.required}/>
        </div>
        <div class="row_item">
            <label  style="margin-top: 0;">客户状态</label>
            <select class="select_status status_prospect" name="status" required>
                {{each(key,name) status}}
                    <option value="${key}" class="${key}">${name}</option>
                {{/each}}
            </select>
        </div>
    {{else field.name=='phone'}}
        <div class="row_item phone">
            <a href="#" class="plus"></a>
            <label>${field.value}</label>
            <input   name="tel[]" type="text" value=""   style="width:150px;" ${field.required}>
            <input   name="memo[]" type="text" value="" placeholder="备注.."  style="width:150px;margin-left:-1px;">
        </div>
    {{else field.name=='email'}}
        <div class="row_item email">
            <a href="#" class="plus"></a>
            <label>${field.value}</label>
            <input   name="email[]" type="text" value=""   style="width:150px;" ${field.required}>
            <input   name="eMemo[]" type="text" value="" placeholder="备注.."  style="width:150px;margin-left:-1px;">
        </div>
    {{else field.name=='weixin'}}
        <div class="row_item weixin">
            <a href="#" class="plus"></a>
            <label>${field.value}</label>
            <input   name="num[]" type="text" value=""   style="width:150px;" ${field.required}>
            <input   name="wxMemo[]" type="text" value="" placeholder="备注.."  style="width:150px;margin-left:-1px;">
        </div>
    {{else field.name=='province'}}
        <div class="row_item">
            <label  style="margin-top: 0;">${field.value}</label>
            <select class="cust_province_casecade" name="${field.name}" ${field.required}><option value="" selected>--请选择--</option></select>
        </div>
    {{else field.name=='city'}}
        <div class="row_item">
            <label  style="margin-top: 0;">${field.value}</label>
            <select class="cust_city_casecade" name="${field.name}" ${field.required}><option value="" selected>--请选择--</option></select>
        </div>
    {{else field.name=='note'||field.name=='address'}}
        <div class="row_item">
        <label  style="margin-top: 0;">${field.value}</label>
        <textarea  name="${field.name}" rows="3" cols="" style="resize: vertical; width:300px; margin-bottom: 0px;" ${field.required}></textarea>
        </div>
    {{else field.name=='sex'}}
        <div class="row_item">
            <label>${field.value}</label>
            <label for="sex1" style="float:left;width:auto;"><input type="radio" name="${field.name}" value="0" id='sex1' ${field.required}/>男</label>&nbsp;
            <label for="sex2" style="float:left;width:auto;"><input type="radio" name="${field.name}" value="1" id='sex2' ${field.required}/>女</label>
        </div>
    {{else field.name=='birth'}}
    <div class="row_item">
        <label for="datetimepicker_birth">${field.value}</label>
        <input name="${field.name}" type="text" id="datetimepicker_birth" class="date_picker" ${field.required}/>
    </div>
    {{else}}
        <div class="row_item">
        <label >${field.value}</label>
        <input  name="${field.name}" type="text"  ${field.required}/>
        </div>
    {{/if}}
    {{/each}}

    </fieldset>

    <fieldset>
       {{if (source && source.length>0) }}
            <div class="row_item">
                <label  style="margin-top: 0;">数据来源</label>
                <select class="" name="custsource1" >
                    <option value="">--请选择--</option>
                    {{each(key,name) source}}
                    <option value="${key}">${name}</option>
                    {{/each}}
                </select>
            </div>
        {{/if}}

        <div class="row_item ">
            <label style="margin-top: 0;">所属人</label>
            <input name="owner" type="hidden" class="select_input" id="agent_owner_customerUpdate_input"   />
            <div id="agent_owner_customerUpdate_user" class="combobox_agent"  disabled="disabled">
                <input type="text" class="select_input" id="displayOwner"   />
            </div>
        </div>
    </fieldset>

    <fieldset>
        <div class="frm_item">
            <label class="frm_left_label2">附件</label>
            <div class="frm_right_content2">
                <div class="">
                    <div id="${qiniuId}-customer-qiniu" class="float:left;line-height: 20px;">
                        <a class="btn btn-default btn-small btn-link" id="${qiniuId}-pickCustomerFiles" href="#" >
                            <i class="icon-plus"></i>
                            <sapn>上传附件</sapn>
                        </a>
                        <div class="muted" style="float:right;line-height:20px">
                            <p>（大小不超过10MB）</p>
                        </div>
                    </div>
                </div>

               <div class="row-fluid" id="customer_files" style="margin-left:50px">
                    <table class="table table-hover text-left customer_attach_container" style="margin-top:5px;display:none;width: 450px;background-color:#fff;">
                        <tbody id="${qiniuId}-fsUploadProgress">
                        </tbody>
                    </table>
               </div>

                <div style="clear: both;"></div>
                <div class="progress attach progress-striped" style="margin-left:118px;width:200px;display: none;">
                    <div class="bar" style="width: 0%;"></div>
                </div>
                <ul class="thumbnails_customer" style='margin-left:118px;'>
                </ul>
                <div style="clear: both;"></div>
            </div>
        </div>
    </fieldset>

    {{if custom_fields.length>0}}
    <fieldset>
        <legend style="width: 475px;margin-bottom: 8px;font-size:15px;">自定义字段</legend>
        {{each custom_fields}}
        {{if type=='single'}}
        <div class="frm_item">
            <label class="frm_left_label2">${name}</label>
            <div class="frm_right_content2">
                <input id="cust_${_id}" name="${_id}" type="text"  msgName='${name}'  ${required} />
            </div>
        </div>
        {{else type=='multi'}}
        <div class="frm_item">
            <label class="frm_left_label2">${name}</label>
            <div class="frm_right_content2">
                <textarea  name="${_id}" rows="3" cols="" style="resize: vertical; width:300px; margin-bottom: 0px;"  msgName='${name}'  ${required}></textarea>
            </div>
        </div>
        {{else type=='number'}}
        <div class="frm_item">
            <label class="frm_left_label2">${name}</label>
            <div class="frm_right_content2">
                <input  name="${_id}" type="text" msgName='${name}'  dataType='Number' msg='必须为数字'  ${required}/>
            </div>
        </div>
        {{else type=='date'}}
        <div class="frm_item">
            <label class="frm_left_label2">${name}</label>
            <div class="input-append">
                <input  type="text" name="${_id}" msgName='${name}'  class="date_picker" style="width:115px;cursor:pointer;position:static;" value="" readonly="true" onkeydown="readOnlyKeyDown()" ${required}>
                <span class="add-on datetimepicker-remove" style="height: 14px;line-height: 15px"><i class="icon-remove"></i></span>
            </div>
        </div>

        {{else type=='dropdown'}}
        <div class="frm_item">
            <label class="frm_left_label2">${name}</label>
            <div class="frm_right_content2">
                <select name="${_id}" msgName='${name}'  ${required}>
                    <option value="" selected="selected">--请选择--</option>
                    {{each(key,val) choices}}
                    <option value="${key}">${val}</option>
                    {{/each}}
                </select>
            </div>
        </div>
        {{else type=='checkbox'}}
        <div class="frm_item">
            <label class="frm_left_label2">${name}</label>
            <div class="frm_right_content2">
                {{each(key,val) choices}}
                <label><input type="checkbox" fieldgroup="1" name="${_id}[]" value="${key}" msgName='${name}'  ${required}/>${val}</label>
                {{/each}}
            </div>
        </div>
        {{else type=='radio'}}
        <div class="frm_item">
            <label class="frm_left_label2">${name}</label>
            <div class="frm_right_content2">
                {{each(key,val) choices}}
                <label><input type="radio" name="${_id}" value="${key}" msgName='${name}'  ${required}/>${val}</label>
                {{/each}}
            </div>
        </div>
        {{/if}}
        {{/each}}
    </fieldset>
    {{/if}}
</script>
