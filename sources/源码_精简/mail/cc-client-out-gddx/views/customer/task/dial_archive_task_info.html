                    <th onclick="utils.sortTable('customer_task_agent_stat', 0, 'string', this);" style="cursor: pointer;" state="init">参与座席<span class="sort monitor_sort">&nbsp;</span></th>

                </tbody>

</div>

<script type="text/javascript">
    function task_dialStatus_stat(data){
        $('#task_pie_chart_dial').empty();
        $('#task_pie_chart_dial').highcharts({
            colors: ['#b1dd68', '#e97a6f', '#f3a472', '#cdcdcd', '#818181', '#f9edd1', '#c578a5'],
            chart: {
                type: 'pie'
            },
            title: {
                text: '任务号码统计图表'
            },
            plotOptions: {
                pie: {
                    allowPointSelect: true,
                    cursor: 'pointer',
                    dataLabels: {
                        enabled: false,
                        color: '#000000',
                        connectorColor: '#000000',
                        format: '<b>{point.name}</b>: {point.percentage:.1f} %'
                    },
                    showInLegend: true
                }
            },
            series: [
                {
                    type: 'pie',
                    name: '号码统计',
                    data: data
                }
            ]
        });
    }

    function _initListHandler(total,list){
        var pane= $("#view_dial_task_list_content");
        var dialListPane=pane.find(".task_user_dial_list");
        if(list.length > 0){
            var html = [];
            var agents=getCache("agents");
            DS.getView('customer/task/dial_close_task_list_item', function (view) {
                for (var i = 0; i < list.length; i++) {
                    var _obj=list[i];
                    _obj.menu = "_#menu#_";
                    for(var j=0;j<agents.length;j++){
                        var agent = agents[j];
                        if(agent._id == _obj.agent){
                            _obj.displayName = agent.displayName;
                        }
                    }
                    _obj.total = total;
                    handler.customer.task._initDialTaskUserNullFields(_obj);
                    html.push(DS.renderMethodViewNew(view,_obj));
                }
                dialListPane.html(html.join(""));
            });
        } else {
            var html='<tr><td class="text-center" colspan="10">没有记录!</td></tr>';
            dialListPane.html(html);
        }
    }
    $(function(){
        var action={
            action:"app.report.statDialUserData",
            data:{
                taskId:"_#taskId#_"
            }
        };
        DS.send(action, function (response) {
            if (response.success) {
                var docs = response.list;
                var total = parseInt(response.total || 0);
                //初始化列表
                _initListHandler(total,docs);
                //统计数据
                var linkedStat =0;
                var emptyNumberStat = 0;
                var noAnswerStat = 0;
                for(var i=0;i<docs.length;i++){
                    var obj = docs[i];
                    var linked = parseInt(obj.linked || 0);
                    var emptyNumber = parseInt(obj.emptyNumber || 0);
                    var noAnswer = parseInt(obj.noAnswer || 0);
                    linkedStat+=linked;
                    emptyNumberStat+=emptyNumber;
                    noAnswerStat+=noAnswer;
                }
                //任务拨打图表
                var linkedStat = linkedStat;
                var emptyNumberStat = emptyNumberStat;
                var noAnswerStat = noAnswerStat;
                var chartData=[
                    {name:"有效",y:linkedStat},
                    {name:"空号",y:emptyNumberStat},
                    {name:"拒接",y:noAnswerStat}
                ];
                if(linkedStat==0&&emptyNumberStat==0&&noAnswerStat==0){
                    chartData = [];
                }
                task_dialStatus_stat(chartData);
            }else{
                $().alertmessage('showError', response.message||errMsg);
            }
        });
    });
</script>
