<div class="advanced_body">
    <form id="frm_called_advanced_search" class="ds_search_form">
        <input type="hidden" name="isAdvanceSearch" value="1">
        <fieldset>
            <div class="row-fluid">
                <div class="span4 advanced_search_item ds_search_item">
                    <label>电话号码</label>
                    <input  name="phone" type="text" value="" />
                </div>
                <div class="span4 advanced_search_item ds_search_item">
                    <label>任务名称</label>
                    <input  name="taskName" type="text" class=""/>
                </div>
                <div class="span4 advanced_search_item ds_search_item">
                    <label>标记状态</label>
                    <select name="dialTag" class="">
                        <option value="" selected>--请选择--</option>
                        <option value="dealing" >已接听</option>
                        <option value="noAnswer" >拒接</option>
                        <option value="nobody" >无人接听</option>
                        <option value="stop" >停机</option>
                        <option value="emptyNumber" >空号</option>
                        <option value="outOfService" >占线</option>
                        <option value="other" >其他</option>
                    </select>
                </div>
            </div>
            <div class="row-fluid">
                <div class="span4 advanced_search_item ds_search_item">
                    <label>客户转化状态</label>
                    <select name="custStatus" class="">
                        <option value="" >--请选择--</option>
                        <option value="1" >已转化</option>
                        <option value="2" >未转化</option>
                    </select>
                </div>

                    <input name="owner" type="hidden" class="select_input" id="dial_task_agent_owner_select_input" />
                    <input name="ownerdep" type="hidden" class="select_input" id="dial_task_agent_owner_select_input_dep" />
