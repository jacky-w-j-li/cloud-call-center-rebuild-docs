<div class="contact_summary" style="padding: 18px;">
    <div class="row-fluid">
        <div class="merge_customer">
                <div style="border-bottom: 1px solid #f0f0f0;line-height:30px;">
                    <h4 style="line-height: inherit;">
                        合并客户 &nbsp;&nbsp;
                        <a class="select_old_cust ds_do_action pull-right" ds_action="call.showSelectCust" ds_data="_#menu#_" ds_attr="_#callNo#_"  style="font-size: 9px;display: none;">客户已存在，点此选择</a>
                        <!--<button type="button" class="btn btn-small btn-link ds_do_action pull-right" ds_action="call.showSelectCust" ds_data="_#menu#_">客户已存在，点此选择</button>-->
                    </h4>
                </div>

                <div class="alert alert-success mergeExplain">
                    <dl>
                        <dt><h4>说明:</h4></dt>
                        <dd>1.选择要合并的两个客户，并确定合并方向(客户A合并到客户B)。</dd>
                        <dd>2.合并时会保留客户B的数据，其中客户B中未填的客户信息由客户A补充,同时客户A的联系记录等信息也会合并到客户B中，合并后将删除A客户。</dd>
                    </dl>
                </div>
                <div class="span12" style="margin-left:0">
                    <div class="span4">
                        <div class="input-append row-fluid">
                            <span for="mergeCustomerA"></span>
                            <input  id="mergeCustomerA" type="hidden" readonly>
                            <button class="btn ds_do_action" type="button" ds_action="customer.showSelectOldCust" ds_data="mergeCustomerA">客户A查询</button>
                        </div>
                    </div>
                        <span class="btn btn-link text-center mergerto">合并到</span>
                    <div class="span4">
                        <div class="input-append row-fluid">
                            <span for="mergeCustomerB"></span>
                            <input  id="mergeCustomerB" type="hidden" readonly>
                            <button class="btn ds_do_action" type="button" ds_action="customer.showSelectOldCust" ds_data="mergeCustomerB">客户B查询</button>
                        </div>
                    </div>
                    <div class="span2">
                        <button class="btn btn-success ds_do_action" ds_action="customer.mergePreview" type="button">合并预览</button>
                    </div>
                </div>
                <div id="mergeCustomerDiv" class="hidden">
                    <div class="span12 user_batch_section" style="margin-left:0">
                        <h5>合并预览：</h5>
                        <form class="form-horizontal mergeCustForm edit_customer">
                            <div id="mergeCustomerInfo" style="width:500px;">

                            </div>
                            <div class="" style="width:500px;">
                                <div id="icc_update_customer_customerUpdateDiv"></div>
                                <div class="form_buttons" style="padding:5px 0 0 117px;">
                                    <button type="button" class="btn btn-small btn-primary ds_form_action pull-left btn_pad" ds_action="customer.mergeCustomer" ds_attr="_#flag#_" menu="_#menu#_">保存</button>
                                    <button type="button" class="btn btn-small pull-left  btn_pad btn_cancel_edit" data-dismiss="modal"  aria-hidden="true">取消</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
        </div>
    </div>
</div>

<script id="tmpl_custmanage_merger" type="text/x-jquery-tmpl">
    <fieldset>
        <input type="hidden" id="custId" name="_id" value="${custId}">
        <input type="hidden" id="custAId" name="custAId" value="${custAId}">
        <input type="hidden" id="custBId" name="custBId" value="${custId}">
        <input type="hidden" name="dbType" value="${_id}">
        {{each(key,field) stable_fields}}
        {{if field.name=='name'}}
            <div class="row_item">
                <label >${field.value}</label>
                <input  name="${field.name}" type="text" value="未知客户" onfocus="this.select()" onmouseover="this.select()" ${field.required}/>
            </div>
            <div class="row_item">
                <label  style="margin-top: 0;">客户状态</label>
                <select class="select_status status_prospect" name="status" required >
                    <!--<option value="" selected="selected">--请选择--</option>-->
                    {{each(key1,name1) status}}
                    <option value="${key1}" class="${key1}">${name1}</option>
                    {{/each}}
                </select>
            </div>
        {{else field.name=='phone'}}
        <div class="row_item phone">
            <a href="#" class="plus"></a>
            <label>${field.value}</label>
            <input   name="tel[]" type="text" value=""   style="width:150px;" ${field.required}>
            <input   name="memo[]" type="text" value="" placeholder="备注.."  style="width:150px;margin-left:-1px;">
        </div>
        {{else field.name=='email'}}
        <div class="row_item email">
            <a href="#" class="plus"></a>
            <label>${field.value}</label>
            <input   name="email[]" type="text" value=""   style="width:150px;" ${field.required}>
            <input   name="eMemo[]" type="text" value="" placeholder="备注.."  style="width:150px;margin-left:-1px;">
        </div>
        {{else field.name=='weixin'}}
        <div class="row_item weixin">
            <a href="#" class="plus"></a>
            <label>${field.value}</label>
            <input   name="num[]" type="text" value=""   style="width:150px;" ${field.required}>
            <input   name="wxMemo[]" type="text" value="" placeholder="备注.."  style="width:150px;margin-left:-1px;">
        </div>
        {{else field.name=='province'}}
            <div class="row_item">
                <label  style="margin-top: 0;">${field.value}</label>
                <select class="cust_province_casecade" name="${field.name}" ${field.required}><option value="" selected>--请选择--</option></select>
            </div>
        {{else field.name=='city'}}
            <div class="row_item">
                <label  style="margin-top: 0;">${field.value}</label>
                <select class="cust_city_casecade" name="${field.name}" ${field.required}><option value="" selected>--请选择--</option></select>
            </div>
        {{else field.name=='note'||field.name=='address'}}
            <div class="row_item">
                <label  style="margin-top: 0;">${field.value}</label>
                <textarea  name="${field.name}" rows="3" cols="" style="resize: vertical; width:300px; margin-bottom: 0px;" ${field.required} ></textarea>
            </div>
        {{else field.name=='sex'}}
            <div class="row_item">
                <label>${field.value}</label>
                <label for="sex1" style="float:left;width:auto;"><input type="radio" name="${field.name}" value="0" id='sex1' ${field.required}/>男</label>&nbsp;
                <label for="sex2" style="float:left;width:auto;"><input type="radio" name="${field.name}" value="1" id='sex2' ${field.required}/>女</label>
            </div>
        {{else field.name=='birth'}}
        <div class="row_item">
            <label for="datetimepicker_birth">${field.value}</label>
            <input name="${field.name}" type="text" id="datetimepicker_birth" class="date_picker" ${field.required}/>
        </div>
        {{else}}
        <div class="row_item">
            <label >${field.value}</label>
            <input  name="${field.name}" type="text"  ${field.required}  />
        </div>
        {{/if}}
        {{/each}}
    </fieldset>

    <fieldset>
        {{if (source && source.length>0) }}
            <div class="row_item">
                <label  style="margin-top: 0;">数据来源</label>
                <select class="" name="custsource1" >
                    <option value="" selected="selected">--请选择--</option>
                    {{each(key,name) source}}
                    <option value="${key}">${name}</option>
                    {{/each}}
                </select>
            </div>
        {{/if}}

        <div class="row_item">
            <label style="margin-top: 0;">归属</label>
           <div style="position:relative;display:inline-block;">
           <input  name="categoryId" type="hidden" class="for_owner_categoryId" value='${categoryId}' />
           <input  name="owner" type="hidden" class="for_owner_id" value='${owner}' />
           <input class="for_owner_input" type="text" style="z-index:99999;"  placeholder="按姓名,拼音,工号搜索">
           </div>
        </div>
    </fieldset>
    <fieldset>
        <div class="frm_item">
            <label class="frm_left_label2">附件</label>
            <div class="frm_right_content2">
                <div class="">
                    <div id="${qiniuId}-customer-qiniu" class="float:left;line-height: 20px;">
                        <a class="btn btn-default btn-small btn-link" id="${qiniuId}-pickCustomerFiles" href="#" >
                            <i class="icon-plus"></i>
                            <sapn>上传附件</sapn>
                        </a>
                        <div class="muted" style="float:right;line-height:20px">
                            <p>（大小不超过10MB）</p>
                        </div>
                    </div>
                </div>

               <div class="row-fluid" id="customer_files" style="margin-left:50px">
                    <table class="table table-hover text-left customer_attach_container" style="margin-top:5px;display:none;width: 450px;background-color:#fff;">
                        <tbody id="${qiniuId}-fsUploadProgress">
                        </tbody>
                    </table>
               </div>

                <div style="clear: both;"></div>
                <div class="progress attach progress-striped" style="margin-left:118px;width:200px;display: none;">
                    <div class="bar" style="width: 0%;"></div>
                </div>
                <ul class="thumbnails_customer" style='margin-left:118px;'>
                </ul>
                <div style="clear: both;"></div>
            </div>
        </div>
    </fieldset>

    {{if custom_fields.length>0}}
    <fieldset>
        <legend style="width: 475px;margin-bottom: 8px;font-size:15px;">自定义字段</legend>
        {{each custom_fields}}
        {{if type=='single'}}
        <div class="frm_item">
            <label class="frm_left_label2">${name}</label>
            <div class="frm_right_content2">
                <input id="cust_${_id}" name="${_id}" type="text"  msgName='${name}'  ${required} />
            </div>
        </div>
        {{else type=='multi'}}
        <div class="frm_item">
            <label class="frm_left_label2">${name}</label>
            <div class="frm_right_content2">
                <textarea  name="${_id}" rows="3" cols="" style="resize: vertical; width:300px; margin-bottom: 0px;"  msgName='${name}'  ${required}></textarea>
            </div>
        </div>
        {{else type=='number'}}
        <div class="frm_item">
            <label class="frm_left_label2">${name}</label>
            <div class="frm_right_content2">
                <input  name="${_id}" type="text" msgName='${name}'  dataType='Number' msg='必须为数字'  ${required}/>
            </div>
        </div>
        {{else type=='date'}}
        <div class="frm_item">
            <label class="frm_left_label2">${name}</label>
            <div class="input-append">
                <input  type="text" name="${_id}" msgName='${name}'  class="date_picker" style="width:115px;cursor:pointer" value="" readonly="true" onkeydown="readOnlyKeyDown()" ${required}>
                 <span class="add-on datetimepicker-remove" style="height: 14px;line-height: 15px"><i class="icon-remove"></i></span>
            </div>
        </div>

        {{else type=='dropdown'}}
        <div class="frm_item">
            <label class="frm_left_label2">${name}</label>
            <div class="frm_right_content2">
                <select name="${_id}" msgName='${name}'  ${required}>
                    <option value="" selected="selected">--请选择--</option>
                    {{each(key,val) choices}}
                    <option value="${key}">${val}</option>
                    {{/each}}
                </select>
            </div>
        </div>
        {{else type=='checkbox'}}
        <div class="frm_item">
            <label class="frm_left_label2">${name}</label>
            <div class="frm_right_content2">
                {{each(key,val) choices}}
                <label><input type="checkbox" fieldgroup="1" name="${_id}[]" value="${key}" msgName='${name}'  ${required}/>${val}</label>
                {{/each}}
            </div>
        </div>
        {{else type=='radio'}}
        <div class="frm_item">
            <label class="frm_left_label2">${name}</label>
            <div class="frm_right_content2">
                {{each(key,val) choices}}
                <label><input type="radio" name="${_id}" value="${key}" msgName='${name}'  ${required}/>${val}</label>
                {{/each}}
            </div>
        </div>
        {{/if}}
        {{/each}}
    </fieldset>
    {{/if}}
</script>
<script id="tmpl_customer_merge_attach" type="text/x-jquery-tmpl">
<li>
    <div class=fujian>
        <div class="left ico-1"></div>
        <div class="left">
            <a href="#" class="ds_do_action attachitem" ds_action="customer.downloadAttach" ds_data="${fileId}" suffix="${suffix}" isNew="${isNew}">${trueName}</a>
        </div>
        <div class="left ico-2 ds_do_action" style="cursor: pointer" ds_action="customer.delCustomerAttach" ds_data="${fileId}">
        </div>
    </DIV>
</li>
</script>
<script id="tmpl_customer_merge_attach_show" type="text/x-jquery-tmpl">
     <li>
         <div class=fujian>
             <div class="left ico-1"></div>
             <div class="left">
                 <a href="#" class="ds_do_action attachitem" ds_action="customer.downloadAttach" ds_data="${id}" suffix="${type}" isNew="0">${name}</a>
             </div>
             <div class="left ico-2 ds_do_action" style="cursor: pointer" ds_action="customer.delCustomerAttach" ds_data="${id}">
             </div>
         </DIV>
     </li>
</script>
