<div >
    <form id="frm_customer_quick_search_update" class="form-horizontal ">
        <input type="hidden" name="kId" value="_#kId#_">
        <div class="form_buttons" style="">
            <button type="button" class="btn btn-small btn-primary ds_form_action pull-right"   ds_action="customer.saveUpdateQuickSearch">保存</button>
            <button type="button" class="btn btn-small pull-right btn_pad btn_cancel_edit ds_do_action" ds_action="customer.cancelModel">取消</button>
        </div>

        <div>
            <div class="control-group">
                <label class="control-label required">菜单</label>
                <div class="controls">
                    <select name="menu">
                        <option value="customer_my">我的客户</option>
                        <option value="customer_seas">公海</option>
                        <option value="customer_all">全部</option>
                    </select>
                </div>
            </div>
            <div class="control-group">
                <label class="control-label required">名称</label>
                <div class="controls">
                    <input name="kName" type="text" maxlength="50" msgName='搜索名称' style="width:300px">
                </div>
            </div>

            <div class="control-group">
                <label class="control-label required">条件</label>
                <div class="controls">
                    <div id="field_quickSearch_pane" style="position: relative;" class="">
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>

<script type="text/javascript">
    $(document).on("change",".condition",function(event){
        var src = $(event.currentTarget);
        var value=src.val();
        var obj = src.get(0);
        var value = obj.options[obj.selectedIndex].value;
        var text = obj.options[obj.selectedIndex].text;
        var p=src.parent("div").find(".changeText");
        var con =src.parent("div").find(".con");
        var tabMenu = $('#frm_customer_quick_search_update').find("select[name='menu']").val();
        handler.customer._showQuickText(value,text,con,p,1,tabMenu);
    });
</script>
