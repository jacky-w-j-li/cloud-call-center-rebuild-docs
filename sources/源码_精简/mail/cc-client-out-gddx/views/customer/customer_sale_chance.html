<div id="customer_sale_chance_query_panel" class="chancePool">
    <div class="row-fluid">
        <div id="customer_sale_chance_list_panel" class="config_left span5">
            <div>
                <form id="customer_sale_chance_form" class="form-horizontal">
                    <div class="pull-left" style="margin:5px 10px 10px 0px">
                        <span class="refresh ds_form_action" style="display: none;" ds_action="customer.querySaleChance"></span>
                        <!--<button type="button" class="button ds_form_action" ds_action="config.customerCommon.queryMareLiberum" style="margin-left: 0px;">查询</button>-->
                        <button type="button" class="btn-blue btn-small ds_form_action"  ds_action="customer.showAddSaleChance" >增加</button>
                        <!--<button type="button" class="button ds_form_action"  ds_action="config.mareLiberum.upMareLiBeRum" style="margin-left: 10px;">修改</button>-->
                    </div>

                    <div>
                        <table class="table table-striped table-bordered table-hover">
                            <thead>
                            <tr>
                                <th width="8%">名称</th>
                                <th width="10%">管理员</th>
                                <th width="10%">成员</th>
                                <th width="15%">创建时间</th>
                                <th width="10.6%">操作</th>
                            </tr>
                            </thead>
                            <tbody class="customer_sale_chance_list">
                            </tbody>
                        </table>
                        <div class="row-fluid class_list">
                            <div for="customer_sale_chance_form" ds_pagination_action="customer.querySaleChance"
                                 class="pagination pagination-small" style="display:table; margin:0;width:100%;">
                                <span class="result_info">查询结果：<span class="result_count">0</span></span>
                                <ul style="float:right;margin-top:5px;">
                                    <li><a href="#"  value="0">&laquo;</a></li>
                                    <li><a href="#"  value="1">1</a></li>
                                    <li><a href="#"  value="2">2</a></li>
                                    <li><a href="#"  value="3">3</a></li>
                                    <li><a href="#"  value="4">4</a></li>
                                    <li><a href="#"  value="5">5</a></li>
                                    <li><a href="#"  value="6">&raquo;</a></li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        <div id="customer_sale_chance_info_pane" class="sub-right span7">
            <h4><span class="cName"></span></h4><br/>
            <div class="modal-body">
                <form id="frm_customer_sale_chance_info_pane" class="">
                    <input type="hidden" name="chanceId" value="">
                    <div class="caption-top clearfix">
                        <div class="" style="width:100%;">
                            <table style="width:100%;">
                                <tr>
                                    <td style="width:12%;" align="left">
                                        <strong>回收规则:</strong>
                                    </td>
                                    <td style="width:55%;">
                                        <span class="recycle"></span>
                                    </td>
                                    <td style="width:35%;" align="left">
                                        <button type="button" class="do_action_cancel ds_form_action right" ds_action="customer.returnCommon"  style="margin-left:151px;width: 52px;">返回</button>
                                    </td>

                                </tr>
                            </table>
                        </div>
                        <div style="border:1px solid;margin-top:5px;"></div>
                        <div class="input-append ds_search_item" style="margin-left: 5px;margin-top: 5px;float:left;">
                            <input class="quick_search" name="customerName" style="width: 110px;" type="text" placeholder="输入姓名...">
                            <button type="button" class="btn ds_form_action dept_search " ds_action="customer.querySaleChanceInfo"  title="查询">
                                <i class="icon-search"></i>
                            </button>
                        </div>
                        <div class="" style="margin-left:5px;margin-top:5px;float:left;">

                            <button type="button" class="btn-blue btn-small ds_form_action" ds_action="customer.addSaleChanceCustomer">增加</button>
                        </div>
                        <div class="" style="margin-top:5px;">
                            <input type="hidden" name="selectAll" value="">
                            <button type="button" class="btn-blue btn-small ds_form_action" ds_action="customer.transferSaleChanceCustomer">转移</button>
                        </div>

                    </div>
                    <div class="panel panel-info">
                        <table class="table table-striped table-bordered table-hover">
                            <thead>
                            <tr>
                                <th width="8%"><input type="checkbox" name="selectAllCustomer" class onchange="selectAllSaleChance(this)">全选</th>
                                <th width="15%">客户名称</th>
                                <th width="8%">所属人</th>
                                <th width="13%">电话</th>
                                <th width="14%">状态</th>
                                <th width="7%">来源</th>
                                <th width="18%">创建时间</th>
                                <th width="5%">操作</th>
                            </tr>
                            </thead>
                            <tbody class="customer_list">
                            </tbody>
                        </table>
                        <div class="row-fluid class_list">
                            <div for="frm_customer_sale_chance_info_pane" ds_pagination_action="customer.querySaleChanceInfo"
                                 class="pagination pagination-small ds_form_action" style="display:table; margin:0;width:100%;">
                                <span class="result_info">查询结果：<span class="result_count">0</span></span>
                                <ul style="float:right;margin-top:5px;">
                                    <li><a href="#"  value="0">&laquo;</a></li>
                                    <li><a href="#"  value="1">1</a></li>
                                    <li><a href="#"  value="2">2</a></li>
                                    <li><a href="#"  value="3">3</a></li>
                                    <li><a href="#"  value="4">4</a></li>
                                    <li><a href="#"  value="5">5</a></li>
                                    <li><a href="#"  value="6">&raquo;</a></li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        <div id="customer_sale_chance_amend_pane" class="sub-right span7"style="display: none;">
            <h4 class="">修改商机池</h4><br/>
            <div class="amendTicket" style="width:100%;">

            </div>
        </div>
        <div id="customer_sale_chance_add_pane" class="sub-right span7"style="display: none;">
            <h4 class="">新建商机池</h4><br/>
            <div class="createTicket" style="width:100%;">

            </div>
        </div>
    </div>
</div>
<script id="tmpl_customer_item" type="text/x-jquery-tmpl">
    <tr>
        <td>
        <input type="checkbox" name="customerS[]" value="${_id}">
        </td>
        <td>
            {{if name}}
            ${name}
            {{/if}}
        </td>
        <td>
            {{if owner}}
            ${handler.config.customerCommon.getUserName(owner)}
            {{/if}}
        </td>
        <td>
            {{if phone}}
            ${handler.customer.contactPhoe(phone)}
            {{/if}}
        </td>
        <td>
            {{if status}}
            ${getCache('custTmpls',dbType).status[status]}
            {{/if}}
        </td>
        <td>
            {{if custsource1}}
            ${handler.customer.getSourceName(dbType,custsource1)}
            {{/if}}
        </td>
        <td>
            {{if createTime}}
            ${createTime}
            {{/if}}
        </td>
        <td>
            <a href='#' class='ds_do_action' ds_action='customer.showSaleChancePopUpdate' ds_data='${_id}'>修改</a>
        </td>
    </tr>
</script>
<script type="text/javascript">
    function selectAllSaleChance(sel){
        var pane = $("#customer_sale_chance_info_pane").find('.customer_list');
        var all = pane.find("input[type=checkbox]");
        if(sel.checked==true){
            $.each(all,function(key, item){
                $(item).attr("checked",true);
            });
            $("#customer_sale_chance_info_pane").find("input[name='selectAll']").val(1);
        }else{
            $.each(all,function(key, item){
                $(item).attr("checked",false);
            });
            $("#customer_sale_chance_info_pane").find("input[name='selectAll']").val(0);
        }
    }
</script>
