<div class="modal-header">
    <button type="button" class="close" data-dismiss="modal" aria-hidden="true">
        ×
    </button>
    <h3>添加步骤动作</h3>
</div>
<div class="">
    <form>
        <!--<input name="_id" value="__id" type="hidden"/>-->

        <div class="modal-body">
            <div class="row_item">
                <label for="name">动作名称</label>
                <input id="name" name="name" value="" maxlength="10" type="text" required>
            </div>
            <div class="row_item">
                <label for="jumpTo">执行动作后转入</label>
                <select name="jumpTo" id="jumpTo" required>
                    <option value="">--请选择--</option>
                </select>
            </div>
            <div class="row_item">
                <label for="actionRole">动作角色</label>
                <select name="actionRole" id="actionRole" required>
                    <option value="">--请选择--</option>
                </select>
            </div>
        </div>
        <div class="modal-footer">
            <button href="#" class="btn btn-primary ds_form_action" ds_action="config.business.addBusinessFlowStepAction">
                保存
            </button>
            <button class="btn" data-dismiss="modal" aria-hidden="true">
                取消
            </button>
        </div>
    </form>
</div>
<script type="text/javascript">
    $(document).ready(function () {
        var step = session.business.currentBusinessFlowStep;
        var currentStepId = step._id;
        var steps = session.business.currentFlowSteps || [];
        var tmp = "<option value='_id'>_name</option>";
        var jumpPane = $("#jumpTo");
        for (var i = 0; i < steps.length; i++) {
            if (steps[i]._id != currentStepId) {
                jumpPane.append(tmp.replace(/_id/g, steps[i]._id).replace(/_name/g, steps[i].name));
            }
        }

        var roles = getCache("roles") || [];
        var tmp = "<option value='_id'>_name</option>";
        var html = "";
        for (var i = 0; i < roles.length; i++) {
            var rolesItem = roles[i];
            html += tmp.replace(/_id/g, rolesItem._id).replace(/_name/g, rolesItem.display_name);
        }
        //增加一个动态角色,工单创建人
        html += tmp.replace(/_id/g, "busCreateUser").replace(/_name/g, "工单创建人");
        $("#actionRole").append(html);

    });
</script>
