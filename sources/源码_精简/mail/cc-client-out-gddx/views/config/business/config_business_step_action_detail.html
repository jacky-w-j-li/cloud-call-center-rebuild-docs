<script type="text/javascript">

    function config_business_step_action_detail() {
        $(".apppopover").popover();

        var step = session.business.currentBusinessFlowStep;
        var currentStepId = step._id;
        var steps = session.business.currentFlowSteps || [];
        var tmp = "<option value='_id'>_name</option>";
        var selectTmp = "<option value='_id' selected>_name</option>";
        var jumpPane = $("#__id_jumpTo");
        var jumpValue = jumpPane.attr("selectValue");
        jumpPane.empty();
        for (var i = 0; i < steps.length; i++) {
            if (steps[i]._id == jumpValue) {
                jumpPane.append(selectTmp.replace(/_id/g, steps[i]._id).replace(/_name/g, steps[i].name));
            } else if(steps[i]._id != currentStepId){
                jumpPane.append(tmp.replace(/_id/g, steps[i]._id).replace(/_name/g, steps[i].name));
            }
        }

        var roles = getCache("roles") || [];
        var tmp = "<option value='_id'>_name</option>";
        var html = "";
        for (var i = 0; i < roles.length; i++) {
            var rolesItem = roles[i];
            html += tmp.replace(/_id/g, rolesItem._id).replace(/_name/g, rolesItem.display_name);
        }
        //增加一个动态角色,工单创建人
        html += tmp.replace(/_id/g, "busCreateUser").replace(/_name/g, "工单创建人");
        $("#__id_actionRole").append(html);
        $("#__id_actionRole").val($("#__id_actionRole").attr("data"));

    }

</script>
