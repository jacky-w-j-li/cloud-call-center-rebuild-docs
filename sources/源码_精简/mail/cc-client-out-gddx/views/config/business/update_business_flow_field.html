<form>
    <div class="row-fluid">
        <div class="row-fluid" style="margin-top: 8px;">
            <div style="float: left;margin-top: 20px; margin-bottom: 10px;">
                <h4>字段编辑</h4>
            </div>
            <div style="float: right;margin-top:15px;margin-bottom: 5px;">
                <a href="#" class="btn btn-primary ds_form_action" ds_action="config.business.saveBusinessFlowFields">保存</a>
            </div>
        </div>
        <div class="row-fluid">
            <div style="border:1px solid;"></div>
        </div>
        <div class="row-fluid">
            <input type='hidden' name='_id' value='__id'>

            <div class="row_item">
                <label for="flow_field_name">字段名称</label>
                <input id="flow_field_name" name="name" type="text" value="__name" required>
            </div>
            <div class="row_item">
                <label>是否必填</label>
                <label class="radio" style="width: 20px;font-weight: normal">
                    <input type="radio" name="required" value="required" style="margin: 5px 0 0 -10px">是</label>
                <label class="radio" style="width: 20px;font-weight: normal">
                    <input type="radio" name="required" value="no" style="margin: 5px 0 0 -10px">
                    否
                </label>
            </div>
            <div class="row_item">
                <label>是否启用</label>
                <label class="radio" style="width: 20px;font-weight: normal">
                    <input type="radio" name="enable" value="yes" style="margin: 5px 0 0 -10px">是</label>
                <label class="radio" style="width: 20px;font-weight: normal">
                    <input type="radio" name="enable" value="no" style="margin: 5px 0 0 -10px">
                    否
                </label>
            </div>
            <div class="row_item">
                <label for="flow_field_type">字段类型</label>
                <select id="flow_field_type" name="type" value="__type">
                    <option value="single">单行文本</option>
                    <option value="multi">多行文本</option>
                    <option value="number">数字文本</option>
                    <option value="date">日期</option>
                    <option value="dropdown">下拉选项</option>
                    <option value="checkbox">复选框</option>
                    <option value="radio">单选框</option>
                    <option value="file">附件</option>
                </select>
            </div>
            <div class="row_item" id="flow_field_is_report" style="display: none;">
                <label>是否报表统计</label>
                <label class="radio" style="width: 20px;font-weight: normal">
                    <input type="radio" name="isReport" value="yes" style="margin: 5px 0 0 -10px">
                    是
                </label>
                <label class="radio" style="width: 20px;font-weight: normal">
                    <input type="radio" name="isReport" value="no" checked style="margin: 5px 0 0 -10px">
                    否
                </label>
            </div>
            <div id="flow_field_exten">

            </div>
        </div>
    </div>
</form>

<script type="text/javascript">
    $(function () {
        var originType = "__type";
        $("#flow_field_type").bind("change", function (src) {
            var selectValue = $("#flow_field_type").val();
            if (selectValue == "dropdown" || selectValue == "radio") {
                $("#flow_field_is_report").show();
            } else {
                $("#flow_field_is_report").hide();
                $("#flow_field_is_report").find("input[name='isReport'][value='no']").attr("checked", "");
            }
            if (selectValue == "dropdown" || selectValue == "checkbox" || selectValue == "radio") {
                var dicTmp = $("<div class='row_item'><label>关联字典</label><select name='dic' value='__dic'></select></div>");
                var dicDefault = $("<div class='row_item'><label>默认值</label><select name='default' value='__default'></select></div>");
                $("#flow_field_exten").empty();
                $("#flow_field_exten").append(dicTmp);
                $("#flow_field_exten").append(dicDefault);

                var selectTmp = "<option value='_value'>_name</option>";
                var options = getCache("options");
                dicDefault.find("select").append("<option value=''>--请选择--</option>");
                for (var i = 0; i < options.length; i++) {
                    var optionsItem = options[i];
                    var select = selectTmp.replace(/_value/g, optionsItem._id).replace(/_name/g, optionsItem.name);
                    dicTmp.find("select").append(select);
                }
                dicTmp.find("select").val('__dic');
                dicTmp.find("select").bind("change", function (event) {
                    var select = $(event.target);
                    var optionId = select.val();
                    var option = getCache("options", optionId);
                    var options = option.options || [];
                    var pane = select.parent(".row_item").next(".row_item").find("select");
                    pane.empty();
                    pane.append("<option value=''>--请选择--</option>");
                    for (var j = 0; j < options.length; j++) {
                        var optionsItem = options[j];
                        pane.append(selectTmp.replace(/_value/g, optionsItem.key).replace(/_name/g, optionsItem.name));
                    }
                    pane.val('__default');
                });
                dicTmp.find("select").change();
            } else if (selectValue == "single") {
                var defaultValue = "";
                if(originType === selectValue) defaultValue= "__default";
                defaultValue = handler.config.business.replaceLineChar(defaultValue);
                var textTmp = "<div class='row_item'><label>默认值</label><input type='text' name='default' value='"+defaultValue+"'/></div>";
                $("#flow_field_exten").empty();
                $("#flow_field_exten").append(textTmp);
            } else if (selectValue == "number") {
                var defaultValue = "";
                if(originType === selectValue) defaultValue= "__default";
                var textTmp = "<div class='row_item'><label>默认值</label><input type='text' dataType='Number' msg='默认值必须是数字' name='default' value='"+defaultValue+"'/></div>";
                $("#flow_field_exten").empty();
                $("#flow_field_exten").append(textTmp);
            } else if (selectValue == 'multi') {
                var defaultValue = "";
                if(originType === selectValue) defaultValue= "__default";
                defaultValue = handler.config.business.replaceLineChar(defaultValue);
                var tmp = "<div class='row_item'><label>默认值</label><textarea name='default'  rows='3'>"+defaultValue+"</textarea></div>";
                $("#flow_field_exten").empty();
                $("#flow_field_exten").append(tmp);
            } else if (selectValue == 'date') {
                var defaultValue = "";
                if(originType === selectValue) defaultValue= "__default";
                var tmp = "<div class='row_item'><label>默认值</label><input size='16' class='ds_date' name='default' type='text' value='"+defaultValue+"' readonly style='margin-right: 0px;'></div>";
                $("#flow_field_exten").empty();
                $("#flow_field_exten").append(tmp);
//                $('#datetimepicker_flow_fields').datetimepicker({language: 'zh-CN', autoclose: true, todayBtn: true, startView: 4, minView: 2});
            } else if (selectValue == "file") {
                $("#flow_field_exten").empty();
            }
        });
        $("#flow_field_type").val('__type');
        $("#flow_field_type").change();
        var required = '__required';
        var enable = '__enable';
        var isReport = '__isReport';
        if (required == 'required') {
            $("input[name='required'][value='required']").attr("checked", "");
        } else {
            $("input[name='required'][value='no']").attr("checked", "");
        }
        if (enable == 'yes') {
            $("input[name='enable'][value='yes']").attr("checked", "");
        } else {
            $("input[name='enable'][value='no']").attr("checked", "");
        }
        if (isReport == "yes") {
            $("#flow_field_is_report").find("input[name='isReport'][value='yes']").attr("checked", "");
        } else {
            $("#flow_field_is_report").find("input[name='isReport'][value='no']").attr("checked", "");
        }
    });


</script>
