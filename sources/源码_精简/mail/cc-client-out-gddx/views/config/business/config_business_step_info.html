<div class="row-fluid">
    <form>
        <div class="row-fluid">
            <div style="margin-top: 10px;float: right;">
                <a href="#" class="btn btn-primary ds_form_action" ds_action="config.business.saveBusinessStepInfo">保存</a>
            </div>
        </div>
        <div class="row-fluid">
            <div class="row_item">
                <label for="name">步骤名称</label>
                <input id="name" name="name" value="__name" maxlength="10" type="text" required>
            </div>
            <div class="row_item" id="__id_begin_config_pane">
                <label>是否为开始步骤</label>
                <input name="isBegin" type="checkbox" id="isBeginInput" value="__isBegin">
            </div>
            <div class="row_item">
                <label >工单时限设置</label>
                <input placeholder="第1步不用设置" type="num" id="ctime" name="ctime" datatype="Number,Range" min="1" msg="输入的时间必须大于0" value=""   maxlength="5" onkeyup="this.value=this.value.replace(/\D/g,'')" >
                &nbsp;&nbsp;单位
                <select name="ctype" id="stepCtype">
                    <option value="min">分钟</option>
                    <option value="hours">小时</option>
                    <option value="day">天</option>
                </select>
            </div>
            <div class="row_item">
                <label></label>
                <span>单步骤不能超过工单总时长__taskTime</span>
            </div>
            <div class="row_item cleanFloat">
                <label >提醒成员</label>
                <input name="ownernotifyUsers" type="hidden" class="select_input" id="remind_owner_select_input_com" />
                <input name="notifyUser" type="hidden" class="select_input" id="remind_owner_select_input" />
                <div id="remind_owner_select_memberUser" class="comtabbox_agent"></div>
                <div class="panel-heading" id="popover_business_update_step">
                    <a href="#" id="popover_business_update_step_pop"  class="btn" data-toggle="popover" data-placement="bottom" data-trigger="hover focus"
                       data-content="工单时限剩余5分钟时,额外提醒座席(不配置时,默认提醒当前处理人,如果是未领取状态则提醒所有有此工单权限的座席)" data-original-title="">
                        <span class="glyphicon-question-sign" style="color:#fff"></span>
                    </a>
                </div>

            </div>
        </div>
    </form>
</div>

        <script type="text/javascript">
            $(document).ready(function(){
                $("#popover_business_update_step").on("mouseover",function(){
                    $("#popover_business_update_step_pop").popover();
                });
                //        是否是开始节点
                var isBegin = __isBegin;
                if (isBegin)
                    $('#isBeginInput').attr('checked', '');
                if('__type' == "sys"){
                    $("#__id_begin_config_pane").hide();
                }
                var inputIdMe = "remind_owner_select_input";
                var containerIdMe = "remind_owner_select_memberUser";
                utils.loadAgentTabBox(inputIdMe,containerIdMe,{width:"215",height:"17",maxHeight:292,hideTab:2,isRadio:false,commonTab:false},false,false);

                    });


                
        </script>
