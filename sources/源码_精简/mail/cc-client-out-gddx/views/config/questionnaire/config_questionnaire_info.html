<form>
    <div class="row-fluid">
        <div class="span8">
            <h3>模板信息配置</h3>
        </div>
        <div class="span4">
            {{
                var opName = '停用',opClass = 'btn-danger',opAction='config.questionnaire.showStopQuestionnaireTemp';
                if(status == 'disable') {
                    opName = '启用';
                    opClass = 'btn-success';
                    opAction='config.questionnaire.showStartQuestionnaireTemp'
                }
            }}

            <a href="#stopQuestionnaireTempModal" id="config_questionnaire_stopAndStart_operate" data-toggle="modal" class="btn {{=opClass}} btn-small ds_do_action" style="float: right;margin-top: 10px;" ds_action="{{=opAction}}" ds_data="{{=_id}}">
                {{=opName}}
            </a>
            <a href="#" class="btn btn-small btn-primary ds_form_action" style="float: right;margin-top: 10px;margin-right: 10px;" ds_action="config.questionnaire.savaQuestionnaireTempInfo">保存</a>
        </div>
        <div id="stopQuestionnaireTempModal" class="modal hide fade" tabindex="-1" role="dialog"aria-hidden="true">
        </div>
    </div>
    <div class="row-fluid">
        <div class="row-fluid">
            <div style="border:1px solid ;"></div>
        </div>
    </div>
    <div class="row-fluid">
        <div id="template_configure" style="margin-top: 15px;">
            <input type='hidden' name='_id' value='{{=_id}}'>
            <div class='row_item'>
                <label>模板名称</label>
                <input type='text' name='name' value='{{=name}}' maxlength="10" style="width: 200px;" required>
            </div>
            <div class="row_item">
                <label>模板类型</label>
                {{type= type || 'static';}}
                <select id="questionnaire_type" name="type" disabled>
                    <option value="dynamic"
                    {{ if(type == 'dynamic'){ }}
                    {{='selected'}}
                    {{ } }}
                    >动态</option>
                    <option value="static"
                    {{ if(type == 'static'){ }}
                    {{='selected'}}
                    {{ } }}
                    >静态</option>
                </select>
            </div>
        </div>
    </div>
</form>
