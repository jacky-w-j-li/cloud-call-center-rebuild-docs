<div class="row-fluid">
    <h3>模板字段定义</h3>
</div>
<div class="row-fluid">
    <div class="row-fluid">
        <div style="border:1px solid ;"></div>
    </div>
</div>
<div class="row-fluid">
    <div class="span6">
        <div class="row-fluid">
            <form id="config_questionnaire_fields_table_form">
                <div class="span2 text-left ">
                    <div style="margin-top: 30px;">
                        <i class="icon-refresh"></i>
                        <a href="#" class=" option ds_form_action" ds_action="config.questionnaire.queryQuestionnaireField">刷新</a>
                    </div>
                </div>
                <div class="span8">
                    <div class="input-append" style="float:left; margin-top: 25px;">
                        <input name='query' type="text" placeholder="输入字段名称进行查询...">
                        <input type='hidden' name='temp_id' value='__flow_id'>

                        <div class="btn-group">
                            <a href="#" class="btn ds_form_action" ds_action="config.questionnaire.queryQuestionnaireField">查询</a>
                        </div>
                    </div>
                </div>
                <div class="span2" style="margin-top: 25px;">
                    <a href="#" class="btn btn-primary ds_do_action" ds_action="config.questionnaire.showAddQuestionnaireField" ds_data="__flow_id">添加</a>
                </div>
            </form>
        </div>
        <div class="row-fluid">
            <table class="table table-striped table-bordered table-hover" id="config_questionnaire_fields_table">
                <thead>
                <tr>
                    <th>字段名称</th>
                    <th>字段描述</th>
                    <th>操作</th>
                </tr>
                </thead>
                <tbody>

                </tbody>
            </table>
        </div>
        <div class="row-fluid class_list" style="margin-top: 20px" id="config_questionnaire_fields_table_pagination">
            <div class="pagination" style="display:table; margin:0;width:100%;">
                <span style="float:left;margin-top:10px;font-size:12px;">查询结果：<span class="result_count">0</span></span>
                <ul style="float:right;">
                    <li>
                        <a href="#" ds_action="config.questionnaire.queryQuestionnaireField" value="0">&laquo;</a>
                    </li>
                    <li>
                        <a href="#" ds_action="config.questionnaire.queryQuestionnaireField" value="1">1</a>
                    </li>
                    <li>
                        <a href="#" ds_action="config.questionnaire.queryQuestionnaireField" value="2">2</a>
                    </li>
                    <li>
                        <a href="#" ds_action="config.questionnaire.queryQuestionnaireField" value="3">3</a>
                    </li>
                    <li>
                        <a href="#" ds_action="config.questionnaire.queryQuestionnaireField" value="4">4</a>
                    </li>
                    <li>
                        <a href="#" ds_action="config.questionnaire.queryQuestionnaireField" value="5">5</a>
                    </li>
                    <li>
                        <a href="#" ds_action="config.questionnaire.queryQuestionnaireField" value="6">&raquo;</a>
                    </li>
                </ul>
            </div>
        </div>
    </div>
    <div class="span6">
        <div id="config_questionnaire_fields_option_container">

        </div>
    </div>

</div>
<script type="text/javascript">
    $(function () {
        $("#config_business_flow_fields_table_form").find("input[name='query']").bind("keypress", function (event) {
            if (event.keyCode == 13) {
                event.keyCode = 9;
//                            handler.config.business.queryBusinessFlowField();
                return false;
            }
            ;
        });
    });
</script>
