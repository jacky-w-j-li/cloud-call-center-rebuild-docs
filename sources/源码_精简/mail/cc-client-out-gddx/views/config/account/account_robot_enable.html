<form id="frm_account_enable_robot">
    <input type="hidden" name="robot_type" value="智齿">
    <div class="row_item">
        <label >邮箱</label>
        <input  value="{{=linkManEmail}}" name="robot_email" type="text" tabindex="20" dataType="Email" msg="邮箱格式输入错误" msgName="邮箱" required/>
    </div>
    <div class="row_item">
        <label >公司名称</label>
        <input value="{{=companyName}}" name="robot_companyName" type="text" tabindex="20" />
    </div>
    <div class="row_item">
        <label >联系人</label>
        <input value="{{=linkManName}}" name="robot_contactor" type="text" tabindex="20" />
    </div>
    <div class="row_item">
        <label>电话</label>
        <input  value="{{=linkManPhone}}" name="robot_phone" type="text" dataType="Phone2" msg="电话格式输入错误" msgName="电话"  />
    </div>

</form>
