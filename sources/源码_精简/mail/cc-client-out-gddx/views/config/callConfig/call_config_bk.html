<div class="row-fluid">
    <div class='clear10'></div>
    <div class='row-fluid'>
        <div class='span10'>
        <form class="form-inline" id="accountFrm">
            <input type="hidden" name="page" id="accountListPage"/>
            <input type="text" name="query" placeholder="输入账户名称查询"/>&nbsp;&nbsp;
            <a href="#" id="searchAccountPbxLink" class="btn btn-info ds_action_flow">
                查询
                <ds-form-action action="config.ivr.pbx.getAllAccountPbx" on-complete="config.callConfig.pbx.setAccountPbxList"/>
                <ds-get-view view="config/callConfig/pbx/account_pbx_result" panel="accountPbxListPanel"/>
            </a>
        </form>
        </div>
        <div class="span2">
            <div id="ivrMessage" class="alert alert-success text-center"
                 style="display:none;margin-bottom:0px;padding-top: 7px;padding-bottom: 7px;">
                保存成功!
            </div>
        </div>
    </div>
    <div class="clear10"></div>
    <div class='row-fluid' id="accountPbxListPanel">

    </div>
</div>
<div class='row-fluid'>
    <div id="accountList_pagination" ds_pagination_action="config.callConfig.pbx.queryPaginationAccount" class="pagination pagination-small" style="display:table; margin:0;width:100%;">
        <span class="result_info">查询结果：<span class="result_count">0</span></span>
        <ul id="accountList_index" style="float:right;margin-top:5px;">
            <li><a href="#" for="accountFrm" value="0">&laquo;</a></li>
            <li><a href="#" for="accountFrm" value="1">1</a></li>
            <li><a href="#" for="accountFrm" value="2">2</a></li>
            <li><a href="#" for="accountFrm" value="3">3</a></li>
            <li><a href="#" for="accountFrm" value="4">4</a></li>
            <li><a href="#" for="accountFrm" value="5">5</a></li>
            <li><a href="#" for="accountFrm" value="6">&raquo;</a></li>
        </ul>
    </div>
</div>
<div class='row-fluid account_line' ></div>

    <div class="span12" id="ivrMain">

    </div>
</div>
