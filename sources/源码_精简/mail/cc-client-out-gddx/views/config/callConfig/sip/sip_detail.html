<div class="row-fluid">
    <div class="span12">
        <form class="form-horizontal ds_item_edit" action="" client-data="session.ivrMap.ivr.ivr_sip">
            <input type="hidden" name="_id" value="___id"/>
            <div class="row-fluid">
                <div class="span7 offset1">
                    <i class="icon-edit"></i>SIP号详细信息
                </div>
                <div class="span4 text-right pull-right">
                    <a class="btn btn-info btn-blue ds_action_flow">
                        <ds-form-action action="config.ivr.sip.updateGatewayCodes" extra-data="config.callConfig.currentConfigData"
                            on-before="config.callConfig.sip.preUpdateCodes"
                            update-client-data='{"method":"config.callConfig.updateClientData","arg":{"type":"ivr_sip"}}'/>
                        <ds-get-view view="config/callConfig/queue/queue_list" panel="ivrQueuePanel"/>
                        <ds-effect-ivr/>
                        保存
                    </a>
                </div>
            </div>
            <br/>
            <br/>

            <div class="control-group">
                <label class="control-label">SIP号</label>
                <div class="controls">
                    <input type="text" name="Exten" disabled/>
                </div>
            </div>
            <div class="control-group">
                <label class="control-label">密码</label>
                <div class="controls">
                    <input type="text" name="Secret" disabled/>
                </div>
            </div>
            <div class="control-group" id="codesWrapper" style="display: none;">
                <label class="control-label">支持编码</label>
                <div class="controls" id="sipCodesPanel">
                    <div>
                        <select>
                            <option value="">--请选择--</option>
                            <option value="alaw">alaw</option>
                            <option value="ulaw">ulaw</option>
                            <option value="g729">g729</option>
                            <option value="speex">speex</option>
                            <option value="gsm">gsm</option>
                            <option value="ilbc">ilbc</option>
                        </select>
                        <a href="#" onclick="handler.config.callConfig.sip.addCodes()">
                            <i class="icon-plus"></i>
                        </a>
                    </div>
                </div>
            </div>
            <div class="control-group">
                <label class="control-label">绑定座席姓名</label>
                <div class="controls">
                    <input type="text" class="sip_detail_user_name" name="UserName" disabled/>
                </div>
            </div>
            <div class="control-group">
                <label class="control-label">绑定座席工号</label>
                <div class="controls">
                    <input type="text" class="sip_detail_user_exten" name="UserExten" disabled/>
                </div>
                <div class="controls">
                    <a class="button sip_detail_user_exten_btn ds_form_action" style="margin-left: -1px"
                       ds_action="config.callConfig.sip.bindGatewayUserExten">绑定</a>
                </div>
            </div>
        </form>
    </div>
</div>
<div id="codesTemplate" style="display: none;">
    <div>
        <select>
            <option value="">--请选择--</option>
            <option value="alaw">alaw</option>
            <option value="ulaw">ulaw</option>
            <option value="g729">g729</option>
            <option value="speex">speex</option>
            <option value="gsm">gsm</option>
            <option value="ilbc">ilbc</option>
        </select>
        <a href="#" onclick="handler.config.callConfig.sip.addCodes()">
            <i class="icon-plus"></i>
        </a>
    </div>
</div>
