<div class="row-fluid">
    <div class="span5">
        <div class="row-fluid">
            <div class="span7">
                <div class="input-append" style="float:left;">
                    <input id="sip_query" name='query' class="ivr_search"
                           node-type="ivr.ivr_sip" map-key="Exten,UserExten,UserName" pagination-name="sipList"
                           type="text" placeholder="输入查询条件...">
                    <div class="btn-group">
                        <button class="btn dropdown-toggle ivr_advantage_search" tabindex="-1"
                                pop-target="#sipAdvantageSearchPanel">
                            <span class="caret"></span>
                        </button>
                        <div id="sipAdvantageSearchPanel" class="modal ivr_advantage_search_panel"
                             style="position:absolute;top:30;left:62;width:400px;display: none;font-size:15px;">
                            <form class="form-horizontal">
                                <table style="margin:10px 10px;width:380px;">
                                    <tr>
                                        <td style="width:100px;text-align:right;padding-right: 20px;">
                                            类型
                                        </td>
                                        <td style="width:290px;">
                                            <label for="typeSip" style="float:left;margin-right: 2px;">
                                                <input type="checkbox" name="sip" id="typeSip" checked>软电话</label>
                                            <label for="typeGateway" style="float:left;margin-right: 2px;">
                                                <input type="checkbox" name="gateway" id="typeGateway" checked>网关</label>
                                            <label for="typeLocal"><input type="checkbox" name="local" id="typeLocal" checked>直线</label>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td colspan="2" style="text-align: center;">
                                            <a class="btn btn-info ds_action_flow">
                                                <ds-form-action action="config.ivr.sip.advantageSearchSip" extra-data="config.callConfig.currentConfigData"
                                                              update-client-data='{"method":"config.callConfig.updateClientSearchData","arg":{"type":"ivr_sip"}}'/>
                                                <ds-get-view view="config/callConfig/sip/sip_list" panel="ivrSipPanel"/>
                                                搜索
                                            </a>
                                            <a class="btn btn-info ds_action_flow ivr_cancel_advantage_search">
                                                取消
                                            </a>
                                        </td>
                                    </tr>
                                </table>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
            <div class="span4 offset1 text-right pull-right">
                <a class="add_button add-contact-link btn btn-add ds_action_flow">
                    <ds-get-view view="config/callConfig/sip/sip_add" panel="sip_panel"/>
                    添加
                </a>
            </div>
        </div>
        <div>
            <div class="accordion-inner">
                <div class='ds-item-list' id="sipList" item-view="config/callConfig/sip/sip_list_item"
                             data-source="ivr['ivr_sip']"></div>
            </div>
        </div>
        <div class="row-fluid">
            <div class="span4">
                <a href="#" class="ds_action_flow">
                    <ds-do-action action="config.ivr.sip.querySip" extra-data="config.callConfig.currentConfigData"
                                  update-client-data='{"method":"config.callConfig.updateClientDataList","arg":{"type":"ivr_sip"}}'/>
                    <ds-get-view view="config/callConfig/sip/sip_list" panel="ivrSipPanel"/>
                    <i class="icon-refresh"></i>刷新
                </a><br/>
                <br/>
                <span>查询结果：<span class="sipList_result_count">10</span></span>
            </div>
            <div class="span8 class_list pull-right">
                <div class="pagination" style="margin:3px;">
                    <ul id="sipList_index">
                        <li><a href="#" for="sipListFrm" class="pagination" ds_pagination_action="config.callConfig.paginationChanged" value="0">&laquo;</a></li>
                        <li><a href="#" for="sipListFrm" class="pagination" ds_pagination_action="config.callConfig.paginationChanged" value="1">1</a></li>
                        <li><a href="#" for="sipListFrm" class="pagination" ds_pagination_action="config.callConfig.paginationChanged" value="2">2</a></li>
                        <li><a href="#" for="sipListFrm" class="pagination" ds_pagination_action="config.callConfig.paginationChanged" value="3">3</a></li>
                        <li><a href="#" for="sipListFrm" class="pagination" ds_pagination_action="config.callConfig.paginationChanged" value="4">4</a></li>
                        <li><a href="#" for="sipListFrm" class="pagination" ds_pagination_action="config.callConfig.paginationChanged" value="5">5</a></li>
                        <li><a href="#" for="sipListFrm" class="pagination" ds_pagination_action="config.callConfig.paginationChanged" value="6">&raquo;</a></li>
                    </ul>
                </div>
            </div>
            <form id="sipListFrm">
                <input type="hidden" name="dataSource" value="ivr.ivr_sip">
                <input type="hidden" name="itemListID" value="sipList">
            </form>
        </div>
    </div>
    <div class="span7 sub-right" id="sip_panel">
    </div>
</div>
