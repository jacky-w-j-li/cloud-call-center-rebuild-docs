<div class="modal-header">
    <button type="button" class="close" data-dismiss="modal" aria-hidden="true">&times;</button>
    <h3>系统提示</h3>
</div>
<div class="modal-body">
    您确认要批量添加<h3 style="color: red;">#batchAddAgentNumber#</h3>个座席吗？
</div>
<div class="modal-footer">
    <a class="btn btn-warning btn-blue ds_action_flow ivr-save">
        <ds-form-action action="config.ivr.agent.batchAddAgent" extra-data="config.callConfig.currentConfigData"
                        on-before="config.callConfig.agent.beforeBatchAddAgent"/>
        <ds-get-view view="config/callConfig/agent/agent_list" panel="ivrAgentPanel"/>
        确认添加
    </a>
    <a href="#" class="btn" data-dismiss="modal" aria-hidden="true">取消</a>
</div>
