<div class="row-fluid">
    <div class="span5">
        <div class="row-fluid" style="position:relative;">
            <div class="span6">
                <div class="input-append" style="width:100%;">
                    <input id="agent_query" name='query' class="ivr_search"
                           node-type="ivr.account_user" map-key="exten,displayName" pagination-name="agentList"
                           type="text" placeholder="输入查询条件..." style="width:80%;">
                    <div class="btn-group">
                        <button class="btn dropdown-toggle" data-toggle="dropdown" tabindex="-1">
                            <span class="caret"></span>
                        </button>
                        <ul class="dropdown-menu">
                            <li>
                                <a href="#">高级查询</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
            <div class="offset1 text-right" style="position:absolute;right:0;">
                <a class="add_button add-contact-link btn btn-add ds_action_flow">
                    <ds-get-view view="config/callConfig/agent/agent_add" panel="agent_pane"
                                 on-complete="config.callConfig.agent.openBatchAddAgent"/>
                    添加
                </a>
                <a class="add_button add-contact-link btn btn-add ds_action_flow">
                    <ds-get-view view="config/callConfig/agent/agent_batch_add" panel="agent_pane"
                                 on-complete="config.callConfig.agent.openBatchAddAgent"/>
                    批量添加
                </a>
            </div>
        </div>
        <div>
            <div class="accordion-inner">
                <div class='ds-item-list' id="agentList" item-view="config/callConfig/agent/agent_list_item"
                             data-source="ivr['account_user']"></div>
            </div>
        </div>
        <div class="row-fluid">
            <div class="span4">
                <a href="#" class="ds_action_flow">
                    <ds-do-action action="config.ivr.agent.refreshUser" extra-data="config.callConfig.currentConfigData"
                                  update-client-data='{"method":"config.callConfig.updateClientDataList","arg":{"type":"account_user"}}'/>
                    <ds-get-view view="config/callConfig/agent/agent_list" panel="ivrAgentPanel"/>
                    <i class="icon-refresh"></i>刷新
                </a><br/>
                <br/>
                <span>查询结果：<span class="agentList_result_count">0</span></span>
            </div>
            <div class="span8 class_list pull-right">
                <div class="pagination" style="margin:3px;">
                    <ul id="agentList_index">
                        <li><a href="#" for="agentFrm" class="pagination" ds_pagination_action="config.callConfig.paginationChanged" value="0">&laquo;</a></li>
                        <li><a href="#" for="agentFrm" class="pagination" ds_pagination_action="config.callConfig.paginationChanged" value="1">1</a></li>
                        <li><a href="#" for="agentFrm" class="pagination" ds_pagination_action="config.callConfig.paginationChanged" value="2">2</a></li>
                        <li><a href="#" for="agentFrm" class="pagination" ds_pagination_action="config.callConfig.paginationChanged" value="3">3</a></li>
                        <li><a href="#" for="agentFrm" class="pagination" ds_pagination_action="config.callConfig.paginationChanged" value="4">4</a></li>
                        <li><a href="#" for="agentFrm" class="pagination" ds_pagination_action="config.callConfig.paginationChanged" value="5">5</a></li>
                        <li><a href="#" for="agentFrm" class="pagination" ds_pagination_action="config.callConfig.paginationChanged" value="6">&raquo;</a></li>
                    </ul>
                </div>
            </div>
            <form id="agentFrm">
                <input type="hidden" name="dataSource" value="ivr.account_user">
                <input type="hidden" name="itemListID" value="agentList">
            </form>
        </div>
    </div>
    <div class="span7 sub-right ivr-node-panel" id="agent_pane">
    </div>
</div>
