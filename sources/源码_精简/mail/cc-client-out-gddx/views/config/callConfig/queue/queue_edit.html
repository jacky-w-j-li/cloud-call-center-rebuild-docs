<div class="row-fluid">
    <div class="span12">
        <form class="form-horizontal ds_item_edit" action="" client-data="session.ivrMap.ivr.ivr_node_queue" on-complete="config.callConfig.queue.preUpdateQueue">
            <input type="hidden" name="State" value="enable"/>
            <input type="hidden" name="action" value="update"/>
            <input type="hidden" name="Type" value="normal"/>
            <input type="hidden" name="_id" value=""/>

            <div class="row-fluid">
                <div class="span7 offset1">
                    <i class="icon-edit"></i>修改技能组
                </div>
                <div class="span4 text-right pull-right">
                    <a class="btn btn-info btn-blue ds_action_flow">
                        <ds-form-action action="config.ivr.queue.updateQueue" extra-data="config.callConfig.currentConfigData"
                            on-before="config.callConfig.queue.preSaveQueue" on-complete="config.callConfig.queue.queueUpdated"/>
                        <ds-get-view view="config/callConfig/queue/queue_list" panel="ivrQueuePanel"/>
                        <ds-effect-ivr/>
                        保存
                    </a>
                    <a class="btn btn-danger btn-gray ds_action_flow">
                        <ds-form-action action="config.ivr.queue.deleteQueue" extra-data="config.callConfig.currentConfigData"
                            update-client-data='{"method":"config.callConfig.updateClientData","arg":{"operation":"del","type":"ivr_node_queue"}}'/>
                        <ds-get-view view="config/callConfig/queue/queue_list" panel="ivrQueuePanel"/>
                        <ds-effect-ivr/>
                        删除
                    </a>
                </div>
            </div>
            <div class="row-fluid">
                <div class="span11 offset1">
                    <div class="btn-group" data-toggle="buttons-radio">
                        <button type="button" class="btn queue_panel_toggle active" id="queueInfo">基本信息</button>
                        <button type="button" class="btn queue_panel_toggle" id="queueTime">时长</button>
                        <button type="button" class="btn queue_panel_toggle" id="agentAssign">座席分配</button>
                        <button type="button" class="btn queue_panel_toggle" id="queueToPeer">流转</button>
                    </div>
                </div>
            </div>
            <br/>

            <div id="queueInfoPanel" class="queue_toggle_panel">
                <div class="control-group">
                    <label class="control-label">技能组名称</label>

                    <div class="controls">
                        <input type="text" name="DisplayName" msgName="技能组名称" required maxlength="16"/>
                    </div>
                </div>
                <div class="control-group">
                    <label class="control-label">技能组号</label>

                    <div class="controls">
                        <input type="text" id="queueNoInput" name="Exten" disabled/>
                    </div>
                </div>
                <div class="control-group">
                    <label class="control-label">座席分配策略</label>

                    <div class="controls">
                        <select name="Strategy">
                            <option value="rrmemory">轮流</option>
                            <option value="random">随机</option>
                            <option value="fewestcalls">接听最少</option>
                        </select>
                    </div>
                </div>
                <div class="control-group">
                    <label class="control-label">是否启用报工号</label>

                    <div class="controls">
                        <label class="radio inline span1" style="margin-right:8px;">
                            <input type="radio" name="SayExten" id="noSayExten" value=false
                                   class="inline">否
                        </label>

                        <label class="radio inline span1" style="margin-right:8px;">
                            <input type="radio" name="SayExten" id="sayExten" value=true
                                   class="inline">是
                        </label>
                    </div>
                </div>
                <div id="agentExtenPoint_div" class="control-group">
                    <label class="control-label">是否启用报工号后的提示音</label>
                    <div class="controls">
                        <label class="checkbox">
                            <input type="checkbox" name="AgentExtenPoint" id="queue_AgentExtenPoint"/>
                        </label>
                    </div>
                </div>
                <div class="control-group">
                    <label class="control-label">无空闲座席时立刻流转</label>
                    <div class="controls">
                        <label class="radio inline span1" style="margin-right:8px;">
                            <input type="radio" name="JoinEmpty" value="0">否
                        </label>
                        <label class="radio inline span1" style="margin-right:8px;">
                            <input type="radio" name="JoinEmpty" value="1">是
                        </label>
                    </div>
                </div>
                <div class="control-group">
                    <label class="control-label">播报排队位置时间间隔</label>
                    <div class="controls">
                        <div class="input-append">
                            <input type="text" name="SayQueuePosition" style="width: 175px" value="0"
                                   required msgName="播报排队位置时间间隔" maxlength="5" dataType="Number" msg="播报排队位置时间间隔必须是数字"/>
                            <span class="add-on" style="height: 14px;line-height: 15px">秒</span>
                        </div>
                        <span class="text-info">设置0则不播报,最小为15秒</span>
                    </div>
                </div>
                <div class="control-group">
                    <label class="control-label">来电弹屏</label>
                    <div class="controls">
                        <select name="BussinessTypeId"  id="callInPopConfig">

                        </select>
                    </div>
                </div>
                <div class="control-group">
                    <label class="control-label">等待音乐</label>
                    <div class="controls">
                        <select name="MusicClass" id="ivrMusicOnHoldOptions">
                        </select>
                    </div>
                </div>
                <div class="control-group">
                    <label class="control-label">进入技能组提示音</label>
                    <div class="controls">
                        <select name="Music" id="ivrSoundOptions">
                        </select>
                    </div>
                </div>
            </div>
            <div id="queueTimePanel" style="display:none;" class="queue_toggle_panel">
                <div class="control-group">
                    <label class="control-label">等待时长</label>

                    <div class="controls">
                        <input type="text" name="WaitTime" value="120" required msgName="在队列中等待时长"
                               maxlength="5" dataType="Number,Range" min="1" msg="在队列中等待时长必须是大于0的数字"/>秒
                    </div>
                </div>
                <div class="control-group">
                    <label class="control-label">座席振铃时长</label>

                    <div class="controls">
                        <input type="text" name="Timeout" value="30" required msgName="座席振铃时长"
                               maxlength="5" dataType="Number,Range" min="1" msg="座席振铃时长必须是大于0的数字"/>秒
                    </div>
                </div>
            </div>
            <div id="queueToPeerPanel" style="display:none;" class="queue_toggle_panel">
                <div class="control-group">
                    <label class="control-label">技能组为空时转向</label>

                    <div class="controls">
                        <div id="queueEmptyToPeerType" class="ds_ivr_to_peer_type" tag-name="ToPeerTypeWhenQueueEmpty" tag-value-key="ToPeerTypeWhenQueueEmpty">

                        </div>
                        <div id="queueEmptyToPeer" class="ds_ivr_to_peer" tag-value-key="ToPeerWhenQueueEmpty">

                        </div>
                    </div>
                </div>
                <div class="control-group">
                    <label class="control-label">正在等待时转向</label>

                    <div class="controls">
                        <div id="queueWhenWaitType" class="ds_ivr_to_peer_type" tag-value-key="ToPeerTypeWhenWait" tag-name="ToPeerTypeWhenWait">

                        </div>
                        <div id="queueWhenWait" class="ds_ivr_to_peer" tag-value-key="ToPeerWhenWait">

                        </div>
                    </div>
                </div>
                <div class="control-group">
                    <label class="control-label">等待超时转向</label>

                    <div class="controls">
                        <div id="queueTimeoutToPeerType" class="ds_ivr_to_peer_type" tag-value-key="ToPeerTypeWhenWaitTimeout" tag-name="ToPeerTypeWhenWaitTimeout">

                        </div>
                        <div id="queueTimeoutToPeer" class="ds_ivr_to_peer" tag-value-key="ToPeerWhenWaitTimeout">

                        </div>
                    </div>
                </div>
                <div class="control-group">
                    <label class="control-label">通话结束后转向</label>

                    <div class="controls">
                        <div id="queueHangupToPeerType" class="ds_ivr_to_peer_type" tag-value-key="ToPeerTypeWhenHanguped" tag-name="ToPeerTypeWhenHanguped">

                        </div>
                        <div id="queueHangupToPeer" class="ds_ivr_to_peer" tag-value-key="ToPeerWhenHanguped">

                        </div>
                    </div>
                </div>
                <div class="ds_item_edit_param" ToPeerTypeWhenQueueEmpty="" ToPeerWhenQueueEmpty=""
                     ToPeerTypeWhenWaitTimeout="" ToPeerWhenWaitTimeout=""
                     ToPeerTypeWhenHanguped="" ToPeerWhenHanguped=""
                     ToPeerTypeWhenWait="" ToPeerWhenWait=""
                     style="display:none"></div>
            </div>
        </form>
        <div id="agentAssignPanel" style="display:none;" class="queue_toggle_panel">
            <div class="offset1">
                输入座席姓名或工号定位座席：<input type="text" data-provide="typeahead" id="agentAssignAutoComplete" autocomplete="off">
                <a href="#" id="locationAgentHref" style="display: none;">aa</a>
                <br>
                按两次回车定位
                &nbsp;&nbsp;
                全选
                <input type="checkbox" name="selectAllAgent" onchange="selectAllQueueAgent(this)">
            </div>
            <div style="height:400px;overflow: auto;">
                <table id="agentAssignTableLeft" class="table span6">
                    <thead>
                    <tr>
                        <th class="span2">座席[工号]</th>
                        <th class="span1">优先级</th>
                        <th class="span2">选择</th>
                    </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
                <table id="agentAssignTableRight" class="table span6">
                    <thead>
                    <tr>
                        <th class="span2">座席[工号]</th>
                        <th class="span1">优先级</th>
                        <th class="span2">选择</th>
                    </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
            <div class="alert alert-success">
            技能组中的座席按照优先级接听电话，数字小的优先接听。优先级相同按预先设置的"座席分配策略"选择接通来电的座席。
            </div>
        </div>
    </div>
</div>
<script>
    function selectAllQueueAgent(sel){
        var leftList = $("#agentAssignTableLeft").find("input[type=checkbox]");
        var rightList = $("#agentAssignTableRight").find("input[type=checkbox]");
        if(sel.checked==true){
            $.each(leftList,function(key, item){
                $(item).attr("checked",true);
            })
            $.each(rightList,function(key, item){
                $(item).attr("checked",true);
            })
        }else{
            $.each(leftList,function(key, item){
                $(item).attr("checked",false);
            })
            $.each(rightList,function(key, item){
                $(item).attr("checked",false);
            })
        }
    }
</script>
