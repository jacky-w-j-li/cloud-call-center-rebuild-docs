<div class="row-fluid">
    <div class="span12">
        <form class="form-horizontal ds_item_edit" action="" client-data="session.ivrMap.ivr.ivr_node_superDialJobNum">
            <div id="confirm_del_pane"></div>
            <input type="hidden" name="_id" value="___id">
            <input type="hidden" name="Exten" value="2">
            <div class="row-fluid">
                <div class="span6 offset1">
                    <i class="icon-plus"></i>修改采集工号并拨打节点
                </div>
                <div class="span5 text-right pull-right">
                    <a class="btn btn-info btn-blue ds_action_flow">
                        <ds-form-action action="config.ivr.node.superDialJobNum.updateSuperDialJobNum" extra-data="config.callConfig.currentConfigData"
                                        update-client-data='{"method":"config.callConfig.updateClientData","arg":{"type":"ivr_node_superDialJobNum"}}'/>
                        <ds-get-view view="config/callConfig/node/superDialJobNum/superDialJobNum_list" panel="ivrSuperDialJobNumNodePanel"/>
                        <ds-effect-ivr/>
                        保存
                    </a>
                    <a class="btn btn-danger btn-gray ds_action_flow">
                        <ds-form-action action="config.ivr.node.superDialJobNum.deleteSuperDialJobNum" extra-data="config.callConfig.currentConfigData"
                                        update-client-data='{"method":"config.callConfig.updateClientData","arg":{"operation":"del","type":"ivr_node_superDialJobNum"}}'/>
                        <ds-get-view view="config/callConfig/node/superDialJobNum/superDialJobNum_list" panel="ivrSuperDialJobNumNodePanel"/>
                        <ds-effect-ivr/>
                        删除
                    </a>
                </div>
            </div>
            <br/>
            <br/>
            <div class="row-fluid">
                <div class="span5">
                    <div class="control-group">
                        <label class="control-label">
                            节点名称
                        </label>
                        <div class="controls">
                            <input type="text" msgName="节点名称" name="DisplayName" required/>
                        </div>
                    </div>
                    <div class="control-group">
                        <label class="control-label">
                            语音文件
                        </label>
                        <div class="controls ds_ivr_sound_select" sound-select-name="Filename">
                            <select name="Filename">
                                <option value="">--请选择--</option>
                            </select>
                        </div>
                    </div>
                    <div class="control-group">
                        <label class="control-label">
                            按0前台转向
                        </label>
                        <div class="controls">
                            <div id="toPeerTypeWhenFrontOffice" class="ds_ivr_to_peer_type" tag-name="ToPeerTypeWhenFrontOffice"
                                 tag-value-key="ToPeerTypeWhenFrontOffice">

                            </div>
                            <div id="toPeerWhenFrontOffice" class="ds_ivr_to_peer" tag-value-key="ToPeerWhenFrontOffice">

                            </div>
                        </div>
                    </div>
                    <div class="control-group">
                        <label class="control-label">
                            工号不存在转向
                        </label>
                        <div class="controls">
                            <div id="toPeerTypeWhenEmpnoNotExist" class="ds_ivr_to_peer_type" tag-name="ToPeerTypeWhenEmpnoNotExist"
                                 tag-value-key="ToPeerTypeWhenEmpnoNotExist">

                            </div>
                            <div id="toPeerWhenEmpnoNotExist" class="ds_ivr_to_peer" tag-value-key="ToPeerWhenEmpnoNotExist">

                            </div>
                        </div>
                    </div>
                    <div class="control-group">
                        <label class="control-label">
                            座席忙转向
                        </label>
                        <div class="controls">
                            <div id="toPeerTypeWhenEmpnoAgentBusy" class="ds_ivr_to_peer_type" tag-name="ToPeerTypeWhenEmpnoAgentBusy"
                                 tag-value-key="ToPeerTypeWhenEmpnoAgentBusy">

                            </div>
                            <div id="toPeerWhenEmpnoAgentBusy" class="ds_ivr_to_peer" tag-value-key="ToPeerWhenEmpnoAgentBusy">

                            </div>
                        </div>
                    </div>
                    <div class="control-group">
                        <label class="control-label">
                            网关未注册也未绑定手机转向
                        </label>
                        <div class="controls">
                            <div id="toPeerTypeWhenEmpnoLogoff" class="ds_ivr_to_peer_type" tag-name="ToPeerTypeWhenEmpnoLogoff"
                                 tag-value-key="ToPeerTypeWhenEmpnoLogoff">

                            </div>
                            <div id="toPeerWhenEmpnoLogoff" class="ds_ivr_to_peer" tag-value-key="ToPeerWhenEmpnoLogoff">

                            </div>
                        </div>
                    </div>
                    <div class="ds_item_edit_param" ToPeerTypeWhenEmpnoNotExist="" ToPeerWhenEmpnoNotExist=""
                         ToPeerTypeWhenEmpnoAgentBusy="" ToPeerWhenEmpnoAgentBusy="" ToPeerTypeWhenEmpnoLogoff=""
                         ToPeerWhenEmpnoLogoff="" Filename=""
                         ToPeerTypeWhenFrontOffice="" ToPeerWhenFrontOffice="" style="display:none"></div>
                </div>
            </div>
        </form>
    </div>
</div>
