<div class="row-fluid">
    <div class="span12">
        <form class="form-horizontal" action="">
            <div class="row-fluid">
                <div class="span7 offset1">
                    <i class="icon-plus"></i>添加按键菜单节点
                </div>
                <div class="span4 text-right pull-right">
                    <a class="btn btn-info btn-blue ds_action_flow">
                        <ds-form-action action="config.ivr.node.ivr.updateIvr" extra-data="config.callConfig.currentConfigData"
                                        update-client-data='{"method":"config.callConfig.updateClientData","arg":{"type":"ivr_node_ivr"}}'/>
                        <ds-get-view view="config/callConfig/node/ivr/ivr_list" panel="ivrIvrNodePanel"/>
                        <ds-effect-ivr/>
                        保存
                    </a>
                </div>
            </div>
            <br/>
            <br/>
            <div class="row-fluid">
                <div class="span5">
                    <div class="control-group">
                        <label class="control-label">
                            节点名称
                        </label>
                        <div class="controls">
                            <input type="text" msgName="节点名称" name="DisplayName" required/>
                        </div>
                    </div>
                    <div class="control-group">
                        <label class="control-label">
                            按键超时
                        </label>
                        <div class="controls">
                            <input type="text" msgName="按键超时" msg="按键超时时间必须大于1秒小于9999秒" name="Timeout" dataType="NumberLen" max="4" min="1" value="10" required/>
                        </div>
                    </div>
                    <div class="control-group">
                        <label class="control-label">
                            语音文件
                        </label>
                        <div class="controls ds_ivr_sound_select" sound-select-name="Filename">
                            <select name="Filename">
                                   <option value="">--请选择--</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
