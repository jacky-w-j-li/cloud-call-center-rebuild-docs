<div class="row-fluid">
    <div class="span12">
        <form class="form-horizontal ds_item_edit" action="" client-data="session.ivrMap.ivr.ivr_node_validation"
              on-complete="config.callConfig.node.validation.endKeyChange()">
            <input type="hidden" id="_id" name="_id"/>
            <input type="hidden" name="Exten" value="__Exten">
            <input type="hidden" id="EndType" name="EndType" value="1">
            <div class="row-fluid">
                <div class="span7 offset1">
                    <i class="icon-plus"></i>修改采集输入节点
                </div>
                <div class="span4 text-right pull-right">
                    <a class="btn btn-info btn-blue ds_action_flow">
                        <ds-form-action action="config.ivr.node.validation.updateValidation" extra-data="config.callConfig.currentConfigData"
                            update-client-data='{"method":"config.callConfig.updateClientData","arg":{"type":"ivr_node_validation"}}'
                            on-before="config.callConfig.node.validation.beforeSaveValidation"/>
                        <ds-get-view view="config/callConfig/node/validation/validation_list" panel="ivrValidationNodePanel"/>
                        <ds-effect-ivr/>
                        保存
                    </a>
                    <a class="btn btn-danger btn-gray ds_action_flow">
                        <ds-form-action action="config.ivr.node.validation.deleteValidation" extra-data="config.callConfig.currentConfigData"
                                        update-client-data='{"method":"config.callConfig.updateClientData","arg":{"operation":"del","type":"ivr_node_validation"}}'/>
                        <ds-get-view view="config/callConfig/node/validation/validation_list" panel="ivrValidationNodePanel"/>
                        <ds-effect-ivr/>
                        删除
                    </a>
                </div>
            </div>
            <br/>
            <br/>
            <div class="row-fluid">
                <div class="span5">
                    <div class="control-group">
                        <label class="control-label">
                            节点名称
                        </label>
                        <div class="controls">
                            <input type="text" msgName="节点名称" name="DisplayName" required/>
                        </div>
                    </div>
                    <div class="control-group">
                        <label class="control-label">
                            语音文件
                        </label>
                        <div class="controls ds_ivr_sound_select" sound-select-name="Filename">
                            <select name="Filename">
                                <option value="">--请选择--</option>
                            </select>
                        </div>
                    </div>
                    <div class="control-group">
                        <label class="control-label">
                            保存输入的变量
                        </label>
                        <div class="controls ds_ivr_var_select" var-select-name="Data">
                            <select name="Data" required>
                                <option value="">--请选择--</option>
                            </select>
                        </div>
                    </div>
                    <div class="control-group">
                        <label class="control-label">
                            结束方式
                        </label>
                        <div class="controls">
                            <select id="EndKey" name="EndKey"
                                    onchange="handler.config.callConfig.node.validation.endKeyChange()">
                                <option value="#">按#结束</option>
                                <option value="*">按*结束</option>
                                <option value="0">按长度结束</option>
                            </select>
                        </div>
                    </div>
                    <div class="control-group">
                        <label class="control-label">
                            字段最小长度
                        </label>
                        <div class="controls">
                            <input type="text" msgName="字段最小长度" name="Min" value="0" required/>
                        </div>
                    </div>
                    <div class="control-group">
                        <label id="MaxLabel" class="control-label">
                            字段最大长度
                        </label>
                        <div class="controls">
                            <input type="text" id="Max" msgName="字段最大长度"  name="Max" value="30" required/>
                        </div>
                    </div>
                    <div class="control-group">
                        <label class="control-label">
                            按键超时时间
                        </label>
                        <div class="controls">
                            <div class="input-append">
                                <input type="text" msgName="按键超时时间"  name="WaitTime" value="20" required/>
                                <span class="add-on" style="height: 14px;line-height: 15px">秒</span>
                            </div>
                        </div>
                    </div>
                    <div class="control-group">
                        <label class="control-label">
                            重新输入按键
                        </label>
                        <div class="controls">
                            <select id="ReturnKey" name="ReturnKey"
                                    onchange="handler.config.callConfig.node.validation.endKeyChange()">
                                <option value="*">按*重新输入</option>
                                <option value="#">按#重新输入</option>
                            </select>
                        </div>
                    </div>
                    <div class="control-group">
                        <label class="control-label">
                            采集完成后转向
                        </label>
                        <div class="controls">
                            <div id="toPeerType" class="ds_ivr_to_peer_type" tag-name="ToPeerType" tag-value-key="ToPeerType">

                            </div>
                            <div id="toPeer" class="ds_ivr_to_peer" tag-value-key="ToPeer">

                            </div>
                        </div>
                    </div>
                    <div class="control-group">
                        <label class="control-label">
                            超时转向
                        </label>
                        <div class="controls">
                            <div id="toPeerTypeWhenWaitTimeout" class="ds_ivr_to_peer_type" tag-name="ToPeerTypeWhenWaitTimeout"
                                 tag-value-key="ToPeerTypeWhenWaitTimeout">

                            </div>
                            <div id="toPeerWhenWaitTimeout" class="ds_ivr_to_peer" tag-value-key="ToPeerWhenWaitTimeout">

                            </div>
                        </div>
                    </div>
                    <div class="ds_item_edit_param" ToPeerType="" ToPeer="" ToPeerTypeWhenWaitTimeout="" ToPeerWhenWaitTimeout="" Data="" Filename=""
                         style="display:none"></div>
                </div>
            </div>
        </form>
    </div>
</div>
