<div class="row-fluid">
    <div class="span12">
        <form class="form-horizontal" action="">
            <div class="row-fluid">
                <div class="span7 offset1">
                    <i class="icon-plus"></i>添加赋值节点
                </div>
                <div class="span4 text-right pull-right">
                    <a class="btn btn-info btn-blue ds_action_flow">
                        <ds-form-action action="config.ivr.node.assignment.updateAssignment" extra-data="config.callConfig.currentConfigData"
                            on-before="config.callConfig.node.assignment.preSaveAssignment"
                            update-client-data='{"method":"config.callConfig.updateClientData","arg":{"type":"ivr_node_assignment"}}'/>
                        <ds-get-view view="config/callConfig/node/assignment/assignment_list" panel="ivrAssignmentNodePanel"/>
                        <ds-effect-ivr/>
                        保存
                    </a>
                </div>
            </div>
            <br/>
            <br/>
            <div class="row-fluid">
                <div class="span12">
                    <div class="control-group">
                        <label class="control-label">
                            节点名称
                        </label>
                        <div class="controls">
                            <input type="text" msgName="节点名称" name="DisplayName" required/>
                        </div>
                    </div>
                    <div class="control-group">
                        <label class="control-label">
                            转向
                        </label>
                        <div class="controls">
                            <div id="toPeerType" class="ds_ivr_to_peer_type" tag-name="ToPeerType"
                                 tag-value-key="ToPeerType">

                            </div>
                            <div id="toPeer" class="ds_ivr_to_peer" tag-value-key="ToPeer">

                            </div>
                        </div>
                    </div>
                    <div class="row-fluid">
                        <div class="span11">
                            <table class="table table-bordered">
                                <tbody>
                                <tr>
                                    <th class="span5">变量</th>
                                    <th class="span1">=</th>
                                    <th class="span5">值</th>
                                    <th>
                                        <a href="#" class="ds-ivr-add-assignment-cond"><i class="icon-plus"></i></a>
                                    </th>
                                </tr>
                                </tbody>
                                <tbody id="ivrAssignmentListBody">

                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
