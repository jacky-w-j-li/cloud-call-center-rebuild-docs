<div class="right_content_pane" >
    <form id="frm_role_edit" class="form-horizontal">
        <input type="hidden" name="_id" />
        <div class="right_head clearfix" style="">
            <div class="pull-left">
                <h4 style="">修改角色</h4>
            </div>
            <div class=" pull-right">
                <button type="button" class="btn btn-small ds_do_action " ds_action="config.role.cancelDeal" style="margin-left: 0px;">取消</button>
                <button type="button" class="btn btn-primary btn-small ds_form_action "  ds_action="config.role.updateRole" style="margin-left: 10px;">保存</button>
            </div>
        </div>

        <div>
            <div class="control-group">
                <label class="control-label">角色名称</label>
                <div class="controls">
                    <input name="display_name" type="text" maxlength="25" msgName='角色名称' required>
                </div>
            </div>
            <div class="control-group">
                <label class="control-label" >描述</label>
                <div class="controls" >
                    <textarea name="memo" rows="3"></textarea>
                </div>
            </div>
            <div class="control-group">
                <label class="control-label">数据权限</label>
                <div class="controls">
                   <div class="row-fluid ">
                        <div class="span12">
                            <label>通话</label>
                            <select id="scopeCall" name="call" style="margin-right:5px;">
                                <option value="level">我和我的下属</option>
                                <option value="all">所有人</option>
                                <option value="dept">我的部门</option>
                                <option value="deptLevel">我和我的下级部门</option>
                            </select>
                        </div>
                    </div>
                     <div class="row-fluid ">
                        <div class="span12">
                            <label>客户 </label>
                            <select id="scopeCustomer"  name="customer" style="margin-right:5px;">
                                <option value="level">我和我的下属</option>
                                <option value="all">所有人</option>
                                <option value="dept">我的部门</option>
                                <option value="deptLevel">我和我的下级部门</option>
                            </select>
                        </div>
                    </div>
                     <div class="row-fluid ">
                        <div class="span12">
                            <label>工单</label>
                            <select id="scopeBusiness" name="business" style="margin-right:5px;">
                                <option value="level">我和我的下属</option>
                                <option value="all">所有人</option>
                                <option value="dept">我的部门</option>
                                <option value="deptLevel">我和我的下级部门</option>
                            </select>
                        </div>
                    </div>
                     <div class="row-fluid ">
                        <div class="span12">
                            <label>外呼任务</label>
                            <select id="scopeCustTask" name="custTask" style="margin-right:5px;">
                                <option value="level">我和我的下属</option>
                                <option value="all">所有人</option>
                                <option value="dept">我的部门</option>
                                <option value="deptLevel">我和我的下级部门</option>
                            </select>
                        </div>
                    </div>
                     <div class="row-fluid ">
                        <div class="span12">
                            <label>客户审核</label>
                            <select id="scopeCustApproval" name="custApproval" style="margin-right:5px;">
                                <option value="level">我和我的下属</option>
                                <option value="all">所有人</option>
                                <option value="dept">我的部门</option>
                                <option value="deptLevel">我和我的下级部门</option>
                            </select>
                        </div>
                    </div>
                     <div class="row-fluid ">
                        <div class="span12">
                            <label>短信</label>
                            <select id="scopeSms" name="sms" style="margin-right:5px;">
                                <option value="level">我和我的下属</option>
                                <option value="all">所有人</option>
                                <option value="dept">我的部门</option>
                                <option value="deptLevel">我和我的下级部门</option>
                            </select>
                        </div>
                    </div>
                    <div class="alert">我和我的下属”是每个座席默认都有的数据权限，“我的部门”、“我和我的下级部门”包含了“我和我的下属”</div>
                </div>
            </div>
            <div class="control-group">
                <label class="control-label" >功能权限</label>
                <div class="controls" >
                    <ul id="role_funcTree" class="ztree pull-left" ></ul>
                </div>
            </div>
        </div>
    </form>
</div>
