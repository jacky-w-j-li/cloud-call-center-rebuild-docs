<div class="right_content_pane" >
    <form id="config_quality_template_update_form" class="form-horizontal">
        <input type="hidden" name="_id"/>
        <input type="hidden" name="enable">
        <div class="right_head clearfix" style="">
            <div class="pull-left">
                <h4>修改质检模板</h4>
            </div>
            <div class=" pull-right">
                <a href="#" class="btn ds_do_action" ds_action="config.qualityCheck.cancelQualityCheckTemplate">取消</a>
                <a href="#" class="btn btn-primary ds_form_action" ds_action="config.qualityCheck.saveEditQualityCheckTemplate">保存</a>
            </div>
        </div>
        <div class="control-group">
            <label class="control-label" for="field_name">质检模板名称</label>
            <div class="controls">
                <input id="field_name" name="name" type="text" maxlength="20" required msgName="质检模板名称">
            </div>
        </div>
        <div class="accordion" id="accordion2">
            <div class="accordion-group">
                <div class="accordion-heading">
                    <a class="accordion-toggle" data-toggle="collapse" data-parent="#accordion2" href="#collapseOne">
                        基本信息
                    </a>
                </div>
                <div id="collapseOne" class="accordion-body collapse">
                    <div class="accordion-inner">
                        <div class="control-group">
                            <label class="control-label" >描述</label>
                            <div class="controls" >
                                <textarea name="memo" rows="3"></textarea>
                            </div>
                        </div>
                        <div class="control-group">
                            <label class="control-label">优秀</label>
                            <div class="controls" >
                                <input name="A-begin" style="width: 15px" type="text" maxlength="2" msgName="优秀起始分值" required>&nbsp;-&nbsp;100分
                            </div>
                        </div>
                        <div class="control-group">
                            <label class="control-label">合格</label>
                            <div class="controls" >
                                <input name="B-begin" style="width: 15px" type="text" maxlength="2" msgName="合格起始分值" required>
                                &nbsp;-&nbsp;
                                <input name="B-end" style="width: 15px" type="text" maxlength="2" msgName="合格结束分值" required>
                                分
                            </div>
                        </div>
                        <div class="control-group">
                            <label class="control-label">提醒</label>
                            <div class="controls" >
                                <input name="C-begin" style="width: 15px" type="text" maxlength="2" msgName="提醒起始分值" required>
                                &nbsp;-&nbsp;
                                <input name="C-end" style="width: 15px" type="text" maxlength="2" msgName="提醒结束分值" required>
                                分
                            </div>
                        </div>
                        <div class="control-group">
                            <label class="control-label">不合格</label>
                            <div class="controls" >
                                0&nbsp;-&nbsp;<input name="D-end" style="width: 15px" type="text" maxlength="2" msgName="不合格结束分值" required>分
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="accordion-group">
                <div class="accordion-heading">
                    <a class="accordion-toggle" data-toggle="collapse" data-parent="#accordion2" href="#collapseTwo">
                        质检项
                    </a>
                </div>
                <div id="collapseTwo" class="accordion-body collapse in">
                    <div class="accordion-inner">
                        <table class="table table-striped table-bordered table-hover">
                            <thead>
                                <tr>
                                    <th>
                                        名称
                                    </th>
                                    <th>
                                        权重
                                    </th>
                                    <th class="span1">
                                        <a href="#" class="ds-config-quality-check-add-config"><i class="icon-plus"></i></a>
                                    </th>
                                </tr>
                            </thead>
                            <tbody id="config_quality_check_template_config_table_pane">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
