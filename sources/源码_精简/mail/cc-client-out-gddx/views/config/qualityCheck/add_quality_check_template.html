<div class="right_content_pane" >
    <form id="config_quality_template_update_form" class="form-horizontal">
        <input type="hidden" name="_id"/>
        <input type="hidden" name="enable">
        <div class="right_head clearfix" style="">
            <div class="pull-left">
                <h4>添加质检模板</h4>
            </div>
            <div class=" pull-right">
                <a href="#" class="btn ds_do_action" ds_action="config.qualityCheck.cancelQualityCheckTemplate">取消</a>
                <a href="#" class="btn btn-primary ds_form_action" ds_action="config.qualityCheck.saveQualityCheckTemplate">保存</a>
            </div>
        </div>
        <div>
            <div class="control-group">
                <label class="control-label" for="field_name">质检模板名称</label>
                <div class="controls">
                    <input id="field_name" name="name" type="text" maxlength="20" required msgName="质检模板名称">
                </div>
            </div>
            <div class="control-group">
                <label class="control-label" >描述</label>
                <div class="controls" >
                    <textarea name="memo" rows="3"></textarea>
                </div>
            </div>
            <div class="control-group">
                <label class="control-label">优秀</label>
                <div class="controls" >
                    <input name="A-begin" style="width: 15px" type="text" maxlength="2" value="95" msgName="优秀起始分值" required>&nbsp;-&nbsp;100分
                </div>
            </div>
            <div class="control-group">
                <label class="control-label">合格</label>
                <div class="controls" >
                    <input name="B-begin" style="width: 15px" type="text" maxlength="2" value="80" msgName="合格起始分值" required>
                    &nbsp;-&nbsp;
                    <input name="B-end" style="width: 15px" type="text" maxlength="2" value="94" msgName="合格结束分值" required>
                    分
                </div>
            </div>
            <div class="control-group">
                <label class="control-label">提醒</label>
                <div class="controls" >
                    <input name="C-begin" style="width: 15px" type="text" maxlength="2" value="60" msgName="提醒起始分值" required>
                    &nbsp;-&nbsp;
                    <input name="C-end" style="width: 15px" type="text" maxlength="2" value="79" msgName="提醒结束分值" required>
                    分
                </div>
            </div>
            <div class="control-group">
                <label class="control-label">不合格</label>
                <div class="controls" >
                    0&nbsp;-&nbsp;<input name="D-end" style="width: 15px" type="text" maxlength="2" value="59" msgName="不合格结束分值" required>分
                </div>
            </div>
        </div>
    </form>
</div>
