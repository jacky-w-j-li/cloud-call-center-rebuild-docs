<div class="right_content_pane" >
    <form id="frm_Mobilesdk_add" class="form-horizontal ">
        <div class="right_head clearfix" style="">
            <div class="pull-left" style="font-weight: bold">
               添加手机在线客服接入号信息
            </div>
        </div>
        <div class="row-fluid">
            <div class="control-head width-500" >
                移动APP在线客服设置
            </div>
        </div>
        <div class="width-500" id="control-labs-app">
            <div class="row-fluid border-bottom">
                <div id="ask_dialog_webchat" class="modal hide fade" tabindex="-1" role="dialog"
                     aria-labelledby="myModalLabel" aria-hidden="true">

                </div>
                <div class="row_item">
                    <label class="control-label" for="mobilesdk_companyName">企业简称</label>
                    <input id="mobilesdk_companyName" type="text" name="companyName" placeholder="" required/>
                </div>
                <div class="row_item">
                    <label class="control-label" for="mobilesdk_name">app名称</label>
                    <input id="mobilesdk_name" type="text" name="name" placeholder="例如：官网app客服"  required/>
                </div>
                <input id="mobilesdk_accessId"  type="hidden" name="accessId" placeholder="" required />

            </div>
            <div class="row-fluid">
                <div class="row_item">
                    <label class="control-label" for="mobilesdk_welcome">客服欢迎词</label>
                    <input id="mobilesdk_welcome"  type="text" name="welcome" placeholder=""/>
                </div>
                <!--<div class="row_item">-->
                    <!--<label class="control-label" for="mobilesdk_topeer">消息分发技能组</label>-->
                    <!--<select id="mobilesdk_topeer" name="ToPeer" required>-->
                    <!--</select>-->
                <!--</div>-->
                <div class="modal fade modal_position" id="sdkSkillModal" tabindex="-1" style="min-width:275px;">
                    <div class="modal-dialog modal-sm">
                        <div class="modal-content skill-group-content">
                            <button type="button" class="close skill_group_close" aria-label="Close"
                                    data-dismiss="modal" aria-hidden="true">
                                &times;
                            </button>
                            <div class="modal-body">
                                <div class="modal-body-type">
                                    <label class="webchat" for='webchat_topeer'>选择技能组</label>
                                    <select class="webchat" id='webchat_topeer'></select>
                                </div>
                                <div class="modal-body-type">
                                    <label class="webchat" for='type_name'>类型名称</label>
                                    <input class="webchat" type='text' id='type_name' required>
                                </div>
                                <div class="modal-body-type">
                                    <label>启用咨询类型</label>
                                    <!--<ul class="webchat_style_select webchat_style1_select">-->
                                    <!--<li class="ds_do_action check_type_fr webchat_style_li ok" style="background-color:rgb(55, 181, 237);"  ds_data="00cccd" ds_action="config.channel.closeTypeName"></li>-->
                                    <!--</ul>-->
                                    <input id="webchat_showTypeName" style="width:20px; height:20px;" type="checkbox" value="true" name="webchat_showTypeName" checked="checked">
                                </div>

                                <button type="button" class="btn-small btn-position ds_do_action" aria-label="Close"
                                        data-dismiss="modal" ds_action="config.channel.addSkillGroup"  ds_data = "sdkSkillModal">
                                    确定
                                </button>
                            </div>

                        </div><!-- /.modal-content -->
                    </div>
                </div>

                <div class="row_item row_item1">
                    <label class="control-label">添加技能组</label>
                    <div class="skillgroup_container">
                        <ul class="sg_container">
                            <input id="useless" type="hidden" value="0">
                            <script>  $(function () { $("[data-toggle='popover']").popover(); });</script>
                        </ul>
                        <ul class="addSkillGroup">
                            <span class="ds_do_action add_skillgroup_btn" ds_action="config.channel.addShowSkillGroup" ds_data="sdkSkillModal"> 添加技能组</span>
                        </ul>
                    </div>
                </div>



                <div class="row_item">
                    <label class="control-label" for="iosPushUrl">ios推送服务地址</label>
                    <input id="iosPushUrl" type="text" name="iosPushUrl">
                    </input>
                </div>
                <div class="row_item row_item1">
                    <label class="control-label" for="sdkchat_csr">是否启用满意度调查</label>
                    <input id="sdkchat_csr" style="width:20px; height:20px;" type="checkbox" name="webchat_csr" checked="checked">
                    </input>
                </div>
                <div class="row_item">
                    <label class="control-label" for="mobilesdk_robot">启用智能机器人</label>
                    <!--<input id="mobilesdk_robot" style="width:20px; height:20px;" type="checkbox" value="true" name="robot">-->
                    <!--</input>-->
                    <select name="robot" id="mobilesdk_robot">
                    </select>
                </div>
                <div class="row_item">
                    <button type="button" class="btn btn-primary btn-small ds_form_action img-none btn-blue"  ds_action="config.channel.saveMobileSdkCfg" style="margin-left: 10px;">保存并进入下一步</button>
                </div>
            </div>
        </div>
    </form>
</div>
