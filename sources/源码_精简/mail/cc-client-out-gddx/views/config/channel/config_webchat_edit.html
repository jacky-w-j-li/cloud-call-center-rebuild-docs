    <form id="frm_webchat_add" class="form-horizontal " >

        <input type="hidden" name="webchatUrl" value="_#webchatUrl#_"/>

        <div class="right_head clearfix" >
            <div class="pull-left" style="font-weight: bold">
                修改在线客服信息
            </div>

        <div class="control-labels">

                <div class="row-fluid border-bottom">
                    <!--<div style="margin-left:10px;margin-bottom:10px;font-size: 13px; background-color: #eeeeee; display: inline-block; padding: 5px; font-weight: bold; border-radius: 5px;">-->
                    <!--企业信息设置-->
                    <!--</div>-->
                    <div class="row_item row_item1">
                        <label class="control-label" for="webchat_companyName">企业简称</label>       <!--class="control-label"-->
                        <input id="webchat_companyName" class="ds_key_action" keyup_action="config.channel.changeWebchatPreviewComName" type="text" name="companyName" value="_#companyName#_" placeholder=""

                    </div>
                    <div class="row_item row_item1">
                        <label class="control-label" for="webchat_name">网站名称</label>              <!--class="control-label"-->
                        <input id="webchat_name" type="text" name="name" value="_#name#_" placeholder="例如：官网页面客服" required/>
                    </div>
                    <!--<div class="row_item row_item1">-->
                    <!--<label class="control-label" for="webchat_accessId">AccessId</label>-->
                    <input id="webchat_accessId" type="hidden" name="accessId" value="_#accessId#_" placeholder="" required
                    />

                    <div class="row_item row_item1 line-34">
                        <label class=" control-label " for="webchat_companyLogo-container-qiniu" style="line-height: 34px">企业LOGO</label>
                        <div class="webchat_preview_img">
                            <a id="webchat_preview_logoA" href="" target="_blank" title="查看原图">

                            </a>
                        </div>
                        <div id="webchat_companyLogo-container-qiniu" class="pull-left">
                            <img src="_#companyLogo#_?imageView2/1/w/50/h/50" id="webchat_config_edit_companyLogo">
                            <a class="btn btn-info btn-small img-none btn-blue" id="webchat_companyLogo-pickfiles" href="#">
                                <i class="icon-plus icon-white"></i>
                                <sapn>选择图片</sapn>
                            </a>
                        </div>
                        <table class="table table-striped table-hover text-left webchat_companyLogo_container display_none"
                               style="margin-top:15px;display: none">
                            <thead>
                            <tr>
                                <th class="span4">图片</th>
                                <th class="span2">大小</th>
                                <th class="span6">&nbsp;</th>
                            </tr>
                            </thead>
                            <tbody id="webchat_companyLogo-fsUploadProgress">
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="row-fluid">
                    <!--<div style="margin-left:10px;margin-top:10px;margin-bottom:10px;font-size: 13px; background-color: #eeeeee; display: inline-block; padding: 5px; font-weight: bold; border-radius: 5px;">-->
                    <!--客服信息设置-->
                    <!--</div>-->
                    <div class="row_item row_item1">
                        <label class="control-label" for="webchat_welcome">客服欢迎词</label>
                        <input id="webchat_welcome" type="text" name="welcome" placeholder="" value="_#welcome#_"/>
                    </div>
                    <div class="row_item row_item1">
                        <label class="control-label" for="webchat_onlineText">在线客服按钮文案</label>
                        <input id="webchat_onlineText" type="text" name="onlineText" value="_#onlineText#_" placeholder=""/>
                    </div>
                    <!--<div class="row_item row_item1">-->
                    <!--<label class="control-label" for="webchat_offlineText">离线客服按钮文案</label>-->

                    <!--</div>-->
                    <div class="row_item row_item1">

                        <input id="webchat_styleColor" type="hidden" name="styleColor" value="_#styleColor#_"/>
                        <ul class="webchat_style_select webchat_style1_select">
                            <li class="ds_do_action webchat_style_li ok" style="background-color: #19CAA6"
                                ds_action="config.channel.changeWebchatStyle" ds_data="19CAA6"></li>
                            <li class="ds_do_action webchat_style_li" style="background-color: #00b45f;"
                                ds_action="config.channel.changeWebchatStyle" ds_data="00b45f"></li>
                            <li class="ds_do_action webchat_style_li" style="background-color: #b50e03;"
                                ds_action="config.channel.changeWebchatStyle" ds_data="b50e03"></li>
                            <li class="ds_do_action webchat_style_li" style="background-color: #f49300;"
                                ds_action="config.channel.changeWebchatStyle" ds_data="f49300"></li>
                            <li class="ds_do_action webchat_style_li" style="background-color: #9ec100;"
                                ds_action="config.channel.changeWebchatStyle" ds_data="9ec100"></li>
                            <li class="ds_do_action webchat_style_li" style="background-color: #00cccd;"
                                ds_action="config.channel.changeWebchatStyle" ds_data="00cccd"></li>

                                ds_action="config.channel.changeWebchatStyle" ds_data="871F78"></li>

                    <!--</div>-->

                    <div class="modal fade modal_position" id="myModal" tabindex="-1" style="min-width:275px;">
                        <div class="modal-dialog modal-sm">
                            <div class="modal-content skill-group-content">
                                <button type="button" class="close skill_group_close" aria-label="Close"
                                        data-dismiss="modal" aria-hidden="true">
                                    &times;
                                </button>
                                <div class="modal-body">
                                    <div class="modal-body-type">
                                        <label class="webchat" for='webchat_topeer'>选择技能组</label>
                                        <select class="webchat" id='webchat_topeer'></select>
                                    </div>
                                    <div class="modal-body-type">
                                        <label class="webchat" for='type_name'>类型名称</label>
                                        <input class="webchat" type='text' id='type_name' required>
                                    </div>
                                    <div class="modal-body-type">
                                        <label>启用咨询类型</label>
                                        <!--<ul class="webchat_style_select webchat_style1_select">-->
                                        <!--<li class="ds_do_action check_type_fr webchat_style_li ok" style="background-color:rgb(55, 181, 237);"  ds_data="00cccd" ds_action="config.channel.closeTypeName"></li>-->
                                        <!--</ul>-->
                                        <input id="webchat_showTypeName" style="width:20px; height:20px;" type="checkbox" value="true" name="webchat_showTypeName" checked="checked">
                                    </div>

                                    <button type="button" class="btn-small btn-position ds_do_action" ds_action="config.channel.addSkillGroup" ds_data="myModal">
                                        确定
                                    </button>
                                </div>

                            </div><!-- /.modal-content -->
                        </div>
                    </div>

                    <div class="row_item row_item1">
                        <label class="control-label">添加技能组</label>

                            <ul class="sg_container">
                                <input id="useless" type="hidden" value="0">
                                <script>  $(function () { $("[data-toggle='popover']").popover(); });</script>
                            </ul>
                            <ul class="addSkillGroup">
                                <span class="ds_do_action add_skillgroup_btn" ds_action="config.channel.addShowSkillGroup" ds_data="myModal"> 添加技能组</span>
                            </ul>
                        </div>

                    </div>


                    <div class="row_item row_item1">
                        <label class="control-label" for="webchat_robot">启用智能机器人</label>
                        <select id="webchat_robot" name="robot">
                        </select>
                    </div>
                    <div class="row_item row_item1">
                        <label class="control-label" for="webchat_csr">是否启用满意度调查</label>
                        <input id="webchat_csr" style="width:20px; height:20px;" type="checkbox" name="webchat_csr">

                        </input>
                    </div>
                    <div class="row_item row_item1 btn-center">
                        <button type="button" class="btn btn-primary btn-small ds_form_action img-none btn-blue" ds_action="config.channel.updateWebchatCfg" style="margin-left: 10px;">
                            保存并进入下一步
                        </button>
                    </div>

    <div class="webchat_preview webchat_preview1">
        <div style="position: absolute;padding:2px; bottom:318px; color:black; width: 5em; font-weight: bold">界面预览</div>
        <div class="webchat_preview_container">
            <div class="webchat_preview_header grey12">
                <div class="webchat_preview_ser_info">
                    <div class="webchat_preview_logo"><img id="webchat_preview_logo" src="_#companyLogo#_?imageView2/1/w/50/h/50"/></div>
                    <div class="webchat_preview_sercompany" id="webchat_preview_sercompany">_#companyName#_</div>
                </div>
                <div class="webchat_preview_corner_btn">
                    <span class="webchat_preview_chat_min"><img width="20px" height="20px" src="../img/client/customer/webchat_min.png"></span>
                    <span class="webchat_preview_chat_close"><img width="20px" height="20px" src="../img/client/customer/webchat_close.png"></span>
                </div>
            </div>
            <div class="webchat_preview_content">
                <ul>
                    <li class="webchat_preview_chatmsg"><p class="webchat_preview_servicename">容联七陌</p>

                        <div class="webchat_preview_outerleft">

                        </div>
                    </li>

            <div class="webchat_preview_footer">
                <div class="webchat_preview_msg_toolbar">
                    <span id="webchat_preview_face_btn"><img width="20px" height="20px" src="../img/client/customer/webchat_ico.png"/></span>
                </div>
                <div class="webchat_preview_msg_input">
                    <div class="webchat_preview_input_box">
                        <span></span>
                    </div>
                </div>
                <div class="webchat_preview_msg_toolbar_footer grey12">
                    <span>提交</span>
                </div>
            </div>
