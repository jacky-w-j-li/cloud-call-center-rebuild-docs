<div class="right-side" style="background-color: #fdfbd8;margin-bottom: 15px;border-radius: 6px;padding-left: 5px;padding-right: 5px;">
    <form>
        <input class="hidden" name="template" value="__id">
        <fieldset>
            <legend>添加自定义字段</legend>
            <div class="row_item">
                <label for="field-name">字段名称</label>
                <input id="field-name" class="field-name" name="name" type="text" maxlength="35" required>
            </div>
            <div class="row_item">
                <label>是否必填</label>
                <label class="radio" style="width: 20px;font-weight: normal">
                    <input type="radio" name="required" id="optionsRadios1" value="yes" style="margin: 5px 0 0 -10px">是</label>
                <label class="radio" style="width: 20px;font-weight: normal">
                    <input type="radio" name="required" id="optionsRadios2" value="no" checked style="margin: 5px 0 0 -10px">
                    否
                </label>
            </div>
            <div class="row_item">
                <label>禁止修改</label>
                <label class="radio" style="width: 20px;font-weight: normal">
                    <input type="radio" name="noupdate" id="noupdate_optionsRadios1" value="yes" style="margin: 5px 0 0 -10px">是</label>
                <label class="radio" style="width: 20px;font-weight: normal">
                    <input type="radio" name="noupdate" id="noupdate_optionsRadios2" value="no" checked style="margin: 5px 0 0 -10px">
                    否
                </label>
            </div>
            <div class="row_item">
                <label>类型</label>
                <select id="choose_custom_field_type" name="type" class="field-type">
                    <option value="single">单行文本</option>
                    <option value="multi">多行文本</option>
                    <option value="number">数字</option>
                    <option value="date">日期</option>
                    <option value="dropdown">下拉框</option>
                    <option value="checkbox">复选框</option>
                    <option value="radio">单选框</option>
                </select>
            </div>
            <div id="field_attr_pane" style="position: relative;margin: 5px 90px 0 117px">

            </div>
            <div class="form_buttons" style="padding-left:113px;padding-top:5px;">
                <a class="submit_button button ds_form_action" ds_action="config.customer.addCustomerField">保存</a>
                <a class="cancel_button ds_do_action" ds_action="config.customer.closeAddCustomerField" ds_data="__id">取消</a>
            </div>
        </fieldset>
    </form>
</div>
<script type="text/javascript">
    $('#choose_custom_field_type').change(function(e){
        var pane = $('#field_attr_pane');
        pane.empty();
        var type = e.currentTarget.value;
        if(type == 'dropdown' || type== 'checkbox' || type == 'radio') {
            pane.removeClass("hidden");
            var str = '<div class="row-select-box" style="position: relative;">'+
                    '<a class="plus ds_do_action" ds_action="config.customer.plusCustomField" ds_data=""></a>'+
                    '<input class="select-box" type="text" name="choices[]" maxlength="60" style="">'+
                    '</div>';
            pane.html(str);
        } else {
            pane.addClass("hidden");
        }
    });
</script>
