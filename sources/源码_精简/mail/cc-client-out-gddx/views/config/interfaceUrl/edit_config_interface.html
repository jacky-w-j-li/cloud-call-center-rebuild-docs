<form>
    <div class="row-fluid">
        <div class="row-fluid" style="margin-top: 8px;">
            <div style="float: left;margin-top: 20px; margin-bottom: 10px;">
                <h4>编辑对接页面</h4>
            </div>
            <div style="float: right;margin-top:15px;margin-bottom: 5px;">
                <a href="#" class="btn btn-small ds_do_action" ds_action="config.interfaceUrl.cancelInterfaceFields">取消</a>
                <a href="#" class="btn btn-small btn-primary ds_form_action" ds_action="config.interfaceUrl.editInterfaceFields">保存</a>
            </div>
        </div>
        <div class="row-fluid">
            <div style="border:1px solid;"></div>
        </div>
        <div class="row-fluid">
            <input id="field_id" name="_id" type="hidden" value="__id" />
            <div class="row_item">
                <label for="field_name">页面名称</label>
                <input id="field_name" name="name" type="text" value="__name" max="20" dataType="LimitLen" msg="页面名称不能超过20个字符" required>
            </div>
            <div class="row_item">
                <label for="field_url">页面地址</label>
                <input id="field_url" name="url" type="text" value="__url" datatype="Url" msg="网址格式不正确"  required>
            </div>
        </div>
    </div>
</form>
