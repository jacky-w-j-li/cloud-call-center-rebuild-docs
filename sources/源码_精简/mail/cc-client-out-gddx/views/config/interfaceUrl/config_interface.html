<div >
    <ul class="nav nav-tabs">
        <li class="active"><a href="#panel_call_url" data-toggle="tab">来电对接</a></li>
        <li><a href="#panel_index_url" data-toggle="tab">首页对接</a></li>
        <!--<li><a href="#panel_call_inter_url" data-toggle="tab">弹屏历史对接</a></li>-->
    </ul>
    <div class="tab-content">
        <div class="tab-pane active" id="panel_call_url">
            <div class="row-fluid">
                <div class="span6">
                    <!--<div class="row-fluid">-->
                        <div class="" style="float: right;margin-bottom: 5px;">
                            <a id="config_callUrl_add" href="#" class="btn btn-small  ds_do_action" ds_action="config.interfaceUrl.showAddcallUrl" ds_data="">添加</a>
                        </div>
                    <!--</div>-->
                    <div class="row-fluid">
                        <table class="table table-striped table-bordered table-hover" id="config_callUrl_table">
                            <thead>
                            <tr>
                                <th>描述</th>
                                <th>弹屏地址</th>
                                <th style="width:5em">弹屏方式</th>
                                <th style="width:6em">操作</th>
                            </tr>
                            </thead>
                            <tbody id="config_callUrl_pane">

                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="span6 sub-right">
                    <div id="config_callUrl_container">

                    </div>
                </div>

            </div>
        </div>
        <div class="tab-pane" id="panel_index_url">
            <div class="row-fluid">
                <div class="span6">
                    <!--<div class="row-fluid">-->
                        <div class="" style="float: right;margin-bottom: 5px;">
                            <a href="#" class="btn btn-small ds_do_action" ds_action="config.interfaceUrl.showAddInferface" ds_data="">添加</a>
                        </div>
                    <!--</div>-->
                    <div class="row-fluid">
                        <table class="table table-striped table-bordered table-hover" id="config_interface_table">
                            <thead>
                            <tr>
                                <th style="width:5em">菜单排序</th>
                                <th>页面名称</th>
                                <th>页面地址</th>
                                <th style="width:5em">操作</th>
                            </tr>
                            </thead>
                            <tbody id="config_interface_pane">

                            </tbody>
                            <script type="text/html" id="config_interface_item_template">
                                <tr>
                                    <td>
                                        <span class="ds_do_action" style="cursor:pointer" ds_action="config.interfaceUrl.moveInterfaceFieldUp" ds_data="{{=_id}}" title="升序"><i class="icon-arrow-up"></i></span>
                                        <span class="ds_do_action" style="cursor:pointer" ds_action="config.interfaceUrl.moveInterfaceFieldDown" ds_data="{{=_id}}" title="降序"><i class="icon-arrow-down"></i></span>
                                    </td>
                                    <td style="word-break: break-all;width: 180px;">
                                        {{=name}}
                                    </td>
                                    <td style="word-break: break-all;width: 180px;">
                                        {{=url}}
                                    </td>
                                    <td>
                                        <a href="#" class="ds_do_action" ds_action="config.interfaceUrl.showEditInterfaceFields" ds_data="{{=_id}}">编辑</a>
                                        <a href="#" class="ds_do_action" ds_action="config.interfaceUrl.delInterfaceFields" ds_data="{{=_id}}">删除</a>
                                    </td>
                                </tr>
                            </script>
                        </table>
                    </div>
                </div>
                <div class="span6 sub-right">
                    <div id="config_interface_container">

                    </div>
                </div>

            </div>
        </div>
        <div class="tab-pane" id="panel_call_inter_url">
            <div class="row-fluid">
                <div class="span6">
                    <div class="row-fluid">
                        <div class="span2" style="float: right">
                            <a href="#" class="btn btn-primary action" appaction="config.call.showAddCallInter" appdata="">添加</a>
                        </div>
                    </div>
                    <div class="row-fluid">
                        <table class="table table-striped table-bordered table-hover" id="config_call_inter_table">
                            <thead>
                            <tr>
                                <th>描述</th>
                                <th>对接地址</th>
                                <th>操作</th>
                            </tr>
                            </thead>
                            <tbody id="config_call_inter_pane">

                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="span5">
                    <div id="config_call_inter_container">

                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
