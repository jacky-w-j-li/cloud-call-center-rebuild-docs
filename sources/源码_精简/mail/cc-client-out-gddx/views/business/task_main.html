<script type="text/javascript">
    $(function () {
        var flows = getCache("businessFlow");
        handler.business.flows=[{n:"全部",v:""}];
        for (var i = 0; i < flows.length; i++) {
            handler.business.flows.push({n:flows[i].name,v:flows[i]._id});
        }
        var searchPane=$("#contact_list_business");
        initQuickMenu(searchPane, handler.business.flows,"business",".quick_wrap_bus");
//        initQuickSearch(searchPane, handler.business.flows,"business",".bus_flows");
        resizeLeftColumn(searchPane);
         var menu = "_#menu#_";
        var container = $("#task_list_search_query"+menu);

        searchPane.find(".task_list_search_dorpdown").bind("click", function (e) {
            e.stopPropagation();
            var offset=$(this).closest(".quick_search").offset();
            container.css({top:offset.top+28+"px",left:offset.left+"px"});
            container.toggleClass("hidden");
        });

        var temp = "<option value='_id'>_name</option>";
        var html = "";
        for (var i = 0; i < flows.length; i++) {
            var flowsItem = flows[i];
            // if (handler.business.hasAccessForFlow(flowsItem)) {
            html += temp.replace(/_id/g, flows[i]._id).replace(/_name/g, flows[i].name);
            // }
        }
        var typeSelect = container.find(".business_type");
        var statusSelect = container.find(".business_status");
        var fieldsPane = container.find(".business_fields");
        var masterSelect = container.find(".business_master");
        var waitformessage = container.find(".business_is_waitingfor");
        var createUserSelect = container.find(".business_createUser");
        typeSelect.append(html);

        var agents = getCache("agents") || [];
        for (var i = 0; i < agents.length; i++) {
            var agentsItem = agents[i];
            masterSelect.append(temp.replace(/_id/g, agentsItem._id).replace(/_name/g, agentsItem.displayName));
            createUserSelect.append(temp.replace(/_id/g, agentsItem._id).replace(/_name/g, agentsItem.displayName));
        }
        if(container.find(".ds_owner").length>0){
                    var inputIdCreateUser=menu+"_createUser_owner_select_input";
                    var containerIdCreateUser=menu+"_createUser_owner_select_user";
                     utils.loadAgentTabBox(inputIdCreateUser,containerIdCreateUser,{width:"126",height:"17",maxHeight:292,hideTab:0,isRadio:true,commonTab:true},false,false,false);
                     var inputIdMaster=menu+"_master_owner_select_input";
                    var containerIdMaster=menu+"_master_owner_select_user";
                     utils.loadAgentTabBox(inputIdMaster,containerIdMaster,{width:"126",height:"17",maxHeight:292,hideTab:0,isRadio:true,commonTab:true},false,false,false);
                }
//        var menu = session.currentPage.pageId;


/*        $(".business_list_query_form").keydown(function (event) {
            if (event.keyCode == 13) {
                event.preventDefault();
                event.stopImmediatePropagation();
                handler.business.queryBusinessList("", $(this));
            }
        });*/


        $(typeSelect).bind('change', function () {
            waitformessage.val("");
            fieldsPane.empty();
            var flowId = $(this).val();
            var flow = getCache("businessFlow", flowId);
            var steps = flow.steps || [];
            statusSelect.empty();
            statusSelect.append("<option value=''>--请选择--</option>");
            for (var i = 0; i < steps.length; i++) {
                var stepsItem = steps[i];
                statusSelect.append(temp.replace(/_id/g, stepsItem._id).replace(/_name/g, stepsItem.name));
            }
            if (flowId) {
                var startStep = handler.business.getStartStep(flow);
                handler.business.createFlowStepCustomFields(flowId, startStep._id, fieldsPane, {});
                handler.business.addBusienssSelectCascade();
                fieldsPane.find(":input").removeAttr("required");
                fieldsPane.find(":text").val("");
                fieldsPane.find("select").val("");
                fieldsPane.find("textarea").val("");
                fieldsPane.find(":input").removeAttr("checked");
                fieldsPane.find(".bus_attach").remove();
            }
        });

    });
</script>
