<div class="row-fluid">

    <div class="action_form">
        <div class="action_bar">
            <div style="float: right;margin: 0 0 0 -200px;width: 100%;">
                <div style="margin: 0 0 0  200px;">
                    <span id="__uid_add_task_info" class="task_info"></span>
                </div>
            </div>
            <div style="float: left;width: 200px;">
                <label class="pane_title_label">工单类型</label>
                <select id="__uid_add_task_taskType" name="flow" style="width: 120px;margin-top: 5px;"></select>
            </div>

        </div>
        <div class="last_action">
            <div class='row-fluid' id="__uid_add_task_business_fields">

            </div>
            <div class='row-fluid'>
                <div class='span6'>
                    <div class='row-fluid'>
                        <div class='field-label'>
                            <label class="control-label" style='margin-top: 3px;text-align: right;'>下一步处理</label>
                        </div>
                        <div class='field-option'>
                            <div class='field-option-inner ds_search_item'>
                                <select id="__uid_add_task_next_step_action" name='nextAction'
                                        style="width: 100%;"></select>
                            </div>
                        </div>
                    </div>
                </div>
                <div class='span6'>
                    <div class='row-fluid'>
                        <div class='field-label'>
                            <label class="control-label" style='margin-top: 3px;text-align: right;'>处理人</label>
                        </div>
                        <div class='field-option'>
                            <div class='field-option-inner ds_search_item'>
                                <select id="__uid_add_task_next_step_user" name="nextUser"
                                        style="width: 100%;display:none;"></select>

                                <div id="__uid_add_task_next_step_user_type" class="combobox_agent"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>

<script type="text/javascript">
    $(function () {
        var flows = getCache("businessFlow");
        var temp = '<option value="_id">_name</option>';
        var html = "";
        for (var i = 0; i < flows.length; i++) {
            var flowsItem = flows[i];
            if (handler.business.hasAccessForFlow(flowsItem)) {
                html += temp.replace(/_id/g, flows[i]._id).replace(/_name/g, flows[i].name);
            }
        }
        var pane = $('#__uid_add_task_taskType');
        pane.append(html);
        var selectFlow = "_selectFlow";
        if (selectFlow && selectFlow !== "_" + "selectFlow") {
            pane.val(selectFlow);
        }
        if (!html) {
            var pane = $("#__uid_add_task_business_fields").closest(".business_transform").closest("div.business-info").hide();
        }


        $('#__uid_add_task_taskType').bind('change', function () {
            var id = $(this).val();
            var pane = $('#__uid_add_task_business_fields');
            pane.empty();
            if (id) {
                var flow = getCache("businessFlow", id);
                var tipInfo = "<i class='icon-info-sign task_info_tip' data-toggle='popover' data-trigger='hover' data-title='工单提示' data-content=_tips></i>";
                if (!flow.tips) {
                    flow.tips = "";
                }
                $("#__uid_add_task_info").html(tipInfo.replace(/_tips/g, flow.tips) + flow.tips);
                $("#__uid_add_task_info").find("i").popover({});

                handler.business.createStartFlowCustomFields(pane, id);
                handler.business.addBusienssSelectCascade();
                handler.business.jiuxianShortCutBusiness($("#__uid_add_task_business_fields"));

                var currentFlow = getCache("businessFlow", id);
                var currentFlowStep = handler.business.getStartStep(currentFlow);
                var actions = currentFlowStep.actions;
                var html = "";
                var actionTmp = "<option value=_id>_name</option>";
                for (var i = 0; i < actions.length; i++) {
                    var actionsItem = actions[i];
                    html += actionTmp.replace(/_id/g, actionsItem._id).replace(/_name/g, actionsItem.name);
                }
                $("#__uid_add_task_next_step_action").empty();
                $("#__uid_add_task_next_step_action").append(html);
                $("#__uid_add_task_next_step_action").change();
            }
        });

        $('#__uid_add_task_next_step_action').bind('change', function () {
            var actionId = $(this).val();
            var flowId = $("#__uid_add_task_taskType").val();
            var pane = $("#__uid_add_task_next_step_user");
            pane.empty();
            pane.append("<option value=''>自动分配</option>");
            var flow = getCache("businessFlow", flowId);
            var step = handler.business.getStartStep(flow);

            var action = handler.business.getFlowAction(step._id, actionId);


            var nextStepId = action.jumpTo;
            var roles = handler.business.getStepRoles(nextStepId);
            var agents = handler.business.getRoleAgents(roles);
            var tmp = "<option value= '_id'>_name</option>";
            for (var i = 0; i < agents.length; i++) {
                var usersItem = agents[i];
                pane.append(tmp.replace(/_id/g, usersItem._id).replace(/_name/g, usersItem.displayName));
            }

            agents.push({_id: "_id", displayName: "自动分配", pinyin: "zidongfenpei"});
            session.dicMap["business_popupAgents"] = agents;
            utils.loadSearchInput({ id: "__uid_add_task_next_step_user_type",
                width: "120",
                height: "15",
                tip: "按姓名,拼音搜索",
                data: agents,
                showState: true,
                cacheData: "business_popupAgents",
                searchField: ["displayName"],
                pinyinField: ["displayName"],
                listField: ["displayName"],
                userIdField: "_id",
                showField: "displayName",
                showAllList: true,
                callbackFuc: function (object) {
                    pane.val(object._id);
                },
                onKeyChanged: function () {
                    pane.val("");
                    //$("#__uid_add_task_next_step_user_type").val(utils.serachInputNoresult);
                }
            });
            utils.setSearchInput("__uid_add_task_next_step_user_type", "自动分配");

//            if (actionId && flowId) {
//                var flow = getCache("businessFlow", flowId);
//                var step = handler.business.getStartStep(flow);
//                var actions = step.actions || [];
//                var action = null;
//                for (var i = 0; i < actions.length; i++) {
//                    var actionsItem = actions[i];
//                    if (actionsItem._id == actionId) {
//                        action = actionsItem;
//                    }
//                }
//                if(action){
//                    var tmp = "<option value= '_id'>_name</option>";
//                    var html = "";
//                    var actionRole = action.actionRole;
//                    var agents = getCache("agents");
//                    for(var j=0;j< agents.length;j++){
//                        var agentsItem =agents[j];
//                        var role = agentsItem.role ||[];
//                        for(var m =0;m<role.length;m++){
//                            if(role[m] == actionRole){
//                                html += tmp.replace(/_id/g,agentsItem._id).replace(/_name/g,agentsItem.name);
//                            }
//                        }
//                    }
//                    pane.append(html);
//                }
//            }
        });

        $('#__uid_add_task_taskType').change();
    });


</script>
