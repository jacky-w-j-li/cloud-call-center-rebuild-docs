<div class="pay_start" style="margin:10px;">
    <div class="licence_pay">
        <div class="alert alert-info">
            新增licence：生效时间和原来的重合，系统会叠加同一时间内的licence数量，总的licence就大了。<br>
            减少licence：生效时间设置为原来licence的到期时间，到期后自动按新的licence计算。
        </div>
        <form class="form-horizontal" id="frm_licence_update">
            <input type="hidden" name="_id" value="">
            <input type="hidden" name="flag" value="buyLicence">
            <div class="form-group">
                <label class="control-label col-md-3">
                    类型
                </label>
                <div class="col-md-5">
                    <select name="licenceType"  class="form-control input-sm licenceType" required>
                        _@getDicOptions("licenceType","","no")@_
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="control-label col-md-3">
                    节点
                </label>
                <div class="col-md-5">
                    <select name="pbx"  class="form-control input-sm pbx" required>
                        _@getCCPbxOptions()@_
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="control-label col-md-3">
                    单价
                </label>
                <div class="col-md-5">
                    <input type="text" name="licencePrice" value='' class="form-control input-sm licencePrice" readonly/>
                    <!--<span class="licencePrice"></span>-->
                </div>
            </div>
            <div class="form-group">
                <label class="control-label col-md-3">
                    生效日期
                </label>
                <div class="col-md-5">
                    <input type="text" name="beginDate" value='' class="form-control input-sm ds_date" required/>
                </div>
            </div>
            <div class="form-group">
                <label class="control-label col-md-3">
                    licence数量
                </label>
                <div class="col-md-5">
                    <input type="text" onkeyup="value=value.replace(/[^\d]/g,'')" name="num" value='1' class="form-control input-sm ds_spinner_licence" required/>个
                    <label for="num" class="error" style="display: none;"></label>
                </div>
            </div>
            <div class="form-group">
                <label class="control-label col-md-3">
                    时长
                </label>
                <div class="col-md-5">
                    <input type="text" onkeyup="value=value.replace(/[^\d]/g,'')" name="month" value='1' class="form-control input-sm ds_spinner_licence " required/>个月
                    <label for="month" class="error" style="display: none;"></label>
                </div>
            </div>
            <div class="form-group">
                <label class="control-label col-md-3">
                    费用
                </label>
                <div class="col-md-8" style="line-height: 35px;">
                    <span class="fee">_#totalFee#_</span>元
                    <span class="text-muted">&nbsp;[单价*数量*购买时长=费用]</span>
                </div>
            </div>
            <div class="form-group">
                <div class="col-md-offset-3 col-md-8">
                    <button type="button" class="btn btn-primary btn-small ds_form_action" ds_action="licence.showPayLicence">立刻购买</button>
                    <button type="button" class="btn btn-default btn-small" data-dismiss="modal">关闭</button>
                </div>
            </div>
        </form>
    </div>

</div>
<div class="pay_end" style="display: none;">
    <p class="text-center">请您在新打开的网上银行页面进行支付，支付完成前请不要关闭该窗口</p>
    <p class="text-center"><button type="button" class="btn btn-primary btn-small ds_do_action" ds_action="licence.finishPay" >支付完成</button></p>
</div>
