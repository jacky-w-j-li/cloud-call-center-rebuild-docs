<div class="pay_start" style="margin:10px;">
    <div class="licence_pay">
        <div class="well" style="padding: 0 19px;">
            <h2>续费_@licence.showFieldDesc("licenceType","_#licenceType#_")@_<small>
                licence单价:<span class="text-primary monthRent">_#licencePrice#_</span>元
            </small></h2>
            <p class="text-muted haveDate">当前licence数<span class="text-primary">_#num#_</span>，到期日期为<strong class="text-danger">_#endDate#_</strong></p>
        </div>
        <form class="form-horizontal" id="frm_licence_update">
            <input type="hidden" name="_id" value="_#_id#_">
            <input type="hidden" name="num" value="_#num#_">
            <input type="hidden" name="account" value="_#account#_">
            <input type="hidden" name="licenceType" value="_#licenceType#_">
            <input type="hidden" name="licencePrice" value="_#licencePrice#_">
            <input type="hidden" name="beginDate" value="_#beginDate#_">
            <input type="hidden" name="endDate" value="_#endDate#_">
            <input type="hidden" name="pbx" value="_#pbx#_">
            <input type="hidden" name="status" value="_#status#_">
            <input type="hidden" name="flag" value="renewLicence">
            <input type="hidden" name="balance" value="_#balance#_">

            <div class="form-group" id="licence_renew_month_div">
                <label class="control-label col-md-3">
                    时长
                </label>
                <div class="col-md-5"  style="line-height: 35px;">
                    <input type="text" onkeyup="value=value.replace(/[^\d]/g,'')" name="month" value='1' class="no_shdw form-control input-sm ds_spinner_licence" min="1" msgName="时长"  msg="时长只能为大于0的整数" datatype="Integer,Range" min="1" required/>个月
                    <label for="month" class="error" style="display: none;"></label>
                </div>
            </div>
            <div class="form-group" id="licence_renew_totalFee_div">
                <label class="control-label col-md-3">
                    费用
                </label>
                <div class="col-md-5" style="line-height: 35px;">
                    <span class="fee">_#totalFee#_</span>元
                    <!--<span class="text-muted">&nbsp;[单价*数量*购买时长=费用]</span>-->
                </div>
            </div>
            <div class="clearfix" style="margin-bottom: 15px;">
                <p>您当前可支付余额为:<span>_#balance#_</span>元,其中实际余额为:_#actualBalance#_,透支额度为_#overdraw#_</p>

                <p class="balance_not_enough" style="display: none;color: red;">
                    您的账户余额不足，请立即充值。
                </p>
            </div>

            <div class="form-group">
                <div class="col-md-offset-3 col-md-8">
                    <button type="button" class="btn btn-primary btn-small ds_form_action licence_renew" ds_action="licence.confirmPay">立刻购买</button>
                    <button type="button" class="btn btn-default btn-small" data-dismiss="modal">关闭</button>
                </div>
            </div>
        </form>
    </div>

</div>
<div class="pay_end" style="display: none;">
    <p class="text-center">请您在新打开的网上银行页面进行支付，支付完成前请不要关闭该窗口</p>
    <p class="text-center"><button type="button" class="btn btn-primary btn-small ds_do_action" ds_action="licence.finishPay" >支付完成</button></p>
</div>
