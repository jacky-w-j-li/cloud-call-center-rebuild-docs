<div class="well" style="padding: 0 19px;">
    <h2>试用号码:_#_id#_<small>月租:<span class="text-primary monthRent">_@formatTrueFee(_#monthRent#_)@_</span>元
    </small></h2>
    <p class="text-muted">到期日期为<strong class="text-danger">_#endTime#_</strong></p>
</div>
<form class="form-horizontal" id="frm_serviceno_detail">
    <input type="hidden" name="_id" value="_#_id#_">
    <input type="hidden" name="product" value="_#product#_">
    <div class="form-group">
        <span style="width:110px;display: inline-block;"></span>
        <span style="display: inline-block;">
            <label class="control-label" >你确定要停用该服务号吗?</label>
        </span>
    </div>
    <div class="form-group">
        <div class="col-md-offset-2 col-md-10">
            <button type="button" class="btn btn-primary ds_form_action" ds_action="account.stopServiceno" >确认</button>
            <button type="button" class="btn btn-default" data-dismiss="modal">关闭</button>
        </div>
    </div>
</form>
