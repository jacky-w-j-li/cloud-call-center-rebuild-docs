<div class="right_container" id="all_call_bill_query_main_panel">
    <div style="height:98%;margin:3px 3px;" id="all_call_bill_query">
        <div class="row-fluid">
            <br/>
            <h5><i class="icon-search"></i>所有电话登记单查询</h5>
            <br/>

            <form id="all_call_bill_query_form" class="form-inline">
                <div>
                    <label for="all_call_bill_datetime_picker_start">
                        创建时间
                    </label>
                    <input type="text" name="BEGIN_DATE" class="input-small ds_date"
                           data-date-format="yyyy-mm-dd" id="all_call_bill_datetime_picker_start"
                           placeholder="开始日期"/>
                    <input type="text" id="all_call_bill_begin_time" name="BEGIN_TIME" class="input-small ds_time" placeholder="开始时间"/>
                    至
                    <input type="text" name="END_DATE" class="input-small ds_date" placeholder="结束日期"
                           data-date-format="yyyy-mm-dd" id="all_call_bill_datetime_picker_end"/>
                    <input type="text" id="all_call_bill_end_time" name="END_TIME" class="input-small ds_time" placeholder="结束时间"/>
                </div>
                <div class="clear10"></div>
                <div>
                    <label>
                        号码
                    </label>
                    <input type="text" name="callNo" style="margin-right: 5px;"/>
                    <label>
                        登记单类别
                    </label>
                    <span id="all_recordBill_type">
                        <select name="dbType" >

                        </select>
                    </span>
                    <label>
                        类型
                    </label>
                    <span id="all_recordBill_custom_type">
                        <select name="type" >
                            <option value="">--请选择--</option>
                        </select>
                    </span>

                </div>
                <div class="clear5"></div>
                <div>
                    <a href="#" class="button ds_form_action" ds_action="call.searchAllCallBill"
                       style="margin:2px 5px;" id="all_call_bill_query_link">查询</a>
                    <a href="#" class="button ds_do_action" ds_action="call.resetForm" style="margin:2px 5px;" >重置</a>
                    <a href="#" class="button ds_form_action" ds_action="call.exportAllCallBill" style="margin:2px 5px;" >导出</a>
                    <a href="#" class="button ds_form_action" ds_action="call.downloadAllCallBillRecord" style="margin:2px 5px;" >批量下载录音</a>
                </div>

                <div class="clear10">&nbsp;</div>

                <div>
                    <table class="table table-striped table-bordered table-hover">
                        <thead>
                        <tr>
                            <th>登记单类别</th>
                            <th>客户</th>
                            <th>号码</th>
                            <th>类型</th>
                            <th>创建时间</th>
                            <th>创建人</th>
                            <th>操作</th>
                        </tr>
                        </thead>
                        <tbody class="call_sheet_table_data">
                        </tbody>
                    </table>
                    <div class="row-fluid class_list">
                        <div for="all_call_bill_query_form" ds_pagination_action="call.searchAllCallBill"
                             class="pagination pagination-small" style="display:table; margin:0;width:100%;">
                            <span class="result_info">查询结果：<span class="result_count">0</span></span>
                            <ul style="float:right;margin-top:5px;">
                                <li><a href="#"  value="0">&laquo;</a></li>
                                <li><a href="#"  value="1">1</a></li>
                                <li><a href="#"  value="2">2</a></li>
                                <li><a href="#"  value="3">3</a></li>
                                <li><a href="#"  value="4">4</a></li>
                                <li><a href="#"  value="5">5</a></li>
                                <li><a href="#"  value="6">&raquo;</a></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
<style>
    #my_call_bill_query_main_panel label {
        font-size:11px;
    }
</style>
<script type="text/javascript">
    $(function(){
        $("#all_recordBill_type").find("select").bind("change",function(){
            var selected = $(this).val();
            var obj = getCache("callRecordTmpls",selected);
            if(obj){
                var types = obj.types || [];
                var customType = $("#all_recordBill_custom_type").find("select");
                customType.empty();
                customType.append("<option value=''>--请选择--</option>");
                for(var i =0;i< types.length;i++){
                    customType.append("<option value="+types[i].key+">"+types[i].name+"</option>");
                }
            } else {
                var customType = $("#all_recordBill_custom_type").find("select");
                customType.empty();
                customType.append("<option value=''>--请选择--</option>");
            }
        });
    });
</script>
