
    <form class="form-inline clearfix" role="form" id="frm_batch_task_search">
        <div class="pull-left">
            <table class="table_row_search">
                <tbody>
                <tr>
                    <td >名称</td>
                    <td >
                        <input type="text" name="name" class="input-small"/>
                    </td>
                    <td >任务类型</td>
                    <td>
                        <select name="taskType" class="input-small">
                            <option value="" >--请选择--</option>
                            <option value="normal">普通任务</option>
                            <option value="time">定时任务</option>
                        </select>
                    </td>
                    <td >录入号码方式</td>
                    <td >
                        <select name="numType" class="input-small">
                            <option value="" >--请选择--</option>
                            <option value="import">导入</option>
                            <option value="generate">号段</option>
                        </select>
                    </td>
                    <td>
                        <button type="button" class="btn btn-primary btn-small ds_form_action" ds_action="batch2.getBdTaskHistory">查询</button>
                        <button type="button" class="btn btn-default btn-small ds_do_action" ds_action="batch2.reset" >重置</button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </form>
    <div style="margin-top: 15px;">
        <table class="table table-bordered table-striped table-hover">
            <thead>
                <tr>
                    <th style="width: 10%;">名称</th>
                    <th style="width: 6em;">录入号码方式</th>
                    <th style="width: 12%;">号段</th>
                    <th style="width: 4em;">任务类型</th>
                    <th style="width: 4em;">定时类型</th>
                    <th style="width: 20%;">时间</th>
                        <!--<th>进度</th>
                    -->
                    <th style="width: 10%;">服务号码</th>
                    <th style="width: 4em;">号码总数</th>
                    <th style="width: 3em;">已拨打</th>
                    <!--<th>已呼通</th>
                    -->
                    <th style="width: 3em;">已接听</th>
                    <th style="width: 3em;">完成率</th>
                    <!--<th>呼通率</th>
                    -->
                    <th style="width: 3em;">接听率</th>
                </tr>
            </thead>
            <tbody class="batch_task_list">
            </tbody>
        </table>
    </div>
