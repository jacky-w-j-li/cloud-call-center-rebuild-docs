<div style="margin: 0px;">
    <form id="frm_batch_search" class="form-horizontal">
        <input type="hidden" name="flag" value="1"/>
        <input type="hidden" name="called" value="false"/>

        <p>
            <button type="button" class="btn btn-success btn-small ds_do_action " ds_action="batch.startDial" style="margin-left: 0px;">开始呼叫</button>
            <button type="button" class="btn btn-danger btn-small ds_do_action" ds_action="batch.stopDial" style="margin-left: 20px;" >停止呼叫</button>
            <button type="button" class="btn btn-success btn-small ds_do_action" ds_action="batch.showImortArea" style="margin-left: 20px;">生成号码</button>
            <button type="button" class="btn btn-success btn-small ds_do_action" ds_action="batch.showImort" style="margin-left: 20px;">导入号码</button>
            <button type="button" class="btn btn-danger btn-small ds_do_action" ds_action="batch.removeTodoList" style="margin-left: 20px;">清空号码</button>
            <span style="margin-left: 20px;">当前并发&nbsp;<span class="label label-info acc_concurrent"></span></span>
            <button type="button" class="btn btn-success btn-small ds_do_action" ds_action="batch.showConcurrent" style="margin-left: 20px;">修改并发</button>
            <span style="margin-left: 20px;">呼叫策略&nbsp;<span class="label label-info batch_strategy"></span></span>
            <button type="button" class="btn btn-success btn-small ds_do_action" ds_action="batch.showCallStrategy" style="margin-left: 20px;">修改策略</button>

            <a href="#"  class="btn btn-link btn-small ds_form_action"  ds_action="batch.getBatchList" style="margin-left: 20px;"><i class="icon-refresh"></i> 刷新</a>
        </p>
    </form>
    <div style="margin-top: 15px;">
        <table class="table table-bordered table-hover">
            <thead>
            <tr>
                <th>号码</th>
                <th>当前呼叫号码</th>
                <th>未呼号码数量(个)</th>
                <th>导入批次</th>
            </tr>
            </thead>
            <tbody class="batch_list">
            </tbody>
        </table>
    </div>
    <div class="row-fluid class_list">
        <div for="frm_batch_search" ds_pagination_action="batch.getBatchList"
             class="pagination pagination-small pagination-right" style="display:table; margin:0;width:100%;">
            <span class="result_info">查询结果：<span class="result_count">0</span></span>
            <ul style="float:right;margin-top:5px;">
                <li><a href="#"  value="0">&laquo;</a></li>
                <li><a href="#"  value="1">1</a></li>
                <li><a href="#"  value="2">2</a></li>
                <li><a href="#"  value="3">3</a></li>
                <li><a href="#"  value="4">4</a></li>
                <li><a href="#"  value="5">5</a></li>
                <li><a href="#"  value="6">&raquo;</a></li>
            </ul>
        </div>
    </div>
</div>
