<script type="text/javascript">
    $(function(){
        $("#autoclaim_switch").bootstrapSwitch({size:'small',onColor:'success',offColor:'warning',onText:'开',offText:'关'});
//        $("#login_panel").find(".bootstrap-switch-success").css({backgroundColor:'#5d87af!important',backgroundImage:"linear-gradient(to bottom,#5d87af,#5d87af)"});


        $('#autoclaim_switch').on('switchChange.bootstrapSwitch', function(event, state) {
            if(state){
                handler.webchat.autoClaim = true;
                handler.webchat.updateAutoClaimWebchatSessionStatus("open");
                if(handler.webchat.haveClaim){
                    handler.webchat.autoClaimWebchatSession();
                }
            }else{
                handler.webchat.autoClaim = false;
                handler.webchat.updateAutoClaimWebchatSessionStatus("close");
            }
        });

        dsevent.bind("#view_webchat_todo", dsevent.evt.refreshWebchatToDoList, function(event , params){
            $(this).find(".refresh").click();
//            $("#view_webchat_todo_content").html("");
        });
        handler.webchat.getIvr();

        $('#imDealCount').bind('change', function () {
            handler.webchat.updateIvrCount();
        })
    });

</script>
