<script>
    $(function () {
        var allAgents = getCache("agents");
        utils.loadSearchInput({ id: "im_report_agent_search_div",
            width: "149",
            height: "14",
            tip: "按姓名,拼音,工号搜索",
            data: allAgents,
            listField: ["displayName", "exten"],
            userIdField: "_id",
            searchField: ["displayName", "exten", "pinyin"],
            pinyinField: ["displayName"],
            showAllList: true,
            callbackFuc: function (object) {
                if($.isArray(object)){
                    return;
                }
                var currentVals = $("input[name='selectedAgent']");

                var ishas = false;
                for (var i = 0; i < currentVals.length; i++) {
                    if (currentVals[i].value === object._id) {
                        ishas = true;
                    }
                }
                if (!ishas) {
                    $('#im_report_agent_select_agents').before("<span id=" + object._id + "><input type='hidden' name='selectedAgent' value=" + object._id + ">" +
                            "<span class='label label-info'>" + object.displayName +
                            "</span><a href='#' onclick=removeAgent('" + object._id + "')><i class='icon-remove'></i></a>&nbsp;</span>");
                }
                countSelectAgent();
            }
        });
    })
    function removeAgent(id) {
        $('#' + id).remove();
        countSelectAgent();
    }
    function countSelectAgent() {
        var currentVals = $("input[name='selectedAgent']");
        var ExtenStr = '';
        for (var i = 0; i < currentVals.length; i++) {
            ExtenStr += currentVals[i].value;
            if (i != currentVals.length - 1) {
                ExtenStr += ',';
            }
        }
        $('#selectedAgentList').val(ExtenStr);
    }
</script>
