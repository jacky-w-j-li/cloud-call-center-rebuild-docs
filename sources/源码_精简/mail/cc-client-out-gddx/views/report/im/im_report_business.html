<div class="">
    <div style="/*height:98%;margin:3px 3px;*/">
        <div class="row-fluid">
            <h5><i class="icon-user"></i>在线客服业务分析报表</h5>
            <br/>

            <form class="form-horizontal">
                <input type="hidden" name="reportType" value="im_report_business">

                <div id="time_type">
                    <!--<label style="float:left;margin-right:3px;">时间类型</label>-->
                    <select name="timeType" id="im_report_business_time_type"
                            onchange="handler.report.callReport.resetDate('im_report_business_dateTd',this.value)">
                        <option value="day" id="optionDay">日报</option>
                        <option value="month" id="optionMonth">月报</option>
                        <option value="year" id="optionYear">年报</option>
                        <option value="other" id="optionOther">自定义</option>
                    </select>

                    <div id="im_report_business_dateTd" style="display: inline">
                    </div>
                    <div id="im_report_business_dateTd_other" style="display: none">
                        <div class="input-append date form_datetime">
                            <input id="im_report_business_datetime_picker_start" size="6" class="input-medium report_start_time" name="StartTime" type="text" value="" readonly>
                            <span class="add-on datetimepicker-remove" style="height: 14px;line-height: 15px"><i class="icon-remove"></i></span>
                            <span class="add-on datetimepicker-open" style="height: 14px;line-height: 15px"><i class="icon-th"></i></span>
                        </div>
                        <div style="padding-top: 5px;display: inline">
                            至
                        </div>
                        <div class="input-append date form_datetime">
                            <input id="im_report_business_datetime_picker_end" size="6" class="input-medium report_end_time" name="EndTime" type="text" value="" readonly>
                            <span class="add-on datetimepicker-remove" style="height: 14px;line-height: 15px"><i class="icon-remove"></i></span>
                            <span class="add-on datetimepicker-open" style="height: 14px;line-height: 15px"><i class="icon-th"></i></span>
                        </div>
                    </div>
                </div>
                <div class="clear10"></div>
                <div id="btn-select">
                    <a class="button ds_form_action" id="im_report_business_btn"
                       ds_action="report.im.im_report_business">查询</a>
                    <a class="button ds_form_action" ds_action="report.callReport.confirmExportReportPdf">导出PDF</a>
                    <a class="button ds_form_action" ds_action="report.im.exportImBusinessExcel">导出Excel</a>
                </div>
                <div class='row-fluid account_line'></div>
                <br/>
                <div id="im_report_business_highcharts_container" style="min-width: 310px; height: 300px; margin: 0 auto"></div>
                <div id="im_report_business_highcharts_container_Y" style="width: 95%; height: 300px; margin: 0 0; display: none;"></div>

                <div class="agent_report_data_part" span12>
                    <!--<div class="data_titile_part">-->
                        <!--<a href="#" class="ds_do_action" ds_action="report.callReport.openConfigTableHeader" ds_data="im_report_business_analyse">配置显示表头</a>-->
                    <!--</div>-->
                    <div class="data_content_part" id="im_report_business_table">
                        <table id="im_report_business_table_id" class="table table-striped table-bordered table-hover">
                            <thead id="imReportBusinessTableHeader">

                            </thead>
                            <tbody id="imReportBusinessTableTbody">

                            </tbody>
                        </table>
                    </div>
                </div>
            </form>

            <div class="contentpart" style="padding: 5px;margin: 10px;">

            </div>
            <div id="im_report_business_analyse_config_table_header_pane"></div>
        </div>
    </div>
</div>
<script type="text/javascript">
    $('#im_report_business_datetime_picker_start').datetimepicker({
        dateFormat: "yy-mm-dd",
        showTimepicker: false
    });
    $('#im_report_business_datetime_picker_end').datetimepicker({
        dateFormat: "yy-mm-dd",
        showTimepicker: false
    });
</script>
