<div class="row-fluid right_container">
    <div class='row-fluid' style="padding: 5px;">
        <h4 >客户报表</h4>
    </div>
    <div style="padding: 5px;" id="_#menu#__report_pane" class="customer_report_pane">
        <div class='row-fluid'>
            <div class='clear10'></div>
            <div class='row-fluid'>
                <div class='span12'>
                    <form class="form-inline">
                        <input type="hidden" name="dbType" value="">
                        <div class='row-fluid'>
                            <div class="span10">
                                <div style='float: left;'>
                                    <label>报表类型</label>
                                    <select name='type' id="_#menu#__query_type_select">
                                        <option value="year">年报</option>
                                        <option value="month">月报</option>
                                        <option value="custom">自定义</option>
                                    </select>
                                </div>
                                <div style="float: left;" id="_#menu#__detail_query_pane">

                                </div>
                            </div>
                            <div class="span2">
                                <a href="#" class="btn  ds_form_action " style="float: right; margin-right: 5px;margin-left: 10px;" menu="_#menu#_" ds_action="report.customer.printReport">导出</a>
                                <a href="#" class="btn btn-info ds_form_action form_query_button" style="float: right; " menu="_#menu#_" ds_action="report.customer.queryCustStatusReport">查询</a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
            <div id = "business_report_show_window"></div>
            <div class="clear10"></div>
            <div class="row-fluid chart_pane" >
                <div class='span6'>
                    <div id="_#menu#_pie_chart_container" style="width:100%; height:400px;">
                    </div>
                </div>
                <div class='span6'>
                    <div id="_#menu#_lint_chart_container" style="width:100%; height:400px;">
                    </div>
                </div>
            </div>
            <div class="clear10"></div>
            <div class='row-fluid table_pane' >
                <table class="table table-bordered table-striped table-hover table-condensed" style=" margin-bottom: 5px;">
                    <thead>
                    <tr>
                        <th>
                            日期
                        </th>

                    </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
        </div>
    </div>


</div>
<script type="text/javascript">
    $(function () {

        $("#_#menu#__query_type_select").bind("change", function () {
            var val = $(this).val();
            var yearTmp = "<div style='float: left;margin-left: 10px;'><label>年份</label><select name='report_year'></select></div>";
            var monthTmp = "<div style='float: left;margin-left: 10px;'><label>月份</label><select name='report_month'></select></div>";
            var customTmp = "<div style='float: left;margin-left: 10px;'><label>日期</label><input type='date' name='beginTime' value=''><label>至</label><input type='date' name='endTime' value=''></div>";
            var detailPane = $("#_#menu#__detail_query_pane");
            var now = new Date();
            detailPane.empty();
            if (val == "year") {
                var yearPane = $(yearTmp);
                var begin = 2013, end = 2020;
                var tmp = "<option value='_value'>_name</option>";
                for (var i = begin; i <= end; i++) {
                    yearPane.find("select").append(tmp.replace(/_value/g, i).replace(/_name/g, i + '年'));
                }
                yearPane.find("select").val(now.getFullYear());
                detailPane.html(yearPane);
            } else if (val == "month") {
                var yearPane = $(yearTmp);
                var begin = 2013, end = 2020;
                var tmp = "<option value='_value'>_name</option>";
                for (var i = begin; i <= end; i++) {
                    yearPane.find("select").append(tmp.replace(/_value/g, i).replace(/_name/g, i + '年'));
                }
                yearPane.find("select").val(now.getFullYear());
                detailPane.append(yearPane);
                var monthPane = $(monthTmp);
                var begin = 1, end = 12;
                var tmp = "<option value='_value'>_name</option>";
                for (var i = begin; i <= end; i++) {
                    monthPane.find("select").append(tmp.replace(/_value/g, i).replace(/_name/g, i + '月'));
                }
                monthPane.find("select").val(now.getMonth()+1);
                detailPane.append(monthPane);
            } else {
                detailPane.html(customTmp);
            }
        });

        $("#_#menu#__query_type_select").change();


    });

    function customer_report_createLineChart(data,keys){
        data.pop();
        keys.pop();

        var pane=$("#_#menu#__report_pane");
        var dbType=pane.find("input[name='dbType']").val();
        var status = getCache('custTmpls', dbType).status
        var chartData = [];
        var tempObj = {};
        for(var key in status){
//            chartData.push({
//                name : tags[key],
//                data : []
//            });
            tempObj[key] = [];
        }

        for(var i=0;i< data.length;i++){
            var dataItem =data[i];
            for(var key in dataItem){
                if(key != "date"){
                    tempObj[key].push(dataItem[key]);
                }

            }
        }

        for(var key in tempObj){
            chartData.push({
                name : status[key],
                data : tempObj[key]
            });
        }

        console.log(chartData);

        $('#_#menu#_lint_chart_container').highcharts({

            },
            xAxis: {
                categories: keys
            },
            yAxis: {
                title: {
                    text : '客户状态数量'
                },
                plotLines: [{
                    value: 0,
                    width: 1,
                    color: '#808080'
                }]
            },
            tooltip: {
                valueSuffix: '个'
            },
            legend: {
                layout: 'vertical',
                align: 'right',
                verticalAlign: 'middle',
                borderWidth: 0
            },
            series : chartData
//            series: [{
//                name: 'Tokyo',
//                data: [7.0, 6.9, 9.5, 14.5, 18.2, 21.5, 25.2, 26.5, 23.3, 18.3, 13.9, 9.6]
//            }, {
//                name: 'New York',
//                data: [-0.2, 0.8, 5.7, 11.3, 17.0, 22.0, 24.8, 24.1, 20.1, 14.1, 8.6, 2.5]

        });

    function customer_report_createPieChart(data) {
        delete data["date"];
        var charData = [];
        var pane=$("#_#menu#__report_pane");
        var dbType=pane.find("input[name='dbType']").val();
        var status = getCache('custTmpls', dbType).status;
        for(var key in status){
            charData.push({
                name : status[key],
                y : data [key]
            } );
        }
        charData[0].sliced = true;
        charData[0].selected = true;
        $('#_#menu#_pie_chart_container').empty();
        $('#_#menu#_pie_chart_container').highcharts({
            chart: {
                type: 'pie'
            },
            title: {
                text: '客户状态分布图表'
            },
            plotOptions: {
                pie: {
                    allowPointSelect: true,
                    cursor: 'pointer',
                    dataLabels: {
                        enabled: true,
                        color: '#000000',
                        connectorColor: '#000000',
                        format: '<b>{point.name}</b>: {point.percentage:.1f} %'
                    }
                }
            },
            series: [
                {
                    type: 'pie',
                    name: '客户状态分布',
                    data : charData
//                    data: [
//                        ['Firefox', 45.0],
//                        ['IE', 26.8],
//                        {

//                        },

//                    ]
                }
            ]
        });
    }
