<script>
    function changeCheckAllProvince(sel){
        var proArr = $(".Province_check");
        if(sel.checked==true){
            $.each(proArr,function(i,item){
                item.checked=true;
            })
        }else{
            $.each(proArr,function(i,item){
                item.checked=false;
            })
        }
    }
</script>
