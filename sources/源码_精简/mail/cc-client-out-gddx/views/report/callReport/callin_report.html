<div class="">
    <div style="/*height:98%;margin:3px 3px;*/">
        <div class="row-fluid">
            <h5><i class="icon-user"></i>中继呼入时间趋势查询</h5>
            <br/>

            <form class="form-horizontal">
                <input type="hidden" name="reportType" value="call_report_relay_time">

                <div id="time_type">
                    <!--<label style="float:left;margin-right:3px;">时间类型</label>-->
                    <select name="TimeType" id="relay_time_time_type"
                            onchange="handler.report.callReport.resetDate('report_relay_time_dateTd',this.value)">
                        <option value="year" id="optionYear">年报</option>
                        <option value="month" id="optionMonth">月报</option>
                        <option value="day" id="optionDay">日报</option>
                        <option value="other" id="optionOther">自定义</option>
                    </select>

                    <div id="report_relay_time_dateTd" style="display: inline">
                    </div>
                    <div id="report_relay_time_dateTd_other" style="display: none">
                        <div class="input-append date form_datetime">
                            <input id="report_relay_time_datetime_picker_start" size="6" class="input-medium report_start_time" name="StartTime" type="text" value="" readonly>
                            <span class="add-on datetimepicker-remove" style="height: 14px;line-height: 15px"><i class="icon-remove"></i></span>
                            <span class="add-on datetimepicker-open" style="height: 14px;line-height: 15px"><i class="icon-th"></i></span>
                        </div>
                        <div style="padding-top: 5px;display: inline">
                            至
                        </div>
                        <div class="input-append date form_datetime">
                            <input id="report_relay_time_datetime_picker_end" size="6" class="input-medium report_end_time" name="EndTime" type="text" value="" readonly>
                            <span class="add-on datetimepicker-remove" style="height: 14px;line-height: 15px"><i class="icon-remove"></i></span>
                            <span class="add-on datetimepicker-open" style="height: 14px;line-height: 15px"><i class="icon-th"></i></span>
                        </div>
                    </div>
                </div>
                <div class="clear10"></div>
                <div>
                    <label style="display: inline">服务号</label>
                    <div style="display: inline" id="report_callin_service_no_div">
                    </div>
                </div>
                <div class="clear10"></div>
                <div id="btn-select">
                    <a class="button ds_form_action" id="call_report_relay_time_btn"
                       ds_action="report.callReport.callin_report">查询</a>
                    <a class="button ds_form_action" ds_action="report.callReport.confirmExportReportPdf">导出PDF</a>
                    <a class="button ds_form_action" ds_action="report.callReport.exportRelayTimeExcel">导出Excel</a>
                </div>
                <div class='row-fluid account_line'></div>
                <br/>
                <div id="call_report_relay_time_highcharts_container" style="min-width: 310px; height: 300px; margin: 0 auto"></div>

                <div class="agent_report_data_part" span12>
                    <div class="data_titile_part">
                        <a href="#" class="ds_do_action" ds_action="report.callReport.openConfigTableHeader" ds_data="call_report_relay_time">配置显示表头</a>
                    </div>
                    <div class="data_content_part" id="report_relay_time_table">
                        <table id="call_report_relay_time_table_id" class="table table-striped table-bordered table-hover">
                            <thead id="relayTimeTableHeader">

                            </thead>
                            <tbody id="relayTimeTableTbody">

                            </tbody>
                        </table>
                    </div>
                </div>
            </form>

            <div class="contentpart" style="padding: 5px;margin: 10px;">

            </div>
            <div id="call_report_relay_time_config_table_header_pane"></div>
        </div>
    </div>
</div>
<script type="text/javascript">
    $('#report_relay_time_datetime_picker_start').datetimepicker({
        dateFormat: "yy-mm-dd",
        showTimepicker: false
    });
    $('#report_relay_time_datetime_picker_end').datetimepicker({
        dateFormat: "yy-mm-dd",
        showTimepicker: false
    });
</script>
