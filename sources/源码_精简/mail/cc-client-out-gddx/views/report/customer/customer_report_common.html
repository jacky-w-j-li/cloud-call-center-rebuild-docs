<script>
    $(function () {
        var custCategorys = getCache("custCategorys");
        var pools = [];
        for(var i =0 ;i<custCategorys.length;i++){
            var cust = custCategorys[i];
            var managers = cust.managers;
            var userId = session.user._id;
            if($.inArray(userId,managers)!=-1){
                pools.push(cust);
            }
        }
        utils.loadSearchInput({ id: "pool_report_search_div",
            width: "149",
            height: "14",
            tip: "按公海名称搜索",
            data: pools,
            listField: ["cName"],
            userIdField: "_id",
            searchField: ["cName", "pinyin"],
            pinyinField: ["cName"],
            showAllList: true,
            callbackFuc: function (object) {
                if($.isArray(object)){
                    return;
                }
                var currentVals = $("input[name='selectedPool']");

                var ishas = false;
                for (var i = 0; i < currentVals.length; i++) {
                    if (currentVals[i].value === object._id) {
                        ishas = true;
                    }
                }
                if (!ishas) {
                    $('#pool_report_select_pools').before("<span id=" + object._id + "><input type='hidden' name='selectedPool' value=" + object._id + ">" +
                            "<span class='label label-info'>" + object.cName +
                            "</span><a href='#' onclick=removeAgent('" + object._id + "')><i class='icon-remove'></i></a>&nbsp;</span>");
                }
                countSelectAgent();
            }
        });
    })
    function removeAgent(id) {
        $('#' + id).remove();
        countSelectAgent();
    }
    function countSelectAgent() {
        var currentVals = $("input[name='selectedPool']");
        var ExtenStr = '';
        for (var i = 0; i < currentVals.length; i++) {
            ExtenStr += currentVals[i].value;
            if (i != currentVals.length - 1) {
                ExtenStr += ',';
            }
        }
        $('#selectedPoolList').val(ExtenStr);
    }
</script>
