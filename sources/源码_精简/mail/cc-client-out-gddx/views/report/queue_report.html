<script>
    $(function () {
        var allQueues = getCache("queues");
        utils.loadSearchInput({ id: "queue_report_search_div",
            width: "149",
            height: "14",
            tip: "按技能组名搜索",
            data: allQueues,
            listField: ["DisplayName"],
            userIdField: "_id",
            searchField: ["DisplayName"],
            pinyinField: ["DisplayName"],
            showAllList: true,
            cacheData: "queues",
            callbackFuc: function (object) {
                if($.isArray(object)){
                    return;
                }
                var currentVals = $("input[name='selectedQueue']");

                var ishas = false;
                for (var i = 0; i < currentVals.length; i++) {
                    if (currentVals[i].value === object._id) {
                        ishas = true;
                    }
                }
                if (!ishas) {
                    $('#queue_report_select_queues').before("<span id=" + object._id + "><input type='hidden' name='selectedQueue' value=" + object._id + "><span class='label label-info'>"
                            + object.DisplayName +
                            "</span><a href='#' onclick=removeQueue('" + object._id + "')><i class='icon-remove'></i></a>&nbsp;</span>");
                }
                countSelectQueue();
            }
        });
    })
    function removeQueue(id) {
        $('#' + id).remove();
        countSelectQueue();
    }
    function countSelectQueue() {
        var currentVals = $("input[name='selectedQueue']");
        var ExtenStr = '';
        for (var i = 0; i < currentVals.length; i++) {
            ExtenStr += currentVals[i].value;
            if (i != currentVals.length - 1) {
                ExtenStr += ',';
            }
        }
        $('#selectedQueueList').val(ExtenStr);
    }
</script>
