<div class="weixin_container " style="padding: 0px;">
    <div class="chat_msg" ds_attr="2" ds_time="">

    </div>

    <div class="clearfix">
        <form action="" class="">
            <input type="hidden" name="openID" value="_#openID#_">
            <input type="hidden" name="userID" value="_#userID#_">
            <input type="hidden" name="contentType" value="text">
            <div class="row-fluid">
                <textarea rows="2" class="span12" style="resize: none;" name="content"></textarea>
            </div>

            <div class="">
                <!--<button type="button" class="btn btn-primary btn-small ds_do_action" ds_action="callWeixin.showHistory" ds_data="_#UserID#_" style="margin-left: 10px;">历史</button>-->
                <!--<button type="button" class="btn btn-info btn-small ds_do_action" ds_action="callWeixin.openUploadImg" ds_data="" style="margin-left: 10px;">图片</button>-->
                <!--<input type="file" id="uploadWeixnImg" class="ds_upload" fileSize="10240" onloaded="callWeixin.uploadSucess"-->
                <!--onerror="callWeixin.uploadError" onprogress="callWeixin.uploadProgress" onprogress="" onabort="" ds_attr="imgUpload" style="display: none;visibility: hidden;"/>-->
                <div id="_#qiniuId#_-container-qiniu" class="pull-left">
                    <a class="btn btn-info btn-small" id="_#qiniuId#_-pickfiles" href="#" >
                        <i class="icon-plus icon-white"></i>
                        <sapn>选择图片</sapn>
                    </a>
                </div>
                <button type="button" class="btn btn-primary btn-small ds_form_action pull-right reply_weixin" ds_action="callWeixin.replayWeixin2" ds_data="" ds_attr="" style="margin-left: 10px;display: none;">发送</button>
                <button type="button" class="btn btn-primary btn-small ds_do_action my_dealMsg" ds_action="callWeixin.dealMessage" ds_data="_#uid#_" style="margin-left: 10px;display: none;">标记为已读</button>

                <button type="button" class="btn btn-small reply_close"  data-dismiss="modal" style="margin-left: 10px;" aria-hidden="true">关闭</button>
            </div>

            <div style="clear: both"></div>
            <div class="row-fluid">
                <table class="table table-striped table-hover text-left wx_img_container"   style="margin-top:15px;display:none">
                    <thead>
                    <tr>
                        <th class="span4">图片</th>
                        <th class="span2">大小</th>
                        <th class="span6">&nbsp;</th>
                    </tr>
                    </thead>
                    <tbody id="_#qiniuId#_-fsUploadProgress">
                    </tbody>
                </table>
            </div>
        </form>
    </div>

    <!---------------------------------------template------------------------------------------>
    <div id="tmpl_weixin_msg_from" style="display: none;">
        <div class="chat_time">_#timeDesc#_</div>
        <div class="chat_section clearfix">
            <!--<div class="pull-left" style="">_#UserID#_</div>-->
            <div class="pull-left" style="margin-left: 5px;">
                <div class="chat_popover right">
                    <div class="arrow"></div>
                    <div class="chat_popover-content">
                        <pre>_#contentDesc#_</pre>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="tmpl_weixin_msg_to" style="display: none;">
        <div class="chat_time">_#timeDesc#_</div>
        <div class="chat_section clearfix">
            <div class="pull-right" style="">_#uidDesc#_</div>
            <div class="pull-right" style="margin-right: 15px;">
                <div class="chat_popover left">
                    <div class="arrow"></div>
                    <div class="chat_popover-content">
                        <pre>_#contentDesc#_</pre>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="tmpl_weixin_msg_from_img" style="display: none;">
        <div class="chat_time">_#timeDesc#_</div>
        <div class="chat_section clearfix">
            <div class="pull-left" style="margin-left: 5px;">
                <div class="chat_popover" style="padding: 0;">
                    _#contentDesc#_
                </div>
            </div>
        </div>
    </div>
    <div id="tmpl_weixin_msg_to_img" style="display: none;">
        <div class="chat_time">_#timeDesc#_</div>
        <div class="chat_section clearfix">
            <div class="pull-right" style="">_#uidDesc#_</div>
            <div class="pull-right" style="margin-right: 15px;">
                <!--<div class="chat_popover left">-->
                <!--<div class="arrow"></div>-->
                <div class="chat_popover " style="padding: 0;">
                    _#contentDesc#_
                </div>
                <!--</div>-->
            </div>
        </div>
    </div>
</div>
