<div id="_#_id#__popupWeixin" class="call_detail" style="display: none;">
    <div class="customer_container content_box clearfix">
        <div class="cust_tip">
        </div>
        <div class="cust_body"></div>
    </div>
    <!--<div class="popup_split"></div>-->
    <div class="weixin_container" style="/*padding: 18px;*/">
        <div class="chat_msg" ds_attr="2" ds_time="">
        </div>

        <div class="clearfix">
            <form action="" class="">
                <input type="hidden" name="openID" value="_#OpenID#_">
                <input type="hidden" name="userID" value="_#UserID#_">
                <input type="hidden" name="contentType" value="text">
                <div class="row-fluid" style="position: relative;">
                   <div class="" style="margin-right: 100px;">
                        <textarea rows="1" class="" style="resize: none;width: 100%;" name="content"></textarea>
                   </div>

                    <div class="" style="position:absolute; right:0;top:3px;">
                        <div id="_#_id#_-container-qiniu" class="pull-left">
                            <a class="btn btn-info btn-small" id="_#_id#_-pickfiles" href="#" >
                                <i class="icon-plus icon-white"></i>
                                <sapn>选择图片</sapn>
                            </a>
                        </div>
                        <button type="button" class="btn btn-primary btn-small ds_form_action pull-right reply_weixin" ds_action="callWeixin.replayWeixin" ds_data="" style="margin-left: 10px;display: none;">发送</button>
                    </div>
                </div>



                <div style="clear: both"></div>
                <div class="row-fluid">
                    <table class="table table-striped table-hover text-left wx_img_container"   style="margin-top:15px;display:none">
                        <thead>
                        <tr>
                            <th class="span4">图片</th>
                            <th class="span2">大小</th>
                            <th class="span6">&nbsp;</th>
                        </tr>
                        </thead>
                        <tbody id="_#_id#_-fsUploadProgress">
                        </tbody>
                    </table>
                </div>
            </form>
        </div>

        <!---------------------------------------template------------------------------------------>
        <div id="tmpl_weixin_msg_from" style="display: none;">
            <div class="chat_time">_#timeDesc#_</div>
            <div class="chat_section clearfix">
                <!--<div class="pull-left" style="">_#UserID#_</div>-->
                <div class="pull-left" style="margin-left: 5px;">
                    <div class="chat_popover right">
                        <div class="arrow"></div>
                        <div class="chat_popover-content">
                            <pre>_#contentDesc#_</pre>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="tmpl_weixin_msg_to" style="display: none;">
            <div class="chat_time">_#timeDesc#_</div>
            <div class="chat_section clearfix">
                <div class="pull-right" style="">_#uidDesc#_</div>
                <div class="pull-right" style="margin-right: 15px;">
                    <div class="chat_popover left">
                        <div class="arrow"></div>
                        <div class="chat_popover-content">
                            <pre>_#contentDesc#_</pre>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div id="tmpl_weixin_msg_from_img" style="display: none;">
            <div class="chat_time">_#timeDesc#_</div>
            <div class="chat_section clearfix">
                <div class="pull-left" style="margin-left: 5px;">
                    <div class="chat_popover" style="padding: 0;">
                        _#contentDesc#_
                    </div>
                </div>
            </div>
        </div>
        <div id="tmpl_weixin_msg_to_img" style="display: none;">
            <div class="chat_time">_#timeDesc#_</div>
            <div class="chat_section clearfix">
                <div class="pull-right" style="">_#uidDesc#_</div>
                <div class="pull-right" style="margin-right: 15px;">
                    <!--<div class="chat_popover left">-->
                        <!--<div class="arrow"></div>-->
                        <div class="chat_popover " style="padding: 0;">
                            _#contentDesc#_
                        </div>
                    <!--</div>-->
                </div>
            </div>
        </div>
    </div>
</div>
